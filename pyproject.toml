[project]
name = "amplifier-smart-tool-decisioncraft"
version = "0.1.0"
description = "Map how a problem works, gather every point of view, and decide together."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/michaeljabbour/amplifier-smart-tool-decisioncraft"

[project.optional-dependencies]
smart = ["anthropic>=0.70", "openai>=1"]

[project.scripts]
decisioncraft = "decisioncraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisioncraft"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
