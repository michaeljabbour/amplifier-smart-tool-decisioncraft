<script type="application/json" id="dc-model">{"format":"decisioncraft/1","title":"Moving file uploads","question":"Should we move customer file uploads to a new storage provider, change how uploads reach storage, or both?","summary":"A mid-size web team stores customers' files with one storage provider. Large uploads time out, and the transfer bill keeps growing. This map shows how an upload works today, what each option changes, and what the team still has to decide. All figures are made up.","freshness_days":30,"reading":"The first view, How an upload works, has six journeys: an upload today, the proposed direct upload, downloading and sharing, deleting, moving existing files, and what happens when something goes wrong. Each column is a part of the system, from the customer's browser on the left to the storage provider on the right, so you can see where each step happens. The second view, Options, starts from the outcome we want and branches into problems, ideas and quick tests. Turn on Show technical names in any box to see the services and settings involved. Notes from security, finance, support and others sit on the steps they are about.","checked":{"date":"2026-05-20","note":"Checked against the incident review, April upload numbers, 31 support tickets, a provider comparison and call notes, the scanning and retention setup, and a team discussion."},"glossary":{"signed link":"A web address that lets one browser upload or download one file for a few minutes, without a password.","proxy":"When our servers pass every byte between the customer and storage, instead of the customer talking to storage directly.","resumable upload":"An upload sent in pieces, so a dropped connection only loses the last piece.","data out":"Files sent from storage to anyone outside it. Providers charge for this.","CDN":"A network of servers close to customers that keeps copies of popular files, so they download faster and cost less.","checksum":"A short fingerprint of a file. If two copies have the same checksum, they are the same.","holding area":"A place where new files wait, unseen by anyone else, until the virus scan passes.","recycle area":"Where a provider keeps deleted files for a few days in case they were deleted by mistake."},"sources":[{"id":"S1","title":"Incident review: slow uploads","kind":"document","date":"2026-05-04","ref":"material/incident-notes.md"},{"id":"S2","title":"Storage providers compared","kind":"data","date":"2026-05-12","ref":"material/provider-comparison.md"},{"id":"S3","title":"Team discussion","kind":"meeting","date":"2026-05-15","ref":"material/team-discussion.md"},{"id":"S4","title":"Support tickets, sample of 31","kind":"document","date":"2026-05-09","ref":"material/support-tickets.md"},{"id":"S5","title":"Upload numbers, April","kind":"data","date":"2026-05-06","ref":"material/upload-metrics.md"},{"id":"S6","title":"Provider B call notes and draft terms","kind":"document","date":"2026-05-14","ref":"material/provider-b-terms.md"},{"id":"S7","title":"Scanning and retention setup","kind":"document","date":"2026-05-10","ref":"material/scanning-and-retention.md"}],"evidence":[{"id":"E1","source":"S1","kind":"data","text":"Uploads over 200 MB timed out for about 40 minutes.","where":"Summary"},{"id":"E2","source":"S1","kind":"quote","text":"Half our servers were just shovelling bytes. Nothing else could get through.","where":"On-call engineer"},{"id":"E3","source":"S1","kind":"data","text":"Our storage bill grew 22% last quarter, mostly from data transfer out, not storage.","where":"Costs"},{"id":"E4","source":"S1","kind":"data","text":"Support received 31 tickets. Most from customers uploading video.","where":"Support"},{"id":"E5","source":"S2","kind":"data","text":"Data out: $90 per TB today; $0 to our CDN with provider B.","where":"Comparison table"},{"id":"E6","source":"S2","kind":"data","text":"Moving 180 TB at current transfer prices would cost about $16,000 once. Provider B offers free one-time transfer over 100 TB, on request.","where":"Notes under the table"},{"id":"E7","source":"S3","kind":"quote","text":"The real problem is the proxy, not the provider. Direct uploads fix the timeouts wherever the files live.","where":"Backend lead"},{"id":"E8","source":"S3","kind":"observation","voice":true,"text":"Customers ask for a progress bar and the ability to resume after a dropped connection.","where":"Product manager, from support tickets"},{"id":"E9","source":"S3","kind":"observation","text":"Signed links must expire in minutes and only allow one file path.","where":"Security engineer"},{"id":"E10","source":"S3","kind":"observation","text":"Nobody has tested how virus scanning works if files no longer pass through our servers.","where":"Open point"},{"id":"E11","source":"S4","kind":"data","text":"19 of 31 tickets were video uploads over 200 MB; 8 said it got to 90% and then failed.","where":"Ticket tags"},{"id":"E12","source":"S4","kind":"quote","text":"I lost two hours re-uploading the same file three times.","where":"Wedding videographer","voice":true},{"id":"E13","source":"S4","kind":"quote","text":"Just show me how far along it is. I can't tell if it's stuck.","where":"Agency producer","voice":true},{"id":"E14","source":"S4","kind":"quote","text":"Our firewall blocks some sites. Will the new way still work here?","where":"School office","voice":true},{"id":"E15","source":"S5","kind":"data","text":"3.1% of uploads were over 200 MB, but they were 71% of all bytes uploaded.","where":"April totals"},{"id":"E16","source":"S5","kind":"data","text":"Failure rate for uploads over 200 MB: 6.2% in busy hours, 1.4% at night.","where":"Failures"},{"id":"E17","source":"S5","kind":"data","text":"Upload servers spend about 55% of their time passing bytes to storage.","where":"Server time"},{"id":"E18","source":"S5","kind":"data","text":"18% of files are downloaded more than 10 times and make up 80% of data out.","where":"Downloads"},{"id":"E19","source":"S6","kind":"data","text":"Free one-time transfer needs a written request and approval, usually 2 to 3 weeks.","where":"Transfer"},{"id":"E20","source":"S6","kind":"data","text":"Provider B keeps deleted files 7 days in a recycle area unless turned off.","where":"Deletes"},{"id":"E21","source":"S6","kind":"data","text":"Upload completion messages go to a web address we choose; they retry for 24 hours.","where":"Notifications"},{"id":"E22","source":"S6","kind":"data","text":"Their EU region is in a different country from our current one. Legal must check our customer contracts.","where":"Region"},{"id":"E23","source":"S7","kind":"data","text":"Files are shown to the customer before the scan finishes; downloads are blocked only if the scan fails.","where":"Scanning"},{"id":"E24","source":"S7","kind":"data","text":"Scanning takes about 9 seconds under 100 MB and up to 4 minutes for 5 GB.","where":"Scanning"},{"id":"E25","source":"S7","kind":"data","text":"Our terms promise deleted files are gone within 30 days, including backups.","where":"Retention"},{"id":"E26","source":"S6","kind":"data","text":"Bucket names at provider B are global; ours must be renamed.","where":"Setup"},{"id":"E28","source":"S6","kind":"observation","text":"Their onboarding team suggests writing new files to both providers for at least a month and comparing checksums on every file before switching reads.","where":"Onboarding advice"},{"id":"E27","source":"S3","kind":"observation","text":"Finance wants the transfer bill down before the September budget review.","where":"Finance"}],"maps":[{"id":"m-how","template":"system-journeys","title":"How an upload works","intro":"Six journeys from the customer's browser to the storage provider. Each column is the part of the system that does that step.","lanes":[{"id":"people","label":"Customer","sub":"In their browser"},{"id":"front","label":"Web app","sub":"Pages and buttons"},{"id":"core","label":"Our servers","sub":"Checks and rules"},{"id":"records","label":"Database","sub":"What we record"},{"id":"background","label":"Background jobs","sub":"Work that runs later"},{"id":"outside","label":"Storage provider","sub":"Where files live"}],"journeys":[{"id":"j-today","title":"Upload today","summary":"Every byte passes through our servers on its way to storage.","creates":["A file record","The file in storage","A scan result"],"steps":[{"id":"t1","lane":"people","text":"Customer picks a file and presses Upload","status":"works","detail":"Upload button on the files page; no size limit shown.","feeling":"ok"},{"id":"t2","lane":"front","text":"Browser sends the whole file to our servers","status":"works","detail":"One HTTP request per file, no pieces.","pain":"No progress bar; people cannot tell if it is stuck.","evidence":["E8","E13"]},{"id":"t3","lane":"core","text":"Our servers pass the bytes on to storage","status":"partial","detail":"Streaming proxy in the upload service; 60-second idle timeout at the load balancer.","moment":true,"evidence":["E1","E2","E17"]},{"id":"t3b","lane":"core","text":"Long uploads hold a server connection open","status":"partial","detail":"Each upload ties up one worker for its whole length.","pain":"Other customers' requests queue behind them.","evidence":["E2","E17"]},{"id":"t3c","lane":"people","text":"On weak wifi the upload fails and starts again from zero","status":"missing","detail":"No resume; the browser retries the whole request.","feeling":"bad","moment":true,"evidence":["E12","E16"]},{"id":"t4","lane":"records","text":"File record is saved and the file shown to the customer","status":"works","detail":"Row in the files table with size, type and owner.","evidence":["E23"]},{"id":"t5","lane":"background","text":"A job scans the file for viruses","status":"works","detail":"Scanner reads the file from storage after the upload finishes.","evidence":["E24"]},{"id":"t6","lane":"records","text":"If the scan fails, downloads are blocked","status":"partial","detail":"Until then the file can already be shared and downloaded.","pain":"A bad file can be downloaded for up to 4 minutes.","evidence":["E23"]}]},{"id":"j-direct","title":"Upload with direct links (proposed)","summary":"The browser sends the file straight to storage in pieces, using a short-lived signed link.","creates":["A file record in 'uploading' state","The file in a holding area","A scan result","A ready file"],"steps":[{"id":"d1","lane":"people","text":"Customer picks a file and presses Upload","status":"works","detail":"Same button; size limit shown up front.","feeling":"good"},{"id":"d2","lane":"core","text":"Our servers check the customer may upload, and issue a signed link for one file","status":"planned","detail":"Signed link valid 10 minutes, one path, one content type.","moment":true,"evidence":["E9"]},{"id":"d2b","lane":"records","text":"A file record is created in 'uploading' state","status":"planned","detail":"Status column: uploading, scanning, ready, rejected."},{"id":"d3","lane":"outside","text":"Browser uploads straight to storage in pieces, with a progress bar","status":"planned","detail":"Multipart upload, 16 MB pieces, three in parallel.","feeling":"good","evidence":["E7","E8","E13"]},{"id":"d3b","lane":"people","text":"If the connection drops, the upload resumes from the last piece","status":"planned","detail":"Browser keeps the upload id and finished pieces in local storage.","moment":true,"evidence":["E12","E11"]},{"id":"d3c","lane":"people","text":"Some office firewalls may block the storage address","status":"missing","detail":"Fallback: the old proxy path for customers who cannot reach storage directly.","pain":"Schools and offices with strict firewalls.","evidence":["E14"]},{"id":"d3d","lane":"outside","text":"File lands in a holding area nobody else can read","status":"planned","detail":"Separate bucket prefix with no public or shared access.","evidence":["E9","E23"]},{"id":"d4","lane":"background","text":"Storage tells us the upload finished; a job scans it","status":"missing","detail":"Completion message to our web address, retried for 24 hours.","evidence":["E10","E21","E24"]},{"id":"d5","lane":"records","text":"File is marked ready only after a clean scan","status":"planned","detail":"Moved out of the holding area, status set to ready.","evidence":["E23"]},{"id":"d6","lane":"front","text":"Customer sees 'Ready' or a plain message if it was rejected","status":"planned","detail":"Rejected files are deleted after 7 days; owner gets an email."}]},{"id":"j-download","title":"Downloading and sharing","summary":"A customer or someone they share with downloads a file.","creates":["A short-lived download link","A download count"],"steps":[{"id":"dl1","lane":"people","text":"Customer clicks Download, or opens a share link","status":"works","detail":"Share links never expire unless the owner turns them off."},{"id":"dl2","lane":"core","text":"Our servers check they may see the file","status":"works","detail":"Owner, team member, or holder of a share link."},{"id":"dl3","lane":"core","text":"Our servers make a signed download link","status":"works","detail":"Valid 5 minutes, one file.","evidence":["E9"]},{"id":"dl4","lane":"outside","text":"Storage sends the file to the browser","status":"works","detail":"Every download is billed as data out at $90 per TB.","pain":"This is where the bill grows.","evidence":["E5","E3"]},{"id":"dl5","lane":"outside","text":"Popular files could come from the CDN instead","status":"missing","detail":"18% of files make 80% of data out; caching them at the CDN cuts the bill.","moment":true,"evidence":["E18","E5"]},{"id":"dl6","lane":"records","text":"We count the download","status":"works","detail":"Download counter on the file record."},{"id":"dl7","lane":"people","text":"A file still being scanned cannot be downloaded","status":"planned","detail":"Today it can; in the planned flow it waits.","evidence":["E23"]}]},{"id":"j-delete","title":"Deleting a file","summary":"A customer deletes a file, or closes their account.","creates":["A deleted mark","A purge job","A deletion log entry"],"steps":[{"id":"x1","lane":"people","text":"Customer deletes a file","status":"works","detail":"Moves to the customer's trash for 30 days."},{"id":"x2","lane":"records","text":"File is marked deleted and hidden","status":"works","detail":"Deleted-at column set; share links stop working."},{"id":"x3","lane":"background","text":"After 30 days a job removes it from storage","status":"works","detail":"Nightly purge job.","evidence":["E25"]},{"id":"x4","lane":"outside","text":"At provider B, deleted files sit in a recycle area for 7 more days","status":"missing","detail":"Must be turned off, or counted inside our 30 days.","moment":true,"evidence":["E20","E25"]},{"id":"x5","lane":"outside","text":"During a move, the file may exist at both providers","status":"missing","detail":"Deletes must reach both until the old copy is gone.","pain":"A deleted file could survive at the old provider.","evidence":["E25"]},{"id":"x6","lane":"background","text":"Account closure deletes everything after 14 days","status":"works","detail":"Same purge job, per account.","evidence":["E25"]},{"id":"x7","lane":"records","text":"We log that the file is gone","status":"partial","detail":"Logged for account closures only."}]},{"id":"j-move","title":"Moving existing files to provider B","summary":"Copying 180 TB without customers noticing, if we decide to move.","creates":["A copy of every file at provider B","A checksum report","A switch-over date"],"steps":[{"id":"mv1","lane":"core","text":"Ask provider B for free transfer in writing","status":"missing","detail":"2 to 3 weeks for approval.","moment":true,"evidence":["E19","E6"]},{"id":"mv2","lane":"core","text":"Legal checks the new region against customer contracts","status":"missing","detail":"Different EU country from today.","evidence":["E22"]},{"id":"mv3","lane":"outside","text":"Create buckets at provider B with new names","status":"planned","detail":"Names are global; ours must change.","evidence":["E26"]},{"id":"mv4","lane":"background","text":"Copy new uploads to both providers for a month","status":"planned","detail":"Dual writes from the upload service.","evidence":["E28"]},{"id":"mv5","lane":"background","text":"Copy older files in batches overnight","status":"planned","detail":"Largest and most-downloaded first, to cut data out soonest.","evidence":["E18"]},{"id":"mv6","lane":"background","text":"Compare checksums for every file","status":"planned","detail":"A report of any file that does not match.","evidence":["E28"]},{"id":"mv7","lane":"core","text":"Switch reads to provider B, then writes","status":"planned","detail":"One setting per customer group, so we can switch back."},{"id":"mv8","lane":"outside","text":"Keep the old copy for 30 days, then delete it","status":"planned","detail":"Deletes made in those 30 days go to both.","evidence":["E25"]}]},{"id":"j-fail","title":"When something goes wrong","summary":"A storage outage, a stuck upload, or a missed completion message.","creates":["An alert","A retry","A message to the customer"],"steps":[{"id":"f1","lane":"outside","text":"Storage provider has an outage","status":"partial","detail":"Today uploads fail with a generic error.","evidence":["E1"]},{"id":"f2","lane":"front","text":"Customer sees a plain message and their upload pauses","status":"planned","detail":"Resume when storage is back, without starting over.","evidence":["E12"]},{"id":"f3","lane":"background","text":"A completion message never arrives","status":"missing","detail":"Nightly job finds files stuck in 'uploading' for over 24 hours.","evidence":["E21"]},{"id":"f4","lane":"background","text":"Stuck files are checked against storage and fixed or cleaned up","status":"missing","detail":"If the file is complete in storage, scan it; if not, delete the record."},{"id":"f5","lane":"core","text":"On-call is alerted when large-upload failures pass 2%","status":"missing","detail":"Today nobody is alerted; support finds out from tickets.","moment":true,"evidence":["E4","E16"]},{"id":"f6","lane":"front","text":"Support can see a customer's recent uploads and why they failed","status":"missing","detail":"A simple page for support, read-only.","evidence":["E4"]}]}]},{"id":"m-options","template":"opportunity-tree","title":"Options","intro":"The outcome at the top, then the problems that stand in its way, the ideas for each, and the quick tests that would prove an idea.","levels":["Outcome","Problem","Idea","Quick test"],"root":{"id":"o-root","title":"Big uploads always finish, and the transfer bill falls","text":"By the September budget review.","children":[{"id":"o-timeouts","title":"Large uploads time out","status":"missing","evidence":["E1","E4"],"children":[{"id":"o-direct","title":"Direct uploads with signed links","status":"planned","evidence":["E7"],"children":[{"id":"o-test-direct","title":"Ship to 5% of video uploads for two weeks","text":"Compare failure rate and server load."}]},{"id":"o-bigger","title":"Raise timeouts and add servers","status":"works","text":"Cheap now, costly later.","children":[{"id":"o-test-bigger","title":"Raise the idle timeout to 10 minutes on one server","text":"Watch for queueing."}]}]},{"id":"o-bill","title":"Data out costs keep growing","status":"partial","evidence":["E3","E5"],"children":[{"id":"o-move","title":"Move files to provider B","status":"planned","evidence":["E5","E6"],"children":[{"id":"o-test-move","title":"Copy one month of new files to B and serve them through the CDN","text":"Measure the bill and download speed."}]},{"id":"o-cache","title":"Cache popular downloads at the CDN","status":"missing","children":[{"id":"o-test-cache","title":"Turn on caching for public files only","text":"One week, then compare data out."}]}]}]}}],"gaps":[{"id":"G1","title":"Direct uploads with a progress bar and resume","why":"Fixes the timeouts no matter which provider we use; uploads over 200 MB are 71% of all bytes.","anchors":["d2","d3","d3b","o-direct"],"impact":5,"effort":3,"stories":[{"as":"As a customer uploading a large video on a weak connection, I want the upload to resume where it stopped, so I do not start again.","done_when":["a 2 GB upload survives a 30-second disconnect","the progress bar matches the bytes received","our servers handle no file bytes"]},{"as":"As a producer uploading a 4 GB video, I want to see how far along it is, so I know it is not stuck.","done_when":["a progress bar shows percent and time left","it updates at least every 2 seconds"]},{"as":"As a school office behind a strict firewall, I want uploads to still work, so we are not locked out.","done_when":["if the storage address cannot be reached within 5 seconds, the upload falls back to the old path","support can see which customers used the fallback"]}]},{"id":"G2","title":"Scan files that never touch our servers","why":"Today scanning assumes we saw the upload, and a bad file can be downloaded for up to 4 minutes.","anchors":["d4","d3d","t6"],"impact":4,"effort":2,"stories":[{"as":"As the security engineer, I want every upload scanned before anyone can download it, so direct uploads add no risk.","done_when":["a file is not downloadable until its scan passes","an infected test file is quarantined and the customer is told"]},{"as":"As a customer, I want to know my file is being checked, so a short wait makes sense.","done_when":["the file shows 'Checking' until the scan passes","files under 100 MB are ready within 15 seconds"]}]},{"id":"G3","title":"Move existing files to provider B","why":"Cuts the data-out bill; only worth it if the free transfer is granted.","anchors":["o-move","mv1","mv5"],"impact":3,"effort":4,"stories":[{"as":"As finance, I want the move to cost nothing up front, so the saving shows before the September review.","done_when":["provider B confirms free transfer in writing","every file's checksum matches after the copy","downloads switch over with no broken links"]},{"as":"As the engineering lead, I want to switch back within an hour, so a bad move does not become an outage.","done_when":["reads and writes switch by one setting per customer group","a dry run of switching back is done before the move"]}]},{"id":"G4","title":"Serve popular files from the CDN","why":"18% of files cause 80% of data out; caching them cuts the bill with either provider.","anchors":["dl5","o-cache"],"impact":4,"effort":2,"stories":[{"as":"As finance, I want popular downloads to stop counting as data out, so the bill falls before September.","done_when":["public and shared files are served from the CDN","data out falls at least 30% in the first month"]},{"as":"As a security engineer, I want private files never cached, so nobody gets someone else's file.","done_when":["only files marked public or shared go to the CDN","a private file request always checks permission first"]}]},{"id":"G5","title":"Deletes reach every copy","why":"Our terms promise deleted files are gone within 30 days; provider B keeps a 7-day recycle area and a move means two copies.","anchors":["x4","x5","mv8"],"impact":4,"effort":2,"stories":[{"as":"As a customer who deleted a file, I want it gone everywhere within 30 days, as the terms promise.","done_when":["provider B's recycle area is off, or our purge runs 7 days early","deletes during the move go to both providers","a monthly check finds no deleted file older than 30 days"]}]},{"id":"G6","title":"Know about failures before customers tell us","why":"Support found out about the 2 May incident from 31 tickets.","anchors":["f5","f6","f3"],"impact":3,"effort":2,"stories":[{"as":"As on-call, I want an alert when large uploads start failing, so I can act in minutes, not hours.","done_when":["an alert fires when failures over 200 MB pass 2% for 10 minutes","the alert links to a page showing the failing step"]},{"as":"As support, I want to see a customer's recent uploads and why they failed, so I can answer the ticket.","done_when":["a read-only page lists the last 20 uploads with status and error","it never shows file contents"]}]}],"notes":[{"id":"N1","role":"engineer","anchor":"t3","title":"The proxy is the bottleneck","body":"Servers hold a connection for the whole upload. That is why everything slowed down.","recommend":"Do direct uploads first; it is independent of the provider choice.","question":"Do we agree to separate the two decisions: direct uploads now, provider later?","urgency":"must","evidence":["E2","E7"]},{"id":"N2","role":"security","anchor":"d2","title":"Signed links must be narrow","body":"A link that allows any path, or lasts hours, would let anyone write files into our storage.","recommend":"Links last 10 minutes, cover one path, and set a size limit.","question":"Is 10 minutes long enough for the slowest customers, given uploads resume in pieces?","urgency":"must","evidence":["E9"]},{"id":"N3","role":"security","anchor":"d4","title":"Nothing is downloadable before it is scanned","body":"With direct uploads, a file lands in storage before we have looked at it.","recommend":"Upload into a holding area; move it to the live area only after a clean scan.","question":"Who builds and tests the holding area before the 5% trial?","urgency":"must","evidence":["E10"]},{"id":"N4","role":"voice","anchor":"d3","title":"Customers asked for two things","body":"A progress bar and resuming after a dropped connection. Neither needs a new provider.","recommend":"Ship both with direct uploads, and tell the 31 customers who raised tickets.","question":"Do we contact the customers who reported the problem when the fix ships?","urgency":"should","evidence":["E4","E8"]},{"id":"N5","role":"finance","anchor":"o-bill","title":"The bill problem is data out, not storage","body":"Storage grew a little; data out grew a lot.","recommend":"Try CDN caching first; it is cheap and fast to test.","question":"How much must data out fall by September for this to count as fixed?","urgency":"must","evidence":["E3","E5"]},{"id":"N6","role":"finance","anchor":"G3","title":"Only move if the transfer is free","body":"At $16,000, the move pays back in about seven months. Free transfer makes it pay back at once.","recommend":"Ask provider B for free transfer in writing before deciding.","question":"Who asks provider B, and by when?","urgency":"should","evidence":["E6"]},{"id":"N7","role":"owner","anchor":"o-root","title":"Two outcomes, two clocks","body":"Timeouts hurt customers now. The bill matters by September.","recommend":"Fix timeouts this month; decide the provider in July with test results in hand.","question":"Is July the right month to make the provider decision?","urgency":"should","evidence":["E1","E3"]},{"id":"N8","role":"analyst","anchor":"o-test-direct","title":"Say what the trial must show","body":"Without a target, a two-week trial cannot pass or fail.","recommend":"Pass if failed uploads drop below 1% and no server spends more than 5% of its time on uploads.","question":"Are those the right pass marks for the trial?","urgency":"should","evidence":["E1"]},{"id":"N9","role":"designer","anchor":"t2","title":"Tell people what is happening","body":"Today a big upload shows a spinner with no end.","recommend":"Show bytes sent, time left, and a clear message if the connection drops.","question":"Should a dropped upload resume by itself, or ask first?","urgency":"info","evidence":["E8"]},{"id":"N10","role":"agent","anchor":"G3","title":"An assistant can check the copy","body":"Comparing checksums for millions of files is repetitive and easy to get wrong by hand.","recommend":"Let an agent run and report the checksum comparison; a person signs off the switch-over.","question":"Who signs off the switch-over once the agent's report is clean?","urgency":"info","evidence":["E6"]},{"id":"N11","role":"engineer","anchor":"o-move","title":"Nobody has run provider B","body":"Four years of experience with the current provider; none with B.","recommend":"Run the one-month copy test before committing.","question":"Are we willing to run two providers for a few months during the move?","urgency":"should","evidence":["E6"]},{"id":"N12","role":"voice","anchor":"t3c","title":"Starting again from zero is the real pain","body":"The videographer lost two hours re-uploading the same file; four tickets came from hotel or train wifi.","recommend":"Make resume the first thing the trial measures.","question":"Do we promise resume in the help pages before the trial ends?","urgency":"must","evidence":["E12","E11"]},{"id":"N13","role":"voice","anchor":"d3c","title":"Strict firewalls could lock some customers out","body":"A school office asked if the new way would work behind their firewall.","recommend":"Keep the old path as a fallback and tell support how to spot it.","question":"How long do we keep the old proxy path running as a fallback?","urgency":"should","evidence":["E14"]},{"id":"N14","role":"designer","anchor":"d6","title":"Say plainly why a file was rejected","body":"Customers see 'Error' today, which looks like our fault.","recommend":"Show 'This file was blocked because it may contain a virus' and what to do next.","question":"Do we tell free-plan users the scanner's reason, or only that it was blocked?","urgency":"should","evidence":["E23"]},{"id":"N15","role":"designer","anchor":"d3","title":"Show time left, not just percent","body":"A producer could not tell whether the upload was stuck.","recommend":"Show percent, speed and time left, updated every two seconds.","question":"Is time left accurate enough on weak connections to show it?","urgency":"info","evidence":["E13"]},{"id":"N16","role":"analyst","anchor":"d2b","title":"One status field for every file","body":"Uploading, checking, ready and rejected must mean the same thing on every page.","recommend":"Write the four states down and use them in the app, support page and alerts.","question":"Do we need a separate state for files waiting on a fallback upload?","urgency":"should","evidence":["E23"]},{"id":"N17","role":"analyst","anchor":"f3","title":"Decide what counts as stuck","body":"Completion messages retry for 24 hours, so 'stuck' must be longer than that.","recommend":"Call a file stuck after 26 hours in 'uploading'.","question":"Is 26 hours too long for customers waiting on a file?","urgency":"should","evidence":["E21"]},{"id":"N18","role":"engineer","anchor":"d4","title":"We must answer completion messages quickly","body":"Provider B retries for 24 hours if we do not answer; slow answers cause duplicates.","recommend":"Answer at once and do the scan in a background job; ignore duplicates by upload id.","question":"Who owns the completion endpoint and its alerts?","urgency":"must","evidence":["E21"]},{"id":"N19","role":"engineer","anchor":"mv4","title":"Dual writes double the risk of half-done uploads","body":"For a month every upload goes to two places.","recommend":"Treat the old provider as the source of truth until the switch; log every mismatch.","question":"Do we pause the move if mismatches pass 0.1%?","urgency":"should","evidence":["E28"]},{"id":"N20","role":"engineer","anchor":"f5","title":"No alert today","body":"Support found the incident from tickets; nobody was paged.","recommend":"Alert on large-upload failure rate, not on server errors alone.","question":"What failure rate should wake someone at night?","urgency":"should","evidence":["E4","E16"]},{"id":"N21","role":"owner","anchor":"G4","title":"Caching may beat moving","body":"Caching popular files cuts most data out without moving anything.","recommend":"Run the one-week caching test before deciding on provider B.","question":"If caching cuts data out by 30%, do we still move?","urgency":"must","evidence":["E18","E5"]},{"id":"N22","role":"owner","anchor":"d3c","title":"Keep the fallback small","body":"A permanent second upload path doubles what we support.","recommend":"Keep the fallback for six months, then review who still uses it.","question":"Who reviews the fallback numbers in six months?","urgency":"info","evidence":["E14"]},{"id":"N23","role":"security","anchor":"x4","title":"The recycle area breaks our deletion promise","body":"Provider B keeps deleted files 7 days unless it is turned off; our terms promise 30 days in total.","recommend":"Turn the recycle area off, or purge 7 days early.","question":"Which do we choose: turn it off, or purge early?","urgency":"must","evidence":["E20","E25"]},{"id":"N24","role":"security","anchor":"dl5","title":"Never cache private files","body":"A cache mistake could show one customer's file to another.","recommend":"Cache only files marked public or shared; check permission for everything else.","question":"Who reviews the cache rules before the test?","urgency":"should","evidence":["E18"]},{"id":"N25","role":"security","anchor":"mv2","title":"A new country needs a legal check","body":"Provider B's EU region is in a different country, and some contracts name the country.","recommend":"Ask legal for a list of affected customers before any copy starts.","question":"Do we need to tell customers before their files move country?","urgency":"must","evidence":["E22"]},{"id":"N26","role":"agent","anchor":"f4","title":"An agent can clean up stuck uploads","body":"Checking each stuck record against storage is routine and rule-based.","recommend":"Let an agent fix or remove stuck records nightly and post a summary.","question":"Should the agent delete stuck records itself, or only list them for a person?","urgency":"info","evidence":["E21"]},{"id":"N27","role":"agent","anchor":"f6","title":"An agent can draft the first support reply","body":"Most tickets ask the same three things.","recommend":"Draft a reply from the customer's upload history for support to check and send.","question":"Are we comfortable with an agent reading upload history to draft replies?","urgency":"info","evidence":["E4","E11"]},{"id":"N28","role":"agent","anchor":"mv6","title":"Checksum reports are a good job for an agent","body":"Comparing 180 TB of checksums is long and repetitive.","recommend":"Let an agent run the comparison and flag only mismatches.","question":"Who acts on a mismatch: the agent, or a person?","urgency":"info","evidence":["E28","E6"]},{"id":"N29","role":"finance","anchor":"dl4","title":"Every download costs money today","body":"$90 per TB of data out is most of the bill growth.","recommend":"Measure data out per customer plan so we know who drives it.","question":"Should heavy-download plans pay more?","urgency":"must","evidence":["E5","E3"]},{"id":"N30","role":"finance","anchor":"mv1","title":"No written transfer, no move","body":"Moving 180 TB costs about $16,000 without the free transfer.","recommend":"Send the written request this week; it takes 2 to 3 weeks.","question":"Who sends the request, and do we wait for it before any other work?","urgency":"should","evidence":["E19","E6"]},{"id":"N31","role":"finance","anchor":"o-root","title":"September is the deadline that matters","body":"Finance wants the bill down before the September review.","recommend":"Plan so that caching or the move shows in the August bill.","question":"Is the August bill the one we judge by?","urgency":"info","evidence":["E27"]},{"id":"N32","role":"analyst","anchor":"G6","title":"Measure the same thing before and after","body":"Failure rates differ a lot between busy hours and night.","recommend":"Report busy-hour and night rates separately.","question":"Do we judge the trial on busy-hour rates only?","urgency":"info","evidence":["E16"]},{"id":"N33","role":"voice","anchor":"dl7","title":"A short wait to download is fine if it is explained","body":"Customers accept 'Checking' if they can see it.","recommend":"Show 'Checking for viruses, usually under 15 seconds'.","question":"Do we let the uploader download their own file before the scan?","urgency":"info","evidence":["E23","E24"]}],"decisions":[{"id":"D1","question":"Do we build direct uploads now, separately from the provider choice?","notes":["N1","N4"],"options":["Yes, now","Wait for the provider decision"],"owner":"Backend lead","status":"decided","decided_by":"Engineering lead","decision":"Yes. Direct uploads ship to 5% of video uploads in June.","due":"2026-05-29"},{"id":"D2","question":"Do we move to provider B?","notes":["N5","N6","N11"],"options":["Move all files","Move new files only","Stay, and add CDN caching"],"owner":"Engineering lead","status":"open","due":"2026-07-15"},{"id":"D3","question":"How do signed links and scanning work?","notes":["N2","N3"],"owner":"Security engineer","status":"open","due":"2026-06-05"},{"id":"D4","question":"Do we run the one-week caching test before deciding on provider B?","notes":["N21","N24"],"options":["Yes, test caching first","No, decide on B now"],"owner":"Engineering lead","status":"open","due":"2026-06-10"},{"id":"D5","question":"How do we keep the 30-day deletion promise at provider B?","notes":["N23"],"options":["Turn the recycle area off","Purge 7 days early"],"owner":"Security engineer","status":"open","due":"2026-06-20"}],"outcomes":[{"id":"O1","measure":"Failed large uploads","baseline":"About 6% during busy hours","target":"Below 1%"},{"id":"O2","measure":"Data out cost per month","baseline":"Up 22% last quarter","target":"Down 30% by September"},{"id":"O3","measure":"Time from upload to 'Ready' for files under 100 MB","baseline":"Shown at once, scanned later","target":"Under 15 seconds, scanned first"},{"id":"O4","measure":"Upload tickets per month","baseline":"31 in the incident week","target":"Fewer than 5"}]}</script>

/* ---------- text helpers ---------- */
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);

const TERM_RE = TERMS.length ? new RegExp("\\b(" + TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "i") : null;

/* Notes beside a row (only when "Show all notes on the map" is on): a column to the right of

  y += 60;
  const laneTop = y - 70;
  (m.journeys || []).forEach((j, ji) => {
    const y0 = y;
    const hd = place("box jhead inj", 0, y0, J.headW,
      `<h3><span class="n">${ji + 1}</span>${gl(j.title)}</h3><p>${gl(j.summary || "")}</p>
       ${(j.creates || []).length ? `<p class="sub small"><b>What it leaves behind:</b> ${j.creates.map(esc).join(", ")}</p>` : ""}
       <div class="meta">${badges(j)}<span class="chip">${plural((j.steps || []).length, "step")}</span></div>`,
      {type:"box", id:j.id}, `Journey ${ji + 1}: ${j.title}`);
    hd.dataset.row = "j" + ji;
    nodes[j.id] = hd;
    let sy = y0, prev = null;
    (j.steps || []).forEach((s, k) => {
      const x = laneX(LI[s.lane] || 0) + (J.laneW - J.stepW) / 2;
      const el = place("box step inj", x, sy, J.stepW,
        `<div class="row1"><span class="n">${k + 1}</span><div class="t">${gl(s.text)}</div></div>${tech(s)}
         <div class="meta">${pill(s.status)}${badges(s)}</div>`,
        {type:"box", id:s.id}, `Step ${k + 1} of journey ${ji + 1}: ${s.text}`);
      el.style.minHeight = J.stepH + "px";
      el.dataset.row = "j" + ji;
      nodes[s.id] = el;
      const h = el.offsetHeight;
      if (prev) {
        const p = link(prev.x + J.stepW / 2, prev.y + prev.h, x + J.stepW / 2, sy - 2, "inj");
        p.dataset.row = "j" + ji; arrowHead(x + J.stepW / 2, sy - 2);
      }
      prev = {x, y:sy, h};
      sy += h + J.rowGap;
    });
    const nh = notePile([j.id, ...(j.steps || []).map(s => s.id)], notesX, y0, 4, "j" + ji);
    const h = Math.max(hd.offsetHeight, sy - y0, nh);
    rows.push({key:"j" + ji, y:y0, h, x:0, w:W});
    y = y0 + h + J.bandGap;
  });
  lanes.forEach((l, i) => {
    const bg = document.createElement("div"); bg.className = "lanebg";
    Object.assign(bg.style, {left:(laneX(i) - 8) + "px", top:laneTop + "px", width:(J.laneW + 16) + "px", height:(y - laneTop) + "px"});
    world.prepend(bg);
  });
  return {x:0, y:0, w:W, h:y};
}

/* ---------- chain ---------- */
const C = {stageW:300, stageH:96, itemW:250, itemGap:14, perRow:3, gap:64};
function renderChain(m) {
  const itemsX = C.stageW + 50;
  const notesX = itemsX + C.perRow * (C.itemW + C.itemGap) + 34;
  const W = itemsX + C.perRow * (C.itemW + C.itemGap) + notesWidth();
  let y = header(m, W);
  place("label", 0, y, 0, "Stage");
  place("label", itemsX, y, 0, S.mode === "planned" ? "Planned (dashed border = new)" : "What exists today");
  if (S.notesOnMap) place("label", notesX, y, 0, "Notes from each role");
  y += 30;
  let prevStage = null;
  (m.stages || []).forEach((st, si) => {
    const y0 = y;
    const items = (st.items || []).filter(it => (it.when || "both") === "both" || it.when === S.mode);
    const stEl = place("box stage inj", 0, y0, C.stageW,
      `<h3>${gl(st.label)}</h3><p>${gl(st.sub || "")}</p>${tech(st)}<div class="meta">${badges(st)}</div>`,
      {type:"box", id:st.id}, `Stage ${si + 1}: ${st.label}`);
    stEl.style.minHeight = C.stageH + "px";
    stEl.dataset.row = "s" + si;
    nodes[st.id] = stEl;
    let rowMax = 0, iy = y0, col = 0;
    items.forEach(it => {
      const el = place(`box item inj${it.when === "planned" ? " planned-new" : ""}`,
        itemsX + col * (C.itemW + C.itemGap), iy, C.itemW,
        `<h4>${gl(it.title)}</h4><p class="t">${gl(it.text || "")}</p>${tech(it)}<div class="meta">${pill(it.status)}${badges(it)}</div>`,
        {type:"box", id:it.id}, it.title);
      el.dataset.row = "s" + si;
      nodes[it.id] = el;
      rowMax = Math.max(rowMax, el.offsetHeight);
      if (++col === C.perRow) { col = 0; iy += rowMax + C.itemGap; rowMax = 0; }
    });
    let ih = iy - y0 + rowMax;
    if (!items.length) { place("label", itemsX, y0 + 10, 0, S.mode === "planned" ? "Nothing planned here" : "Nothing here today"); ih = 40; }
    const nh = notePile([st.id, ...(st.items || []).map(i => i.id)], notesX, y0, 4, "s" + si);
    const h = Math.max(stEl.offsetHeight, ih, nh);
    rows.push({key:"s" + si, y:y0, h, x:0, w:W});
    if (prevStage) {
      const p = link(C.stageW / 2, prevStage.y + prevStage.h, C.stageW / 2, y0 - 2, "inj", prevStage.verb);
      p.dataset.row = "s" + si; arrowHead(C.stageW / 2, y0 - 2);
    }
    prevStage = {y:y0, h:stEl.offsetHeight, verb:st.verb || ""};
    y = y0 + h + C.gap;
  });
  const outs = MODEL.outcomes || [];
  if (outs.length && m === MODEL.maps.find(mm => KIND[mm.template] === "chain")) {
    place("label", 0, y, 0, "Did it work?");
    y += 26;
    const ow = C.itemW + 60;
    outs.forEach((o, i) => {
      const el = place("box inj", (i % 3) * (ow + C.itemGap), y + Math.floor(i / 3) * 150, ow,
        `<h4>${esc(o.measure)}</h4><p class="t">${o.baseline ? "Before: " + esc(o.baseline) + ". " : ""}${o.target ? "Target: " + esc(o.target) + ". " : ""}${o.result ? "<b>Result: " + esc(o.result) + "</b>" : "Not measured yet."}</p>
         <div class="meta">${o.becomes_evidence ? `<span class="chip">Feeds back as evidence</span>` : ""}</div>`,
        {type:"outcome", o}, `Outcome: ${o.measure}`);
      nodes[o.id] = el;
    });
    rows.push({key:"outcomes", y:y - 26, h:Math.ceil(outs.length / 3) * 150 + 26, x:0, w:W});
    y += Math.ceil(outs.length / 3) * 150 + 20;
  }
  return {x:0, y:0, w:W, h:y};
}

/* ---------- tree ---------- */
const T = {colW:270, colGap:60, nodeH:104, vGap:18};
function renderTree(m) {
  const levels = m.levels || TREE_LEVELS;
  const depthOf = n => n.children && n.children.length ? 1 + Math.max(...n.children.map(depthOf)) : 1;
  const depth = depthOf(m.root);
  const notesX = depth * (T.colW + T.colGap) + 10;
  const W = depth * (T.colW + T.colGap) - T.colGap + notesWidth();
  let y = header(m, W);
  for (let d = 0; d < depth; d++) place("label", d * (T.colW + T.colGap), y, 0, esc(levels[Math.min(d, levels.length - 1)]));
  y += 30;
  let cursor = y;
  const pos = {};
  (function lay(n, d) {
    const kids = n.children || [];
    let cy;
    if (!kids.length) { cy = cursor; cursor += T.nodeH + T.vGap; }
    else { kids.forEach(k => lay(k, d + 1)); cy = (pos[kids[0].id].y + pos[kids[kids.length - 1].id].y) / 2; }
    pos[n.id] = {x:d * (T.colW + T.colGap), y:cy, d};
  })(m.root, 0);
  const branches = m.root.children || [];
  const ids = n => [n.id, ...(n.children || []).flatMap(ids)];
  const shifted = {};
  let shift = 0;
  branches.forEach((b, bi) => {
    const own = ids(b);
    const ys = own.map(i => pos[i].y);
    const y0 = Math.min(...ys) + shift, y1 = Math.max(...ys) + T.nodeH + shift;
    own.forEach(i => shifted[i] = pos[i].y + shift);
    const nh = notePile(own, notesX, y0, 4, "b" + bi);
    rows.push({key:"b" + bi, y:y0, h:Math.max(y1 - y0, nh), x:0, w:W});
    shift += Math.max(0, nh - (y1 - y0)) + (S.notesOnMap ? T.vGap : 0);
  });
  shifted[m.root.id] = branches.length ? (shifted[branches[0].id] + shifted[branches[branches.length - 1].id]) / 2 : pos[m.root.id].y;
  const draw = (n, parent, bi) => {
    const p = pos[n.id], ny = shifted[n.id];
    const el = place(`box tree-node l${p.d} inj`, p.x, ny, T.colW,
      `<h4>${gl(n.title)}</h4>${n.text ? `<p class="t">${gl(n.text)}</p>` : ""}${tech(n)}<div class="meta">${pill(n.status)}${badges(n)}</div>`,
      {type:"box", id:n.id}, `${levels[Math.min(p.d, levels.length - 1)]}: ${n.title}`);
    el.style.minHeight = T.nodeH + "px";
    if (bi != null) el.dataset.row = "b" + bi;
    nodes[n.id] = el;
    if (parent) {
      const l = link(pos[parent.id].x + T.colW, shifted[parent.id] + T.nodeH / 2, p.x, ny + T.nodeH / 2, "inj");
      if (bi != null) l.dataset.row = "b" + bi;
    }
    (n.children || []).forEach(c => draw(c, n, bi == null ? branches.indexOf(c) : bi));
  };
  draw(m.root, null, null);
  return {x:0, y:0, w:W, h:Math.max(...Object.values(shifted)) + T.nodeH + 60};
}

/* ---------- render ---------- */
let bounds = {x:0, y:0, w:1000, h:800};
function render() {
  world.innerHTML = "";
  nodes = {}; rows = [];
  svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "links"); svg.setAttribute("aria-hidden", "true");
  world.appendChild(svg);
  const far = document.body.classList.contains("z-far");
  document.body.classList.remove("z-far");          // lay out at full detail, then restore
  const m = MODEL.maps[S.map];
  const kind = KIND[m.template];
  bounds = kind === "journeys" ? renderJourneys(m) : kind === "chain" ? renderChain(m) : renderTree(m);
  if (far) document.body.classList.add("z-far");
  applyFocus();
  topBar();
  story();
}

/* ---------- pan and zoom ---------- */
let Z = 1, X = 40, Y = 80;
const leftEdge = () => S.story ? STORY_W : 0;
const rightEdge = () => document.body.classList.contains("panel-open") ? PANEL_W + 10 : 0;
function apply() {
  world.style.transform = `translate(${X}px,${Y}px) scale(${Z})`;
  document.documentElement.style.setProperty("--z", Z);
  document.documentElement.style.setProperty("--inv", Math.min(2.4, Math.max(1, 0.62 / Z)));
  document.body.classList.toggle("z-far", Z < 0.55);
}
function zoomAt(f, cx, cy) {
  const nz = Math.min(MAX_Z, Math.max(MIN_Z, Z * f));
  X = cx - (cx - X) * (nz / Z); Y = cy - (cy - Y) * (nz / Z); Z = nz; apply();
}
const viewCenter = () => [leftEdge() + (innerWidth - leftEdge() - rightEdge()) / 2, TOP_H + (innerHeight - TOP_H) / 2];
function fitTo(b) {
  const vw = innerWidth - leftEdge() - rightEdge() - 40, vh = innerHeight - TOP_H - 40;
  let z = Math.min(vw / b.w, vh / b.h) * 0.95;
  const tall = z < MIN_Z + 0.08;
  if (tall) z = Math.min(1, Math.max(MIN_Z + 0.1, vw / b.w * 0.96));   // too tall: fit the width, start at the top
  Z = Math.min(1.3, Math.max(MIN_Z, z));
  X = leftEdge() + 20 + Math.max(0, (vw - b.w * Z) / 2) - b.x * Z;
  Y = TOP_H + 20 + (tall ? 0 : Math.max(0, (vh - b.h * Z) / 2)) - b.y * Z;
  apply();
}
function fitRow(key) {
  const r = rows.find(r => r.key === key);
  if (r) fitTo({x:r.x - 10, y:r.y - 30, w:r.w + 20, h:r.h + 60});
}
function fit() { if (S.journey >= 0) fitRow("j" + S.journey); else fitTo(bounds); }
function centerOn(el) {
  const x = parseFloat(el.style.left) + el.offsetWidth / 2, y = parseFloat(el.style.top) + el.offsetHeight / 2;
  if (Z < 0.75) Z = 0.9;
  const [cx, cy] = viewCenter();
  X = cx - x * Z; Y = cy - y * Z; apply();
}
let drag = null;
viewport.addEventListener("pointerdown", e => {
  if (e.target.closest(".box,.notecard,.morenotes,button")) return;
  drag = {x:e.clientX, y:e.clientY, X, Y}; viewport.classList.add("dragging"); viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener("pointermove", e => { if (!drag) return; X = drag.X + e.clientX - drag.x; Y = drag.Y + e.clientY - drag.y; apply(); });
viewport.addEventListener("pointerup", () => { drag = null; viewport.classList.remove("dragging"); });
viewport.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
  else { X -= e.deltaX; Y -= e.deltaY; apply(); }
}, {passive:false});
$("#zin").addEventListener("click", () => zoomAt(1.25, ...viewCenter()));
$("#zout").addEventListener("click", () => zoomAt(1 / 1.25, ...viewCenter()));
$("#zfit").addEventListener("click", () => fit());

/* ---------- focus ---------- */
function applyFocus() {
  const on = S.journey >= 0 && KIND[MODEL.maps[S.map].template] === "journeys";
  document.body.classList.toggle("dim", on);
  world.querySelectorAll(".inj").forEach(el => el.classList.toggle("hot", on && el.dataset.row === "j" + S.journey));
  svg.querySelectorAll("path").forEach(p => p.classList.toggle("hot", on && p.dataset.row === "j" + S.journey));
}
function showMap(i) { if (i !== S.map) { S.map = i; S.journey = -1; persist(); render(); } }
function focusJourney(mi, ji) { showMap(mi); S.journey = ji; persist(); applyFocus(); story(); fit(); }
function focusRow(mi, key) { showMap(mi); S.journey = -1; persist(); applyFocus(); story(); fitRow(key); }
function setMode(m) { S.mode = m; persist(); render(); }

/* ---------- top bar ---------- */
function topBar() {
  const qn = questionList().length;
  $("#top").innerHTML = `
    <span class="title" title="${esc(MODEL.title)}">${esc(MODEL.title)}</span>
    <button id="tq" class="primary">Questions to decide<span class="count">${qn}</span></button>
    <button id="tshare" aria-haspopup="true" aria-expanded="false">Share my answers ▾</button>
    <button id="tview" aria-haspopup="true" aria-expanded="false">View ▾</button>
    <button id="tkeys" title="Keyboard shortcuts">? Keys</button>`;
  $("#tq").addEventListener("click", () => open("questions"));
  $("#tshare").addEventListener("click", e => menu(e.currentTarget, [
    ["save", "Save my answers as a file", ""], ["copy", "Copy the questions as a list", ""],
    ["print", "Print this view", ""], ["reset", "Clear my answers on this computer", ""]]));
  $("#tview").addEventListener("click", e => menu(e.currentTarget, [
    ["tech", "Show technical names", S.tech ? "On" : "Off"],
    ["notes", "Show all notes on the map", S.notesOnMap ? "On" : "Off"],
    ["roles", "Whose notes to show", `${ROLES.filter(r => S.roles[r.id] !== false).length} of ${ROLES.length}`],

    ["dots", "Background dots", S.dots ? "On" : "Off"],

  $("#tkeys").addEventListener("click", () => open("keys"));
}
function menu(btn, items) {
  const mm = $("#menu");
  const reopen = mm.classList.contains("open") && mm._from === btn;
  mm.classList.remove("open");
  document.querySelectorAll("#top [aria-expanded]").forEach(b => b.setAttribute("aria-expanded", "false"));
  if (reopen) return;
  mm._from = btn;
  mm.innerHTML = items.map(([a, label, state]) => `<button role="menuitem" data-a="${a}"><span>${label}</span><span class="state">${state}</span></button>`).join("");
  const r = btn.getBoundingClientRect();
  mm.style.left = Math.max(8, Math.min(r.left, innerWidth - 290)) + "px"; mm.style.top = (r.bottom + 6) + "px";
  mm.classList.add("open"); btn.setAttribute("aria-expanded", "true");
  mm.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { mm.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); act(b.dataset.a); }));
  mm.querySelector("button").focus();
}
document.addEventListener("click", e => { if (!e.target.closest("#menu,#tshare,#tview")) $("#menu").classList.remove("open"); });
function act(a) {
  if (a === "tech") { S.tech = !S.tech; persist(); render(); if (current) open(current.kind, current.arg); toast(S.tech ? "Technical names shown" : "Technical names hidden"); }
  if (a === "notes") { S.notesOnMap = !S.notesOnMap; persist(); render(); toast(S.notesOnMap ? "Notes shown beside the boxes" : "Notes shown as a count on each box"); }
  if (a === "roles") open("roles");
  if (a === "story") setStory(!S.story);
  if (a === "dots") { S.dots = !S.dots; persist(); document.body.classList.toggle("dots", S.dots); }
  if (a === "key") open("key");
  if (a === "save") saveReview();
  if (a === "copy") copyQuestions();
  if (a === "print") window.print();
  if (a === "reset" && confirm("Clear your answers, dots and decision notes on this computer?")) {
    S.answers = {}; S.votes = {}; S.decisions = {}; persist(); if (current) open(current.kind, current.arg); topBar();
  }
}

/* ---------- left story list ---------- */
function setStory(on) { S.story = on; persist(); document.body.classList.toggle("nostory", !on); story(); }
$("#storytab").addEventListener("click", () => setStory(true));
function story() {
  const el = $("#story");
  if (!S.story) { el.innerHTML = ""; return; }
  const views = MODEL.maps.map((m, mi) => {
    const kind = KIND[m.template];
    const cur = mi === S.map;
    let sub = "";
    if (kind === "journeys") sub = (m.journeys || []).map((j, ji) => `<li><button class="view" data-j="${mi}:${ji}" aria-current="${cur && S.journey === ji}"><b><span class="num">${mi + 1}.${ji + 1}</span>${esc(j.title)}</b><span>${esc(j.summary || plural((j.steps || []).length, "step"))}</span></button></li>`).join("");
    if (kind === "chain") sub = (m.stages || []).map((st, si) => `<li><button class="view" data-row="${mi}:s${si}"><b><span class="num">${mi + 1}.${si + 1}</span>${esc(st.label)}</b><span>${esc(st.sub || "")}</span></button></li>`).join("");
    if (kind === "tree") sub = (m.root.children || []).map((b, bi) => `<li><button class="view" data-row="${mi}:b${bi}"><b><span class="num">${mi + 1}.${bi + 1}</span>${esc(b.title)}</b><span>${plural((b.children || []).length, "idea")}</span></button></li>`).join("");
    const seg = kind === "chain" && cur ? `<div class="seg" role="group" aria-label="Today or planned"><button data-mode="today" aria-pressed="${S.mode === "today"}">Today</button><button data-mode="planned" aria-pressed="${S.mode === "planned"}">Planned</button></div>` : "";
    return `<li><button class="view" data-map="${mi}" aria-current="${cur && S.journey < 0}"><b><span class="num">${mi + 1}.</span>${esc(m.title)}</b><span>${esc(m.intro || "")}</span></button>${seg}<ol class="sub">${sub}</ol></li>`;
  }).join("");
  el.innerHTML = `<button class="hide" data-hide>Hide list</button>
    <div class="small">The decision</div><p class="q">${gl(MODEL.question, true)}</p>
    ${MODEL.reading ? `<details class="reading"><summary>How to read this</summary><p>${gl(MODEL.reading, true)}</p></details>` : ""}
    <button class="walkbtn" data-walk>Walk me through it</button>
    <h2>Views</h2><ol>${views}</ol>
    <h2>Deciding</h2><div class="more">
      <button data-open="questions">Questions to decide (${questionList().length})</button>
      ${DECISIONS.length ? `<button data-open="decisions">Decisions (${DECISIONS.length})</button>` : ""}
      ${GAPS.length ? `<button data-open="gaps">Gaps, ranked (${GAPS.length})</button>` : ""}
      <button data-open="evidence">Evidence and sources (${(MODEL.evidence || []).length})</button>
      <button data-open="roles">Whose notes to show</button>
    </div>
    ${MODEL.summary ? `<h2>About this decision</h2><p class="small">${gl(MODEL.summary, true)}</p>` : ""}`;
  el.querySelector("[data-hide]").addEventListener("click", () => setStory(false));
  el.querySelector("[data-walk]").addEventListener("click", () => walk(0));
  el.querySelectorAll("[data-map]").forEach(b => b.addEventListener("click", () => { showMap(+b.dataset.map); S.journey = -1; persist(); applyFocus(); story(); fit(); }));
  el.querySelectorAll("[data-j]").forEach(b => b.addEventListener("click", () => { const [mi, ji] = b.dataset.j.split(":").map(Number); focusJourney(mi, ji); }));
  el.querySelectorAll("[data-row]").forEach(b => b.addEventListener("click", () => { const [mi, key] = b.dataset.row.split(":"); focusRow(+mi, key); }));
  el.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  el.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => open(b.dataset.open)));
  wireTerms(el);
}

/* ---------- walk-through ---------- */
function steps() {
  const out = [{title:"The decision", text:MODEL.question + (MODEL.summary ? " " + MODEL.summary : ""), go:() => { showMap(0); S.journey = -1; applyFocus(); story(); fit(); }}];
  if (MODEL.reading) out.push({title:"How to read this", text:MODEL.reading, go:() => { showMap(0); S.journey = -1; applyFocus(); story(); fit(); }});
  MODEL.maps.forEach((m, mi) => {
    const kind = KIND[m.template];
    out.push({title:m.title, text:m.intro || "", go:() => { showMap(mi); S.journey = -1; applyFocus(); story(); fit(); }});
    if (kind === "journeys") (m.journeys || []).forEach((j, ji) => {
      const moments = (j.steps || []).filter(s => s.moment).map(s => s.text);
      out.push({title:`${ji + 1}. ${j.title}`, text:(j.summary || "") + ` ${plural((j.steps || []).length, "step")}.` + (moments.length ? ` Moments that matter: ${moments.join("; ")}.` : ""), go:() => focusJourney(mi, ji)});
    });
    if (kind === "chain") (m.stages || []).forEach((st, si) => {
      const items = (st.items || []).filter(it => (it.when || "both") === "both" || it.when === S.mode).map(it => it.title);
      out.push({title:`${si + 1}. ${st.label}`, text:`${st.sub || ""}. ${items.length ? items.join("; ") + "." : "Nothing here yet."}`, go:() => focusRow(mi, "s" + si)});
    });
    if (kind === "tree") (m.root.children || []).forEach((b, bi) => {
      out.push({title:b.title, text:`Ideas: ${(b.children || []).map(c => c.title).join("; ") || "none yet"}.`, go:() => focusRow(mi, "b" + bi)});
    });
  });
  if (GAPS.length) {
    const best = GAPS.slice().sort((a, b) => ((b.impact || 0) * 2 - (b.effort || 0)) - ((a.impact || 0) * 2 - (a.effort || 0)))[0];
    out.push({title:"Gaps between today and planned", text:`${plural(GAPS.length, "gap")}. Best value first: ${best.title}.`, panel:true, go:() => open("gaps")});
  }
  const qs = questionList();
  const must = qs.filter(q => q.urgency === "must").length;
  out.push({title:"What we need to decide", text:`${plural(qs.length, "question")}, ${must} that must be decided. Answer them on the right, then use Share my answers.`, panel:true, go:() => open("questions")});
  return out;
}
let walkAt = -1;
function walk(i) {
  const list = steps();
  if (i < 0 || i >= list.length) return endWalk();
  walkAt = i;
  hideHint();
  const s = list[i];
  if (!s.panel) close();
  s.go();
  const w = $("#walk");
  w.innerHTML = `<div class="step">Step ${i + 1} of ${list.length}</div><h3>${esc(s.title)}</h3><p>${gl(s.text)}</p>
    <div class="row"><button data-w="back"${i === 0 ? " disabled" : ""}>Back</button><span class="grow"></span>
    <button data-w="end">End the walk-through</button><button class="next" data-w="next">${i === list.length - 1 ? "Finish" : "Next"}</button></div>`;
  w.classList.add("open");
  w.querySelector('[data-w="back"]').addEventListener("click", () => walk(walkAt - 1));
  w.querySelector('[data-w="next"]').addEventListener("click", () => walk(walkAt + 1));
  w.querySelector('[data-w="end"]').addEventListener("click", endWalk);
  w.querySelector('[data-w="next"]').focus();
  wireTerms(w);
}
function endWalk() { walkAt = -1; $("#walk").classList.remove("open"); }

function wirePanel(p) {
  p.querySelectorAll("[data-jump-to]").forEach(b => b.addEventListener("click", () => jumpTo(b.dataset.jumpTo)));
  p.querySelectorAll("[data-open-gap]").forEach(b => b.addEventListener("click", () => { open("gaps"); const c = $("#gap-" + CSS.escape(b.dataset.openGap)); if (c) c.scrollIntoView(); }));
  p.querySelectorAll("[data-open-note]").forEach(b => b.addEventListener("click", () => open("note", NOTES.find(n => n.id === b.dataset.openNote))));
  p.querySelectorAll("[data-open-decision]").forEach(b => b.addEventListener("click", () => open("decisions")));
  p.querySelectorAll("[data-ans]").forEach(b => b.addEventListener("click", () => {
    const a = S.answers[b.dataset.ans] = S.answers[b.dataset.ans] || {};
    a.choice = a.choice === b.dataset.choice ? "" : b.dataset.choice; persist();
    b.parentElement.querySelectorAll("[data-ans]").forEach(x => x.setAttribute("aria-pressed", x.dataset.choice === a.choice));
  }));
  p.querySelectorAll("[data-comment]").forEach(t => t.addEventListener("input", () => {
    (S.answers[t.dataset.comment] = S.answers[t.dataset.comment] || {}).comment = t.value; persist();
  }));
  p.querySelectorAll("[data-dot]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.dot, d = +b.dataset.d, v = S.votes[id] || 0;
    if (d > 0 && dotsLeft() <= 0) return toast("No dots left. Take one back from another question first.");
    S.votes[id] = Math.max(0, v + d); if (!S.votes[id]) delete S.votes[id]; persist();
    b.parentElement.querySelector(".n").textContent = S.votes[id] || 0;
    const dl = $("#dleft"); if (dl) dl.textContent = dotsLeft();
  }));
  p.querySelectorAll("[data-dec]").forEach(f => f.addEventListener(f.tagName === "SELECT" ? "change" : "input", () => {
    (S.decisions[f.dataset.dec] = S.decisions[f.dataset.dec] || {})[f.dataset.k] = f.value; persist();
  }));
  const rv = $("#reviewer", p); if (rv) rv.addEventListener("input", () => { S.reviewer = rv.value; persist(); });
  p.querySelectorAll("[data-role]").forEach(c => c.addEventListener("change", () => { S.roles[c.dataset.role] = c.checked; persist(); render(); }));
  p.querySelectorAll("[data-roles]").forEach(b => b.addEventListener("click", () => {
    ROLES.forEach(r => S.roles[r.id] = b.dataset.roles === "all"); persist(); render(); open("roles");
  }));
  const gs = $("#gsort", p); if (gs) gs.addEventListener("change", () => open("gaps", gs.value));
  const vo = $("#voiceonly", p); if (vo) vo.addEventListener("change", () => open("evidence", vo.checked));
  wireTerms(p);
}
function jumpTo(id) {
  const info = BOX[id];
  if (info && info.kind === "gap") return open("gaps");
  const mi = mapOfAnchor(id);
  if (mi >= 0) showMap(mi);
  if (info && info.kind === "item" && !nodes[id]) setMode(info.box.when === "today" ? "today" : "planned");
  if (S.journey >= 0 && info && info.ji !== S.journey) { S.journey = -1; applyFocus(); story(); }
  const el = nodes[id];
  if (el) { world.querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); el.classList.add("sel"); centerOn(el); }
}

/* ---------- clicks on the map ---------- */
function activate(el) {
  const d = el._data; if (!d) return;
  hideHint();
  if (d.type === "box") open("box", d.id);
  else if (d.type === "note") open("note", d.n);
  else if (d.type === "notes") open("notes", d);
  else if (d.type === "outcome") open("outcome", d.o);
}
world.addEventListener("click", e => { const el = e.target.closest("[role=button]"); if (el && el._data) activate(el); });
world.addEventListener("keydown", e => {
  const el = e.target.closest("[role=button]");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); activate(el); }
});
world.addEventListener("focusin", e => {
  const el = e.target.closest("[role=button]");
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (r.right < leftEdge() || r.left > innerWidth - rightEdge() || r.bottom < TOP_H || r.top > innerHeight) centerOn(el);
});

/* ---------- glossary ---------- */
const gbox = $("#gloss");
function showTerm(el) {
  const k = el.dataset.term; if (!GLOSS[k]) return;
  gbox.innerHTML = `<b>${esc(k)}</b>${esc(GLOSS[k])}`;
  gbox.style.display = "block";
  const r = el.getBoundingClientRect();
  gbox.style.left = Math.min(innerWidth - 320, Math.max(8, r.left)) + "px";
  gbox.style.top = (r.bottom + 8 + 120 > innerHeight ? r.top - gbox.offsetHeight - 8 : r.bottom + 8) + "px";
}
const hideTerm = () => { gbox.style.display = "none"; };
function wireTerms(root) {
  root.querySelectorAll(".term").forEach(t => {
    t.addEventListener("mouseenter", () => showTerm(t)); t.addEventListener("mouseleave", hideTerm);
    t.addEventListener("focus", () => showTerm(t)); t.addEventListener("blur", hideTerm);
    t.addEventListener("click", e => { e.stopPropagation(); showTerm(t); });
  });
}
world.addEventListener("mouseover", e => { const t = e.target.closest(".term"); if (t) showTerm(t); });
world.addEventListener("mouseout", e => { if (e.target.closest(".term")) hideTerm(); });

/* ---------- share ---------- */
function reviewData() {
  return {format:"decisioncraft-review/1", model:MODEL.title, model_fingerprint:META.fingerprint || "",
    reviewer:S.reviewer || "", saved_at:new Date().toISOString(), answers:S.answers, dots:S.votes, decisions:S.decisions};
}
function saveReview() {
  const blob = new Blob([JSON.stringify(reviewData(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  const who = (S.reviewer || "reviewer").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  a.href = URL.createObjectURL(blob); a.download = `review-${who || "reviewer"}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Saved. Send the file to whoever runs the review.");
}
function copyQuestions() {
  let out = `# Questions to decide: ${MODEL.title}\n`, cur = null;
  questionList().forEach(q => {
    if (q.urgency !== cur) { cur = q.urgency; out += `\n## ${URG[cur]}\n\n`; }
    const a = S.answers[q.id] || {};
    out += `- ${q.n.question} (${(ROLE[q.n.role] || {label:q.n.role}).label})${a.choice ? ` — my answer: ${a.choice}` : ""}${a.comment ? ` — ${a.comment}` : ""}\n`;
  });
  const done = () => toast("Copied as a list");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out).then(done, () => fallbackCopy(out, done));
  else fallbackCopy(out, done);
}
function fallbackCopy(text, done) {
  const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("Could not copy on this browser."); }
  t.remove();
}
let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", 2600); }

/* ---------- optional keyboard shortcuts ---------- */
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,select")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "escape") { $("#menu").classList.remove("open"); hideTerm(); if (walkAt >= 0) endWalk(); else close(); return; }
  if (walkAt >= 0 && (k === "arrowright" || k === "arrowleft")) { walk(walkAt + (k === "arrowright" ? 1 : -1)); e.preventDefault(); return; }
  const m = MODEL.maps[S.map];
  if (/^[1-9]$/.test(k) && +k <= MODEL.maps.length) { showMap(+k - 1); fit(); }
  else if (k === "w") walk(0);
  else if (k === "f") fit();
  else if (k === "+" || k === "=") zoomAt(1.25, ...viewCenter());
  else if (k === "-") zoomAt(1 / 1.25, ...viewCenter());
  else if (k === "q") open("questions");
  else if (k === "n") act("notes");
  else if (k === "x") act("tech");
  else if (k === "?") open("keys");
  else if (k === "t" && KIND[m.template] === "chain") setMode(S.mode === "today" ? "planned" : "today");
  else return;
  e.preventDefault();
});

/* ---------- print: fit the view to the page width ---------- */
let before = null;
addEventListener("beforeprint", () => { before = {Z, X, Y}; Z = Math.min(1, 1000 / bounds.w); X = 0; Y = 0; apply(); });
addEventListener("afterprint", () => { if (before) { ({Z, X, Y} = before); apply(); } });

/* ---------- start ---------- */
document.title = MODEL.title;
document.body.classList.toggle("dots", S.dots);
document.body.classList.toggle("nostory", !S.story);
render();
fit();
hint();
addEventListener("resize", () => apply());
})();

</script>
</body>
</html>
