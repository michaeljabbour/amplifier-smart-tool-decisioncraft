<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:">
<meta name="generator" content="decisioncraft">
<title>Moving file uploads</title>
<style>
/* Decisioncraft canvas. One visual language:
   - a dotted canvas;
   - the chain as bold blocks, purple first and warm yellow after, joined by dashed arrows
     that name what each step does to the next;
   - white cards with a solid status tag, lane colours on journey steps;
   - sticky notes in each role's colour, slightly tilted, with an urgency edge;
   - plan changes as ribbons: teal New, amber Changed, grey Goes away. */
:root{
  --bg:#f4f3ef; --dot:#cdc9bf; --ink:#1d1d1f; --ink2:#43423d; --muted:#6a6862; --line:#dcd9d0;
  --panel:#ffffff; --soft:#efede6; --accent:#2f5bd3; --accent-soft:#e8eefc;
  --purple:#7350e0; --purple-ink:#ffffff; --yellow:#f7cd60; --yellow-edge:#e5b641; --yellow-ink:#3a2a00;
  --works:#1f7a4a; --partial:#985800; --missing:#b3261e; --planned:#0b6b72;
  --new:#0e8a84; --new-soft:#e6f6f4; --changed:#c27c00; --changed-soft:#fff4dc; --gone:#86837b; --gone-soft:#f1efea;
  --must:#b3261e; --should:#a86400; --info:#4a5a72;
  --z:1; --inv:1;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.small{font-size:12.5px;color:var(--muted)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:60px;z-index:80;background:#fff;padding:6px 10px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- canvas ---------- */
#viewport,#viewport2{position:fixed;inset:0;cursor:grab;touch-action:none;overflow:hidden}
body.dots #viewport,body.dots #viewport2{background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:22px 22px}
#viewport.dragging,#viewport2.dragging{cursor:grabbing}
#viewport2{display:none}
#world,#world2{position:absolute;left:0;top:0;transform-origin:0 0}
.panelabel{display:none}
svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:1}
svg.links path{fill:none;stroke:#a19d93;stroke-width:2}
svg.links path.flow{stroke:#a19d93}
svg.links path.hot{stroke:var(--accent);stroke-width:3}
svg.links path.spine{stroke:#8f8a7e;stroke-width:2.5;stroke-dasharray:7 6}
svg.links text{font-size:14px;font-weight:600;fill:#5d5a52;paint-order:stroke;stroke:var(--bg);stroke-width:5px}
svg.links text.verb{font-size:14px;font-weight:600;fill:#6b6658}
svg.links path.notelink{stroke-width:1.6;stroke-dasharray:3 5;opacity:.55}

/* ---------- boxes ---------- */
.box{position:absolute;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:11px 13px 12px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(40,35,20,.05);cursor:pointer;transition:opacity .15s,box-shadow .15s,transform .15s;overflow:hidden;z-index:2}
.box:hover{box-shadow:0 2px 4px rgba(0,0,0,.07),0 10px 26px rgba(40,35,20,.13)}
.box.sel{outline:3px solid var(--accent);outline-offset:3px}
.box.pair{outline:2px solid rgba(47,91,211,.45);outline-offset:3px}
.box h3,.box h4{margin:0 0 4px;font-size:15px;line-height:1.28;font-weight:650}
.box p{margin:0;color:var(--ink2)}
.box .t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:13.5px}
.box .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
body.dim .box.inj:not(.hot),body.dim .notecard.inj:not(.hot),body.dim .steplabel:not(.hot){opacity:.25}
body.dim svg.links path.inj:not(.hot){opacity:.25}

.stamp{position:absolute;white-space:nowrap;font-size:11.5px;font-weight:700;color:#fff;background:#3b4a63;border-radius:6px;padding:3px 9px;letter-spacing:.02em}
.maptitle{position:absolute;font-size:34px;font-weight:800;letter-spacing:-.015em;line-height:1.1}
.mapintro{position:absolute;color:var(--ink2);font-size:15.5px;line-height:1.45;max-width:780px}
.label{position:absolute;white-space:nowrap;color:var(--muted);font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
.modebar{position:absolute;white-space:nowrap;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 12px;font-size:13.5px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.modebar .hint-sbs{color:var(--muted);margin-left:4px}
.emptyslot{position:absolute;border:2px dashed #d3cfc4;border-radius:12px;padding:16px 14px;color:var(--muted);font-size:13.5px;background:rgba(255,255,255,.35)}

/* journeys: lanes as columns, a header card per journey, numbered steps with lane colours */
.lanehead{position:absolute;font-weight:700;font-size:15px;color:var(--ink);padding-left:2px}
.lanehead i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:1px}
.lanehead small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.3;margin-top:2px}
.lanebg{position:absolute;z-index:0;background:rgba(255,255,255,.5);border-radius:16px;border:1px dashed #dcd8ce;
  box-shadow:inset 0 3px 0 color-mix(in srgb,var(--lane) 55%,transparent)}
.jhead,.timeline-title{background:#fffdf7;border-color:#e6dfc9}
.jhead h3,.timeline-title h3{font-size:17px;display:flex;align-items:flex-start;gap:8px}
.jhead p,.timeline-title p{font-size:13.5px}
.jhead .creates,.timeline-title .creates{margin-top:10px;padding:8px 10px;background:#f7f3e6;border-radius:9px;font-size:12.5px}
.creates b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#6b5a26;margin-bottom:3px}
.creates ul{margin:0;padding-left:17px;color:var(--ink2)}
.creates.changes{background:#f3f7f6}
.creates.changes p{display:flex;gap:5px;flex-wrap:wrap}
.jhead .n,.timeline-title .n,.step .n{display:inline-grid;place-items:center;flex:0 0 auto;min-width:24px;height:24px;border-radius:12px;
  background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:0 6px}
.step{display:flex;flex-direction:column;border-left:5px solid var(--lane,#999)}
.step .row1{display:flex;align-items:flex-start;gap:8px}
.step .n{background:var(--lane,#1d1d1f)}
.step .t{font-size:14px;color:var(--ink);-webkit-line-clamp:3}
.customer-step{border-top:5px solid var(--lane,#5b78b9)}
.customer-step h4{font-weight:600;font-size:14.5px}
.steplabel{position:absolute;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.steplabel i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.links .customer-flow{stroke:#9aa6c2;stroke-width:2.2}

/* chain: a purple first stage, yellow stages after, items in a calm grid */
.box.stage{background:var(--yellow);border:0;color:var(--yellow-ink);display:flex;flex-direction:column;justify-content:center;
  padding:16px 20px;box-shadow:0 2px 0 var(--yellow-edge),0 8px 22px rgba(120,90,10,.16);border-radius:14px}
.box.stage h3{font-size:22px;font-weight:700;margin:0}
.box.stage p{color:#4b3c06;font-size:13.5px;margin-top:3px}
.box.stage.first-stage{background:var(--purple);color:var(--purple-ink);box-shadow:0 2px 0 #5737bd,0 8px 22px rgba(70,40,170,.25)}
.box.stage.first-stage p{color:#ece6ff}
.stagenum{position:absolute;right:14px;top:10px;font-size:12px;font-weight:800;opacity:.55}
.item h4{font-size:15px}
.tree-node{background:#fff}
.tree-node.l0{background:var(--ink);color:#fff;border-color:var(--ink)}
.tree-node.l0 p{color:#ddd}
.tree-node.l1{border-top:5px solid var(--purple)}
.tree-node.l2{border-top:5px solid var(--yellow-edge)}
.tree-node.l3{border-top:5px solid var(--new)}
.jindex{cursor:default;background:#fbfaf6}

/* tags */
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;color:#fff;white-space:nowrap;letter-spacing:.01em}
.pill.works{background:var(--works)} .pill.partial{background:var(--partial)}
.pill.missing{background:var(--missing)} .pill.planned{background:var(--planned)}
.chip{display:inline-block;font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip.since{background:#e9eefb;color:#203f8f;font-weight:700}
.chip.stale{background:#f4e1df;color:#7d1d16}
.chip.moment{background:#ece4fb;color:#4b2a8a;font-weight:700}
.chip.pain{background:#fde6e3;color:#8a1f16}
.feel{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.feel.good{background:#2f9e6a}.feel.ok{background:#d9a21e}.feel.bad{background:#d1543f}
.techname{display:block;margin-top:6px;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#3b4a63;
  background:#eef1f7;border-radius:6px;padding:3px 7px;white-space:normal}
/* the compact note count: a little stack of the speakers' paper colours */
.notebadge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 8px 2px 5px;
  background:#2b2a27;color:#fff;white-space:nowrap}
.notebadge.must{background:var(--must)}
.notebadge .stack{display:inline-flex}
.notebadge .stack i{display:block;width:11px;height:11px;border:1.5px solid;border-radius:2px;margin-left:-4px;transform:rotate(-6deg);box-shadow:1px 1px 0 rgba(0,0,0,.25)}
.notebadge .stack i:first-child{margin-left:0}
.notebadge .stack i:nth-child(2){transform:rotate(5deg)}

/* ---------- plan changes ---------- */
.ribbon,.ribbon-today{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  border-radius:6px;padding:2px 7px;white-space:nowrap;color:#fff}
.ribbon.new{background:var(--new)} .ribbon.changed{background:var(--changed)} .ribbon.gone{background:var(--gone)}
.box > .ribbon,.box > .ribbon-today{position:relative;margin:-1px 0 7px;vertical-align:top;align-self:flex-start;width:max-content}
.box.stage > .ribbon{display:none}
.ribbon-today{display:none}
.ribbon-today.changed{background:var(--changed)} .ribbon-today.gone{background:var(--gone)}
.box.chg-new{border:2px dashed var(--new);background:var(--new-soft)}
.box.chg-changed{border:2px solid var(--changed);box-shadow:0 0 0 4px var(--changed-soft),0 4px 14px rgba(40,35,20,.06)}
.box.chg-gone{background:var(--gone-soft);border:1.5px dashed #bdb9af;box-shadow:none}
.box.chg-gone .vwrap,.box.chg-gone h4,.box.chg-gone .row1 .t{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.45);color:var(--muted)}
.box.chg-gone .meta,.box.chg-gone p{opacity:.6}
.box.chg-same{opacity:.92}
.vwrap{display:grid}
.vwrap > div{grid-area:1/1;min-width:0}
.v-before{visibility:hidden}
.ghostlabel{display:none}
.chg-legend{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}

/* side by side: today on the left, the plan on the right, rows aligned */
body.sbs #viewport2{display:block;border-left:2px solid #c9c4b8}
body.sbs .panelabel{display:block;position:absolute;left:12px;top:60px;z-index:5;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.06)}
body.sbs #viewport .panelabel{border-color:#c9c4b8}
body.sbs #viewport2 .panelabel{border-color:var(--new);color:var(--new)}
.pane-today .box > .ribbon{display:none}
.pane-today .box > .ribbon-today{display:inline-block}
.pane-today .chg-new > .ribbon{display:inline-block}
.pane-today .chg-changed .v-now{visibility:hidden}
.pane-today .chg-changed .v-before{visibility:visible}
.pane-today .box.chg-changed{box-shadow:none;border:1.5px solid var(--changed)}
.pane-today .box.chg-gone{background:var(--panel);border:1px solid var(--line)}
.pane-today .box.chg-gone .vwrap,.pane-today .box.chg-gone h4,.pane-today .box.chg-gone .row1 .t{text-decoration:none;color:inherit}
.pane-today .box.chg-gone .meta,.pane-today .box.chg-gone p{opacity:1}
.pane-today .box.chg-new,.pane-planned .box.chg-gone{background:transparent;border:2px dashed #d0ccc1;box-shadow:none}
.pane-today .box.chg-new > :not(.ghostlabel),.pane-planned .box.chg-gone > :not(.ghostlabel){visibility:hidden}
.pane-today .box.chg-new .ghostlabel,.pane-planned .box.chg-gone .ghostlabel{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;font-weight:600}
#pairline{position:fixed;z-index:27;height:0;border-top:2px dashed rgba(47,91,211,.55);transform-origin:0 0;pointer-events:none;display:none}

/* ---------- sticky notes ---------- */
.notecard{position:absolute;z-index:2;cursor:pointer;overflow:hidden;transition:opacity .15s,transform .15s,box-shadow .15s;
  border-radius:3px 3px 14px 3px;border:1px solid rgba(70,55,20,.12);border-left:6px solid var(--info);padding:13px 14px 12px 13px;
  box-shadow:0 2px 2px rgba(0,0,0,.05),2px 8px 14px rgba(0,0,0,.12);transform:rotate(var(--note-tilt,0deg))}
.notecard.must{border-left-color:var(--must)} .notecard.should{border-left-color:var(--should)}
.notecard::before{content:"";position:absolute;top:-4px;left:calc(50% - 22px);width:44px;height:12px;
  background:rgba(255,255,255,.6);transform:rotate(-3deg);border:1px solid rgba(255,255,255,.7)}
.notecard::after{content:"";position:absolute;right:0;bottom:0;width:13px;height:13px;
  background:linear-gradient(135deg,transparent 48%,rgba(0,0,0,.1) 50%,rgba(255,255,255,.75));border-radius:0 0 12px 0}
.notecard:hover,.notecard:focus-visible{transform:none;box-shadow:2px 12px 20px rgba(0,0,0,.18)}
.notehead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.notecard .who{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink2);min-width:0;
  background:rgba(255,255,255,.7);border-radius:999px;padding:1px 8px 1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notecard .who i{flex:0 0 auto}
.notecard .urg{white-space:nowrap;flex:0 0 auto}
.notecard .who i{width:9px;height:9px;border-radius:50%}
.notecard .urg{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.notecard.must .urg{color:var(--must)} .notecard.should .urg{color:var(--should)} .notecard.info .urg{color:var(--info)}
.notecard h5{margin:8px 0 5px;font-size:15px;line-height:1.3}
.notecard .q{font-size:13px;font-weight:600;color:#2b2a26;line-height:1.42;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.morenotes{position:absolute;z-index:2;border:1.5px dashed #b9b5aa;background:rgba(255,255,255,.75);border-radius:9px;
  padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
#role-strip{position:fixed;top:62px;z-index:29;display:flex;align-items:center;gap:7px;width:max-content;
  max-width:calc(100vw - 24px);overflow-x:auto;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:12px;padding:6px 9px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
#role-strip[hidden]{display:none}
#role-strip button{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;background:#faf9f5;padding:4px 9px}
#role-strip button[aria-pressed="true"]{background:#eef0ff;border-color:#b8b4dc}
#role-strip button[aria-pressed="false"]{color:var(--muted);opacity:.7}
.paper-swatch{width:14px;height:14px;border:1px solid;box-shadow:1px 2px 2px rgba(0,0,0,.12);transform:rotate(-5deg)}
.role-caption{font-size:12px;color:var(--muted);white-space:nowrap}
body.sbs #role-strip{top:96px}

/* far zoom: keep the main words readable, drop the small print */
body.z-far .box .meta > :not(.notebadge):not(.pill),body.z-far .box p,body.z-far .creates,body.z-far .notecard .q,body.z-far .notecard .notehead{display:none}
body.z-far .box .t,body.z-far .box h3,body.z-far .box h4,body.z-far .notecard h5{font-size:calc(14px * var(--inv));line-height:1.15}
body.z-far .box .t{-webkit-line-clamp:2}
body.z-far .box .meta .notebadge,body.z-far .box .meta .pill{font-size:calc(11.5px * var(--inv))}
body.z-far #world .techname,body.z-far #world2 .techname{font-size:calc(12px * var(--inv))}
body.z-far .box > .ribbon{font-size:calc(11px * var(--inv))}

.term{border-bottom:1px dotted currentColor;cursor:help}
#gloss{position:fixed;z-index:60;max-width:300px;background:#1d1d1b;color:#fff;border-radius:8px;padding:8px 10px;
  font-size:13px;display:none;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#gloss b{display:block;margin-bottom:2px}

/* ---------- one quiet top bar ---------- */
#top{position:fixed;left:0;right:0;top:0;height:52px;z-index:30;display:flex;align-items:center;gap:8px;
  padding:0 12px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);white-space:nowrap}
#top .title{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
#top > button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;min-height:34px}
#top > button:hover{background:var(--soft)}
#top .primary{background:#fff6dc;border-color:#e9cf86;font-weight:600}
#top .count{display:inline-block;min-width:1.6em;padding:0 6px;margin-left:6px;border-radius:9px;background:rgba(0,0,0,.08);font-size:12px;text-align:center}
.save-primary,#top .save-primary{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:9px;padding:7px 12px;font-weight:600}
#top .save-primary:hover{background:#2448a8}
.short-label{display:none}
/* the view switch: words on a segmented control */
.seg{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:#f6f5f1;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button:hover{background:#fff}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[data-mode="changes"][aria-pressed="true"]{color:var(--new)}
.seg .sbs{margin-left:6px;border-left:1px solid var(--line);border-radius:0 7px 7px 0;padding-left:12px}
.seg .sbs[aria-pressed="true"]{color:var(--new)}
#top .seg{flex:0 0 auto}
#menu{position:fixed;z-index:45;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);display:none;min-width:270px;max-height:calc(100vh - 70px);overflow-y:auto}
#menu.open{display:block}
#menu button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px}
#menu button:hover{background:var(--soft)}
#menu .state{color:var(--muted);font-size:12.5px}
#menu [role=menuitemcheckbox][aria-checked="true"] .state{color:var(--accent);font-weight:700}

/* ---------- left story list ---------- */
#story{position:fixed;left:0;top:52px;bottom:0;width:320px;z-index:25;background:#fbfaf7;border-right:1px solid var(--line);
  overflow:auto;padding:14px 14px 30px}
body.nostory #story{display:none}
#storytab{position:fixed;left:10px;top:62px;z-index:26;display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px}
body.nostory #storytab{display:block}
#story .q{font-size:15px;font-weight:650;line-height:1.35;margin:2px 0 12px}
#story .walkbtn{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px;font-weight:650;font-size:14.5px;margin:4px 0}
#story .walkbtn:hover{background:#2a50bb}
#story .walkbtn.alt{background:#fff;color:var(--new);border:1.5px solid var(--new)}
#story .walkbtn.alt:hover{background:var(--new-soft)}
#story .hide{border:0;background:none;color:var(--muted);font-size:12.5px;padding:4px 0;float:right}

<script type="application/json" id="dc-model">{"format":"decisioncraft/1","title":"Moving file uploads","question":"Should we move customer file uploads to a new storage provider, change how uploads reach storage, or both?","summary":"A mid-size web team stores customers' files with one storage provider. Large uploads time out, and the transfer bill keeps growing. This map shows how an upload works today, what each option changes, and what the team still has to decide. All figures are made up.","freshness_days":30,"reading":"The first view, How an upload works, has six journeys: an upload today, the proposed direct upload, downloading and sharing, deleting, moving existing files, and what happens when something goes wrong. Each column is a part of the system, from the customer's browser on the left to the storage provider on the right, so you can see where each step happens. The second view, Options, starts from the outcome we want and branches into problems, ideas and quick tests. Turn on Show technical names in any box to see the services and settings involved. Notes from security, finance, support and others sit on the steps they are about.","checked":{"date":"2026-05-20","note":"Checked against the incident review, April upload numbers, 31 support tickets, a provider comparison and call notes, the scanning and retention setup, and a team discussion."},"glossary":{"signed link":"A web address that lets one browser upload or download one file for a few minutes, without a password.","proxy":"When our servers pass every byte between the customer and storage, instead of the customer talking to storage directly.","resumable upload":"An upload sent in pieces, so a dropped connection only loses the last piece.","data out":"Files sent from storage to anyone outside it. Providers charge for this.","CDN":"A network of servers close to customers that keeps copies of popular files, so they download faster and cost less.","checksum":"A short fingerprint of a file. If two copies have the same checksum, they are the same.","holding area":"A place where new files wait, unseen by anyone else, until the virus scan passes.","recycle area":"Where a provider keeps deleted files for a few days in case they were deleted by mistake."},"sources":[{"id":"S1","title":"Incident review: slow uploads","kind":"document","date":"2026-05-04","ref":"material/incident-notes.md"},{"id":"S2","title":"Storage providers compared","kind":"data","date":"2026-05-12","ref":"material/provider-comparison.md"},{"id":"S3","title":"Team discussion","kind":"meeting","date":"2026-05-15","ref":"material/team-discussion.md"},{"id":"S4","title":"Support tickets, sample of 31","kind":"document","date":"2026-05-09","ref":"material/support-tickets.md"},{"id":"S5","title":"Upload numbers, April","kind":"data","date":"2026-05-06","ref":"material/upload-metrics.md"},{"id":"S6","title":"Provider B call notes and draft terms","kind":"document","date":"2026-05-14","ref":"material/provider-b-terms.md"},{"id":"S7","title":"Scanning and retention setup","kind":"document","date":"2026-05-10","ref":"material/scanning-and-retention.md"}],"evidence":[{"id":"E1","source":"S1","kind":"data","text":"Uploads over 200 MB timed out for about 40 minutes.","where":"Summary"},{"id":"E2","source":"S1","kind":"quote","text":"Half our servers were just shovelling bytes. Nothing else could get through.","where":"On-call engineer"},{"id":"E3","source":"S1","kind":"data","text":"Our storage bill grew 22% last quarter, mostly from data transfer out, not storage.","where":"Costs"},{"id":"E4","source":"S1","kind":"data","text":"Support received 31 tickets. Most from customers uploading video.","where":"Support"},{"id":"E5","source":"S2","kind":"data","text":"Data out: $90 per TB today; $0 to our CDN with provider B.","where":"Comparison table"},{"id":"E6","source":"S2","kind":"data","text":"Moving 180 TB at current transfer prices would cost about $16,000 once. Provider B offers free one-time transfer over 100 TB, on request.","where":"Notes under the table"},{"id":"E7","source":"S3","kind":"quote","text":"The real problem is the proxy, not the provider. Direct uploads fix the timeouts wherever the files live.","where":"Backend lead"},{"id":"E8","source":"S3","kind":"observation","voice":true,"text":"Customers ask for a progress bar and the ability to resume after a dropped connection.","where":"Product manager, from support tickets"},{"id":"E9","source":"S3","kind":"observation","text":"Signed links must expire in minutes and only allow one file path.","where":"Security engineer"},{"id":"E10","source":"S3","kind":"observation","text":"Nobody has tested how virus scanning works if files no longer pass through our servers.","where":"Open point"},{"id":"E11","source":"S4","kind":"data","text":"19 of 31 tickets were video uploads over 200 MB; 8 said it got to 90% and then failed.","where":"Ticket tags"},{"id":"E12","source":"S4","kind":"quote","text":"I lost two hours re-uploading the same file three times.","where":"Wedding videographer","voice":true},{"id":"E13","source":"S4","kind":"quote","text":"Just show me how far along it is. I can't tell if it's stuck.","where":"Agency producer","voice":true},{"id":"E14","source":"S4","kind":"quote","text":"Our firewall blocks some sites. Will the new way still work here?","where":"School office","voice":true},{"id":"E15","source":"S5","kind":"data","text":"3.1% of uploads were over 200 MB, but they were 71% of all bytes uploaded.","where":"April totals"},{"id":"E16","source":"S5","kind":"data","text":"Failure rate for uploads over 200 MB: 6.2% in busy hours, 1.4% at night.","where":"Failures"},{"id":"E17","source":"S5","kind":"data","text":"Upload servers spend about 55% of their time passing bytes to storage.","where":"Server time"},{"id":"E18","source":"S5","kind":"data","text":"18% of files are downloaded more than 10 times and make up 80% of data out.","where":"Downloads"},{"id":"E19","source":"S6","kind":"data","text":"Free one-time transfer needs a written request and approval, usually 2 to 3 weeks.","where":"Transfer"},{"id":"E20","source":"S6","kind":"data","text":"Provider B keeps deleted files 7 days in a recycle area unless turned off.","where":"Deletes"},{"id":"E21","source":"S6","kind":"data","text":"Upload completion messages go to a web address we choose; they retry for 24 hours.","where":"Notifications"},{"id":"E22","source":"S6","kind":"data","text":"Their EU region is in a different country from our current one. Legal must check our customer contracts.","where":"Region"},{"id":"E23","source":"S7","kind":"data","text":"Files are shown to the customer before the scan finishes; downloads are blocked only if the scan fails.","where":"Scanning"},{"id":"E24","source":"S7","kind":"data","text":"Scanning takes about 9 seconds under 100 MB and up to 4 minutes for 5 GB.","where":"Scanning"},{"id":"E25","source":"S7","kind":"data","text":"Our terms promise deleted files are gone within 30 days, including backups.","where":"Retention"},{"id":"E26","source":"S6","kind":"data","text":"Bucket names at provider B are global; ours must be renamed.","where":"Setup"},{"id":"E28","source":"S6","kind":"observation","text":"Their onboarding team suggests writing new files to both providers for at least a month and comparing checksums on every file before switching reads.","where":"Onboarding advice"},{"id":"E27","source":"S3","kind":"observation","text":"Finance wants the transfer bill down before the September budget review.","where":"Finance"}],"maps":[{"id":"m-how","template":"system-journeys","title":"How an upload works","intro":"Five journeys from the customer's browser to the storage provider. Each column is the part of the system that does that step. The upload journey shows today and the plan in one.","lanes":[{"id":"people","label":"Customer","sub":"In their browser"},{"id":"front","label":"Web app","sub":"Pages and buttons"},{"id":"core","label":"Our servers","sub":"Checks and rules","summary":"The part of our system that checks who may do what before anything happens.","detail":"Upload service behind the load balancer; 60-second idle timeout."},{"id":"records","label":"Database","sub":"What we record","summary":"Where we keep a row for every file: who owns it, its size, and whether it is ready.","detail":"Files table with a state column: uploading, ready, rejected, deleted."},{"id":"background","label":"Background jobs","sub":"Work that runs later"},{"id":"outside","label":"Storage provider","sub":"Where files live","summary":"The company that stores the files for us, today provider A and perhaps provider B.","detail":"Object storage with signed links; buckets per region."}],"journeys":[{"id":"j-today","title":"Uploading a file","summary":"How an upload works today, and with direct links to storage. Use Today, Planned and What changes to read it.","creates":["A file record","The file in storage","A scan result"],"steps":[{"id":"t1","lane":"people","text":"Customer picks a file and presses Upload","status":"works","detail":"Upload button on the files page; no size limit shown.","feeling":"ok","kind":"Screen"},{"id":"t2","lane":"front","text":"Browser sends the whole file to our servers","status":"works","detail":"One HTTP request per file, no pieces.","pain":"No progress bar; people cannot tell if it is stuck.","evidence":["E8","E13"],"when":"today","kind":"Comes in"},{"id":"d2","lane":"core","text":"Our servers check the customer may upload, and issue a signed link for one file","status":"planned","detail":"Signed link valid 10 minutes, one path, one content type.","moment":true,"evidence":["E9"],"when":"planned","replaces":"t2","kind":"Behind the scenes"},{"id":"d2b","lane":"records","text":"A file record is created in 'uploading' state","status":"planned","detail":"Status column: uploading, scanning, ready, rejected.","when":"planned"},{"id":"t3","lane":"core","text":"Our servers pass the bytes on to storage","status":"partial","detail":"Streaming proxy in the upload service; 60-second idle timeout at the load balancer.","moment":true,"evidence":["E1","E2","E17"],"when":"today"},{"id":"d3","lane":"outside","text":"Browser uploads straight to storage in pieces, with a progress bar","status":"planned","detail":"Multipart upload, 16 MB pieces, three in parallel.","feeling":"good","evidence":["E7","E8","E13"],"when":"planned","replaces":"t3","kind":"Comes in"},{"id":"t3b","lane":"core","text":"Long uploads hold a server connection open","status":"partial","detail":"Each upload ties up one worker for its whole length.","pain":"Other customers' requests queue behind them.","evidence":["E2","E17"],"when":"today"},{"id":"t3c","lane":"people","text":"On weak wifi the upload fails and starts again from zero","status":"missing","detail":"No resume; the browser retries the whole request.","feeling":"bad","moment":true,"evidence":["E12","E16"],"when":"today"},{"id":"d3b","lane":"people","text":"If the connection drops, the upload resumes from the last piece","status":"planned","detail":"Browser keeps the upload id and finished pieces in local storage.","moment":true,"evidence":["E12","E11"],"when":"planned","replaces":"t3c"},{"id":"d3c","lane":"people","text":"Some office firewalls may block the storage address","status":"unsure","detail":"Fallback: the old proxy path for customers who cannot reach storage directly.","pain":"Schools and offices with strict firewalls.","evidence":["E14"],"when":"planned","status_reason":"Two of five large customers could not say yet whether their firewalls allow the storage address."},{"id":"d3d","lane":"outside","text":"File lands in a holding area nobody else can read","status":"planned","detail":"Separate bucket prefix with no public or shared access.","evidence":["E9","E23"],"when":"planned"},{"id":"t4","lane":"records","text":"File record is saved and the file shown to the customer","status":"works","detail":"Row in the files table with size, type and owner.","evidence":["E23"]},{"id":"d4","lane":"background","text":"Storage tells us the upload finished; a job scans it","status":"missing","detail":"Completion message to our web address, retried for 24 hours.","evidence":["E10","E21","E24"],"when":"planned"},{"id":"t5","lane":"background","text":"A job scans the file for viruses","status":"works","detail":"Scanner reads the file from storage after the upload finishes.","evidence":["E24"],"kind":"Behind the scenes"},{"id":"t6","lane":"records","text":"If the scan fails, downloads are blocked","status":"partial","detail":"Until then the file can already be shared and downloaded.","pain":"A bad file can be downloaded for up to 4 minutes.","evidence":["E23"],"when":"today"},{"id":"d5","lane":"records","text":"File is marked ready only after a clean scan","status":"planned","detail":"Moved out of the holding area, status set to ready.","evidence":["E23"],"when":"planned","replaces":"t6"},{"id":"d6","lane":"front","text":"Customer sees 'Ready' or a plain message if it was rejected","status":"planned","detail":"Rejected files are deleted after 7 days; owner gets an email.","when":"planned","kind":"Screen"}]},{"id":"j-download","title":"Downloading and sharing","summary":"A customer or someone they share with downloads a file.","creates":["A short-lived download link","A download count"],"steps":[{"id":"dl1","lane":"people","text":"Customer clicks Download, or opens a share link","status":"works","detail":"Share links never expire unless the owner turns them off."},{"id":"dl2","lane":"core","text":"Our servers check they may see the file","status":"works","detail":"Owner, team member, or holder of a share link."},{"id":"dl3","lane":"core","text":"Our servers make a signed download link","status":"works","detail":"Valid 5 minutes, one file.","evidence":["E9"]},{"id":"dl4","lane":"outside","text":"Storage sends the file to the browser","status":"works","detail":"Every download is billed as data out at $90 per TB.","pain":"This is where the bill grows.","evidence":["E5","E3"]},{"id":"dl5","lane":"outside","text":"Popular files could come from the CDN instead","status":"missing","detail":"18% of files make 80% of data out; caching them at the CDN cuts the bill.","moment":true,"evidence":["E18","E5"]},{"id":"dl6","lane":"records","text":"We count the download","status":"works","detail":"Download counter on the file record."},{"id":"dl7","lane":"people","text":"A file still being scanned cannot be downloaded","status":"planned","detail":"Today it can; in the planned flow it waits.","evidence":["E23"]}]},{"id":"j-delete","title":"Deleting a file","summary":"A customer deletes a file, or closes their account.","creates":["A deleted mark","A purge job","A deletion log entry"],"steps":[{"id":"x1","lane":"people","text":"Customer deletes a file","status":"works","detail":"Moves to the customer's trash for 30 days."},{"id":"x2","lane":"records","text":"File is marked deleted and hidden","status":"works","detail":"Deleted-at column set; share links stop working."},{"id":"x3","lane":"background","text":"After 30 days a job removes it from storage","status":"works","detail":"Nightly purge job.","evidence":["E25"]},{"id":"x4","lane":"outside","text":"At provider B, deleted files sit in a recycle area for 7 more days","status":"missing","detail":"Must be turned off, or counted inside our 30 days.","moment":true,"evidence":["E20","E25"]},{"id":"x5","lane":"outside","text":"During a move, the file may exist at both providers","status":"missing","detail":"Deletes must reach both until the old copy is gone.","pain":"A deleted file could survive at the old provider.","evidence":["E25"]},{"id":"x6","lane":"background","text":"Account closure deletes everything after 14 days","status":"works","detail":"Same purge job, per account.","evidence":["E25"]},{"id":"x7","lane":"records","text":"We log that the file is gone","status":"partial","detail":"Logged for account closures only."}]},{"id":"j-move","title":"Moving existing files to provider B","summary":"Copying 180 TB without customers noticing, if we decide to move.","creates":["A copy of every file at provider B","A checksum report","A switch-over date"],"steps":[{"id":"mv1","lane":"core","text":"Ask provider B for free transfer in writing","status":"missing","detail":"2 to 3 weeks for approval.","moment":true,"evidence":["E19","E6"]},{"id":"mv2","lane":"core","text":"Legal checks the new region against customer contracts","status":"missing","detail":"Different EU country from today.","evidence":["E22"]},{"id":"mv3","lane":"outside","text":"Create buckets at provider B with new names","status":"planned","detail":"Names are global; ours must change.","evidence":["E26"]},{"id":"mv4","lane":"background","text":"Copy new uploads to both providers for a month","status":"planned","detail":"Dual writes from the upload service.","evidence":["E28"]},{"id":"mv5","lane":"background","text":"Copy older files in batches overnight","status":"planned","detail":"Largest and most-downloaded first, to cut data out soonest.","evidence":["E18"]},{"id":"mv6","lane":"background","text":"Compare checksums for every file","status":"planned","detail":"A report of any file that does not match.","evidence":["E28"]},{"id":"mv7","lane":"core","text":"Switch reads to provider B, then writes","status":"planned","detail":"One setting per customer group, so we can switch back."},{"id":"mv8","lane":"outside","text":"Keep the old copy for 30 days, then delete it","status":"planned","detail":"Deletes made in those 30 days go to both.","evidence":["E25"]}]},{"id":"j-fail","title":"When something goes wrong","summary":"A storage outage, a stuck upload, or a missed completion message.","creates":["An alert","A retry","A message to the customer"],"steps":[{"id":"f1","lane":"outside","text":"Storage provider has an outage","status":"partial","detail":"Today uploads fail with a generic error.","evidence":["E1"]},{"id":"f2","lane":"front","text":"Customer sees a plain message and their upload pauses","status":"planned","detail":"Resume when storage is back, without starting over.","evidence":["E12"]},{"id":"f3","lane":"background","text":"A completion message never arrives","status":"missing","detail":"Nightly job finds files stuck in 'uploading' for over 24 hours.","evidence":["E21"]},{"id":"f4","lane":"background","text":"Stuck files are checked against storage and fixed or cleaned up","status":"missing","detail":"If the file is complete in storage, scan it; if not, delete the record."},{"id":"f5","lane":"core","text":"On-call is alerted when large-upload failures pass 2%","status":"missing","detail":"Today nobody is alerted; support finds out from tickets.","moment":true,"evidence":["E4","E16"]},{"id":"f6","lane":"front","text":"Support can see a customer's recent uploads and why they failed","status":"missing","detail":"A simple page for support, read-only.","evidence":["E4"]}]}]},{"id":"m-options","template":"opportunity-tree","title":"Options","intro":"The outcome at the top, then the problems that stand in its way, the ideas for each, and the quick tests that would prove an idea.","levels":["Outcome","Problem","Idea","Quick test"],"root":{"id":"o-root","title":"Big uploads always finish, and the transfer bill falls","text":"By the September budget review.","children":[{"id":"o-timeouts","title":"Large uploads time out","status":"missing","evidence":["E1","E4"],"children":[{"id":"o-direct","title":"Direct uploads with signed links","status":"planned","evidence":["E7"],"children":[{"id":"o-test-direct","title":"Ship to 5% of video uploads for two weeks","text":"Compare failure rate and server load."}]},{"id":"o-bigger","title":"Raise timeouts and add servers","status":"works","text":"Cheap now, costly later.","children":[{"id":"o-test-bigger","title":"Raise the idle timeout to 10 minutes on one server","text":"Watch for queueing."}]}]},{"id":"o-bill","title":"Data out costs keep growing","status":"partial","evidence":["E3","E5"],"children":[{"id":"o-move","title":"Move files to provider B","status":"planned","evidence":["E5","E6"],"children":[{"id":"o-test-move","title":"Copy one month of new files to B and serve them through the CDN","text":"Measure the bill and download speed."}]},{"id":"o-cache","title":"Cache popular downloads at the CDN","status":"missing","children":[{"id":"o-test-cache","title":"Turn on caching for public files only","text":"One week, then compare data out."}]}]}]}}],"gaps":[{"id":"G1","title":"Direct uploads with a progress bar and resume","why":"Fixes the timeouts no matter which provider we use; uploads over 200 MB are 71% of all bytes.","anchors":["d2","d3","d3b","o-direct"],"impact":5,"effort":3,"stories":[{"as":"As a customer uploading a large video on a weak connection, I want the upload to resume where it stopped, so I do not start again.","done_when":["a 2 GB upload survives a 30-second disconnect","the progress bar matches the bytes received","our servers handle no file bytes"],"detail":["A dropped connection resumes from the last finished piece in a test with throttled network.","A link used after 15 minutes is refused."]},{"as":"As a producer uploading a 4 GB video, I want to see how far along it is, so I know it is not stuck.","done_when":["a progress bar shows percent and time left","it updates at least every 2 seconds"]},{"as":"As a school office behind a strict firewall, I want uploads to still work, so we are not locked out.","done_when":["if the storage address cannot be reached within 5 seconds, the upload falls back to the old path","support can see which customers used the fallback"]}],"design":["The customer sees progress and can leave the page without losing the upload.","Nothing is shown as ready until the scan is clean.","If direct upload is blocked, the old way still works."],"detail":"Signed upload link per file, valid 15 minutes; pieces of 8 MB; completion message from storage starts the scan job."},{"id":"G2","title":"Scan files that never touch our servers","why":"Today scanning assumes we saw the upload, and a bad file can be downloaded for up to 4 minutes.","anchors":["d4","d3d","t6"],"impact":4,"effort":2,"stories":[{"as":"As the security engineer, I want every upload scanned before anyone can download it, so direct uploads add no risk.","done_when":["a file is not downloadable until its scan passes","an infected test file is quarantined and the customer is told"]},{"as":"As a customer, I want to know my file is being checked, so a short wait makes sense.","done_when":["the file shows 'Checking' until the scan passes","files under 100 MB are ready within 15 seconds"]}]},{"id":"G3","title":"Move existing files to provider B","why":"Cuts the data-out bill; only worth it if the free transfer is granted.","anchors":["o-move","mv1","mv5"],"impact":3,"effort":4,"stories":[{"as":"As finance, I want the move to cost nothing up front, so the saving shows before the September review.","done_when":["provider B confirms free transfer in writing","every file's checksum matches after the copy","downloads switch over with no broken links"]},{"as":"As the engineering lead, I want to switch back within an hour, so a bad move does not become an outage.","done_when":["reads and writes switch by one setting per customer group","a dry run of switching back is done before the move"]}]},{"id":"G4","title":"Serve popular files from the CDN","why":"18% of files cause 80% of data out; caching them cuts the bill with either provider.","anchors":["dl5","o-cache"],"impact":4,"effort":2,"stories":[{"as":"As finance, I want popular downloads to stop counting as data out, so the bill falls before September.","done_when":["public and shared files are served from the CDN","data out falls at least 30% in the first month"]},{"as":"As a security engineer, I want private files never cached, so nobody gets someone else's file.","done_when":["only files marked public or shared go to the CDN","a private file request always checks permission first"]}]},{"id":"G5","title":"Deletes reach every copy","why":"Our terms promise deleted files are gone within 30 days; provider B keeps a 7-day recycle area and a move means two copies.","anchors":["x4","x5","mv8"],"impact":4,"effort":2,"stories":[{"as":"As a customer who deleted a file, I want it gone everywhere within 30 days, as the terms promise.","done_when":["provider B's recycle area is off, or our purge runs 7 days early","deletes during the move go to both providers","a monthly check finds no deleted file older than 30 days"]}]},{"id":"G6","title":"Know about failures before customers tell us","why":"Support found out about the 2 May incident from 31 tickets.","anchors":["f5","f6","f3"],"impact":3,"effort":2,"stories":[{"as":"As on-call, I want an alert when large uploads start failing, so I can act in minutes, not hours.","done_when":["an alert fires when failures over 200 MB pass 2% for 10 minutes","the alert links to a page showing the failing step"]},{"as":"As support, I want to see a customer's recent uploads and why they failed, so I can answer the ticket.","done_when":["a read-only page lists the last 20 uploads with status and error","it never shows file contents"]}]}],"notes":[{"id":"N1","role":"engineer","anchor":"t3","title":"The proxy is the bottleneck","body":"Servers hold a connection for the whole upload. That is why everything slowed down.","recommend":"Do direct uploads first; it is independent of the provider choice.","question":"Do we agree to separate the two decisions: direct uploads now, provider later?","urgency":"must","evidence":["E2","E7"]},{"id":"N2","role":"security","anchor":"d2","title":"Signed links must be narrow","body":"A link that allows any path, or lasts hours, would let anyone write files into our storage.","recommend":"Links last 10 minutes, cover one path, and set a size limit.","question":"Is 10 minutes long enough for the slowest customers, given uploads resume in pieces?","urgency":"must","evidence":["E9"]},{"id":"N3","role":"security","anchor":"d4","title":"Nothing is downloadable before it is scanned","body":"With direct uploads, a file lands in storage before we have looked at it.","recommend":"Upload into a holding area; move it to the live area only after a clean scan.","question":"Who builds and tests the holding area before the 5% trial?","urgency":"must","evidence":["E10"]},{"id":"N4","role":"voice","anchor":"d3","title":"Customers asked for two things","body":"A progress bar and resuming after a dropped connection. Neither needs a new provider.","recommend":"Ship both with direct uploads, and tell the 31 customers who raised tickets.","question":"Do we contact the customers who reported the problem when the fix ships?","urgency":"should","evidence":["E4","E8"]},{"id":"N5","role":"finance","anchor":"o-bill","title":"The bill problem is data out, not storage","body":"Storage grew a little; data out grew a lot.","recommend":"Try CDN caching first; it is cheap and fast to test.","question":"How much must data out fall by September for this to count as fixed?","urgency":"must","evidence":["E3","E5"]},{"id":"N6","role":"finance","anchor":"G3","title":"Only move if the transfer is free","body":"At $16,000, the move pays back in about seven months. Free transfer makes it pay back at once.","recommend":"Ask provider B for free transfer in writing before deciding.","question":"Who asks provider B, and by when?","urgency":"should","evidence":["E6"]},{"id":"N7","role":"owner","anchor":"o-root","title":"Two outcomes, two clocks","body":"Timeouts hurt customers now. The bill matters by September.","recommend":"Fix timeouts this month; decide the provider in July with test results in hand.","question":"Is July the right month to make the provider decision?","urgency":"should","evidence":["E1","E3"]},{"id":"N8","role":"analyst","anchor":"o-test-direct","title":"Say what the trial must show","body":"Without a target, a two-week trial cannot pass or fail.","recommend":"Pass if failed uploads drop below 1% and no server spends more than 5% of its time on uploads.","question":"Are those the right pass marks for the trial?","urgency":"should","evidence":["E1"]},{"id":"N9","role":"designer","anchor":"t2","title":"Tell people what is happening","body":"Today a big upload shows a spinner with no end.","recommend":"Show bytes sent, time left, and a clear message if the connection drops.","question":"Should a dropped upload resume by itself, or ask first?","urgency":"info","evidence":["E8"]},{"id":"N10","role":"agent","anchor":"G3","title":"An assistant can check the copy","body":"Comparing checksums for millions of files is repetitive and easy to get wrong by hand.","recommend":"Let an agent run and report the checksum comparison; a person signs off the switch-over.","question":"Who signs off the switch-over once the agent's report is clean?","urgency":"info","evidence":["E6"]},{"id":"N11","role":"engineer","anchor":"o-move","title":"Nobody has run provider B","body":"Four years of experience with the current provider; none with B.","recommend":"Run the one-month copy test before committing.","question":"Are we willing to run two providers for a few months during the move?","urgency":"should","evidence":["E6"]},{"id":"N12","role":"voice","anchor":"t3c","title":"Starting again from zero is the real pain","body":"The videographer lost two hours re-uploading the same file; four tickets came from hotel or train wifi.","recommend":"Make resume the first thing the trial measures.","question":"Do we promise resume in the help pages before the trial ends?","urgency":"must","evidence":["E12","E11"]},{"id":"N13","role":"voice","anchor":"d3c","title":"Strict firewalls could lock some customers out","body":"A school office asked if the new way would work behind their firewall.","recommend":"Keep the old path as a fallback and tell support how to spot it.","question":"How long do we keep the old proxy path running as a fallback?","urgency":"should","evidence":["E14"]},{"id":"N14","role":"designer","anchor":"d6","title":"Say plainly why a file was rejected","body":"Customers see 'Error' today, which looks like our fault.","recommend":"Show 'This file was blocked because it may contain a virus' and what to do next.","question":"Do we tell free-plan users the scanner's reason, or only that it was blocked?","urgency":"should","evidence":["E23"]},{"id":"N15","role":"designer","anchor":"d3","title":"Show time left, not just percent","body":"A producer could not tell whether the upload was stuck.","recommend":"Show percent, speed and time left, updated every two seconds.","question":"Is time left accurate enough on weak connections to show it?","urgency":"info","evidence":["E13"]},{"id":"N16","role":"analyst","anchor":"d2b","title":"One status field for every file","body":"Uploading, checking, ready and rejected must mean the same thing on every page.","recommend":"Write the four states down and use them in the app, support page and alerts.","question":"Do we need a separate state for files waiting on a fallback upload?","urgency":"should","evidence":["E23"]},{"id":"N17","role":"analyst","anchor":"f3","title":"Decide what counts as stuck","body":"Completion messages retry for 24 hours, so 'stuck' must be longer than that.","recommend":"Call a file stuck after 26 hours in 'uploading'.","question":"Is 26 hours too long for customers waiting on a file?","urgency":"should","evidence":["E21"]},{"id":"N18","role":"engineer","anchor":"d4","title":"We must answer completion messages quickly","body":"Provider B retries for 24 hours if we do not answer; slow answers cause duplicates.","recommend":"Answer at once and do the scan in a background job; ignore duplicates by upload id.","question":"Who owns the completion endpoint and its alerts?","urgency":"must","evidence":["E21"]},{"id":"N19","role":"engineer","anchor":"mv4","title":"Dual writes double the risk of half-done uploads","body":"For a month every upload goes to two places.","recommend":"Treat the old provider as the source of truth until the switch; log every mismatch.","question":"Do we pause the move if mismatches pass 0.1%?","urgency":"should","evidence":["E28"]},{"id":"N20","role":"engineer","anchor":"f5","title":"No alert today","body":"Support found the incident from tickets; nobody was paged.","recommend":"Alert on large-upload failure rate, not on server errors alone.","question":"What failure rate should wake someone at night?","urgency":"should","evidence":["E4","E16"]},{"id":"N21","role":"owner","anchor":"G4","title":"Caching may beat moving","body":"Caching popular files cuts most data out without moving anything.","recommend":"Run the one-week caching test before deciding on provider B.","question":"If caching cuts data out by 30%, do we still move?","urgency":"must","evidence":["E18","E5"]},{"id":"N22","role":"owner","anchor":"d3c","title":"Keep the fallback small","body":"A permanent second upload path doubles what we support.","recommend":"Keep the fallback for six months, then review who still uses it.","question":"Who reviews the fallback numbers in six months?","urgency":"info","evidence":["E14"]},{"id":"N23","role":"security","anchor":"x4","title":"The recycle area breaks our deletion promise","body":"Provider B keeps deleted files 7 days unless it is turned off; our terms promise 30 days in total.","recommend":"Turn the recycle area off, or purge 7 days early.","question":"Which do we choose: turn it off, or purge early?","urgency":"must","evidence":["E20","E25"]},{"id":"N24","role":"security","anchor":"dl5","title":"Never cache private files","body":"A cache mistake could show one customer's file to another.","recommend":"Cache only files marked public or shared; check permission for everything else.","question":"Who reviews the cache rules before the test?","urgency":"should","evidence":["E18"]},{"id":"N25","role":"security","anchor":"mv2","title":"A new country needs a legal check","body":"Provider B's EU region is in a di MODEL.maps.forEach(m => changeList(m).forEach(s => {
  CHANGE_INFO[s.box.id] = s;
  if (s.before) CHANGE_INFO[s.before.id] = {change:"replaced", box:s.before, by:s.box};

function changeCounts(list) {

  return [["new", n("new"), "new"], ["changed", n("changed"), "changed"], ["gone", n("gone"), n("gone") === 1 ? "goes away" : "go away"]].filter(c => c[1]);
}
const countsText = list => changeCounts(list).map(([, n, w]) => `${n} ${w}`).join(" · ");
const countsHtml = list => changeCounts(list).map(([k, n, w]) => `<span class="ribbon ${k}">${n} ${w}</span>`).join("");
/* A changed box carries both versions in one grid cell, so it is as tall as the taller one
   and rows line up in Side by side. */
const RIBBON = s => s.change && s.change !== "same"
  ? `<span class="ribbon ${s.change}">${CHANGE_WORD[s.change]}</span>${s.change === "new" ? "" : `<span class="ribbon-today ${s.change}">${s.change === "changed" ? "Will change" : "Goes away"}</span>`}` : "";
const GHOST = s => s.change === "new" ? `<span class="ghostlabel">Not there today</span>` : s.change === "gone" ? `<span class="ghostlabel">Goes away</span>` : "";
function slotHtml(s, inner) {
  const now = inner(s.box);
  return RIBBON(s) + (s.before ? `<div class="vwrap"><div class="v-now">${now}</div><div class="v-before">${inner(s.before)}</div></div>` : now) + GHOST(s);

const slotLabel = (s, text) => (s.change && s.change !== "same" ? CHANGE_WORD[s.change] + ": " : "") + text;

/* Word-level differences between two short texts, for the Before and After view. */
function wordDiff(a, b) {
  const A = String(a || "").split(/(\s+)/).filter(Boolean), B = String(b || "").split(/(\s+)/).filter(Boolean);
  const n = A.length, m = B.length;
  const dp = Array.from({length:n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const mark = (t, tag) => /^\s+$/.test(t) ? esc(t) : `<${tag}>${esc(t)}</${tag}>`;
  let i = 0, j = 0, oa = "", ob = "";
  while (i < n && j < m) {
    if (A[i] === B[j]) { oa += esc(A[i]); ob += esc(B[j]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) oa += mark(A[i++], "del");
    else ob += mark(B[j++], "ins");
  }
  while (i < n) oa += mark(A[i++], "del");
  while (j < m) ob += mark(B[j++], "ins");
  return [oa, ob];
}
const mapOfAnchor = a => BOX[a] ? (BOX[a].mi >= 0 ? BOX[a].mi : mapOfAnchor((BOX[a].box.anchors || [])[0])) : -1;
const titleOf = b => b.title || b.label || b.text || b.id;

function badges(b) {
  const out = [];
  if (sinceAdded.has(b.id)) out.push(`<span class="chip since">New since last review</span>`);
  else if (sinceChanged[b.id]) out.push(`<span class="chip since">Changed since last review</span>`);
  const ref = (MODEL.checked || {}).date;
  if (b.checked && ref && days(ref, b.checked) > FRESH_DAYS) out.push(`<span class="chip stale" title="Checked ${esc(b.checked)}">May be out of date</span>`);
  if (b.moment) out.push(`<span class="chip moment">Moment that matters</span>`);
  if (b.pain) out.push(`<span class="chip pain">Pain point</span>`);
  if (b.feeling) out.push(`<span class="chip"><i class="feel ${b.feeling}"></i>${FEEL[b.feeling]}</span>`);
  const ev = (b.evidence || []).length;
  if (ev) out.push(`<span class="chip">Evidence: ${ev}</span>`);
  const notes = notesOn(b.id);
  if (notes.length) {
    const colours = [...new Set(notes.map(n => (ROLE[n.role] || {}).color || "#888"))].slice(0, 3);
    out.push(`<span class="notebadge${notes.some(n => n.urgency === "must") ? " must" : ""}"><span class="stack" aria-hidden="true">${colours.map(c => `<i style="background:${tint(c)};border-color:${c}"></i>`).join("")}</span>${plural(notes.length, "note")}</span>`);
  }
  return out.join("");
}
const tech = b => S.tech && b.detail ? `<span class="techname">${esc(b.detail)}</span>` : "";

/* ---------- DOM helpers ---------- */
const world = $("#world"), viewport = $("#viewport");
let nodes = {}, rows = [], svg, K = 0;
function place(cls, x, y, w, html, data, label) {
  const d = document.createElement("div");
  d.className = cls; d.style.left = x + "px"; d.style.top = y + "px";
  if (w) d.style.width = w + "px";
  d.innerHTML = html;
  if (data) { d.tabIndex = 0; d.setAttribute("role", "button"); d.setAttribute("aria-label", label || ""); d._data = data; d.dataset.k = ++K; }
  world.appendChild(d);
  return d;
}
function link(x1, y1, x2, y2, cls, label) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  const my = (y1 + y2) / 2;
  p.setAttribute("d", Math.abs(x1 - x2) < 2 ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
  if (cls) p.setAttribute("class", cls);
  svg.appendChild(p);
  if (label) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", (x1 + x2) / 2 + 16); t.setAttribute("y", my + 5); t.textContent = label;
    t.setAttribute("class", "verb");

}
function arrowHead(x, y) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", `M${x - 6},${y - 9} L${x},${y} L${x + 6},${y - 9}`);
  svg.appendChild(p);
}
function tint(hex) {
  const n = parseInt(String(hex).replace("#", ""), 16) || 0x888888;
  const mix = c => Math.round(c * 0.16 + 255 * 0.84);
  return `rgb(${mix(n >> 16 & 255)},${mix(n >> 8 & 255)},${mix(n & 255)})`;
}

/* Notes beside a row (only when "Show all notes on the map" is on): a column to the right of
   every box, sized from the real cards, so a note never sits over any text. */
const NOTE_W = 250, NOTE_GAP = 12, NOTES_W = 2 * NOTE_W + NOTE_GAP;
function notePile(anchors, x, y, max, rowKey) {
  if (!S.notesOnMap) return 0;
  const list = NOTES.filter(n => anchors.includes(n.anchor) && S.roles[n.role] !== false)
    .sort((a, b) => URG_ORDER[a.urgency || "info"] - URG_ORDER[b.urgency || "info"]);
  const shown = list.slice(0, max);
  const colH = [0, 0];
  shown.forEach((n, i) => {
    const c = colH[0] <= colH[1] ? 0 : 1;
    const r = ROLE[n.role] || {label:n.role, color:"#888"};
    const el = place(`notecard ${n.urgency || "info"} inj`, x + c * (NOTE_W + NOTE_GAP), y + colH[c], NOTE_W,
      `<div class="notehead"><span class="who"><i style="background:${r.color}"></i>${esc(r.label)}</span><span class="urg">${URG[n.urgency || "info"]}</span></div>
       <h5>${esc(n.title)}</h5><div class="q">${esc(n.question || n.body || "")}</div>`,
      {type:"note", n}, `${r.label} note: ${n.title}`);
    el.style.background = tint(r.color);
    el.style.setProperty("--note-tilt", [-1.1, 0.8, -0.5, 1][i % 4] + "deg");
    el.style.setProperty("--role", r.color);
    el.dataset.row = rowKey; el.dataset.anchor = n.anchor;
    colH[c] += el.offsetHeight + NOTE_GAP;
  });
  let h = Math.max(colH[0], colH[1]);

    const more = place("morenotes inj", x, y + h, NOTES_W, `+ ${plural(list.length - shown.length, "more note")} here`,
      {type:"notes", anchors, title:"Notes here"}, `${list.length - shown.length} more notes`);
    more.dataset.row = rowKey;
    h += more.offsetHeight + NOTE_GAP;
  }
  return h;
}
const notesWidth = () => S.notesOnMap ? NOTES_W + 48 : 0;

function header(m, width) {
  place("stamp", 0, 6, 0, (MODEL.checked && MODEL.checked.date) ? `Checked against the sources on ${esc(MODEL.checked.date)}` : "Not yet checked against sources");
  const t = place("maptitle", 0, 40, Math.max(width, 600), esc(m.title || MODEL.title));
  const q = place("mapintro", 0, 40 + t.offsetHeight + 8, Math.min(Math.max(width, 600), 900), gl(m.intro || ""));
  let y = 40 + t.offsetHeight + 8 + q.offsetHeight;
  const mode = modeOf(m);
  if (mode !== "all") {
    const list = changeList(m);
    const text = mode === "today" ? "<b>Today.</b> What exists now, before any change." :
      mode === "planned" ? "<b>Planned.</b> How it works once the plan is done." :
      `<b>What changes.</b> The plan, with every change marked. ${countsHtml(list)}`;
    const lg = place("modebar", 0, y + 14, 0, `${text}${mode === "changes" ? `<span class="hint-sbs">${sbsOn() ? "Left: today. Right: the plan. Rows line up." : "Faded boxes go away. Open a box to compare before and after."}</span>` : ""}`);
    y += 14 + lg.offsetHeight;
  }
  return y + 40;
}

/* ---------- journeys ---------- */
/* Each lane keeps one colour, so a step's edge says which part of the system it runs in. */
const LANE_COLORS = ["#4f7fd8", "#8a5cd6", "#d99a1e", "#2f9e6a", "#d1543f", "#1f9aa6", "#b5568c", "#7a7a72"];
function okColour(c) {

  return 1.05 / (0.2126 * r + 0.7152 * g + 0.0722 * b + 0.05) >= 3;
}
const laneColor = (i, m = MODEL.maps[S.map]) => { const own = ((m.lanes || [])[i] || {}).color; return okColour(own) ? own : LANE_COLORS[i % LANE_COLORS.length]; };
const J = {laneW:262, laneGap:20, stepW:238, stepH:86, rowGap:18, headW:330, headGap:44, bandGap:76};
function stepInner(n) {
  return b => `${kindLabel(b)}<div class="row1"><span class="n">${n}</span><div class="t">${gl(b.text)}</div></div>${tech(b)}
    <div class="meta">${bpill(b)}${badges(b)}</div>`;
}
function journeyHead(m, j, ji, slots, mode) {
  const changed = mode === "changes" ? slots.filter(s => s.change && s.change !== "same") : [];
  return `<h3><span class="n">${ji + 1}</span><span class="tt">${gl(j.title)}</span></h3><p>${gl(j.summary || "")}</p>
    ${(j.creates || []).length ? `<div class="creates"><b>What gets created</b><ul>${j.creates.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
    ${changed.length ? `<div class="creates changes"><b>What changes</b><p>${countsHtml(changed)}</p></div>` : ""}
    ${tech(j)}<div class="meta">${badges(j)}<span class="chip">${plural(slots.length, "step")}</span></div>
    ${slots.length ? `<button class="mini startj" data-startj="${S.map}:${ji}">▶ Walk through this journey</button>` : ""}`;
}
function renderJourneys(m) {
  const lanes = m.lanes || [];
  const mode = modeOf(m);
  const LI = Object.fromEntries(lanes.map((l, i) => [l.id, i]));
  const laneX = i => J.headW + J.headGap + i * (J.laneW + J.laneGap);
  const lanesRight = laneX(lanes.length - 1) + J.laneW;
  const notesX = lanesRight + 56;
  const W = lanesRight + notesWidth();
  let y = header(m, W);
  lanes.forEach((l, i) => {
    const h = place("lanehead", laneX(i), y, J.laneW, `<i style="background:${laneColor(i)}"></i>${esc(l.label)}<small>${esc(l.sub || "")}</small>`,
      {type:"lane", mi:S.map, i}, `About ${l.label}`);
    h.style.setProperty("--lane", laneColor(i));
    if (l.summary) h.title = l.summary;
  });
  if (S.notesOnMap) place("label", notesX, y + 4, 0, "Notes from each role");
  y += 66;
  const laneTop = y - 78;
  (m.journeys || []).forEach((j, ji) => {
    const y0 = y;
    const slots = arrange(j.steps || [], mode);
    const hd = place("box jhead inj", 0, y0, J.headW, journeyHead(m, j, ji, slots, mode),
      {type:"box", id:j.id}, `Journey ${ji + 1}: ${j.title}`);

      const li = LI[s.lane] || 0;
      const x = laneX(li) + (J.laneW - J.stepW) / 2;
      const el = place(`box step inj${slot.change ? " chg-" + slot.change : ""}`, x, sy, J.stepW,
        slotHtml(slot, stepInner(k + 1)),
        {type:"box", id:s.id}, slotLabel(slot, `Step ${k + 1} of journey ${ji + 1}: ${s.text}`));
      el.style.minHeight = J.stepH + "px";
      el.style.setProperty("--lane", laneColor(li));
      el.dataset.row = "j" + ji;
      nodes[s.id] = el;
      const h = el.offsetHeight;
      if (prev) {

        p.dataset.row = "j" + ji; arrowHead(x + J.stepW / 2, sy - 3);

    const h = Math.max(hd.offsetHeight, sy - y0, nh);

    y = y0 + h + J.bandGap;

    const bg = document.createElement("div"); bg.className = "lanebg";

    bg.style.setProperty("--lane", laneColor(i));
    world.prepend(bg);
  });

/* A customer's actions run left to right, in the supplied order. */
function renderCustomerJourney(m) {
  const cardW = 252, gap = 62;
  const mode = modeOf(m);
  const all = (m.journeys || []).map(j => arrange(j.steps || [], mode));
  const count = Math.max(1, ...all.map(s => s.length));
  const timelineW = count * (cardW + gap) - gap;
  const notesX = timelineW + 56;
  const W = timelineW + notesWidth();
  const LI = Object.fromEntries((m.lanes || []).map((l, i) => [l.id, i]));
  let y = header(m, W);
  (m.journeys || []).forEach((j, ji) => {
    const start = y;
    const slots = all[ji];
    const hd = place("box timeline-title inj", 0, y, Math.min(640, timelineW),
      journeyHead(m, j, ji, slots, mode), {type:"box", id:j.id}, j.title);
    nodes[j.id] = hd; hd.dataset.row = "j" + ji;
    y += hd.offsetHeight + 52;
    let maxH = 0, prev = null;
    slots.forEach((slot, i) => {
      const step = slot.box;
      const x = i * (cardW + gap);
      const li = LI[step.lane];
      const lane = (m.lanes || [])[li];
      const lb = place("steplabel", x, y - 28, cardW, `<i style="background:${laneColor(li || 0)}"></i>${i + 1}. ${esc(lane ? lane.label : "Next step")}`);
      lb.dataset.row = "j" + ji;
      const card = place(`box customer-step inj${slot.change ? " chg-" + slot.change : ""}`, x, y, cardW,
        slotHtml(slot, b => `${kindLabel(b)}<h4>${gl(b.text)}</h4>${tech(b)}<div class="meta">${bpill(b)}${badges(b)}</div>`),
        {type:"box", id:step.id}, slotLabel(slot, `Step ${i + 1}: ${step.text}`));
      card.style.setProperty("--lane", laneColor(li || 0));
      card.dataset.row = "j" + ji; nodes[step.id] = card;
      maxH = Math.max(maxH, card.offsetHeight);
      if (prev !== null) {
        const line = link(prev + cardW + 6, y + 32, x - 10, y + 32, "inj customer-flow");
        line.dataset.row = "j" + ji;
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
        arrow.setAttribute("d", `M${x - 18},${y + 26} L${x - 10},${y + 32} L${x - 18},${y + 38}`);
        arrow.setAttribute("class", "customer-flow"); svg.appendChild(arrow);
      }
      prev = x;
    });
    const nh = notePile([j.id, ...(j.steps || []).map(step => step.id)], notesX, start, 4, "j" + ji);
    const h = Math.max(y - start + maxH, nh);
    rows.push({key:"j" + ji, y:start, h, x:0, w:W});
    y = start + h + 70;
  });
  return {x:0, y:0, w:W, h:y};
}

/* Side by side, journey maps: the chosen journey as one column of steps, each with its
   lane as a chip, so both panes stay readable. By default only the steps that differ show,
   with one step either side; runs of unchanged steps fold into a line that opens them. */
function renderJourneySbs(m) {
  const lanes = m.lanes || [];
  const LI = Object.fromEntries(lanes.map((l, i) => [l.id, i]));
  const js = m.journeys || [];
  if (S.sbsJourney == null || !js[S.sbsJourney]) S.sbsJourney = Math.max(0, js.findIndex(j => journeyChanges(j).length));
  const ji = S.sbsJourney, j = js[ji] || {steps:[]};
  const all = arrange(j.steps || [], "changes");
  const differs = all.map(s => s.change !== "same");
  const any = differs.some(Boolean);
  const keep = all.map((s, i) => S.sbsAll || !any || differs[i] || differs[i - 1] || differs[i + 1]);
  const W = 540;
  const t = place("maptitle sbs-title", 0, 0, W, `<span class="n">${ji + 1}</span><span class="tt">${esc(j.title || "")}</span>`);
  let y = t.offsetHeight + 8;
  if (j.summary) { const q = place("mapintro", 0, y, W, gl(j.summary)); y += q.offsetHeight + 12; }
  const changed = all.filter(s => s.change !== "same");
  const mb = place("modebar", 0, y, 0, any ? `${countsHtml(changed)}<span class="hint-sbs">${S.sbsAll ? "The whole journey" : "Only what changes, with one step either side"}</span>` : "No changes in this journey. All of its steps are shown.");
  y += mb.offsetHeight + 26;
  let prev = null, hidden = 0;
  const fold = () => {
    if (!hidden) return;
    const g = place("gaprow", 0, y, W, `${plural(hidden, "step")} the same here · Show the whole journey`, {type:"expand"}, `Show ${plural(hidden, "unchanged step")}`);
    g.dataset.row = "j" + ji;
    y += g.offsetHeight + 14; hidden = 0; prev = null;
  };
  all.forEach((slot, i) => {
    if (!keep[i]) { hidden++; return; }
    fold();
    const s = slot.box, li = LI[s.lane] || 0, lane = lanes[li];
    const el = place(`box step sbs-step inj${slot.change ? " chg-" + slot.change : ""}`, 0, y, W,
      slotHtml(slot, b => `${kindLabel(b)}<div class="row1"><span class="n">${i + 1}</span><div class="t">${gl(b.text)}</div></div>${tech(b)}
        <div class="meta"><span class="lanechip"><i style="background:${laneColor(LI[b.lane] || 0)}"></i>${esc((lanes[LI[b.lane] || 0] || {}).label || "")}</span>${bpill(b)}${badges(b)}</div>`),
      {type:"box", id:s.id}, slotLabel(slot, `Step ${i + 1}: ${s.text}`));
    el.style.setProperty("--lane", laneColor(li));
    el.dataset.row = "j" + ji;
    nodes[s.id] = el;
    if (prev) { const p = link(W / 2, prev.y + prev.h, W / 2, y - 3, "inj flow"); p.dataset.row = "j" + ji; arrowHead(W / 2, y - 3); }
    prev = {y, h:el.offsetHeight};
    y += el.offsetHeight + 16;
  });
  fold();
  rows.push({key:"j" + ji, y:0, h:y, x:0, w:W});
  return {x:0, y:0, w:W, h:y};
}

/* ---------- chain ---------- */
const C = {stageW:300, stageH:104, itemW:262, itemGap:16, perRow:3, gap:70};
const itemInner = b => `${kindLabel(b)}<h4>${gl(b.title)}</h4><p class="t">${gl(b.text || "")}</p>${tech(b)}<div class="meta">${bpill(b)}${badges(b)}</div>`;
function renderChain(m) {
  const mode = modeOf(m);
  const perRow = sbsOn() ? 2 : C.perRow;   // two to a row side by side, so each pane stays readable
  const hasBefore = (m.stages || []).some(st => st.before);
  const bands = m.bands || [];
  const beforeW = 250, stageX = hasBefore ? beforeW + 40 : 0;
  const itemsX = stageX + C.stageW + 64;

  const W = notesX - 56 + notesWidth();
  let y = header(m, W);
  if (hasBefore) place("label", 0, y, beforeW, esc(m.before_label || "Before"));
  place("label", stageX, y, 0, "The chain");

  place("label", itemsX, y, columnW, {today:"What exists today", planned:"What the plan puts in place", changes:"The plan, with every change marked", all:"What is here"}[mode]);
  if (S.notesOnMap) place("label", notesX, y, 0, "Notes from each role");
  y += 34;
  let prevStage = null;
  (m.stages || []).forEach((st, si) => {
    const y0 = y;
    const stEl = place(`box stage inj${si === 0 ? " first-stage" : ""}`, stageX, y0, C.stageW,
      `<span class="stagenum">${si + 1}</span><h3>${gl(st.label)}</h3><p>${gl(st.sub || "")}</p>${tech(st)}<div class="meta">${bpill(st)}${badges(st)}</div>`,
      {type:"box", id:st.id}, `Stage ${si + 1}: ${st.label}`);
    const bc = st.before ? place("beforecell inj", 0, y0, beforeW, `<p>${gl(st.before)}</p>`) : null;
    if (bc) { bc.dataset.row = "s" + si; bc.style.minHeight = C.stageH + "px"; }
    stEl.style.minHeight = C.stageH + "px";
    stEl.dataset.row = "s" + si; nodes[st.id] = stEl;
    const slots = arrange(st.items || [], mode);
    let rowMax = 0, iy = y0, col = 0;
    slots.forEach(slot => {
      const it = slot.box;
      const el = place(`box item inj${slot.change ? " chg-" + slot.change : ""}`,
        itemsX + col * (C.itemW + C.itemGap), iy, C.itemW, slotHtml(slot, itemInner),
        {type:"box", id:it.id}, slotLabel(slot, it.title));
      el.dataset.row = "s" + si;
      nodes[it.id] = el;
      rowMax = Math.max(rowMax, el.offsetHeight);
      if (++col === perRow) { col = 0; iy += rowMax + C.itemGap; rowMax = 0; }
    });
    let ih = iy - y0 + rowMax;
    if (!slots.length) {

      e.dataset.row = "s" + si; ih = e.offsetHeight;
    }
    const nh = notePile([st.id, ...(st.items || []).map(i => i.id)], notesX, y0, 4, "s" + si);
    const h = Math.max(stEl.offsetHeight, ih, nh, bc ? bc.offsetHeight : 0);
    rows.push({key:"s" + si, y:y0, h, x:0, w:W, stage:st.id, mid:y0 + stEl.offsetHeight / 2});
    if (prevStage) {
      const sx = stageX + C.stageW / 2;
      const p = link(sx, prevStage.y + prevStage.h + 4, sx, y0 - 6, "inj spine", prevStage.verb);
      p.dataset.row = "s" + si; arrowHead(sx, y0 - 6);
    }
    prevStage = {y:y0, h:stEl.offsetHeight, verb:st.verb || ""};
    y = y0 + h + C.gap;
  });
  /* Bands run beside the chain, as tall as the stages they touch, with a chip level with
     each of those stages and a dashed line back to its row. */
  bands.forEach((band, bi) => {
    const linked = rows.filter(r => r.stage && (!(band.stages || []).length || band.stages.includes(r.stage)));
    if (!linked.length) return;
    const top = linked[0].y, bottom = linked[linked.length - 1].y + linked[linked.length - 1].h;
    const x = bandX + bi * (bandW + 20);
    const el = place("box band inj", x, top, bandW,
      `${kindLabel(band)}<h4>${gl(band.title || band.id)}</h4>${band.text ? `<p class="t">${gl(band.text)}</p>` : ""}${tech(band)}
       <div class="meta">${bpill(band)}${badges(band)}</div>`,
      {type:"box", id:band.id}, `Across the chain: ${band.title || band.id}`);
    const wordsH = el.offsetHeight;
    el.style.height = Math.max(bottom - top, wordsH) + "px";
    const chips = linked.filter(r => r.mid - top - 12 > wordsH + 6).map(r => {
      const si = (m.stages || []).findIndex(st => st.id === r.stage);
      return `<span class="bandchip" style="top:${r.mid - top - 12}px">${si + 1} · ${esc((m.stages[si] || {}).label || "")}</span>`;
    }).join("");
    if (chips) el.insertAdjacentHTML("beforeend", `<div class="bandchips" aria-hidden="true">${chips}</div>`);
    nodes[band.id] = el;
    linked.forEach(r => {

      l.dataset.row = r.key;

  });
  const outs = MODEL.outcomes || [];
  if (outs.length && m === MODEL.maps.find(mm => KIND[mm.template] === "chain")) {
    place("label", stageX, y, 0, "Did it work?");
    y += 26;
    const ow = C.itemW + 60;
    let oy = y, outcomeH = 0;
    outs.forEach((o, i) => {
      const el = place("box inj", stageX + (i % 3) * (ow + C.itemGap), oy, ow,
        `<h4>${esc(o.measure)}</h4><p class="t">${o.baseline ? "Before: " + esc(o.baseline) + ". " : ""}${o.target ? "Target: " + esc(o.target) + ". " : ""}${o.result ? "<b>Result: " + esc(o.result) + "</b>" : "Not measured yet."}</p>
         <div class="meta">${o.becomes_evidence ? `<span class="chip">Feeds back as evidence</span>` : ""}</div>`,
        {type:"outcome", o}, `Outcome: ${o.measure}`);
      nodes[o.id] = el;
      outcomeH = Math.max(outcomeH, el.offsetHeight);
