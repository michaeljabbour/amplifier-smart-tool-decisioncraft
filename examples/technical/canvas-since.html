<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:">
<meta name="generator" content="decisioncraft">
<title>Moving file uploads</title>
<style>
:root{
  --bg:#f5f4f0; --dot:#d6d3cb; --ink:#1d1d1b; --ink2:#46453f; --muted:#6a6862; --line:#d9d6ce;
  --panel:#ffffff; --soft:#efede7; --accent:#2f5bd3; --accent-ink:#ffffff;
  --works:#1f7a4a; --partial:#9a5b00; --missing:#b3261e; --planned:#0d6e74;
  --must:#b3261e; --should:#9a5b00; --info:#4a5a72;
  --z:1; --inv:1;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* canvas */
#viewport{position:fixed;inset:0;cursor:grab;touch-action:none}
body.dots #viewport{background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:22px 22px}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:1}
svg.links path{fill:none;stroke:#9a978f;stroke-width:2}
svg.links path.hot{stroke:var(--accent);stroke-width:3}
svg.links text{font-size:15px;font-weight:600;fill:#5d5b55;paint-order:stroke;stroke:var(--bg);stroke-width:4px}

.box{position:absolute;border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;
  box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;transition:opacity .15s,box-shadow .15s;overflow:hidden;z-index:2}
.box:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.box.sel{outline:3px solid var(--accent);outline-offset:2px}
.box h3,.box h4{margin:0 0 4px;font-size:15px;line-height:1.25}
.box p{margin:0;color:var(--ink2)}
.box .t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.box .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
body.dim .box.inj:not(.hot){opacity:.28}
body.dim .notecard.inj:not(.hot){opacity:.28}

.lanehead{position:absolute;font-weight:700;font-size:15px;color:var(--ink)}
.lanehead small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.lanebg{position:absolute;z-index:0;background:rgba(255,255,255,.45);border-radius:14px;border:1px dashed #e0ddd5}
.label{position:absolute;white-space:nowrap;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.maptitle{position:absolute;font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.mapintro{position:absolute;color:var(--ink2);font-size:15px;max-width:760px}
.stamp{position:absolute;white-space:nowrap;font-size:12px;font-weight:700;color:#fff;background:#3b4a63;border-radius:6px;padding:3px 8px}

.jhead{background:#fbfaf6}
.jhead .n,.step .n{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;
  background:var(--ink);color:#fff;font-size:12px;font-weight:700;margin-right:6px;padding:0 6px}
.step{display:flex;flex-direction:column}
.step .row1{display:flex;align-items:flex-start;gap:6px}
.stage{background:#f6d77b;border-color:#e2bf55;display:flex;flex-direction:column;justify-content:center}
.stage h3{font-size:19px}
.stage p{color:#3d3200}
.item.planned-new{border:2px dashed var(--planned)}
.tree-node{background:#fff}
.tree-node.l0{background:#1d1d1b;color:#fff;border-color:#1d1d1b}
.tree-node.l0 p{color:#ddd}

.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;color:#fff;white-space:nowrap}
.pill.works{background:var(--works)} .pill.partial{background:var(--partial)}
.pill.missing{background:var(--missing)} .pill.planned{background:var(--planned)}
.chip{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip.new{background:#dff3e6;color:#145c36;font-weight:700}
.chip.changed{background:#fff0c9;color:#6b4800;font-weight:700}
.chip.stale{background:#f4e1df;color:#7d1d16}
.chip.moment{background:#ece4fb;color:#4b2a8a;font-weight:700}
.chip.pain{background:#fde6e3;color:#8a1f16}
.feel{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:middle}
.feel.good{background:#2f9e6a}.feel.ok{background:#d9a21e}.feel.bad{background:#d1543f}

/* notes: a column beside each row, sized so they never cover any box */
.notecard{position:absolute;z-index:2;border-radius:8px;padding:8px 10px 9px 12px;cursor:pointer;
  border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden;transition:opacity .15s}
.notecard:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}
.notecard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--info)}
.notecard.must::before{background:var(--must)} .notecard.should::before{background:var(--should)}
.notecard .who{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.notecard .urg{font-size:11px;font-weight:700;margin-left:6px}
.notecard.must .urg{color:var(--must)} .notecard.should .urg{color:var(--should)} .notecard.info .urg{color:var(--info)}
.notecard h5{margin:3px 0 3px;font-size:13.5px;line-height:1.25}
.notecard .q{font-size:12.5px;color:var(--ink2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.morenotes{position:absolute;z-index:2;border:1px dashed #b9b5aa;background:rgba(255,255,255,.7);border-radius:8px;
  padding:6px 10px;font-size:12.5px;color:var(--ink2);cursor:pointer}

/* far zoom: keep the main words readable, drop the small print */
body.z-far .box .meta > :not(.notebadge),body.z-far .box p.sub,body.z-far .notecard .q,body.z-far .notecard .who{display:none}
body.z-far .box .t,body.z-far .box h3,body.z-far .box h4,body.z-far .notecard h5{font-size:calc(14px * var(--inv));line-height:1.15}
body.z-far .box .t{-webkit-line-clamp:2}

.term{border-bottom:1px dotted currentColor;cursor:help}
#gloss{position:fixed;z-index:60;max-width:300px;background:#1d1d1b;color:#fff;border-radius:8px;padding:8px 10px;
  font-size:13px;display:none;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#gloss b{display:block;margin-bottom:2px}

/* side panel */
#panel{position:fixed;top:64px;right:10px;bottom:10px;width:min(460px,calc(100vw - 20px));z-index:35;background:#fff;
  border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.14);display:none;flex-direction:column}
#panel.open{display:flex}
#panel header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#panel header h2{margin:0;font-size:17px;flex:1}
#panel header button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:32px;min-height:32px}
#panel .body{overflow:auto;padding:12px 14px 20px}
#panel h3{font-size:14px;margin:16px 0 6px}
#panel h3:first-child{margin-top:0}
#panel p{margin:4px 0}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
.card.must{border-left:5px solid var(--must)} .card.should{border-left:5px solid var(--should)} .card.info{border-left:5px solid var(--info)}
.quote{border-left:3px solid #c9c4b6;padding:2px 0 2px 10px;margin:6px 0;color:var(--ink2);font-style:italic}
.quote .src{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.quote.voice{border-left-color:#d99a1e}
.answer{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.answer button,.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;min-height:28px}
.answer button[aria-pressed="true"]{background:#e6ecfb;border-color:#9fb4ee;font-weight:600}
.dots{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.dots .n{min-width:1.5em;text-align:center;font-weight:700}
textarea,input[type=text],input[type=date],select.field{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;margin-top:4px;background:#fff}
textarea{min-height:52px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
.tally{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);margin:6px 0 2px}
.tally i{display:block;height:100%}
.tally .a{background:#2f9e6a}.tally .c{background:#d1543f}.tally .u{background:#c9c4b6}
.small{font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--soft)}
.badge.split{background:#fde6e3;color:#8a1f16}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:8px;height:8px;border-radius:50%;background:#dcd8cf}
.meter i.on{background:var(--ink2)}
.rolerow{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft)}
.rolerow input{margin-top:4px;width:18px;height:18px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend span{margin-right:10px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d1d1b;color:#fff;border-radius:8px;
  padding:8px 14px;z-index:70;display:none}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:60px;z-index:80;background:#fff;padding:6px 10px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media print{
  #bar,#panel,#more,#toast,#gloss{display:none !important}
  html,body{overflow:visible;height:auto;background:#fff}
  #viewport{position:static;background:none !important}
  #world{position:relative}
  .box,.notecard{box-shadow:none;break-inside:avoid}
}

.jindex{cursor:default;background:#fbfaf6}
.jindex .meta{gap:6px}
body.z-far .jindex .mini{font-size:calc(13px * var(--inv))}

/* ---------- chrome: one quiet top bar ---------- */
#top{position:fixed;left:0;right:0;top:0;height:52px;z-index:30;display:flex;align-items:center;gap:8px;
  padding:0 12px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);white-space:nowrap}
#top .title{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
#top button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;min-height:34px}
#top button:hover{background:var(--soft)}
#top .primary{background:#fff6dc;border-color:#e9cf86;font-weight:600}
#top .count{display:inline-block;min-width:1.6em;padding:0 6px;margin-left:5px;border-radius:9px;background:rgba(0,0,0,.07);font-size:12px}
#menu{position:fixed;z-index:45;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;
  box-shadow:0 8px 28px rgba(0,0,0,.14);display:none;min-width:270px;max-height:calc(100vh - 70px);overflow-y:auto}
#menu.open{display:block}
#menu button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px}
#menu button:hover{background:var(--soft)}
#menu .state{color:var(--muted);font-size:12.5px}
#menu hr{border:0;border-top:1px solid var(--soft);margin:4px 0}

/* ---------- left story list ---------- */
#story{position:fixed;left:0;top:52px;bottom:0;width:320px;z-index:25;background:#fbfaf7;border-right:1px solid var(--line);
  overflow:auto;padding:14px 14px 30px}
body.nostory #story{display:none}
#storytab{position:fixed;left:10px;top:62px;z-index:26;display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px}
body.nostory #storytab{display:block}
#story .q{font-size:15px;font-weight:600;line-height:1.35;margin:2px 0 10px}
#story .walkbtn{width:100%;background:#2f5bd3;color:#fff;border:0;border-radius:9px;padding:10px;font-weight:600;font-size:15px}
#story .walkbtn:hover{background:#2a50bb}
#story .hide{border:0;background:none;color:var(--muted);font-size:12.5px;padding:4px 0;float:right}
#story h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
#story ol{list-style:none;margin:0;padding:0}
#story li{margin:0}
#story .view{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 9px;margin:2px 0}
#story .view:hover{background:#fff;border-color:var(--line)}
#story .view[aria-current="true"]{background:#fff;border-color:#9fb4ee}
#story .view b{display:block;font-size:14.5px}
#story .view span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
#story .sub{padding-left:14px;border-left:2px solid var(--line);margin:2px 0 8px 12px}
#story .sub .view b{font-size:13.5px;font-weight:600}
#story .num{display:inline-block;min-width:1.7em;color:var(--muted);font-weight:700}
#story .seg{display:flex;margin:4px 0 6px 12px}
#story .seg button{flex:1;border:1px solid var(--line);background:#fff;padding:6px;font-size:13px}
#story .seg button:first-child{border-radius:8px 0 0 8px}
#story .seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
#story .seg button[aria-pressed="true"]{background:#e6ecfb;border-color:#9fb4ee;font-weight:600}
#story .more button{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:7px 9px}
#story .more button:hover{background:#fff;border-color:var(--line)}

/* ---------- zoom, walk-through, hint ---------- */
#zoom{position:fixed;right:14px;bottom:14px;z-index:28;display:flex;flex-direction:column;gap:6px}
body.panel-open #zoom{right:494px}
#zoom button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;min-width:128px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#zoom button:hover{background:var(--soft)}
#walk{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:32;width:min(560px,calc(100vw - 40px));
  background:#1d1d1b;color:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
body:not(.nostory) #walk{left:calc(50% + 160px)}
body.panel-open #walk{left:calc(50% - 80px)}
#walk.open{display:block}
#walk .step{font-size:12px;color:#c9c6bd;letter-spacing:.04em;text-transform:uppercase}
#walk h3{margin:4px 0 4px;font-size:17px}
#walk p{margin:0 0 10px;color:#e8e6df}
#walk .row{display:flex;gap:8px;align-items:center}
#walk button{white-space:nowrap;border:1px solid #55534d;background:#2c2b28;color:#fff;border-radius:8px;padding:7px 14px}
#walk button.next{background:#fff;color:#1d1d1b;border-color:#fff;font-weight:600}
#walk .grow{flex:1}
#hint{position:fixed;left:340px;top:66px;z-index:31;max-width:420px;background:#fff8e1;border:1px solid #ecd48e;border-radius:10px;
  padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.1);display:none}
body.nostory #hint{left:110px}
#hint.open{display:block}
#hint button{margin-top:6px;border:1px solid #d9bf73;background:#fff;border-radius:7px;padding:4px 10px}

/* the panel sits under the top bar */
#panel{top:62px}
body.panel-open #panel{display:flex}
.techname{display:block;margin-top:4px;font:12px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#3b4a63;
  background:#eef1f7;border-radius:5px;padding:2px 6px;white-space:normal}
body.z-far .techname{font-size:calc(12px * var(--inv))}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.switch input{width:18px;height:18px}
.notebadge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:#1d1d1b;color:#fff}
.notebadge.must{background:var(--must)}
body.z-far .box .meta .notebadge{font-size:calc(11.5px * var(--inv))}
#story .reading{margin:0 0 10px;font-size:13.5px;line-height:1.45}
#story .reading summary{cursor:pointer;color:#2f5bd3;font-weight:600}
#story .reading p{margin:6px 0 0}

/* Review actions stay visible and say where the file goes. */
.save-primary,#top .save-primary{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;padding:7px 11px;font-weight:600}
#top .save-primary:hover{background:#2448a8}
.review-next{border:1px solid var(--line);background:#f3f6fd;border-radius:9px;padding:12px;margin-bottom:16px}
.answer-label{display:block;font-weight:600;margin-top:10px}
.review-answer{white-space:pre-wrap;border-left:3px solid var(--accent);padding-left:8px}

.review-nav{display:flex;gap:8px;justify-content:space-between;margin:20px 0 12px}
.review-nav button{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.support{margin:14px 0}
.support summary{cursor:pointer;color:var(--accent);font-weight:600}
.decision-question{font-size:19px;font-weight:600;line-height:1.35}

.short-label{display:none}
@media(max-width:720px){
  #top{gap:5px;padding:6px}
  #top .title,#top .wide-label,#top .count,#tkeys{display:none}
  #top .short-label{display:inline}
  #top button{padding:6px 8px;font-size:13px}
  #hint{left:10px;right:10px;max-width:none}
}

#paper-review{display:none}
@media print{
  body.print-review{height:auto;overflow:visible;background:#fff}
  body.print-review > *{display:none!important}
  body.print-review #paper-review{display:block!important;padding:16px}
  #paper-review article{break-inside:avoid;margin:24px 0}
  #paper-review h2{font-size:17px}
  .paper-space{height:90px;border-bottom:1px solid #ccc}
}

.recommendation{background:#f3f6fd;border-left:3px solid var(--accent);padding:10px 12px;margin:12px 0}
.recommendation p{margin:4px 0 0}

#story .workflow button{padding:12px 9px;font-weight:600}
#story .more button[aria-current="true"]{background:#eaf0ff;border-color:#9fb4ee;color:#244ca6}

/* Display controls have names on hover or focus, and a visible switch state. */
#top .display-controls{display:flex;gap:5px;align-items:center}
#top .icon-control{position:relative;width:36px;height:36px;padding:5px 6px 9px}
.icon-control svg{display:block;width:22px;height:22px}
#top .icon-control[aria-pressed="true"]{background:#eaf0ff;color:#244ca6;border-color:#9fb4ee}
.toggle-state{position:absolute;bottom:3px;left:13px;width:11px;height:4px;border-radius:4px;background:#aaa}
[aria-pressed="true"] .toggle-state{background:#244ca6}
.control-tip{display:none;position:absolute;top:calc(100% + 9px);right:0;background:#1d1d1b;color:#fff;
  font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;z-index:60}
.icon-control:hover .control-tip,.icon-control:focus-visible .control-tip{display:block}
.word-meanings dt{font-weight:700;margin-top:16px}
.word-meanings dd{margin:4px 0 0}
@media(max-width:720px){#top .display-controls{gap:3px}#top .icon-control{width:32px;padding:5px 4px 9px}}

/* Keep space for the drawing when details are open. */
body.panel-open #panel{width:clamp(320px,30vw,460px)}
body.panel-open #story{width:240px}
body.panel-open #zoom{right:calc(clamp(320px,30vw,460px) + 24px)}
.customer-step{border-top:4px solid #5b78b9}
.timeline-title{background:#eef3ff;border-color:#b9c9ea}
.links .customer-flow{stroke:#5b78b9;stroke-width:2}
#story .seg button{padding:6px 4px}
@media(max-width:1100px){body.panel-open #story{display:none}body.panel-open #storytab{display:block}}
@media(max-width:720px){body.panel-open #panel{width:calc(100vw - 20px)}body.panel-open #zoom{display:none}}

/* A stage spine anchors the work; proposals and feedback have distinct styles. */
.box.stage{background:#f9d46b;border-color:#e5bd51;color:#3a2a00}
.box.stage h3{font-size:23px;font-weight:600}
.box.stage.first-stage{background:#7652d9;color:#fff;border-color:#7652d9}
.box.stage.first-stage p{color:#fff}
.box.planned-new{background:#effaf8;border-color:#81c9c1}
.links .connection path{stroke:#7652d9;stroke-width:1.8;fill:none;opacity:.55}
.links .connection.evidence path{stroke:#4675ba}
.links .connection.feedback path{stroke:#c54d46;stroke-dasharray:6 4}
.links .connection.active path{opacity:1;stroke-width:2.5}
body.connection-focus .box:not(.connected){opacity:.4}

/* Paper notes stay beside the work, with space for each person's perspective. */
.notecard{border-radius:3px 3px 12px 3px;border:1px solid rgba(70,55,20,.12);padding:14px 14px 12px;
  box-shadow:0 2px 2px rgba(0,0,0,.05),2px 7px 13px rgba(0,0,0,.13);transform:rotate(var(--note-tilt,0deg))}
.notecard::before{top:-5px;bottom:auto;left:calc(50% - 22px);width:44px;height:12px;
  background:rgba(255,255,255,.55)!important;transform:rotate(-3deg);border:1px solid rgba(255,255,255,.6)}
.notecard::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;
  background:linear-gradient(135deg,transparent 48%,rgba(0,0,0,.09) 50%,rgba(255,255,255,.7));border-radius:0 0 10px 0}
.notecard:hover,.notecard:focus-visible{transform:none;box-shadow:2px 10px 18px rgba(0,0,0,.18)}
.notecard .who{text-transform:none;letter-spacing:0;font-size:12px}
.notecard h5{font-size:15px;line-height:1.3;margin:7px 0}
.notecard .q{line-height:1.45}
#role-strip{position:fixed;top:64px;z-index:29;display:flex;align-items:center;gap:7px;width:max-content;
  max-width:calc(100vw - 24px);overflow-x:auto;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
#role-strip[hidden]{display:none}
#role-strip button{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);border-radius:7px;background:#faf9f5;padding:4px 8px}
#role-strip button[aria-pressed="true"]{background:#eef0ff;border-color:#b8b4dc}
#role-strip button[aria-pressed="false"]{color:var(--muted);opacity:.7}
.paper-swatch{width:14px;height:14px;border:1px solid;box-shadow:1px 2px 2px rgba(0,0,0,.12);transform:rotate(-5deg)}
.role-caption{font-size:12px;color:var(--muted);white-space:nowrap}
@media print{#role-strip{display:none!important}}

<script type="application/json" id="dc-model">{"format":"decisioncraft/1","title":"Moving file uploads","question":"Should we move customer file uploads to a new storage provider, change how uploads reach storage, or both?","summary":"A mid-size web team stores customers' files with one storage provider. Large uploads time out, and the transfer bill keeps growing. This map shows how an upload works today, what each option changes, and what the team still has to decide. All figures are made up.","freshness_days":30,"reading":"The first view, How an upload works, has six journeys: an upload today, the proposed direct upload, downloading and sharing, deleting, moving existing files, and what happens when something goes wrong. Each column is a part of the system, from the customer's browser on the left to the storage provider on the right, so you can see where each step happens. The second view, Options, starts from the outcome we want and branches into problems, ideas and quick tests. Turn on Show technical names in any box to see the services and settings involved. Notes from security, finance, support and others sit on the steps they are about.","checked":{"date":"2026-05-20","note":"Checked against the incident review, April upload numbers, 31 support tickets, a provider comparison and call notes, the scanning and retention setup, and a team discussion."},"glossary":{"signed link":"A web address that lets one browser upload or download one file for a few minutes, without a password.","proxy":"When our servers pass every byte between the customer and storage, instead of the customer talking to storage directly.","resumable upload":"An upload sent in pieces, so a dropped connection only loses the last piece.","data out":"Files sent from storage to anyone outside it. Providers charge for this.","CDN":"A network of servers close to customers that keeps copies of popular files, so they download faster and cost less.","checksum":"A short fingerprint of a file. If two copies have the same checksum, they are the same.","holding area":"A place where new files wait, unseen by anyone else, until the virus scan passes.","recycle area":"Where a provider keeps deleted files for a few days in case they were deleted by mistake."},"sources":[{"id":"S1","title":"Incident review: slow uploads","kind":"document","date":"2026-05-04","ref":"material/incident-notes.md"},{"id":"S2","title":"Storage providers compared","kind":"data","date":"2026-05-12","ref":"material/provider-comparison.md"},{"id":"S3","title":"Team discussion","kind":"meeting","date":"2026-05-15","ref":"material/team-discussion.md"},{"id":"S4","title":"Support tickets, sample of 31","kind":"document","date":"2026-05-09","ref":"material/support-tickets.md"},{"id":"S5","title":"Upload numbers, April","kind":"data","date":"2026-05-06","ref":"material/upload-metrics.md"},{"id":"S6","title":"Provider B call notes and draft terms","kind":"document","date":"2026-05-14","ref":"material/provider-b-terms.md"},{"id":"S7","title":"Scanning and retention setup","kind":"document","date":"2026-05-10","ref":"material/scanning-and-retention.md"}],"evidence":[{"id":"E1","source":"S1","kind":"data","text":"Uploads over 200 MB timed out for about 40 minutes.","where":"Summary"},{"id":"E2","source":"S1","kind":"quote","text":"Half our servers were just shovelling bytes. Nothing else could get through.","where":"On-call engineer"},{"id":"E3","source":"S1","kind":"data","text":"Our storage bill grew 22% last quarter, mostly from data transfer out, not storage.","where":"Costs"},{"id":"E4","source":"S1","kind":"data","text":"Support received 31 tickets. Most from customers uploading video.","where":"Support"},{"id":"E5","source":"S2","kind":"data","text":"Data out: $90 per TB today; $0 to our CDN with provider B.","where":"Comparison table"},{"id":"E6","source":"S2","kind":"data","text":"Moving 180 TB at current transfer prices would cost about $16,000 once. Provider B offers free one-time transfer over 100 TB, on request.","where":"Notes under the table"},{"id":"E7","source":"S3","kind":"quote","text":"The real problem is the proxy, not the provider. Direct uploads fix the timeouts wherever the files live.","where":"Backend lead"},{"id":"E8","source":"S3","kind":"observation","voice":true,"text":"Customers ask for a progress bar and the ability to resume after a dropped connection.","where":"Product manager, from support tickets"},{"id":"E9","source":"S3","kind":"observation","text":"Signed links must expire in minutes and only allow one file path.","where":"Security engineer"},{"id":"E10","source":"S3","kind":"observation","text":"Nobody has tested how virus scanning works if files no longer pass through our servers.","where":"Open point"},{"id":"E11","source":"S4","kind":"data","text":"19 of 31 tickets were video uploads over 200 MB; 8 said it got to 90% and then failed.","where":"Ticket tags"},{"id":"E12","source":"S4","kind":"quote","text":"I lost two hours re-uploading the same file three times.","where":"Wedding videographer","voice":true},{"id":"E13","source":"S4","kind":"quote","text":"Just show me how far along it is. I can't tell if it's stuck.","where":"Agency producer","voice":true},{"id":"E14","source":"S4","kind":"quote","text":"Our firewall blocks some sites. Will the new way still work here?","where":"School office","voice":true},{"id":"E15","source":"S5","kind":"data","text":"3.1% of uploads were over 200 MB, but they were 71% of all bytes uploaded.","where":"April totals"},{"id":"E16","source":"S5","kind":"data","text":"Failure rate for uploads over 200 MB: 6.2% in busy hours, 1.4% at night.","where":"Failures"},{"id":"E17","source":"S5","kind":"data","text":"Upload servers spend about 55% of their time passing bytes to storage.","where":"Server time"},{"id":"E18","source":"S5","kind":"data","text":"18% of files are downloaded more than 10 times and make up 80% of data out.","where":"Downloads"},{"id":"E19","source":"S6","kind":"data","text":"Free one-time transfer needs a written request and approval, usually 2 to 3 weeks.","where":"Transfer"},{"id":"E20","source":"S6","kind":"data","text":"Provider B keeps deleted files 7 days in a recycle area unless turned off.","where":"Deletes"},{"id":"E21","source":"S6","kind":"data","text":"Upload completion messages go to a web address we choose; they retry for 24 hours.","where":"Notifications"},{"id":"E22","source":"S6","kind":"data","text":"Their EU region is in a different country from our current one. Legal must check our customer contracts.","where":"Region"},{"id":"E23","source":"S7","kind":"data","text":"Files are shown to the customer before the scan finishes; downloads are blocked only if the scan fails.","where":"Scanning"},{"id":"E24","source":"S7","kind":"data","text":"Scanning takes about 9 seconds under 100 MB and up to 4 minutes for 5 GB.","where":"Scanning"},{"id":"E25","source":"S7","kind":"data","text":"Our terms promise deleted files are gone within 30 days, including backups.","where":"Retention"},{"id":"E26","source":"S6","kind":"data","text":"Bucket names at provider B are global; ours must be renamed.","where":"Setup"},{"id":"E28","source":"S6","kind":"observation","text":"Their onboarding team suggests writing new files to both providers for at least a month and comparing checksums on every file before switching reads.","where":"Onboarding advice"},{"id":"E27","source":"S3","kind":"observation","text":"Finance wants the transfer bill down before the September budget review.","where":"Finance"}],"maps":[{"id":"m-how","template":"system-journeys","title":"How an upload works","intro":"Six journeys from the customer's browser to the storage provider. Each column is the part of the system that does that step.","lanes":[{"id":"people","label":"Customer","sub":"In their browser"},{"id":"front","label":"Web app","sub":"Pages and buttons"},{"id":"core","label":"Our servers","sub":"Checks and rules"},{"id":"records","label":"Database","sub":"What we record"},{"id":"background","label":"Background jobs","sub":"Work that runs later"},{"id":"outside","label":"Storage provider","sub":"Where files live"}],"journeys":[{"id":"j-today","title":"Upload today","summary":"Every byte passes through our servers on its way to storage.","creates":["A file record","The file in storage","A scan result"],"steps":[{"id":"t1","lane":"people","text":"Customer picks a file and presses Upload","status":"works","detail":"Upload button on the files page; no size limit shown.","feeling":"ok"},{"id":"t2","lane":"front","text":"Browser sends the whole file to our servers","status":"works","detail":"One HTTP request per file, no pieces.","pain":"No progress bar; people cannot tell if it is stuck.","evidence":["E8","E13"]},{"id":"t3","lane":"core","text":"Our servers pass the bytes on to storage","status":"partial","detail":"Streaming proxy in the upload service; 60-second idle timeout at the load balancer.","moment":true,"evidence":["E1","E2","E17"]},{"id":"t3b","lane":"core","text":"Long uploads hold a server connection open","status":"partial","detail":"Each upload ties up one worker for its whole length.","pain":"Other customers' requests queue behind them.","evidence":["E2","E17"]},{"id":"t3c","lane":"people","text":"On weak wifi the upload fails and starts again from zero","status":"missing","detail":"No resume; the browser retries the whole request.","feeling":"bad","moment":true,"evidence":["E12","E16"]},{"id":"t4","lane":"records","text":"File record is saved and the file shown to the customer","status":"works","detail":"Row in the files table with size, type and owner.","evidence":["E23"]},{"id":"t5","lane":"background","text":"A job scans the file for viruses","status":"works","detail":"Scanner reads the file from storage after the upload finishes.","evidence":["E24"]},{"id":"t6","lane":"records","text":"If the scan fails, downloads are blocked","status":"partial","detail":"Until then the file can already be shared and downloaded.","pain":"A bad file can be downloaded for up to 4 minutes.","evidence":["E23"]}]},{"id":"j-direct","title":"Upload with direct links (proposed)","summary":"The browser sends the file straight to storage in pieces, using a short-lived signed link.","creates":["A file record in 'uploading' state","The file in a holding area","A scan result","A ready file"],"steps":[{"id":"d1","lane":"people","text":"Customer picks a file and presses Upload","status":"works","detail":"Same button; size limit shown up front.","feeling":"good"},{"id":"d2","lane":"core","text":"Our servers check the customer may upload, and issue a signed link for one file","status":"planned","detail":"Signed link valid 10 minutes, one path, one content type.","moment":true,"evidence":["E9"]},{"id":"d2b","lane":"records","text":"A file record is created in 'uploading' state","status":"planned","detail":"Status column: uploading, scanning, ready, rejected."},{"id":"d3","lane":"outside","text":"Browser uploads straight to storage in pieces, with a progress bar","status":"planned","detail":"Multipart upload, 16 MB pieces, three in parallel.","feeling":"good","evidence":["E7","E8","E13"]},{"id":"d3b","lane":"people","text":"If the connection drops, the upload resumes from the last piece","status":"planned","detail":"Browser keeps the upload id and finished pieces in local storage.","moment":true,"evidence":["E12","E11"]},{"id":"d3c","lane":"people","text":"Some office firewalls may block the storage address","status":"missing","detail":"Fallback: the old proxy path for customers who cannot reach storage directly.","pain":"Schools and offices with strict firewalls.","evidence":["E14"]},{"id":"d3d","lane":"outside","text":"File lands in a holding area nobody else can read","status":"planned","detail":"Separate bucket prefix with no public or shared access.","evidence":["E9","E23"]},{"id":"d4","lane":"background","text":"Storage tells us the upload finished; a job scans it","status":"missing","detail":"Completion message to our web address, retried for 24 hours.","evidence":["E10","E21","E24"]},{"id":"d5","lane":"records","text":"File is marked ready only after a clean scan","status":"planned","detail":"Moved out of the holding area, status set to ready.","evidence":["E23"]},{"id":"d6","lane":"front","text":"Customer sees 'Ready' or a plain message if it was rejected","status":"planned","detail":"Rejected files are deleted after 7 days; owner gets an email."}]},{"id":"j-download","title":"Downloading and sharing","summary":"A customer or someone they share with downloads a file.","creates":["A short-lived download link","A download count"],"steps":[{"id":"dl1","lane":"people","text":"Customer clicks Download, or opens a share link","status":"works","detail":"Share links never expire unless the owner turns them off."},{"id":"dl2","lane":"core","text":"Our servers check they may see the file","status":"works","detail":"Owner, team member, or holder of a share link."},{"id":"dl3","lane":"core","text":"Our servers make a signed download link","status":"works","detail":"Valid 5 minutes, one file.","evidence":["E9"]},{"id":"dl4","lane":"outside","text":"Storage sends the file to the browser","status":"works","detail":"Every download is billed as data out at $90 per TB.","pain":"This is where the bill grows.","evidence":["E5","E3"]},{"id":"dl5","lane":"outside","text":"Popular files could come from the CDN instead","status":"missing","detail":"18% of files make 80% of data out; caching them at the CDN cuts the bill.","moment":true,"evidence":["E18","E5"]},{"id":"dl6","lane":"records","text":"We count the download","status":"works","detail":"Download counter on the file record."},{"id":"dl7","lane":"people","text":"A file still being scanned cannot be downloaded","status":"planned","detail":"Today it can; in the planned flow it waits.","evidence":["E23"]}]},{"id":"j-delete","title":"Deleting a file","summary":"A customer deletes a file, or closes their account.","creates":["A deleted mark","A purge job","A deletion log entry"],"steps":[{"id":"x1","lane":"people","text":"Customer deletes a file","status":"works","detail":"Moves to the customer's trash for 30 days."},{"id":"x2","lane":"records","text":"File is marked deleted and hidden","status":"works","detail":"Deleted-at column set; share links stop working."},{"id":"x3","lane":"background","text":"After 30 days a job removes it from storage","status":"works","detail":"Nightly purge job.","evidence":["E25"]},{"id":"x4","lane":"outside","text":"At provider B, deleted files sit in a recycle area for 7 more days","status":"missing","detail":"Must be turned off, or counted inside our 30 days.","moment":true,"evidence":["E20","E25"]},{"id":"x5","lane":"outside","text":"During a move, the file may exist at both providers","status":"missing","detail":"Deletes must reach both until the old copy is gone.","pain":"A deleted file could survive at the old provider.","evidence":["E25"]},{"id":"x6","lane":"background","text":"Account closure deletes everything after 14 days","status":"works","detail":"Same purge job, per account.","evidence":["E25"]},{"id":"x7","lane":"records","text":"We log that the file is gone","status":"partial","detail":"Logged for account closures only."}]},{"id":"j-move","title":"Moving existing files to provider B","summary":"Copying 180 TB without customers noticing, if we decide to move.","creates":["A copy of every file at provider B","A checksum report","A switch-over date"],"steps":[{"id":"mv1","lane":"core","text":"Ask provider B for free transfer in writing","status":"missing","detail":"2 to 3 weeks for approval.","moment":true,"evidence":["E19","E6"]},{"id":"mv2","lane":"core","text":"Legal checks the new region against customer contracts","status":"missing","detail":"Different EU country from today.","evidence":["E22"]},{"id":"mv3","lane":"outside","text":"Create buckets at provider B with new names","status":"planned","detail":"Names are global; ours must change.","evidence":["E26"]},{"id":"mv4","lane":"background","text":"Copy new uploads to both providers for a month","status":"planned","detail":"Dual writes from the upload service.","evidence":["E28"]},{"id":"mv5","lane":"background","text":"Copy older files in batches overnight","status":"planned","detail":"Largest and most-downloaded first, to cut data out soonest.","evidence":["E18"]},{"id":"mv6","lane":"background","text":"Compare checksums for every file","status":"planned","detail":"A report of any file that does not match.","evidence":["E28"]},{"id":"mv7","lane":"core","text":"Switch reads to provider B, then writes","status":"planned","detail":"One setting per customer group, so we can switch back."},{"id":"mv8","lane":"outside","text":"Keep the old copy for 30 days, then delete it","status":"planned","detail":"Deletes made in those 30 days go to both.","evidence":["E25"]}]},{"id":"j-fail","title":"When something goes wrong","summary":"A storage outage, a stuck upload, or a missed completion message.","creates":["An alert","A retry","A message to the customer"],"steps":[{"id":"f1","lane":"outside","text":"Storage provider has an outage","status":"partial","detail":"Today uploads fail with a generic error.","evidence":["E1"]},{"id":"f2","lane":"front","text":"Customer sees a plain message and their upload pauses","status":"planned","detail":"Resume when storage is back, without starting over.","evidence":["E12"]},{"id":"f3","lane":"background","text":"A completion message never arrives","status":"missing","detail":"Nightly job finds files stuck in 'uploading' for over 24 hours.","evidence":["E21"]},{"id":"f4","lane":"background","text":"Stuck files are checked against storage and fixed or cleaned up","status":"missing","detail":"If the file is complete in storage, scan it; if not, delete the record."},{"id":"f5","lane":"core","text":"On-call is alerted when large-upload failures pass 2%","status":"missing","detail":"Today nobody is alerted; support finds out from tickets.","moment":true,"evidence":["E4","E16"]},{"id":"f6","lane":"front","text":"Support can see a customer's recent uploads and why they failed","status":"missing","detail":"A simple page for support, read-only.","evidence":["E4"]}]}]},{"id":"m-options","template":"opportunity-tree","title":"Options","intro":"The outcome at the top, then the problems that stand in its way, the ideas for each, and the quick tests that would prove an idea.","levels":["Outcome","Problem","Idea","Quick test"],"root":{"id":"o-root","title":"Big uploads always finish, and the transfer bill falls","text":"By the September budget review.","children":[{"id":"o-timeouts","title":"Large uploads time out","status":"missing","evidence":["E1","E4"],"children":[{"id":"o-direct","title":"Direct uploads with signed links","status":"planned","evidence":["E7"],"children":[{"id":"o-test-direct","title":"Ship to 5% of video uploads for two weeks","text":"Compare failure rate and server load."}]},{"id":"o-bigger","title":"Raise timeouts and add servers","status":"works","text":"Cheap now, costly later.","children":[{"id":"o-test-bigger","title":"Raise the idle timeout to 10 minutes on one server","text":"Watch for queueing."}]}]},{"id":"o-bill","title":"Data out costs keep growing","status":"partial","evidence":["E3","E5"],"children":[{"id":"o-move","title":"Move files to provider B","status":"planned","evidence":["E5","E6"],"children":[{"id":"o-test-move","title":"Copy one month of new files to B and serve them through the CDN","text":"Measure the bill and download speed."}]},{"id":"o-cache","title":"Cache popular downloads at the CDN","status":"missing","children":[{"id":"o-test-cache","title":"Turn on caching for public files only","text":"One week, then compare data out."}]}]}]}}],"gaps":[{"id":"G1","title":"Direct uploads with a progress bar and resume","why":"Fixes the timeouts no matter which provider we use; uploads over 200 MB are 71% of all bytes.","anchors":["d2","d3","d3b","o-direct"],"impact":5,"effort":3,"stories":[{"as":"As a customer uploading a large video on a weak connection, I want the upload to resume where it stopped, so I do not start again.","done_when":["a 2 GB upload survives a 30-second disconnect","the progress bar matches the bytes received","our servers handle no file bytes"]},{"as":"As a producer uploading a 4 GB video, I want to see how far along it is, so I know it is not stuck.","done_when":["a progress bar shows percent and time left","it updates at least every 2 seconds"]},{"as":"As a school office behind a strict firewall, I want uploads to still work, so we are not locked out.","done_when":["if the storage address cannot be reached within 5 seconds, the upload falls back to the old path","support can see which customers used the fallback"]}]},{"id":"G2","title":"Scan files that never touch our servers","why":"Today scanning assumes we saw the upload, and a bad file can be downloaded for up to 4 minutes.","anchors":["d4","d3d","t6"],"impact":4,"effort":2,"stories":[{"as":"As the security engineer, I want every upload scanned before anyone can download it, so direct uploads add no risk.","done_when":["a file is not downloadable until its scan passes","an infected test file is quarantined and the customer is told"]},{"as":"As a customer, I want to know my file is being checked, so a short wait makes sense.","done_when":["the file shows 'Checking' until the scan passes","files under 100 MB are ready within 15 seconds"]}]},{"id":"G3","title":"Move existing files to provider B","why":"Cuts the data-out bill; only worth it if the free transfer is granted.","anchors":["o-move","mv1","mv5"],"impact":3,"effort":4,"stories":[{"as":"As finance, I want the move to cost nothing up front, so the saving shows before the September review.","done_when":["provider B confirms free transfer in writing","every file's checksum matches after the copy","downloads switch over with no broken links"]},{"as":"As the engineering lead, I want to switch back within an hour, so a bad move does not become an outage.","done_when":["reads and writes switch by one setting per customer group","a dry run of switching back is done before the move"]}]},{"id":"G4","title":"Serve popular files from the CDN","why":"18% of files cause 80% of data out; caching them cuts the bill with either provider.","anchors":["dl5","o-cache"],"impact":4,"effort":2,"stories":[{"as":"As finance, I want popular downloads to stop counting as data out, so the bill falls before September.","done_when":["public and shared files are served from the CDN","data out falls at least 30% in the first month"]},{"as":"As a security engineer, I want private files never cached, so nobody gets someone else's file.","done_when":["only files marked public or shared go to the CDN","a private file request always checks permission first"]}]},{"id":"G5","title":"Deletes reach every copy","why":"Our terms promise deleted files are gone within 30 days; provider B keeps a 7-day recycle area and a move means two copies.","anchors":["x4","x5","mv8"],"impact":4,"effort":2,"stories":[{"as":"As a customer who deleted a file, I want it gone everywhere within 30 days, as the terms promise.","done_when":["provider B's recycle area is off, or our purge runs 7 days early","deletes during the move go to both providers","a monthly check finds no deleted file older than 30 days"]}]},{"id":"G6","title":"Know about failures before customers tell us","why":"Support found out about the 2 May incident from 31 tickets.","anchors":["f5","f6","f3"],"impact":3,"effort":2,"stories":[{"as":"As on-call, I want an alert when large uploads start failing, so I can act in minutes, not hours.","done_when":["an alert fires when failures over 200 MB pass 2% for 10 minutes","the alert links to a page showing the failing step"]},{"as":"As support, I want to see a customer's recent uploads and why they failed, so I can answer the ticket.","done_when":["a read-only page lists the last 20 uploads with status and error","it never shows file contents"]}]}],"notes":[{"id":"N1","role":"engineer","anchor":"t3","title":"The proxy is the bottleneck","body":"Servers hold a connection for the whole upload. That is why everything slowed down.","recommend":"Do direct uploads first; it is independent of the provider choice.","question":"Do we agree to separate the two decisions: direct uploads now, provider later?","urgency":"must","evidence":["E2","E7"]},{"id":"N2","role":"security","anchor":"d2","title":"Signed links must be narrow","body":"A link that allows any path, or lasts hours, would let anyone write files into our storage.","recommend":"Links last 10 minutes, cover one path, and set a size limit.","question":"Is 10 minutes long enough for the slowest customers, given uploads resume in pieces?","urgency":"must","evidence":["E9"]},{"id":"N3","role":"security","anchor":"d4","title":"Nothing is downloadable before it is scanned","body":"With direct uploads, a file lands in storage before we have looked at it.","recommend":"Upload into a holding area; move it to the live area only after a clean scan.","question":"Who builds and tests the holding area before the 5% trial?","urgency":"must","evidence":["E10"]},{"id":"N4","role":"voice","anchor":"d3","title":"Customers asked for two things","body":"A progress bar and resuming after a dropped connection. Neither needs a new provider.","recommend":"Ship both with direct uploads, and tell the 31 customers who raised tickets.","question":"Do we contact the customers who reported the problem when the fix ships?","urgency":"should","evidence":["E4","E8"]},{"id":"N5","role":"finance","anchor":"o-bill","title":"The bill problem is data out, not storage","body":"Storage grew a little; data out grew a lot.","recommend":"Try CDN caching first; it is cheap and fast to test.","question":"How much must data out fall by September for this to count as fixed?","urgency":"must","evidence":["E3","E5"]},{"id":"N6","role":"finance","anchor":"G3","title": n"],"owner":"Backend lead","status":"decided","decided_by":"Engineering lead","decision":"Yes. Direct uploads ship to 5% of video uploads in June.","due":"2026-05-29"},{"id":"D2","question":"Do we move to provider B?","notes":["N5","N6","N11"],"options":["Move all files","Move new files only","Stay, and add CDN caching"],"owner":"Engineering lead","status":"open","due":"2026-07-15"},{"id":"D3","question":"How do signed links and scanning work?","notes":["N2","N3"],"owner":"Security engineer","status":"open","due":"2026-06-05"},{"id":"D4","question":"Do we run the one-week caching test before deciding on provider B?","notes":["N21","N24"],"options":["Yes, test caching first","No, decide on B now"],"owner":"Engineering lead","status":"open","due":"2026-06-10"},{"id":"D5","question":"How do we keep the 30-day deletion promise at provider B?","notes":["N23"],"options":["Turn the recycle area off","Purge 7 days early"],"owner":"Security engineer","status":"open","due":"2026-06-20"}],"outcomes":[{"id":"O1","measure":"Failed large uploads","baseline":"About 6% during busy hours","target":"Below 1%"},{"id":"O2","measure":"Data out cost per month","baseline":"Up 22% last quarter","target":"Down 30% by September"},{"id":"O3","measure":"Time from upload to 'Ready' for files under 100 MB","baseline":"Shown at once, scanned later","target":"Under 15 seconds, scanned first"},{"id":"O4","measure":"Upload tickets per month","baseline":"31 in the incident week","target":"Fewer than 5"}]}</script>

}

const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const TERMS = Object.keys(GLOSS).sort((a, b) => b.length - a.length);
const TERM_RE = TERMS.length ? new RegExp("\\b(" + TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "i") : null;
function gl(text, focusable = true) {
  if (!TERM_RE) return esc(text);
  return String(text || "").split(TERM_RE).map((part, i) => {
    if (!(i % 2)) return esc(part);
    const key = TERMS.find(t => t.toLowerCase() === part.toLowerCase());
    return `<span class="term" data-term="${esc(key)}"${focusable ? ' tabindex="0"' : ""}>${esc(part)}</span>`;
  }).join("");
}

const pill = s => s && STATUS[s] ? `<span class="pill ${s}">${STATUS[s]}</span>` : "";
const days = (a, b) => (new Date(a) - new Date(b)) / 864e5;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

/* ---------- index of boxes ---------- */
const BOX = {};
MODEL.maps.forEach((m, mi) => {
  (m.journeys || []).forEach((j, ji) => {
    BOX[j.id] = {box:j, mi, kind:"journey", ji};
    (j.steps || []).forEach((s, k) => BOX[s.id] = {box:s, mi, kind:"step", ji, k});
  });
  (m.stages || []).forEach((st, si) => {
    BOX[st.id] = {box:st, mi, kind:"stage", si};
    (st.items || []).forEach(it => BOX[it.id] = {box:it, mi, kind:"item", si, stage:st.id});
  });
  if (m.root) {
    const walk = (n, d, bi) => { BOX[n.id] = {box:n, mi, kind:"node", depth:d, bi}; (n.children || []).forEach((c, i) => walk(c, d + 1, d === 0 ? i : bi)); };
    walk(m.root, 0, -1);
  }
});
GAPS.forEach(g => BOX[g.id] = {box:g, mi:-1, kind:"gap"});
const notesOn = id => NOTES.filter(n => n.anchor === id && S.roles[n.role] !== false);
const mapOfAnchor = a => BOX[a] ? (BOX[a].mi >= 0 ? BOX[a].mi : mapOfAnchor((BOX[a].box.anchors || [])[0])) : -1;
const titleOf = b => b.title || b.label || b.text || b.id;

function badges(b) {
  const out = [];
  if (sinceAdded.has(b.id)) out.push(`<span class="chip new">New</span>`);
  else if (sinceChanged[b.id]) out.push(`<span class="chip changed">Changed</span>`);
  const ref = (MODEL.checked || {}).date;
  if (b.checked && ref && days(ref, b.checked) > FRESH_DAYS) out.push(`<span class="chip stale" title="Checked ${esc(b.checked)}">May be out of date</span>`);
  if (b.moment) out.push(`<span class="chip moment">Moment that matters</span>`);
  if (b.pain) out.push(`<span class="chip pain">Pain point</span>`);
  if (b.feeling) out.push(`<span class="chip"><i class="feel ${b.feeling}"></i>${FEEL[b.feeling]}</span>`);
  const ev = (b.evidence || []).length;
  if (ev) out.push(`<span class="chip">Evidence: ${ev}</span>`);
  const notes = notesOn(b.id);
  if (notes.length) out.push(`<span class="notebadge${notes.some(n => n.urgency === "must") ? " must" : ""}">${plural(notes.length, "note")}</span>`);
  return out.join("");
}
const tech = b => S.tech && b.detail ? `<span class="techname">${esc(b.detail)}</span>` : "";

/* ---------- DOM helpers ---------- */
const world = $("#world"), viewport = $("#viewport");
let nodes = {}, rows = [], svg;
function place(cls, x, y, w, html, data, label) {
  const d = document.createElement("div");
  d.className = cls; d.style.left = x + "px"; d.style.top = y + "px";
  if (w) d.style.width = w + "px";
  d.innerHTML = html;
  if (data) { d.tabIndex = 0; d.setAttribute("role", "button"); d.setAttribute("aria-label", label || ""); d._data = data; }
  world.appendChild(d);
  return d;
}
function link(x1, y1, x2, y2, cls, label) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  const my = (y1 + y2) / 2;
  p.setAttribute("d", Math.abs(x1 - x2) < 2 ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
  if (cls) p.setAttribute("class", cls);
  svg.appendChild(p);
  if (label) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", (x1 + x2) / 2 + 10); t.setAttribute("y", my + 5); t.textContent = label;
    svg.appendChild(t);
  }
  return p;
}
function arrowHead(x, y) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", `M${x - 6},${y - 9} L${x},${y} L${x + 6},${y - 9}`);
  svg.appendChild(p);
}
function tint(hex) {
  const n = parseInt(String(hex).replace("#", ""), 16) || 0x888888;
  const mix = c => Math.round(c * 0.16 + 255 * 0.84);
  return `rgb(${mix(n >> 16 & 255)},${mix(n >> 8 & 255)},${mix(n & 255)})`;
}

/* Notes beside a row (only when "Show all notes on the map" is on): a column to the right of
   every box, sized from the real cards, so a note never sits over any text. */
const NOTE_W = 250, NOTE_GAP = 12, NOTES_W = 2 * NOTE_W + NOTE_GAP;
function notePile(anchors, x, y, max, rowKey) {
  if (!S.notesOnMap) return 0;
  const list = NOTES.filter(n => anchors.includes(n.anchor) && S.roles[n.role] !== false)
    .sort((a, b) => URG_ORDER[a.urgency || "info"] - URG_ORDER[b.urgency || "info"]);
  const shown = list.slice(0, max);
  const colH = [0, 0];
  shown.forEach((n, i) => {
    const c = colH[0] <= colH[1] ? 0 : 1;
    const r = ROLE[n.role] || {label:n.role, color:"#888"};
    const el = place(`notecard ${n.urgency || "info"} inj`, x + c * (NOTE_W + NOTE_GAP), y + colH[c], NOTE_W,
      `<div><span class="who">${esc(r.label)}</span><span class="urg">${URG[n.urgency || "info"]}</span></div>
       <h5>${esc(n.title)}</h5><div class="q">${esc(n.question || n.body || "")}</div>`,
      {type:"note", n}, `${r.label} note: ${n.title}`);
    el.style.background = tint(r.color);
    el.style.setProperty("--note-tilt", [-0.7, 0.5, -0.3, 0.6][i % 4] + "deg");
    el.dataset.row = rowKey;
    colH[c] += el.offsetHeight + NOTE_GAP;
  });
  let h = Math.max(colH[0], colH[1]);
  if (list.length > shown.length) {
    const more = place("morenotes inj", x, y + h, NOTES_W, `+ ${plural(list.length - shown.length, "more note")} here`,
      {type:"notes", anchors, title:"Notes here"}, `${list.length - shown.length} more notes`);
    more.dataset.row = rowKey;
    h += more.offsetHeight + NOTE_GAP;
  }
  return h;
}
const notesWidth = () => S.notesOnMap ? NOTES_W + 48 : 0;

function header(m, width) {
  place("stamp", 0, 6, 0, (MODEL.checked && MODEL.checked.date) ? `Checked against the sources on ${esc(MODEL.checked.date)}` : "Not yet checked against sources");
  const t = place("maptitle", 0, 40, Math.max(width, 600), esc(m.title || MODEL.title));
  const q = place("mapintro", 0, 40 + t.offsetHeight + 8, Math.min(Math.max(width, 600), 900), gl(m.intro || ""));
  return 40 + t.offsetHeight + 8 + q.offsetHeight + 40;
}

/* ---------- journeys ---------- */
const J = {laneW:260, laneGap:22, stepW:236, stepH:84, rowGap:16, headW:330, headGap:40, bandGap:70};
function renderJourneys(m) {
  const lanes = m.lanes || [];
  const LI = Object.fromEntries(lanes.map((l, i) => [l.id, i]));
  const laneX = i => J.headW + J.headGap + i * (J.laneW + J.laneGap);
  const lanesRight = laneX(lanes.length - 1) + J.laneW;
  const notesX = lanesRight + 48;
  const W = lanesRight + notesWidth();
  let y = header(m, W);
  lanes.forEach((l, i) => place("lanehead", laneX(i), y, J.laneW, `${esc(l.label)}<small>${esc(l.sub || "")}</small>`));
  if (S.notesOnMap) place("label", notesX, y + 4, 0, "Notes from each role");
  y += 60;
  const laneTop = y - 70;
  (m.journeys || []).forEach((j, ji) => {
    const y0 = y;
    const hd = place("box jhead inj", 0, y0, J.headW,
      `<h3><span class="n">${ji + 1}</span>${gl(j.title)}</h3><p>${gl(j.summary || "")}</p>
       ${(j.creates || []).length ? `<p class="sub small"><b>What it leaves behind:</b> ${j.creates.map(esc).join(", ")}</p>` : ""}
       ${tech(j)}<div class="meta">${badges(j)}<span class="chip">${plural((j.steps || []).length, "step")}</span></div>`,
      {type:"box", id:j.id}, `Journey ${ji + 1}: ${j.title}`);
    hd.dataset.row = "j" + ji;
    nodes[j.id] = hd;
    let sy = y0, prev = null;
    (j.steps || []).forEach((s, k) => {
      const x = laneX(LI[s.lane] || 0) + (J.laneW - J.stepW) / 2;
      const el = place("box step inj", x, sy, J.stepW,
        `<div class="row1"><span class="n">${k + 1}</span><div class="t">${gl(s.text)}</div></div>${tech(s)}
         <div class="meta">${pill(s.status)}${badges(s)}</div>`,
        {type:"box", id:s.id}, `Step ${k + 1} of journey ${ji + 1}: ${s.text}`);
      el.style.minHeight = J.stepH + "px";
      el.dataset.row = "j" + ji;
      nodes[s.id] = el;
      const h = el.offsetHeight;
      if (prev) {
        const p = link(prev.x + J.stepW / 2, prev.y + prev.h, x + J.stepW / 2, sy - 2, "inj");
        p.dataset.row = "j" + ji; arrowHead(x + J.stepW / 2, sy - 2);
      }
      prev = {x, y:sy, h};
      sy += h + J.rowGap;
    });
    const nh = notePile([j.id, ...(j.steps || []).map(s => s.id)], notesX, y0, 4, "j" + ji);
    const h = Math.max(hd.offsetHeight, sy - y0, nh);
    rows.push({key:"j" + ji, y:y0, h, x:0, w:W});
    y = y0 + h + J.bandGap;
  });
  lanes.forEach((l, i) => {
    const bg = document.createElement("div"); bg.className = "lanebg";
    Object.assign(bg.style, {left:(laneX(i) - 8) + "px", top:laneTop + "px", width:(J.laneW + 16) + "px", height:(y - laneTop) + "px"});
    world.prepend(bg);
  });
  return {x:0, y:0, w:W, h:y};
}

/* A customer's actions run left to right, in the supplied order. */
function renderCustomerJourney(m) {
  const cardW = 250, gap = 64;
  const count = Math.max(1, ...(m.journeys || []).map(j => (j.steps || []).length));
  const timelineW = count * (cardW + gap) - gap;
  const notesX = timelineW + 48;
  const W = timelineW + notesWidth();
  let y = header(m, W);
  (m.journeys || []).forEach((j, ji) => {
    const start = y;
    const hd = place("box timeline-title inj", 0, y, Math.min(600, timelineW),
      `<h3>${gl(j.title)}</h3><p>${gl(j.summary || "")}</p>${tech(j)}<div class="meta">${badges(j)}</div>`,
      {type:"box", id:j.id}, j.title);
    nodes[j.id] = hd; hd.dataset.row = "j" + ji;
    y += hd.offsetHeight + 48;
    let maxH = 0, prev = null;
    (j.steps || []).forEach((step, i) => {
      const x = i * (cardW + gap);
      const lane = (m.lanes || []).find(l => l.id === step.lane);
      place("label", x, y - 26, cardW, `${i + 1}. ${esc(lane ? lane.label : "Next step")}`);
      const card = place("box customer-step inj", x, y, cardW,
        `<h4>${gl(step.text)}</h4>${tech(step)}<div class="meta">${pill(step.status)}${badges(step)}</div>`,
        {type:"box", id:step.id}, `Step ${i + 1}: ${step.text}`);
      card.dataset.row = "j" + ji; nodes[step.id] = card;
      maxH = Math.max(maxH, card.offsetHeight);
      if (prev !== null) {
        const line = link(prev + cardW, y + 30, x - 8, y + 30, "inj customer-flow");
        line.dataset.row = "j" + ji;
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
        arrow.setAttribute("d", `M${x - 16},${y + 24} L${x - 8},${y + 30} L${x - 16},${y + 36}`);
        arrow.setAttribute("class", "customer-flow"); svg.appendChild(arrow);
      }
      prev = x;
    });
    const nh = notePile([j.id, ...(j.steps || []).map(step => step.id)], notesX, start, 4, "j" + ji);
    const h = Math.max(y - start + maxH, nh);
    rows.push({key:"j" + ji, y:start, h, x:0, w:W});
    y = start + h + 64;
  });
  return {x:0, y:0, w:W, h:y};
}

/* ---------- chain ---------- */
const C = {stageW:300, stageH:96, itemW:250, itemGap:14, perRow:3, gap:64};
function renderChain(m) {
  const compare = S.mode === "compare";
  const itemsX = C.stageW + 50;
  const perRow = compare ? 2 : C.perRow;
  const columnW = perRow * (C.itemW + C.itemGap) - C.itemGap;
  const versions = compare ? ["today", "planned"] : [S.mode];
  const notesX = itemsX + versions.length * (columnW + 44) + 34;
  const W = notesX - 34 + notesWidth();
  let y = header(m, W);
  place("label", 0, y, 0, "Stage");
  versions.forEach((version, i) => place("label", itemsX + i * (columnW + 44), y, columnW,
    version === "today" ? "Current" : "Proposed · dashed boxes are new"));
  if (S.notesOnMap) place("label", notesX, y, 0, "Notes from each role");
  y += 30;
  let prevStage = null;
  (m.stages || []).forEach((st, si) => {
    const y0 = y;
    const stEl = place(`box stage inj${si === 0 ? " first-stage" : ""}`, 0, y0, C.stageW,
      `<h3>${gl(st.label)}</h3><p>${gl(st.sub || "")}</p>${tech(st)}<div class="meta">${badges(st)}</div>`,
      {type:"box", id:st.id}, `Stage ${si + 1}: ${st.label}`);
    stEl.style.minHeight = C.stageH + "px";
    stEl.dataset.row = "s" + si; nodes[st.id] = stEl;
    let ih = 0;
    versions.forEach((version, vi) => {
      const items = (st.items || []).filter(it => (it.when || "both") === "both" || it.when === version);
      const columnX = itemsX + vi * (columnW + 44);
      let rowMax = 0, iy = y0, col = 0;
      items.forEach(it => {
        const el = place(`box item inj${it.when === "planned" ? " planned-new" : ""}`,
          columnX + col * (C.itemW + C.itemGap), iy, C.itemW,
          `<h4>${gl(it.title)}</h4><p class="t">${gl(it.text || "")}</p>${tech(it)}<div class="meta">${pill(it.status)}${badges(it)}${compare && (it.when || "both") === "both" ? '<span class="chip">Unchanged</span>' : ""}</div>`,
          {type:"box", id:it.id}, `${compare ? version === "today" ? "Current: " : "Proposed: " : ""}${it.title}`);
        el.dataset.row = "s" + si;
        if (!nodes[it.id]) nodes[it.id] = el;
        rowMax = Math.max(rowMax, el.offsetHeight);
        if (++col === perRow) { col = 0; iy += rowMax + C.itemGap; rowMax = 0; }
      });
      ih = Math.max(ih, iy - y0 + rowMax);
      if (!items.length) { place("label", columnX, y0 + 10, columnW, version === "planned" ? "Nothing proposed here" : "Nothing here today"); ih = Math.max(ih, 40); }
    });
    const nh = notePile([st.id, ...(st.items || []).map(i => i.id)], notesX, y0, 4, "s" + si);
    const h = Math.max(stEl.offsetHeight, ih, nh);
    rows.push({key:"s" + si, y:y0, h, x:0, w:W});
    if (prevStage) {
      const p = link(C.stageW / 2, prevStage.y + prevStage.h, C.stageW / 2, y0 - 2, "inj", prevStage.verb);
      p.dataset.row = "s" + si; arrowHead(C.stageW / 2, y0 - 2);
    }
    prevStage = {y:y0, h:stEl.offsetHeight, verb:st.verb || ""};
    y = y0 + h + C.gap;
  });
  const outs = MODEL.outcomes || [];
  if (outs.length && m === MODEL.maps.find(mm => KIND[mm.template] === "chain")) {
    place("label", 0, y, 0, "Did it work?");
    y += 26;
    const ow = C.itemW + 60;
    let oy = y, outcomeH = 0;
    outs.forEach((o, i) => {
      const el = place("box inj", (i % 3) * (ow + C.itemGap), oy, ow,
        `<h4>${esc(o.measure)}</h4><p class="t">${o.baseline ? "Before: " + esc(o.baseline) + ". " : ""}${o.target ? "Target: " + esc(o.target) + ". " : ""}${o.result ? "<b>Result: " + esc(o.result) + "</b>" : "Not measured yet."}</p>
         <div class="meta">${o.becomes_evidence ? `<span class="chip">Feeds back as evidence</span>` : ""}</div>`,
        {type:"outcome", o}, `Outcome: ${o.measure}`);
      nodes[o.id] = el;
      outcomeH = Math.max(outcomeH, el.offsetHeight);
      if (i % 3 === 2 || i === outs.length - 1) { oy += outcomeH + C.itemGap; outcomeH = 0; }
    });
    rows.push({key:"outcomes", y:y - 26, h:oy - y + 26, x:0, w:W});
    y = oy + 20;
  }
  return {x:0, y:0, w:W, h:y};
}

/* ---------- tree ---------- */
const T = {colW:270, colGap:60, nodeH:104, vGap:18};
function renderTree(m) {
  const levels = !m.levels || JSON.stringify(m.levels) === JSON.stringify(["Outcome","Need or pain","Idea","Quick test"]) ? TREE_LEVELS : m.levels;
  const depthOf = n => n.children && n.children.length ? 1 + Math.max(...n.children.map(depthOf)) : 1;
  const depth = depthOf(m.root);
  const notesX = depth * (T.colW + T.colGap) + 10;
  const W = depth * (T.colW + T.colGap) - T.colGap + notesWidth();
  let y = header(m, W);
  for (let d = 0; d < depth; d++) place("label", d * (T.colW + T.colGap), y, 0, esc(levels[Math.min(d, levels.length - 1)]));
  y += 30;
  // Measure the actual cards before reserving rows. Long titles and badges wrap.
  const cards = {};
  let nodeH = T.nodeH;
  (function measure(n, d) {
    const el = place(`box tree-node l${d} inj`, d * (T.colW + T.colGap), y, T.colW,
      `<h4>${gl(n.title)}</h4>${n.text ? `<p class="t">${gl(n.text)}</p>` : ""}${tech(n)}<div class="meta">${pill(n.status)}${badges(n)}</div>`,
      {type:"box", id:n.id}, `${levels[Math.min(d, levels.length - 1)]}: ${n.title}`);
    el.style.minHeight = T.nodeH + "px";
    cards[n.id] = el;
    nodeH = Math.max(nodeH, el.offsetHeight);
    (n.children || []).forEach(c => measure(c, d + 1));
  })(m.root, 0);
  let cursor = y;
  const pos = {};
  (function lay(n, d) {
    const kids = n.children || [];
    let cy;
    if (!kids.length) { cy = cursor; cursor += nodeH + T.vGap; }
    else { kids.forEach(k => lay(k, d + 1)); cy = (pos[kids[0].id].y + pos[kids[kids.length - 1].id].y) / 2; }
    pos[n.id] = {x:d * (T.colW + T.colGap), y:cy, d};
  })(m.root, 0);
  const branches = m.root.children || [];
  const ids = n => [n.id, ...(n.children || []).flatMap(ids)];
  const shifted = {};
  let shift = 0;
  branches.forEach((b, bi) => {
    const own = ids(b);
    const ys = own.map(i => pos[i].y);
    const y0 = Math.min(...ys) + shift, y1 = Math.max(...ys) + nodeH + shift;
    own.forEach(i => shifted[i] = pos[i].y + shift);
    const nh = notePile(own, notesX, y0, 4, "b" + bi);
    rows.push({key:"b" + bi, y:y0, h:Math.max(y1 - y0, nh), x:0, w:W});
    shift += Math.max(0, nh - (y1 - y0)) + (S.notesOnMap ? T.vGap : 0);
  });
  shifted[m.root.id] = branches.length ? (shifted[branches[0].id] + shifted[branches[branches.length - 1].id]) / 2 : pos[m.root.id].y;
  const draw = (n, parent, bi) => {
    const p = pos[n.id], ny = shifted[n.id];
    const el = cards[n.id];
    el.style.top = ny + "px";
    el.style.height = nodeH + "px";
    if (bi != null) el.dataset.row = "b" + bi;
    nodes[n.id] = el;
    if (parent) {
      const l = link(pos[parent.id].x + T.colW, shifted[parent.id] + nodeH / 2, p.x, ny + nodeH / 2, "inj");
      if (bi != null) l.dataset.row = "b" + bi;
    }
    (n.children || []).forEach(c => draw(c, n, bi == null ? branches.indexOf(c) : bi));
  };
  draw(m.root, null, null);
  let bottom = Math.max(...Object.values(shifted)) + nodeH;
  if (S.notesOnMap && notesOn(m.root.id).length) {
    const start = Math.max(bottom, ...rows.map(row => row.y + row.h)) + 38;
    place("label", notesX, start - 24, NOTES_W, "About the whole choice");
    const height = notePile([m.root.id], notesX, start, 6, "root-notes");
    rows.push({key:"root-notes", y:start, h:height, x:0, w:W});
    bottom = start + height;
  }
  return {x:0, y:0, w:W, h:bottom + 60};
}

/* Named connections come from the model, never from the card positions. */
function visibleLinks() {
  return (MODEL.links || []).filter(l => S.mode === "compare" || (l.when || "both") === "both" || l.when === S.mode);
}
function drawConnections() {
  const connections = visibleLinks().filter(l => nodes[l.from] && nodes[l.to]);
  const right = Math.max(0, ...Object.values(nodes).map(n => parseFloat(n.style.left) + n.offsetWidth));
  connections.forEach((connection, i) => {
    const a = nodes[connection.from], b = nodes[connection.to];
    const ax = parseFloat(a.style.left) + a.offsetWidth / 2, ay = parseFloat(a.style.top);
    const bx = parseFloat(b.style.left) + b.offsetWidth / 2, by = parseFloat(b.style.top);
    const gutter = right + 40 + i * 18;
    const group = document.createElementNS("http://www.w3.org/2000/svg", "g");

  const vw = innerWidth - leftEdge() - rightEdge() - 40, vh = innerHeight - topEdge() - bottomEdge() - 40;
  let z = Math.min(vw / b.w, vh / b.h) * 0.95;
  const tall = z < MIN_Z + 0.08;
  if (tall) z = Math.min(1, Math.max(MIN_Z + 0.1, vw / b.w * 0.96));   // too tall: fit the width, start at the top
  Z = Math.min(1.3, Math.max(MIN_Z, z));

  if (Z < 0.75) Z = 0.9;

}

/* ---------- walk-through ---------- */
function steps() {
  const out = [{title:"The decision", text:MODEL.question + (MODEL.summary ? " " + MODEL.summary : ""), go:() => { showMap(0); S.journey = -1; applyFocus(); story(); fit(); }}];
  if (MODEL.reading) out.push({title:"How to read this", text:MODEL.reading, go:() => { showMap(0); S.journey = -1; applyFocus(); story(); fit(); }});
  MODEL.maps.forEach((m, mi) => {
    const kind = KIND[m.template];
    out.push({title:m.title, text:m.intro || "", go:() => { showMap(mi); S.journey = -1; applyFocus(); story(); fit(); }});
    if (kind === "journeys") (m.journeys || []).forEach((j, ji) => {
      const moments = (j.steps || []).filter(s => s.moment).map(s => s.text);
      out.push({title:`${ji + 1}. ${j.title}`, text:(j.summary || "") + ` ${plural((j.steps || []).length, "step")}.` + (moments.length ? ` Moments that matter: ${moments.join("; ")}.` : ""), go:() => focusJourney(mi, ji)});
    });
    if (kind === "chain") (m.stages || []).forEach((st, si) => {
      const items = (st.items || []).filter(it => (it.when || "both") === "both" || it.when === S.mode).map(it => it.title);
      out.push({title:`${si + 1}. ${st.label}`, text:`${st.sub || ""}. ${items.length ? items.join("; ") + "." : "Nothing here yet."}`, go:() => focusRow(mi, "s" + si)});
    });
    if (kind === "tree") (m.root.children || []).forEach((b, bi) => {
      out.push({title:b.title, text:`Ideas: ${(b.children || []).map(c => c.title).join("; ") || "none yet"}.`, go:() => focusRow(mi, "b" + bi)});
    });
  });
  if (GAPS.length) {
    const best = GAPS.slice().sort((a, b) => ((b.impact || 0) * 2 - (b.effort || 0)) - ((a.impact || 0) * 2 - (a.effort || 0)))[0];
    out.push({title:"Gaps between today and planned", text:`${plural(GAPS.length, "gap")}. Best value first: ${best.title}.`, panel:true, go:() => open("gaps")});
  }
  const qs = questionList();
  const must = qs.filter(q => q.urgency === "must").length;
  out.push({title:"What we need to decide", text:`${plural(qs.length, "question")}, ${must} that must be decided. Answer them on the right, then press Save my answers. Send the downloaded file to the review owner.`, panel:true, go:() => open("questions")});
  return out;
}
let walkAt = -1;
function walk(i) {
  const list = steps();
  if (i < 0 || i >= list.length) return endWalk();
  walkAt = i;
  hideHint();
  const s = list[i];
  if (!s.panel) close();
  s.go();
  const w = $("#walk");
  w.innerHTML = `<div class="step">Step ${i + 1} of ${list.length}</div><h3>${esc(s.title)}</h3><p>${gl(s.text)}</p>
    <div class="row"><button data-w="back"${i === 0 ? " disabled" : ""}>Back</button><span class="grow"></span>
    <button data-w="end">End the walk-through</button><button class="next" data-w="next">${i === list.length - 1 ? "Finish" : "Next"}</button></div>`;
  w.classList.add("open");
  w.querySelector('[data-w="back"]').addEventListener("click", () => walk(walkAt - 1));
  w.querySelector('[data-w="next"]').addEventListener("click", () => walk(walkAt + 1));
  w.querySelector('[data-w="end"]').addEventListener("click", endWalk);
  w.querySelector('[data-w="next"]').focus();
  wireTerms(w);
}
function endWalk() { walkAt = -1; $("#walk").classList.remove("open"); }
