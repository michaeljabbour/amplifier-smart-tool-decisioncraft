<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="generator" content="decisioncraft">
<title>Riverside footbridge: repair or replace?</title>
<style>
/* Decisioncraft canvas. One visual language:
   - a dotted canvas;
   - the chain as bold blocks, purple first and warm yellow after, joined by dashed arrows
     that name what each step does to the next;
   - white cards with a solid status tag, lane colours on journey steps;
   - sticky notes in each role's colour, slightly tilted, with an urgency edge;
   - plan changes as ribbons: teal New, amber Changed, grey Goes away. */
:root{
  --bg:#f4f3ef; --dot:#cdc9bf; --ink:#1d1d1f; --ink2:#43423d; --muted:#6a6862; --line:#dcd9d0;
  --panel:#ffffff; --soft:#efede6; --accent:#2f5bd3; --accent-soft:#e8eefc;
  --purple:#7350e0; --purple-ink:#ffffff; --yellow:#f7cd60; --yellow-edge:#e5b641; --yellow-ink:#3a2a00;
  --works:#1f7a4a; --partial:#985800; --missing:#b3261e; --planned:#0b6b72;
  --new:#0e8a84; --new-soft:#e6f6f4; --changed:#c27c00; --changed-soft:#fff4dc; --gone:#86837b; --gone-soft:#f1efea;
  --must:#b3261e; --should:#a86400; --info:#4a5a72;
  --z:1; --inv:1;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.small{font-size:12.5px;color:var(--muted)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:60px;z-index:80;background:#fff;padding:6px 10px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- canvas ---------- */
#viewport,#viewport2{position:fixed;inset:0;cursor:grab;touch-action:none;overflow:hidden}
body.dots #viewport,body.dots #viewport2{background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:22px 22px}
#viewport.dragging,#viewport2.dragging{cursor:grabbing}
#viewport2{display:none}
#world,#world2{position:absolute;left:0;top:0;transform-origin:0 0}
.panelabel{display:none}
svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:1}
svg.links path{fill:none;stroke:#a19d93;stroke-width:2}
svg.links path.flow{stroke:#a19d93}
svg.links path.hot{stroke:var(--accent);stroke-width:3}
svg.links path.spine{stroke:#8f8a7e;stroke-width:2.5;stroke-dasharray:7 6}
svg.links text{font-size:14px;font-weight:600;fill:#5d5a52;paint-order:stroke;stroke:var(--bg);stroke-width:5px}
svg.links text.verb{font-size:14px;font-weight:600;fill:#6b6658}
svg.links path.notelink{stroke-width:1.6;stroke-dasharray:3 5;opacity:.55}

/* ---------- boxes ---------- */
.box{position:absolute;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:11px 13px 12px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(40,35,20,.05);cursor:pointer;transition:opacity .15s,box-shadow .15s,transform .15s;overflow:hidden;z-index:2}
.box:hover{box-shadow:0 2px 4px rgba(0,0,0,.07),0 10px 26px rgba(40,35,20,.13)}
.box.sel{outline:3px solid var(--accent);outline-offset:3px}
.box.pair{outline:2px solid rgba(47,91,211,.45);outline-offset:3px}
.box h3,.box h4{margin:0 0 4px;font-size:15px;line-height:1.28;font-weight:650}
.box p{margin:0;color:var(--ink2)}
.box .t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:13.5px}
.box .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
body.dim .box.inj:not(.hot),body.dim .notecard.inj:not(.hot),body.dim .steplabel:not(.hot){opacity:.25}
body.dim svg.links path.inj:not(.hot){opacity:.25}

.stamp{position:absolute;white-space:nowrap;font-size:11.5px;font-weight:700;color:#fff;background:#3b4a63;border-radius:6px;padding:3px 9px;letter-spacing:.02em}
.maptitle{position:absolute;font-size:34px;font-weight:800;letter-spacing:-.015em;line-height:1.1}
.mapintro{position:absolute;color:var(--ink2);font-size:15.5px;line-height:1.45;max-width:780px}
.label{position:absolute;white-space:nowrap;color:var(--muted);font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
.modebar{position:absolute;white-space:nowrap;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 12px;font-size:13.5px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.modebar .hint-sbs{color:var(--muted);margin-left:4px}
.emptyslot{position:absolute;border:2px dashed #d3cfc4;border-radius:12px;padding:16px 14px;color:var(--muted);font-size:13.5px;background:rgba(255,255,255,.35)}

/* journeys: lanes as columns, a header card per journey, numbered steps with lane colours */
.lanehead{position:absolute;font-weight:700;font-size:15px;color:var(--ink);padding-left:2px}
.lanehead i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:1px}
.lanehead small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.3;margin-top:2px}
.lanebg{position:absolute;z-index:0;background:rgba(255,255,255,.5);border-radius:16px;border:1px dashed #dcd8ce;
  box-shadow:inset 0 3px 0 color-mix(in srgb,var(--lane) 55%,transparent)}
.jhead,.timeline-title{background:#fffdf7;border-color:#e6dfc9}
.jhead h3,.timeline-title h3{font-size:17px;display:flex;align-items:flex-start;gap:8px}
.jhead p,.timeline-title p{font-size:13.5px}
.jhead .creates,.timeline-title .creates{margin-top:10px;padding:8px 10px;background:#f7f3e6;border-radius:9px;font-size:12.5px}
.creates b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#6b5a26;margin-bottom:3px}
.creates ul{margin:0;padding-left:17px;color:var(--ink2)}
.creates.changes{background:#f3f7f6}
.creates.changes p{display:flex;gap:5px;flex-wrap:wrap}
.jhead .n,.timeline-title .n,.step .n{display:inline-grid;place-items:center;flex:0 0 auto;min-width:24px;height:24px;border-radius:12px;
  background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:0 6px}
.step{display:flex;flex-direction:column;border-left:5px solid var(--lane,#999)}
.step .row1{display:flex;align-items:flex-start;gap:8px}
.step .n{background:var(--lane,#1d1d1f)}
.step .t{font-size:14px;color:var(--ink);-webkit-line-clamp:3}
.customer-step{border-top:5px solid var(--lane,#5b78b9)}
.customer-step h4{font-weight:600;font-size:14.5px}
.steplabel{position:absolute;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.steplabel i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.links .customer-flow{stroke:#9aa6c2;stroke-width:2.2}

/* chain: a purple first stage, yellow stages after, items in a calm grid */
.box.stage{background:var(--yellow);border:0;color:var(--yellow-ink);display:flex;flex-direction:column;justify-content:center;
  padding:16px 20px;box-shadow:0 2px 0 var(--yellow-edge),0 8px 22px rgba(120,90,10,.16);border-radius:14px}
.box.stage h3{font-size:22px;font-weight:700;margin:0}
.box.stage p{color:#4b3c06;font-size:13.5px;margin-top:3px}
.box.stage.first-stage{background:var(--purple);color:var(--purple-ink);box-shadow:0 2px 0 #5737bd,0 8px 22px rgba(70,40,170,.25)}
.box.stage.first-stage p{color:#ece6ff}
.stagenum{position:absolute;right:14px;top:10px;font-size:12px;font-weight:800;opacity:.55}
.item h4{font-size:15px}
.tree-node{background:#fff}
.tree-node.l0{background:var(--ink);color:#fff;border-color:var(--ink)}
.tree-node.l0 p{color:#ddd}
.tree-node.l1{border-top:5px solid var(--purple)}
.tree-node.l2{border-top:5px solid var(--yellow-edge)}
.tree-node.l3{border-top:5px solid var(--new)}
.jindex{cursor:default;background:#fbfaf6}

/* tags */
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;color:#fff;white-space:nowrap;letter-spacing:.01em}
.pill.works{background:var(--works)} .pill.partial{background:var(--partial)}
.pill.missing{background:var(--missing)} .pill.planned{background:var(--planned)}
.chip{display:inline-block;font-size:11.5px;border-radius:6px;padding:2px 7px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip.since{background:#e9eefb;color:#203f8f;font-weight:700}
.chip.stale{background:#f4e1df;color:#7d1d16}
.chip.moment{background:#ece4fb;color:#4b2a8a;font-weight:700}
.chip.pain{background:#fde6e3;color:#8a1f16}
.feel{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.feel.good{background:#2f9e6a}.feel.ok{background:#d9a21e}.feel.bad{background:#d1543f}
.techname{display:block;margin-top:6px;font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#3b4a63;
  background:#eef1f7;border-radius:6px;padding:3px 7px;white-space:normal}
/* the compact note count: a little stack of the speakers' paper colours */
.notebadge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 8px 2px 5px;
  background:#2b2a27;color:#fff;white-space:nowrap}
.notebadge.must{background:var(--must)}
.notebadge .stack{display:inline-flex}
.notebadge .stack i{display:block;width:11px;height:11px;border:1.5px solid;border-radius:2px;margin-left:-4px;transform:rotate(-6deg);box-shadow:1px 1px 0 rgba(0,0,0,.25)}
.notebadge .stack i:first-child{margin-left:0}
.notebadge .stack i:nth-child(2){transform:rotate(5deg)}

/* ---------- plan changes ---------- */
.ribbon,.ribbon-today{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  border-radius:6px;padding:2px 7px;white-space:nowrap;color:#fff}
.ribbon.new{background:var(--new)} .ribbon.changed{background:var(--changed)} .ribbon.gone{background:var(--gone)}
.box > .ribbon,.box > .ribbon-today{position:relative;margin:-1px 0 7px;vertical-align:top;align-self:flex-start;width:max-content}
.box.stage > .ribbon{display:none}
.ribbon-today{display:none}
.ribbon-today.changed{background:var(--changed)} .ribbon-today.gone{background:var(--gone)}
.box.chg-new{border:2px dashed var(--new);background:var(--new-soft)}
.box.chg-changed{border:2px solid var(--changed);box-shadow:0 0 0 4px var(--changed-soft),0 4px 14px rgba(40,35,20,.06)}
.box.chg-gone{background:var(--gone-soft);border:1.5px dashed #bdb9af;box-shadow:none}
.box.chg-gone .vwrap,.box.chg-gone h4,.box.chg-gone .row1 .t{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.45);color:var(--muted)}
.box.chg-gone .meta,.box.chg-gone p{opacity:.6}
.box.chg-same{opacity:.92}
.vwrap{display:grid}
.vwrap > div{grid-area:1/1;min-width:0}
.v-before{visibility:hidden}
.ghostlabel{display:none}
.chg-legend{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}

/* side by side: today on the left, the plan on the right, rows aligned */
body.sbs #viewport2{display:block;border-left:2px solid #c9c4b8}
body.sbs .panelabel{display:block;position:absolute;left:12px;top:60px;z-index:5;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.06)}
body.sbs #viewport .panelabel{border-color:#c9c4b8}
body.sbs #viewport2 .panelabel{border-color:var(--new);color:var(--new)}
.pane-today .box > .ribbon{display:none}
.pane-today .box > .ribbon-today{display:inline-block}
.pane-today .chg-new > .ribbon{display:inline-block}
.pane-today .chg-changed .v-now{visibility:hidden}
.pane-today .chg-changed .v-before{visibility:visible}
.pane-today .box.chg-changed{box-shadow:none;border:1.5px solid var(--changed)}
.pane-today .box.chg-gone{background:var(--panel);border:1px solid var(--line)}
.pane-today .box.chg-gone .vwrap,.pane-today .box.chg-gone h4,.pane-today .box.chg-gone .row1 .t{text-decoration:none;color:inherit}
.pane-today .box.chg-gone .meta,.pane-today .box.chg-gone p{opacity:1}
.pane-today .box.chg-new,.pane-planned .box.chg-gone{background:transparent;border:2px dashed #d0ccc1;box-shadow:none}
.pane-today .box.chg-new > :not(.ghostlabel),.pane-planned .box.chg-gone > :not(.ghostlabel){visibility:hidden}
.pane-today .box.chg-new .ghostlabel,.pane-planned .box.chg-gone .ghostlabel{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;font-weight:600}
#pairline{position:fixed;z-index:27;height:0;border-top:2px dashed rgba(47,91,211,.55);transform-origin:0 0;pointer-events:none;display:none}

/* ---------- sticky notes ---------- */
.notecard{position:absolute;z-index:2;cursor:pointer;overflow:hidden;transition:opacity .15s,transform .15s,box-shadow .15s;
  border-radius:3px 3px 14px 3px;border:1px solid rgba(70,55,20,.12);border-left:6px solid var(--info);padding:13px 14px 12px 13px;
  box-shadow:0 2px 2px rgba(0,0,0,.05),2px 8px 14px rgba(0,0,0,.12);transform:rotate(var(--note-tilt,0deg))}
.notecard.must{border-left-color:var(--must)} .notecard.should{border-left-color:var(--should)}
.notecard::before{content:"";position:absolute;top:-4px;left:calc(50% - 22px);width:44px;height:12px;
  background:rgba(255,255,255,.6);transform:rotate(-3deg);border:1px solid rgba(255,255,255,.7)}
.notecard::after{content:"";position:absolute;right:0;bottom:0;width:13px;height:13px;
  background:linear-gradient(135deg,transparent 48%,rgba(0,0,0,.1) 50%,rgba(255,255,255,.75));border-radius:0 0 12px 0}
.notecard:hover,.notecard:focus-visible{transform:none;box-shadow:2px 12px 20px rgba(0,0,0,.18)}
.notehead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.notecard .who{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink2);min-width:0;
  background:rgba(255,255,255,.7);border-radius:999px;padding:1px 8px 1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notecard .who i{flex:0 0 auto}
.notecard .urg{white-space:nowrap;flex:0 0 auto}
.notecard .who i{width:9px;height:9px;border-radius:50%}
.notecard .urg{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.notecard.must .urg{color:var(--must)} .notecard.should .urg{color:var(--should)} .notecard.info .urg{color:var(--info)}
.notecard h5{margin:8px 0 5px;font-size:15px;line-height:1.3}
.notecard .q{font-size:13px;font-weight:600;color:#2b2a26;line-height:1.42;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.morenotes{position:absolute;z-index:2;border:1.5px dashed #b9b5aa;background:rgba(255,255,255,.75);border-radius:9px;
  padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
#role-strip{position:fixed;top:62px;z-index:29;display:flex;align-items:center;gap:7px;width:max-content;
  max-width:calc(100vw - 24px);overflow-x:auto;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:12px;padding:6px 9px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
#role-strip[hidden]{display:none}
#role-strip button{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;background:#faf9f5;padding:4px 9px}
#role-strip button[aria-pressed="true"]{background:#eef0ff;border-color:#b8b4dc}
#role-strip button[aria-pressed="false"]{color:var(--muted);opacity:.7}
.paper-swatch{width:14px;height:14px;border:1px solid;box-shadow:1px 2px 2px rgba(0,0,0,.12);transform:rotate(-5deg)}
.role-caption{font-size:12px;color:var(--muted);white-space:nowrap}
body.sbs #role-strip{top:96px}

/* far zoom: keep the main words readable, drop the small print */
body.z-far .box .meta > :not(.notebadge):not(.pill),body.z-far .box p,body.z-far .creates,body.z-far .notecard .q,body.z-far .notecard .notehead{display:none}
body.z-far .box .t,body.z-far .box h3,body.z-far .box h4,body.z-far .notecard h5{font-size:calc(14px * var(--inv));line-height:1.15}
body.z-far .box .t{-webkit-line-clamp:2}
body.z-far .box .meta .notebadge,body.z-far .box .meta .pill{font-size:calc(11.5px * var(--inv))}
body.z-far .techname{font-size:calc(12px * var(--inv))}
body.z-far .box > .ribbon{font-size:calc(11px * var(--inv))}

.term{border-bottom:1px dotted currentColor;cursor:help}
#gloss{position:fixed;z-index:60;max-width:300px;background:#1d1d1b;color:#fff;border-radius:8px;padding:8px 10px;
  font-size:13px;display:none;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#gloss b{display:block;margin-bottom:2px}

/* ---------- one quiet top bar ---------- */
#top{position:fixed;left:0;right:0;top:0;height:52px;z-index:30;display:flex;align-items:center;gap:8px;
  padding:0 12px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);white-space:nowrap}
#top .title{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
#top > button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;min-height:34px}
#top > button:hover{background:var(--soft)}
#top .primary{background:#fff6dc;border-color:#e9cf86;font-weight:600}
#top .count{display:inline-block;min-width:1.6em;padding:0 6px;margin-left:6px;border-radius:9px;background:rgba(0,0,0,.08);font-size:12px;text-align:center}
.save-primary,#top .save-primary{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:9px;padding:7px 12px;font-weight:600}
#top .save-primary:hover{background:#2448a8}
.short-label{display:none}
/* the view switch: words on a segmented control */
.seg{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:#f6f5f1;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.seg button:hover{background:#fff}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[data-mode="changes"][aria-pressed="true"]{color:var(--new)}
.seg .sbs{margin-left:6px;border-left:1px solid var(--line);border-radius:0 7px 7px 0;padding-left:12px}
.seg .sbs[aria-pressed="true"]{color:var(--new)}
#top .seg{flex:0 0 auto}
#menu{position:fixed;z-index:45;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);display:none;min-width:270px;max-height:calc(100vh - 70px);overflow-y:auto}
#menu.open{display:block}
#menu button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px}
#menu button:hover{background:var(--soft)}
#menu .state{color:var(--muted);font-size:12.5px}
#menu [role=menuitemcheckbox][aria-checked="true"] .state{color:var(--accent);font-weight:700}

/* ---------- left story list ---------- */
#story{position:fixed;left:0;top:52px;bottom:0;width:320px;z-index:25;background:#fbfaf7;border-right:1px solid var(--line);
  overflow:auto;padding:14px 14px 30px}
body.nostory #story{display:none}
#storytab{position:fixed;left:10px;top:62px;z-index:26;display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px}
body.nostory #storytab{display:block}
#story .q{font-size:15px;font-weight:650;line-height:1.35;margin:2px 0 12px}
#story .walkbtn{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px;font-weight:650;font-size:14.5px;margin:4px 0}
#story .walkbtn:hover{background:#2a50bb}
#story .walkbtn.alt{background:#fff;color:var(--new);border:1.5px solid var(--new)}
#story .walkbtn.alt:hover{background:var(--new-soft)}
#story .hide{border:0;background:none;color:var(--muted);font-size:12.5px;padding:4px 0;float:right}

/* ---------- zoom, walk-through, hint ---------- */
#zoom{position:fixed;right:14px;bottom:14px;z-index:28;display:flex;flex-direction:column;gap:6px}
#zoom button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;min-width:132px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#zoom button:hover{background:var(--soft)}
#walk{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:32;width:min(580px,calc(100vw - 40px));
  background:#1d1d1b;color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.28);display:none}
body:not(.nostory) #walk{left:calc(50% + 160px)}
body.panel-open #walk{left:270px;transform:none;width:min(560px,calc(100vw - 270px - clamp(320px,30vw,460px) - 190px))}
body.panel-open.nostory #walk{left:20px;width:min(560px,calc(100vw - 20px - clamp(320px,30vw,460px) - 190px))}
#walk.open{display:block}
#walk .step{font-size:12px;color:#c9c6bd;letter-spacing:.04em;text-transform:uppercase}
#walk h3{margin:5px 0 5px;font-size:17px;display:flex;align-items:center;gap:8px}
#walk p{margin:0 0 10px;color:#e8e6df}
#walk .row{display:flex;gap:8px;align-items:center}
#walk button{white-space:nowrap;border:1px solid #55534d;background:#2c2b28;color:#fff;border-radius:8px;padding:7px 14px}
#walk button.next{background:#fff;color:#1d1d1b;border-color:#fff;font-weight:650}
#walk .grow{flex:1}
#hint{position:fixed;left:340px;bottom:18px;z-index:31;max-width:440px;background:#fff8e1;border:1px solid #ecd48e;border-radius:12px;
  padding:11px 13px;box-shadow:0 6px 18px rgba(0,0,0,.1);display:none}
body.nostory #hint{left:110px}
#hint.open{display:block}
#hint button{margin-top:7px;border:1px solid #d9bf73;background:#fff;border-radius:7px;padding:4px 11px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d1d1b;color:#fff;border-radius:9px;
  padding:8px 14px;z-index:70;display:none}

/* ---------- detail panel ---------- */
#panel{position:fixed;top:62px;right:10px;bottom:10px;width:min(460px,calc(100vw - 20px));z-index:35;background:#fff;
  border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.15);display:none;flex-direction:column}
#panel.open,body.panel-open #panel{display:flex}
#panel header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#panel header h2{margin:0;font-size:17px;flex:1}
#panel header button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:32px;min-height:32px;padding:4px 10px}
#panel .body{overflow:auto;padding:12px 14px 20px}
#panel h3{font-size:14px;margin:16px 0 6px}
#panel h3:first-child{margin-top:0}
#panel p{margin:4px 0}
.card{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:8px 0;background:#fff}
.card.must{border-left:5px solid var(--must)} .card.should{border-left:5px solid var(--should)} .card.info{border-left:5px solid var(--info)}
.quote{border-left:3px solid #c9c4b6;padding:2px 0 2px 10px;margin:6px 0;color:var(--ink2);font-style:italic}
.quote .src{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.quote.voice{border-left-color:#d99a1e}
.answer{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.answer button,.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;min-height:28px}
.answer button[aria-pressed="true"]{background:var(--accent-soft);border-color:#9fb4ee;font-weight:600}
.dots{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.dots .n{min-width:1.5em;text-align:center;font-weight:700}
textarea,input[type=text],input[type=date],select.field{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:4px;background:#fff}
textarea{min-height:56px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
.tally{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);margin:6px 0 2px}
.tally i{display:block;height:100%}
.tally .a{background:#2f9e6a}.tally .c{background:#d1543f}.tally .u{background:#c9c4b6}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--soft)}
.badge.split{background:#fde6e3;color:#8a1f16}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:8px;height:8px;border-radius:50%;background:#dcd8cf}
.meter i.on{background:var(--ink2)}
.rolerow{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft)}
.rolerow input{margin-top:4px;width:18px;height:18px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend span{margin-right:8px;white-space:nowrap}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.switch input{width:18px;height:18px}
.word-meanings dt{font-weight:700;margin-top:16px}
.word-meanings dd{margin:4px 0 0}
.connection-description{border-left:3px solid var(--purple);padding-left:8px}
.connection-description.evidence{border-color:#4675ba}
.connection-description.feedback{border-color:#c54d46}
.review-next{border:1px solid var(--line);background:#f3f6fd;border-radius:10px;padding:12px;margin-bottom:16px}
.answer-label{display:block;font-weight:600;margin-top:10px}
.review-answer{white-space:pre-wrap;border-left:3px solid var(--accent);padding-left:8px}
.review-nav{display:flex;gap:8px;justify-content:space-between;margin:20px 0 12px}
.review-nav button{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.support{margin:14px 0}
.support summary{cursor:pointer;color:var(--accent);font-weight:600}
.decision-question{font-size:19px;font-weight:650;line-height:1.35}
.recommendation{background:#f3f6fd;border-left:3px solid var(--accent);padding:10px 12px;margin:12px 0;border-radius:0 8px 8px 0}
.recommendation p{margin:4px 0 0}
/* before and after, in the panel */
.change{border-radius:11px;padding:10px 12px;margin:0 0 12px}
.change.new{background:var(--new-soft);border:1.5px dashed var(--new)}
.change.gone{background:var(--gone-soft);border:1.5px dashed #bdb9af}
.change.changed{background:var(--changed-soft);border:1.5px solid #ecc97a}
.change p{margin:6px 0 0}
.ba{margin-top:10px;display:grid;gap:6px}
.ba-row{display:grid;grid-template-columns:78px 1fr 1fr;gap:6px;align-items:start}
.ba-row.head .ba-cell{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:none;padding:0 2px;color:var(--muted)}
.ba-row.head .ba-cell.after{color:var(--new)}
.ba-label{font-size:12px;color:var(--muted);font-weight:600;padding-top:6px}
.ba-cell{background:#fff;border-radius:8px;padding:6px 8px;font-size:13px;line-height:1.4}
.ba-cell.before{border:1px solid #e3ddcf}
.ba-cell.after{border:1px solid #9fd6d0}
.ba del{background:#fbe0dc;color:#7d1d16;text-decoration:line-through;border-radius:3px;padding:0 1px}
.ba ins{background:#d8f2ee;color:#0b5a55;text-decoration:none;font-weight:600;border-radius:3px;padding:0 1px}

/* ---------- layout with the side lists open ---------- */
body.panel-open #panel{width:clamp(320px,30vw,460px)}
body.panel-open #story{width:250px}
body.panel-open #zoom{right:calc(clamp(320px,30vw,460px) + 24px)}
@media(max-width:1100px){
  body.panel-open #story{display:none}
  body.panel-open #storytab{display:block}
  #top .seg.in-top{display:none}
}
@media(min-width:721px) and (max-width:1100px){body.panel-open.show-navigation #story{display:block}}
@media(max-width:720px){
  #top{gap:5px;padding:6px}
  #top .title,#top .wide-label{display:none}
  #top .short-label{display:inline}
  #top > button{padding:6px 8px;font-size:13px}
  #top .count{margin-left:4px}
  #hint{left:10px;right:10px;max-width:none}
  body.panel-open #panel{width:calc(100vw - 20px);top:auto;height:48vh}
  body.panel-open #zoom{display:none}
}

/* ---------- print ---------- */
#paper-review{display:none}
@media print{
  #top,#panel,#toast,#gloss,#zoom,#story,#storytab,#walk,#hint,#role-strip,#menu{display:none !important}
  html,body{overflow:visible;height:auto;background:#fff}
  #viewport{position:static;background:none !important}
  #world{position:relative}
  .box,.notecard{box-shadow:none;break-inside:avoid}
  body.print-review{height:auto;overflow:visible;background:#fff}
  body.print-review > *{display:none!important}
  body.print-review #paper-review{display:block!important;padding:16px}
  #paper-review article{break-inside:avoid;margin:24px 0}
  #paper-review h2{font-size:17px}
  .paper-space{height:90px;border-bottom:1px solid #ccc}
}

06-27","ref":"material/programme-and-suppliers.md"},{"id":"S8","title":"Survey of south-side shops","kind":"survey","date":"2026-06-25","ref":"material/shops-survey.md"}],"evidence":[{"id":"E1","source":"S1","kind":"data","text":"Corrosion at 6 of 14 lower joints; two show section loss over 20%.","where":"Findings"},{"id":"E2","source":"S1","kind":"quote","text":"With repairs, another 25 years is realistic. Without them, we would recommend a weight limit within three years.","where":"Inspector's summary"},{"id":"E3","source":"S1","kind":"observation","text":"Bearings at the north end have seized; the bridge cannot expand freely in summer.","where":"Findings"},{"id":"E4","source":"S2","kind":"data","text":"Repair £1.1m, 10 weeks closed, 25 years. Replace £3.4m, 9 months closed, 100 years. Wider replacement £4.2m, 11 months, 100 years.","where":"Options table"},{"id":"E5","source":"S2","kind":"data","text":"A regional cycling fund could pay up to 40% of a widened bridge, if bid by November.","where":"Notes"},{"id":"E6","source":"S2","kind":"data","text":"The river authority needs 6 months' notice for any work in the water.","where":"Notes"},{"id":"E7","source":"S3","kind":"quote","voice":true,"text":"It's the only step-free way to the school. A long closure means a 20-minute walk round by the main road.","where":"Parent with a pram"},{"id":"E8","source":"S3","kind":"quote","voice":true,"text":"It's too narrow to pass anyone. If you're rebuilding, make it wider.","where":"Regular cyclist"},{"id":"E9","source":"S3","kind":"quote","voice":true,"text":"Last time it shut for a month, my takings dropped by a third.","where":"Shop owner, south side"},{"id":"E10","source":"S3","kind":"quote","voice":true,"text":"The ramps at the north end are too steep for me on my own.","where":"Wheelchair user"},{"id":"E11","source":"S2","kind":"data","text":"Estimates are ±30% at this stage.","where":"Notes"},{"id":"E12","source":"S4","kind":"data","text":"Average 1,900 crossings a day on est.","where":"Constraints"},{"id":"E26","source":"S8","kind":"data","text":"Five of eight shops said takings fell by a quarter or more during the last four-week closure.","where":"Survey"},{"id":"E27","source":"S8","kind":"data","text":"What would help shops most: clear signs (7 of 8), works in summer (6), a rates holiday (5), a shuttle stop (4).","where":"Survey"},{"id":"E28","source":"S3","kind":"observation","text":"Several people asked whether the old bridge could stay open while a new one is built.","where":"Comment cards"}],"maps":[{"id":"m-chain","template":"decision-chain","title":"From inspection to a working bridge","intro":"Each stage is one step from what the inspection found to a bridge people can use, and whether it worked.","stages":[{"id":"c-source","label":"Source","verb":"backs up","sub":"Where it was found or said","items":[{"id":"ci1","title":"Principal inspection","text":"Every joint, bearing and board checked.","status":"works","when":"both","detail":"Principal inspection to the national code; tactile and close visual, with ultrasonic thickness readings at joints.","evidence":["E1","E3"]},{"id":"ci2","title":"Public drop-in","text":"About 60 people, comment cards.","status":"works","when":"both","evidence":["E7","E8"]},{"id":"ci2b","title":"Crossing counts and access audit","text":"Two weeks of counts; ramps measured.","status":"works","when":"both","evidence":["E12","E20"]}]},{"id":"c-evidence","label":"Evidence","verb":"informs","sub":"The findings we rely on","items":[{"id":"ci3","title":"Rust at two joints is serious","text":"Over 20% of the steel lost.","status":"works","when":"both","evidence":["E1"]},{"id":"ci4","title":"Closures hurt the school run and shops","text":"20-minute detour; takings down by a quarter or more last time.","status":"works","when":"both","evidence":["E7","E26"]},{"id":"ci4b","title":"The bridge is busy and mixed","text":"1,900 crossings a day, a fifth by cycle, 40 by wheelchair or scooter.","status":"works","when":"both","evidence":["E12","E14","E15"]},{"id":"ci4c","title":"The north ramp fails the standard","text":"1 in 10 with no landing.","status":"works","when":"both","evidence":["E20"]}]},{"id":"c-decision","label":"Decision","verb":"shapes","sub":"What we choose, and why","items":[{"id":"ci5","title":"Repair now, plan a wider bridge later","text":"One option on the table.","status":"planned","when":"planned","evidence":["E2","E4"]},{"id":"ci6","title":"Replace with a wider bridge now","text":"The other option on the table.","status":"planned","when":"planned","evidence":["E5","E8"]},{"id":"ci6b","title":"Bearings freed now, whatever we choose","text":"Decided as urgent works in August.","status":"works","when":"both","evidence":["E3"]}]},{"id":"c-intent","label":"Intent","verb":"spells out","sub":"The result we want","items":[{"id":"ci7","title":"A safe, step-free crossing for decades","text":"With the shortest possible closure, and a way across while it is shut.","status":"planned","when":"planned","evidence":["E7","E28"]}]},{"id":"c-spec","label":"Spec","verb":"plans","sub":"What the bridge must do","items":[{"id":"ci8","title":"Ramps anyone can use alone","text":"1 in 15 at the north end, with rest landings and handrails both sides.","status":"missing","when":"planned","evidence":["E10","E20","E22"]},{"id":"ci9","title":"Room to pass","text":"4 m wide if replaced.","status":"planned","when":"planned","evidence":["E8","E13"]},{"id":"ci9b","title":"Lit and safe at night","text":"All approach lamps working; new lighting on any new bridge.","status":"partial","when":"planned","evidence":["E21"]}]},{"id":"c-plan","label":"Plan","verb":"produces","sub":"The work, in order","items":[{"id":"ci10","title":"Give the river authority notice","text":"Six months before any work in the water.","status":"missing","when":"planned","evidence":["E6"]},{"id":"ci10b","title":"Order steel early","text":"20 to 24 weeks for a new bridge.","status":"missing","when":"planned","evidence":["E23"]},{"id":"ci10c","title":"Bid to the cycling fund","text":"By 28 November, if the wider option is chosen.","status":"missing","when":"planned","evidence":["E5","E24"]}]},{"id":"c-work","label":"Work","verb":"creates","sub":"What was done","items":[{"id":"ci11","title":"Inspection and early costs","text":"Done. Nothing built yet.","status":"works","when":"today","evidence":["E4"]},{"id":"ci11b","title":"Broken approach lamps","text":"Reported; not yet fixed.","status":"partial","when":"today","evidence":["E21"]},{"id":"ci11p","title":"Works built and signed off","text":"Bearings freed, joints repaired or the new span in place, inspected before opening.","status":"planned","when":"planned","replaces":"ci11","evidence":["E4"]},{"id":"ci11bp","title":"Approach lamps working","text":"Broken lamps replaced before any closure, so the detour is lit.","status":"planned","when":"planned","replaces":"ci11b","evidence":["E21"]},{"id":"ci11c","title":"Barrier at the north ramp","text":"The steepest part has been fenced off since the spring inspection.","status":"partial","when":"today","evidence":["E20"]}]},{"id":"c-outcome","label":"Outcome","verb":"","sub":"Did it work?","items":[{"id":"ci12","title":"Measures to agree","text":"Crossings per day, days closed, complaints, upkeep cost.","status":"missing","when":"both","evidence":["E12"]}]}]},{"id":"m-works","template":"system-journeys","title":"The works, option by option","intro":"Each option from committee to reopening, across the people and bodies involved. Compare how long each takes and what it waits on.","lanes":[{"id":"people","label":"Residents","sub":"Who it affects"},{"id":"council","label":"Council","sub":"Committee and officers"},{"id":"design","label":"Design team","sub":"Engineers and access"},{"id":"builder","label":"Contractor","sub":"On site"},{"id":"permits","label":"River and permits","sub":"Notices and approvals"},{"id":"funders","label":"Funders","sub":"Cycling fund"}],"journeys":[{"id":"j-repair","title":"Option A: repair","summary":"Fix joints, bearings and deck; about 10 weeks closed; 25 more years.","creates":["A repair contract","New joints, bearings and deck boards","A new north ramp, if added"],"steps":[{"id":"ra1","lane":"council","text":"Committee chooses repair on 15 September","status":"planned","detail":"Report with whole-life cost over 50 years.","evidence":["E24","E4"]},{"id":"ra2","lane":"design","text":"Repair design and steel schedule","status":"planned","detail":"Replace plates at 6 joints; new elastomeric bearings north end.","evidence":["E1","E3"]},{"id":"ra3","lane":"design","text":"Decide whether the repair includes a new north ramp","status":"missing","detail":"Ramp must turn back on itself to reach 1 in 15.","moment":true,"evidence":["E20","E22"]},{"id":"ra4","lane":"permits","text":"River notice given (6 months)","status":"planned","detail":"Scaffold under the deck counts as work in the water.","evidence":["E6"]},{"id":"ra5","lane":"builder","text":"Order repair steel and bearings (8 weeks)","status":"planned","evidence":["E23"]},{"id":"ra6","lane":"people","text":"Bridge closes for about 10 weeks","status":"planned","detail":"Best in the school summer holidays, when counts are 45% lower.","feeling":"bad","moment":true,"evidence":["E16","E7"]},{"id":"ra7","lane":"builder","text":"Joints, bearings and deck boards replaced","status":"planned","detail":"Grit-blast and repaint the truss while scaffolded.","evidence":["E1"]},{"id":"ra8","lane":"people","text":"Bridge reopens; a weight limit is not needed","status":"planned","feeling":"good","evidence":["E2"]},{"id":"ra9","lane":"council","text":"A wider bridge stays on the list for later","status":"planned","detail":"Repair life of 25 years means the question comes back around 2050.","evidence":["E2"]}]},{"id":"j-replace","title":"Option B: replace at today's width","summary":"A new steel bridge, 2.2 m wide; about 9 months closed; 100 years.","creates":["A design-and-build contract","A new bridge and ramps","The old bridge removed"],"steps":[{"id":"rb1","lane":"council","text":"Committee chooses replace on 15 September","status":"planned","evidence":["E24"]},{"id":"rb2","lane":"design","text":"Outline design and ramps to the standard","status":"planned","detail":"New ramps at both ends designed to 1 in 15.","evidence":["E20"]},{"id":"rb3","lane":"council","text":"Hire a contractor from the framework","status":"planned","detail":"One of three firms has rebuilt two similar footbridges."},{"id":"rb4","lane":"permits","text":"River notice given (6 months)","status":"planned","evidence":["E6"]},{"id":"rb5","lane":"builder","text":"Order fabricated steel (20 to 24 weeks)","status":"planned","moment":true,"evidence":["E23"]},{"id":"rb6","lane":"people","text":"Bridge closes for about 9 months","status":"planned","detail":"Must avoid the two weeks before Christmas for the final lift.","feeling":"bad","moment":true,"evidence":["E7","E25"]},{"id":"rb7","lane":"people","text":"People cross by shuttle, detour or temporary bridge","status":"missing","detail":"No way across agreed yet.","pain":"20-minute detour on a 1.4 m footway.","evidence":["E17","E18","E19"]},{"id":"rb8","lane":"builder","text":"Old bridge lifted out, new one lifted in","status":"planned","detail":"One weekend road closure for the crane."},{"id":"rb9","lane":"people","text":"New bridge opens","status":"planned","feeling":"good"}]},{"id":"j-wider","title":"Option C: replace wider, with a fund bid","summary":"A 4 m shared-use bridge; about 11 months closed; up to 40% paid by the fund.","creates":["A fund bid","A design-and-build contract","A 4 m bridge for walking and cycling"],"steps":[{"id":"rc1","lane":"council","text":"Committee chooses the wider option, subject to the bid","status":"planned","detail":"Decision on 15 September; bid by 28 November.","evidence":["E24"]},{"id":"rc2","lane":"funders","text":"Bid to the cycling fund","status":"missing","detail":"Uses counts showing 22% cycles and peak conflicts.","moment":true,"evidence":["E5","E14","E13"]},{"id":"rc3","lane":"design","text":"Design a 4 m deck and ramps to the standard","status":"planned","evidence":["E8","E20"]},{"id":"rc4","lane":"funders","text":"Fund decides in March","status":"planned","detail":"If refused, the council pays the full £4.2m or falls back.","pain":"Five months of waiting before steel can be ordered.","evidence":["E24","E4"]},{"id":"rc5","lane":"permits","text":"River notice given (6 months)","status":"planned","evidence":["E6"]},{"id":"rc6","lane":"builder","text":"Order fabricated steel","status":"planned","detail":"Wider deck may need the longer end of 20 to 24 weeks.","evidence":["E23"]},{"id":"rc7","lane":"people","text":"Bridge closes for about 11 months","status":"planned","feeling":"bad","evidence":["E7","E26"]},{"id":"rc8","lane":"people","text":"Cycles and prams can pass on the new bridge","status":"planned","feeling":"good","evidence":["E8","E13"]}]},{"id":"j-urgent","title":"Urgent works: free the seized bearings","summary":"Decided already: done in August whatever option is chosen.","creates":["An urgent works order","Freed north bearings"],"steps":[{"id":"ub1","lane":"design","text":"Engineer flags the seized bearings","status":"works","detail":"Bridge cannot expand in summer; stress builds at the north end.","evidence":["E3"]},{"id":"ub2","lane":"council","text":"Head of highways approves urgent works","status":"works"},{"id":"ub3","lane":"permits","text":"Works kept above the river, so no 6-month notice","status":"works","detail":"Access from the deck and north bank only.","evidence":["E6"]},{"id":"ub4","lane":"people","text":"Bridge closes for two nights in August","status":"planned","detail":"Overnight closures, signed in advance.","evidence":["E16"]},{"id":"ub5","lane":"builder","text":"Bearings freed and greased","status":"planned","evidence":["E3"]},{"id":"ub6","lane":"design","text":"Re-check movement in the first hot week","status":"planned"}]}]},{"id":"m-closure","template":"service-blueprint","title":"Closing the bridge for works","intro":"What a resident goes through when the bridge shuts, what the council does in front of them and out of sight, and what supports it.","lanes":[{"id":"person","label":"Resident","sub":"What they do"},{"id":"front","label":"In front of them","sub":"Signs, staff, website"},{"id":"back","label":"Out of sight","sub":"Council and contractor"},{"id":"support","label":"Support","sub":"Permits, suppliers, rules"},{"id":"proof","label":"What they keep","sub":"Letters and notices"}],"journeys":[{"id":"j-before","title":"Before the closure","summary":"Finding out, and planning another way.","creates":["A letter to every home and shop nearby","Detour signs","A way across, if agreed"],"steps":[{"id":"b1","lane":"proof","text":"Letter through the door: dates and the detour","status":"planned","detail":"Letters to homes and shops within 800 m, six weeks before."},{"id":"b1b","lane":"front","text":"Notices at both ends of the bridge and on the website","status":"planned"},{"id":"b2","lane":"person","text":"Works out a new school run","status":"planned","feeling":"bad","moment":true,"evidence":["E7"]},{"id":"b3","lane":"back","text":"Council agrees a temporary crossing or shuttle","status":"missing","detail":"Shuttle £1,450 a week; temporary bridge £380k.","evidence":["E7","E9","E17","E18"]},{"id":"b4","lane":"support","text":"River authority notice and permits","status":"missing","evidence":["E6"]},{"id":"b5","lane":"front","text":"Shops get signs pointing customers the long way round","status":"missing","detail":"Shops' top request.","evidence":["E27"]},{"id":"b6","lane":"back","text":"School told the dates and asked to share them","status":"missing","evidence":["E7"]}]},{"id":"j-during","title":"During the works","summary":"Getting across, and getting news.","creates":["Weekly updates","A shuttle timetable, if chosen"],"steps":[{"id":"w1","lane":"person","text":"Follows the signed detour","status":"planned","detail":"Two crossings of a busy road; footway 1.4 m.","feeling":"bad","evidence":["E19"]},{"id":"w1b","lane":"person","text":"Wheelchair users use the shuttle's one space","status":"missing","detail":"40 wheelchair or scooter crossings a day; one space per trip.","pain":"One space may not be enough at school times.","evidence":["E15","E18"]},{"id":"w2","lane":"front","text":"Signs at both ends show the detour and the end date","status":"planned"},{"id":"w3","lane":"front","text":"Website shows progress each week","status":"missing"},{"id":"w4","lane":"person","text":"Shops on the south side see fewer customers","status":"planned","feeling":"bad","evidence":["E9","E26"]},{"id":"w5","lane":"back","text":"Contractor keeps the end date or warns early","status":"planned","detail":"Weekly progress meeting with the council."},{"id":"w6","lane":"support","text":"Complaints line answered within two days","status":"missing"}]},{"id":"j-after","title":"After reopening","summary":"Back to normal, and checking it worked.","creates":["A reopening notice","Counts after three months"],"steps":[{"id":"a1","lane":"proof","text":"Notice: the bridge is open again","status":"planned"},{"id":"a2","lane":"person","text":"Goes back to the old route","status":"planned","feeling":"good"},{"id":"a3","lane":"back","text":"Counter left in place to compare crossings","status":"planned","detail":"Compare with 1,900 a day before.","evidence":["E12"]},{"id":"a4","lane":"person","text":"Wheelchair user tries the new north ramp alone","status":"missing","detail":"Only if the ramp is rebuilt.","moment":true,"evidence":["E10","E20"]},{"id":"a5","lane":"back","text":"Upkeep plan starts","status":"planned","detail":"£18k a year after repair; £6k to £7k after replacement.","evidence":["E4"]}]}]}],"gaps":[{"id":"G1","title":"A way across during a long closure","why":"A nine-month closure without a crossing cuts off the school's only step-free route.","anchors":["b3","w1","rb7"],"impact":5,"effort":4,"stories":[{"as":"As a parent with a pram, I want a step-free way across while the bridge is shut, so the school run stays under ten minutes.","done_when":["a temporary crossing or shuttle runs at school times","the route is signed and lit","the detour is no more than 10 minutes longer"]},{"as":"As a wheelchair user, I want to be sure of a place on the shuttle, so I am not left behind at school time.","done_when":["a wheelchair space can be booked by text","a second space is added at the two school-time peaks"]},{"as":"As the council lead, I want the cost of each way across side by side, so the committee can choose.","done_when":["shuttle, temporary bridge and detour are compared on cost, time and step-free access","the comparison is in the 15 September report"]}]},{"id":"G2","title":"Ramps people can use on their own","why":"The north ramp is 1 in 10 with no landing; the standard is 1 in 15.","anchors":["ci8","ra3","a4"],"impact":4,"effort":2,"stories":[{"as":"As a wheelchair user, I want ramps I can manage alone, so I do not need help to cross.","done_when":["ramp slopes meet the access standard","a wheelchair user tests the design before it is approved"]},{"as":"As a parent with a pram, I want a rest landing on the way up, so I can stop safely.","done_when":["a level landing at least every 10 m","handrails on both sides"]}]},{"id":"G3","title":"Bid to the cycling fund by November","why":"Up to 40% of a wider bridge could be paid for, but only with a bid by 28 November.","anchors":["ci6","rc2"],"impact":4,"effort":3,"stories":[{"as":"As the council lead, I want the bid submitted by November, so the wider option is affordable.","done_when":["a bid is submitted before the deadline","the bid shows the drop-in feedback"]},{"as":"As finance, I want a fall-back if the bid fails, so we are not stuck in March.","done_when":["the report says what we do if the bid is refused","the fall-back is agreed before the bid goes in"]}]},{"id":"G4","title":"Weekly news during works","why":"People put up with closures better when they can see progress.","anchors":["w3","w5"],"impact":2,"effort":1,"stories":[{"as":"As a resident, I want a weekly update, so I know the end date is real.","done_when":["a photo and a line of news go up every Friday"]},{"as":"As a shop owner, I want to know a week ahead if the end date moves, so I can plan stock and staff.","done_when":["any change to the end date is posted within a day of the contractor knowing","shops get it by text as well"]}]},{"id":"G5","title":"Help for south-side shops","why":"Five of eight shops lost a quarter or more of takings last time.","anchors":["w4","b5"],"impact":3,"effort":2,"stories":[{"as":"As a shop owner, I want signs that send people my way, so customers still find me.","done_when":["signs at both ends name the shops and the walking time","the shuttle stops outside the shops"]},{"as":"As the council lead, I want to know what support we can give, so we can say it in the letter.","done_when":["the report says whether a rates holiday is possible","the letter says what help is on offer"]}]},{"id":"G6","title":"Fix the approach lighting now","why":"Two of six lamps on the north approach do not work, whatever option is chosen.","anchors":["ci9b","ci11b"],"impact":3,"effort":1,"stories":[{"as":"As someone crossing after dark, I want every lamp working, so the approach feels safe.","done_when":["all six lamps work within a month","lamps are checked at each inspection"]}]}],"notes":[{"id":"N1","role":"engineer","anchor":"ci3","title":"Repairs buy 25 years, not 100","body":"Repair is sound engineering, but the bridge will need replacing in the 2050s anyway.","recommend":"Compare options over 50 years, not on build cost alone.","question":"Do we judge the options over 50 years of cost and closures?","urgency":"must","evidence":["E2","E4"]},{"id":"N2","role":"engineer","anchor":"b4","title":"The river notice sets the earliest start","body":"Any option needs six months' notice for work in the water.","recommend":"Send a notice for the larger option now; it can be narrowed later.","question":"Can we give notice before the committee decides?","urgency":"should","evidence":["E6"]},{"id":"N3","role":"security","anchor":"ci5","title":"Seized bearings are a summer risk","body":"A bridge that cannot expand is stressed on hot days.","recommend":"Free or replace the north bearings this year, whatever we decide.","question":"Do we fix the bearings now as urgent work?","urgency":"must","evidence":["E3"]},{"id":"N4","role":"voice","anchor":"b2","title":"The school run is the hardest hit","body":"Families with prams have no other step-free route.","recommend":"Plan the closure around school holidays where possible.","question":"Can the longest part of the works fall in the summer holidays?","urgency":"must","evidence":["E7"]},{"id":"N5","role":"voice","anchor":"w4","title":"Shops felt the last closure","body":"One owner lost a third of takings during a one-month closure.","recommend":"Talk to the south-side shops before setting dates; consider signs that say 'shops open'.","question":"Is there any support we can offer shops during a long closure?","urgency":"should","evidence":["E9"]},{"id":"N6","role":"designer","anchor":"ci8","title":"Fix the ramps in either option","body":"A repair could rebuild the north ramps too.","recommend":"Include gentler ramps in the repair option so the comparison is fair.","question":"Does the repair price include new ramps?","urgency":"should","evidence":["E10"]},{"id":"N7","role":"finance","anchor":"ci6","title":"The fund changes the sums","body":"With 40% from the fund, the wider bridge costs the council about £2.5m.","recommend":"Show the committee both prices: with and without the fund.","question":"Do we commit to the wider option if the bid fails?","urgency":"must","evidence":["E4","E5"]},{"id":"N8","role":"analyst","anchor":"c-decision","title":"The estimates are rough","body":"At ±30%, repair and replace overlap less than they seem, but the ranking could still shift.","recommend":"Show ranges, not single numbers.","question":"Do we wait for firmer prices before deciding?","urgency":"should","evidence":["E11"]},{"id":"N9","role":"owner","anchor":"c-intent","title":"Say what we are aiming for","body":"Residents care about the closure as much as the bridge.","recommend":"State the aim as a safe crossing with the shortest closure we can manage.","question":"Which matters more to the committee: lowest cost or shortest closure?","urgency":"must","evidence":["E7","E9"]},{"id":"N10","role":"agent","anchor":"w3","title":"An assistant can draft the weekly update","body":"Site photos and the contractor's diary hold most of the news.","recommend":"Let an assistant draft the Friday update from the diary; a council officer approves it.","question":"Who approves the weekly update before it goes out?","urgency":"info"},{"id":"N11","role":"designer","anchor":"ci9","title":"Wider means safer, not just nicer","body":"People cannot pass on the current width.","recommend":"Treat 4 m as the access option, not an extra.","question":"Is 4 m enough for the expected number of cycles?","urgency":"info","evidence":["E8"]},{"id":"N12","role":"engineer","anchor":"rb5","title":"Steel lead time decides the closure start","body":"Fabricated steel takes 20 to 24 weeks; nothing can close until it is near delivery.","recommend":"Plan the closure back from the steel delivery date, not forward from the decision.","question":"Can we place a provisional steel order before the fund decision?","urgency":"must","evidence":["E23"]},{"id":"N13","role":"engineer","anchor":"ra3","title":"A new north ramp changes the repair","body":"Reaching 1 in 15 means a longer ramp that turns back on itself.","recommend":"Price the repair with and without a new north ramp.","question":"Do we compare repair-with-ramp against replacement, not bare repair?","urgency":"should","evidence":["E22","E20"]},{"id":"N14","role":"engineer","anchor":"ub   const ev = (b.evidence || []).length;
  if (ev) out.push(`<span class="chip">Evidence: ${ev}</span>`);
  const notes = notesOn(b.id);
  if (notes.length) {
    const colours = [...new Set(notes.map(n => (ROLE[n.role] || {}).color || "#888"))].slice(0, 3);
    out.push(`<span class="notebadge${notes.some(n => n.urgency === "must") ? " must" : ""}"><span class="stack" aria-hidden="true">${colours.map(c => `<i style="background:${tint(c)};border-color:${c}"></i>`).join("")}</span>${plural(notes.length, "note")}</span>`);
  }
  return out.join("");
}
const tech = b => S.tech && b.detail ? `<span class="techname">${esc(b.detail)}</span>` : "";

/* ---------- DOM helpers ---------- */
const world = $("#world"), viewport = $("#viewport");
let nodes = {}, rows = [], svg, K = 0;
function place(cls, x, y, w, html, data, label) {
  const d = document.createElement("div");
  d.className = cls; d.style.left = x + "px"; d.style.top = y + "px";
  if (w) d.style.width = w + "px";
  d.innerHTML = html;
  if (data) { d.tabIndex = 0; d.setAttribute("role", "button"); d.setAttribute("aria-label", label || ""); d._data = data; d.dataset.k = ++K; }
  world.appendChild(d);
  return d;
}
function link(x1, y1, x2, y2, cls, label) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  const my = (y1 + y2) / 2;
  p.setAttribute("d", Math.abs(x1 - x2) < 2 ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
  if (cls) p.setAttribute("class", cls);
  svg.appendChild(p);
  if (label) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", (x1 + x2) / 2 + 16); t.setAttribute("y", my + 5); t.textContent = label;
    t.setAttribute("class", "verb");
    svg.appendChild(t);
  }
  return p;
}
function arrowHead(x, y) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", `M${x - 6},${y - 9} L${x},${y} L${x + 6},${y - 9}`);
  svg.appendChild(p);
}
function tint(hex) {
  const n = parseInt(String(hex).replace("#", ""), 16) || 0x888888;
  const mix = c => Math.round(c * 0.16 + 255 * 0.84);
  return `rgb(${mix(n >> 16 & 255)},${mix(n >> 8 & 255)},${mix(n & 255)})`;
}

/* Notes beside a row (only when "Show all notes on the map" is on): a column to the right of
   every box, sized from the real cards, so a note never sits over any text. */
const NOTE_W = 250, NOTE_GAP = 12, NOTES_W = 2 * NOTE_W + NOTE_GAP;
function notePile(anchors, x, y, max, rowKey) {
  if (!S.notesOnMap) return 0;
  const list = NOTES.filter(n => anchors.includes(n.anchor) && S.roles[n.role] !== false)
    .sort((a, b) => URG_ORDER[a.urgency || "info"] - URG_ORDER[b.urgency || "info"]);
  const shown = list.slice(0, max);
  const colH = [0, 0];
  shown.forEach((n, i) => {
    const c = colH[0] <= colH[1] ? 0 : 1;
    const r = ROLE[n.role] || {label:n.role, color:"#888"};
    const el = place(`notecard ${n.urgency || "info"} inj`, x + c * (NOTE_W + NOTE_GAP), y + colH[c], NOTE_W,
      `<div class="notehead"><span class="who"><i style="background:${r.color}"></i>${esc(r.label)}</span><span class="urg">${URG[n.urgency || "info"]}</span></div>
       <h5>${esc(n.title)}</h5><div class="q">${esc(n.question || n.body || "")}</div>`,
      {type:"note", n}, `${r.label} note: ${n.title}`);
    el.style.background = tint(r.color);
    el.style.setProperty("--note-tilt", [-1.1, 0.8, -0.5, 1][i % 4] + "deg");
    el.style.setProperty("--role", r.color);
    el.dataset.row = rowKey; el.dataset.anchor = n.anchor;
    colH[c] += el.offsetHeight + NOTE_GAP;
  });
  let h = Math.max(colH[0], colH[1]);
  if (list.length > shown.length) {
    const more = place("morenotes inj", x, y + h, NOTES_W, `+ ${plural(list.length - shown.length, "more note")} here`,
      {type:"notes", anchors, title:"Notes here"}, `${list.length - shown.length} more notes`);
    more.dataset.row = rowKey;
    h += more.offsetHeight + NOTE_GAP;
  }
  return h;
}
const notesWidth = () => S.notesOnMap ? NOTES_W + 48 : 0;

function header(m, width) {
  place("stamp", 0, 6, 0, (MODEL.checked && MODEL.checked.date) ? `Checked against the sources on ${esc(MODEL.checked.date)}` : "Not yet checked against sources");
  const t = place("maptitle", 0, 40, Math.max(width, 600), esc(m.title || MODEL.title));
  const q = place("mapintro", 0, 40 + t.offsetHeight + 8, Math.min(Math.max(width, 600), 900), gl(m.intro || ""));
  let y = 40 + t.offsetHeight + 8 + q.offsetHeight;
  const mode = modeOf(m);
  if (mode !== "all") {
    const list = changeList(m);
    const text = mode === "today" ? "<b>Today.</b> What exists now, before any change." :
      mode === "planned" ? "<b>Planned.</b> How it works once the plan is done." :
      `<b>What changes.</b> The plan, with every change marked. ${countsHtml(list)}`;
    const lg = place("modebar", 0, y + 14, 0, `${text}${mode === "changes" ? `<span class="hint-sbs">${sbsOn() ? "Left: today. Right: the plan. Rows line up." : "Faded boxes go away. Open a box to compare before and after."}</span>` : ""}`);
    y += 14 + lg.offsetHeight;
  }
  return y + 40;
}

/* ---------- journeys ---------- */
/* Each lane keeps one colour, so a step's edge says which part of the system it runs in. */
const LANE_COLORS = ["#4f7fd8", "#8a5cd6", "#d99a1e", "#2f9e6a", "#d1543f", "#1f9aa6", "#b5568c", "#7a7a72"];
const laneColor = i => LANE_COLORS[i % LANE_COLORS.length];
const J = {laneW:262, laneGap:20, stepW:238, stepH:86, rowGap:18, headW:330, headGap:44, bandGap:76};
function stepInner(n) {
  return b => `<div class="row1"><span class="n">${n}</span><div class="t">${gl(b.text)}</div></div>${tech(b)}
    <div class="meta">${pill(b.status)}${badges(b)}</div>`;
}
function journeyHead(m, j, ji, slots, mode) {
  const changed = mode === "changes" ? slots.filter(s => s.change && s.change !== "same") : [];
  return `<h3><span class="n">${ji + 1}</span>${gl(j.title)}</h3><p>${gl(j.summary || "")}</p>
    ${(j.creates || []).length ? `<div class="creates"><b>What gets created</b><ul>${j.creates.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
    ${changed.length ? `<div class="creates changes"><b>What changes</b><p>${countsHtml(changed)}</p></div>` : ""}
    ${tech(j)}<div class="meta">${badges(j)}<span class="chip">${plural(slots.length, "step")}</span></div>`;
}
function renderJourneys(m) {
  const lanes = m.lanes || [];
  const mode = modeOf(m);
  const LI = Object.fromEntries(lanes.map((l, i) => [l.id, i]));
  const laneX = i => J.headW + J.headGap + i * (J.laneW + J.laneGap);
  const lanesRight = laneX(lanes.length - 1) + J.laneW;
  const notesX = lanesRight + 56;
  const W = lanesRight + notesWidth();
  let y = header(m, W);
  lanes.forEach((l, i) => {
    const h = place("lanehead", laneX(i), y, J.laneW, `<i style="background:${laneColor(i)}"></i>${esc(l.label)}<small>${esc(l.sub || "")}</small>`);
    h.style.setProperty("--lane", laneColor(i));
  });
  if (S.notesOnMap) place("label", notesX, y + 4, 0, "Notes from each role");
  y += 66;
  const laneTop = y - 78;
  (m.journeys || []).forEach((j, ji) => {
    const y0 = y;
    const slots = arrange(j.steps || [], mode);
    const hd = place("box jhead inj", 0, y0, J.headW, journeyHead(m, j, ji, slots, mode),
      {type:"box", id:j.id}, `Journey ${ji + 1}: ${j.title}`);
    hd.dataset.row = "j" + ji;
    nodes[j.id] = hd;
    let sy = y0, prev = null;
    slots.forEach((slot, k) => {
      const s = slot.box;
      const li = LI[s.lane] || 0;
      const x = laneX(li) + (J.laneW - J.stepW) / 2;
      const el = place(`box step inj${slot.change ? " chg-" + slot.change : ""}`, x, sy, J.stepW,
        slotHtml(slot, stepInner(k + 1)),
        {type:"box", id:s.id}, slotLabel(slot, `Step ${k + 1} of journey ${ji + 1}: ${s.text}`));
      el.style.minHeight = J.stepH + "px";
      el.style.setProperty("--lane", laneColor(li));
      el.dataset.row = "j" + ji;
      nodes[s.id] = el;
      const h = el.offsetHeight;
      if (prev) {
        const p = link(prev.x + J.stepW / 2, prev.y + prev.h, x + J.stepW / 2, sy - 3, "inj flow");
        p.dataset.row = "j" + ji; arrowHead(x + J.stepW / 2, sy - 3);
      }
      prev = {x, y:sy, h};
      sy += h + J.rowGap;
    });
    const nh = notePile([j.id, ...(j.steps || []).map(s => s.id)], notesX, y0, 4, "j" + ji);
    const h = Math.max(hd.offsetHeight, sy - y0, nh);
    rows.push({key:"j" + ji, y:y0, h, x:0, w:W});
    y = y0 + h + J.bandGap;
  });
  lanes.forEach((l, i) => {
    const bg = document.createElement("div"); bg.className = "lanebg";
    Object.assign(bg.style, {left:(laneX(i) - 9) + "px", top:laneTop + "px", width:(J.laneW + 18) + "px", height:(y - laneTop - J.bandGap + 24) + "px"});
    bg.style.setProperty("--lane", laneColor(i));

  return {x:0, y:0, w:W, h:y};

/* A customer's actions run left to right, in the supplied order. */
function renderCustomerJourney(m) {
  const cardW = 252, gap = 62;
  const mode = modeOf(m);
  const all = (m.journeys || []).map(j => arrange(j.steps || [], mode));
  const count = Math.max(1, ...all.map(s => s.length));
  const timelineW = count * (cardW + gap) - gap;
  const notesX = timelineW + 56;
  const W = timelineW + notesWidth();
  const LI = Object.fromEntries((m.lanes || []).map((l, i) => [l.id, i]));
  let y = header(m, W);
  (m.journeys || []).forEach((j, ji) => {
    const start = y;
    const slots = all[ji];
    const hd = place("box timeline-title inj", 0, y, Math.min(640, timelineW),
      journeyHead(m, j, ji, slots, mode), {type:"box", id:j.id}, j.title);
    nodes[j.id] = hd; hd.dataset.row = "j" + ji;
    y += hd.offsetHeight + 52;
    let maxH = 0, prev = null;
    slots.forEach((slot, i) => {
      const step = slot.box;
      const x = i * (cardW + gap);
      const li = LI[step.lane];
      const lane = (m.lanes || [])[li];
      const lb = place("steplabel", x, y - 28, cardW, `<i style="background:${laneColor(li || 0)}"></i>${i + 1}. ${esc(lane ? lane.label : "Next step")}`);
      lb.dataset.row = "j" + ji;
      const card = place(`box customer-step inj${slot.change ? " chg-" + slot.change : ""}`, x, y, cardW,
        slotHtml(slot, b => `<h4>${gl(b.text)}</h4>${tech(b)}<div class="meta">${pill(b.status)}${badges(b)}</div>`),
        {type:"box", id:step.id}, slotLabel(slot, `Step ${i + 1}: ${step.text}`));
      card.style.setProperty("--lane", laneColor(li || 0));
      card.dataset.row = "j" + ji; nodes[step.id] = card;
      maxH = Math.max(maxH, card.offsetHeight);
      if (prev !== null) {
        const line = link(prev + cardW + 6, y + 32, x - 10, y + 32, "inj customer-flow");
        line.dataset.row = "j" + ji;
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
        arrow.setAttribute("d", `M${x - 18},${y + 26} L${x - 10},${y + 32} L${x - 18},${y + 38}`);
        arrow.setAttribute("class", "customer-flow"); svg.appendChild(arrow);
      }
      prev = x;
    });
    const nh = notePile([j.id, ...(j.steps || []).map(step => step.id)], notesX, start, 4, "j" + ji);
    const h = Math.max(y - start + maxH, nh);
    rows.push({key:"j" + ji, y:start, h, x:0, w:W});
    y = start + h + 70;

  return {x:0, y:0, w:W, h:y};
}

/* Side by side, journey maps: the chosen journey as one column of steps, each with its
   lane as a chip, so both panes stay readable. By default only the steps that differ show,
   with one step either side; runs of unchanged steps fold into a line that opens them. */
function renderJourneySbs(m) {
  const lanes = m.lanes || [];
  const LI = Object.fromEntries(lanes.map((l, i) => [l.id, i]));
  const js = m.journeys || [];
  if (S.sbsJourney == null || !js[S.sbsJourney]) S.sbsJourney = Math.max(0, js.findIndex(j => journeyChanges(j).length));
  const ji = S.sbsJourney, j = js[ji] || {steps:[]};
  const all = arrange(j.steps || [], "changes");
  const differs = all.map(s => s.change !== "same");
  const any = differs.some(Boolean);
  const keep = all.map((s, i) => S.sbsAll || !any || differs[i] || differs[i - 1] || differs[i + 1]);
  const W = 540;
  const t = place("maptitle sbs-title", 0, 0, W, `<span class="n">${ji + 1}</span>${esc(j.title || "")}`);
  let y = t.offsetHeight + 8;
  if (j.summary) { const q = place("mapintro", 0, y, W, gl(j.summary)); y += q.offsetHeight + 12; }
  const changed = all.filter(s => s.change !== "same");
  const mb = place("modebar", 0, y, 0, any ? `${countsHtml(changed)}<span class="hint-sbs">${S.sbsAll ? "The whole journey" : "Only what changes, with one step either side"}</span>` : "No changes in this journey. All of its steps are shown.");
  y += mb.offsetHeight + 26;
  let prev = null, hidden = 0;
  const fold = () => {
    if (!hidden) return;
    const g = place("gaprow", 0, y, W, `${plural(hidden, "step")} the same here · Show the whole journey`, {type:"expand"}, `Show ${plural(hidden, "unchanged step")}`);
    g.dataset.row = "j" + ji;
    y += g.offsetHeight + 14; hidden = 0; prev = null;
  };
  all.forEach((slot, i) => {
    if (!keep[i]) { hidden++; return; }
    fold();
    const s = slot.box, li = LI[s.lane] || 0, lane = lanes[li];
    const el = place(`box step sbs-step inj${slot.change ? " chg-" + slot.change : ""}`, 0, y, W,
      slotHtml(slot, b => `<div class="row1"><span class="n">${i + 1}</span><div class="t">${gl(b.text)}</div></div>${tech(b)}
        <div class="meta"><span class="lanechip"><i style="background:${laneColor(LI[b.lane] || 0)}"></i>${esc((lanes[LI[b.lane] || 0] || {}).label || "")}</span>${pill(b.status)}${badges(b)}</div>`),
      {type:"box", id:s.id}, slotLabel(slot, `Step ${i + 1}: ${s.text}`));
    el.style.setProperty("--lane", laneColor(li));
    el.dataset.row = "j" + ji;
    nodes[s.id] = el;
    if (prev) { const p = link(W / 2, prev.y + prev.h, W / 2, y - 3, "inj flow"); p.dataset.row = "j" + ji; arrowHead(W / 2, y - 3); }
    prev = {y, h:el.offsetHeight};
    y += el.offsetHeight + 16;
  });
  fold();
  rows.push({key:"j" + ji, y:0, h:y, x:0, w:W});
  return {x:0, y:0, w:W, h:y};
}

/* ---------- chain ---------- */
const C = {stageW:300, stageH:104, itemW:262, itemGap:16, perRow:3, gap:70};
const itemInner = b => `<h4>${gl(b.title)}</h4><p class="t">${gl(b.text || "")}</p>${tech(b)}<div class="meta">${pill(b.status)}${badges(b)}</div>`;
function renderChain(m) {
  const mode = modeOf(m);
  const perRow = sbsOn() ? 2 : C.perRow;   // two to a row side by side, so each pane stays readable
  const itemsX = C.stageW + 64;
  const columnW = perRow * (C.itemW + C.itemGap) - C.itemGap;
  const notesX = itemsX + columnW + 56;
  const W = notesX - 56 + notesWidth();
  let y = header(m, W);
  place("label", 0, y, 0, "The chain");
  place("label", itemsX, y, columnW, {today:"What exists today", planned:"What the plan puts in place", changes:"The plan, with every change marked", all:"What is here"}[mode]);
  if (S.notesOnMap) place("label", notesX, y, 0, "Notes from each role");
  y += 34;
  let prevStage = null;
  (m.stages || []).forEach((st, si) => {
    const y0 = y;
    const stEl = place(`box stage inj${si === 0 ? " first-stage" : ""}`, 0, y0, C.stageW,
      `<span class="stagenum">${si + 1}</span><h3>${gl(st.label)}</h3><p>${gl(st.sub || "")}</p>${tech(st)}<div class="meta">${badges(st)}</div>`,
      {type:"box", id:st.id}, `Stage ${si + 1}: ${st.label}`);
    stEl.style.minHeight = C.stageH + "px";
    stEl.dataset.row = "s" + si; nodes[st.id] = stEl;
    const slots = arrange(st.items || [], mode);
    let rowMax = 0, iy = y0, col = 0;
    slots.forEach(slot => {
      const it = slot.box;
      const el = place(`box item inj${slot.change ? " chg-" + slot.change : ""}`,
        itemsX + col * (C.itemW + C.itemGap), iy, C.itemW, slotHtml(slot, itemInner),
        {type:"box", id:it.id}, slotLabel(slot, it.title));
      el.dataset.row = "s" + si;
      nodes[it.id] = el;
      rowMax = Math.max(rowMax, el.offsetHeight);
      if (++col === perRow) { col = 0; iy += rowMax + C.itemGap; rowMax = 0; }
    });
    let ih = iy - y0 + rowMax;
    if (!slots.length) {
      const e = place("emptyslot", itemsX, y0, C.itemW, mode === "today" ? "Nothing here today" : mode === "planned" ? "Nothing planned here" : "Nothing here yet");
      e.dataset.row = "s" + si; ih = e.offsetHeight;
    }
    const nh = notePile([st.id, ...(st.items || []).map(i => i.id)], notesX, y0, 4, "s" + si);
    const h = Math.max(stEl.offsetHeight, ih, nh);
    rows.push({key:"s" + si, y:y0, h, x:0, w:W});
    if (prevStage) {
      const p = link(C.stageW / 2, prevStage.y + prevStage.h + 4, C.stageW / 2, y0 - 6, "inj spine", prevStage.verb);
      p.dataset.row = "s" + si; arrowHead(C.stageW / 2, y0 - 6);
    }
    prevStage = {y:y0, h:stEl.offsetHeight, verb:st.verb || ""};
    y = y0 + h + C.gap;
  });
  const outs = MODEL.outcomes || [];
  if (outs.length && m === MODEL.maps.find(mm => KIND[mm.template] === "chain")) {
    place("label", 0, y, 0, "Did it work?");
    y += 26;
    const ow = C.itemW + 60;
    let oy = y, outcomeH = 0;
    outs.forEach((o, i) => {
      const el = place("box inj", (i % 3) * (ow + C.itemGap), oy, ow,
        `<h4>${esc(o.measure)}</h4><p class="t">${o.baseline ? "Before: " + esc(o.baseline) + ". " : ""}${o.target ? "Target: " + esc(o.target) + ". " : ""}${o.result ? "<b>Result: " + esc(o.result) + "</b>" : "Not measured yet."}</p>
         <div class="meta">${o.becomes_evidence ? `<span class="chip">Feeds back as evidence</span>` : ""}</div>`,
        {type:"outcome", o}, `Outcome: ${o.measure}`);
      nodes[o.id] = el;
      outcomeH = Math.max(outcomeH, el.offsetHeight);
      if (i % 3 === 2 || i === outs.length - 1) { oy += outcomeH + C.itemGap; outcomeH = 0; }
    });
    rows.push({key:"outcomes", y:y - 26, h:oy - y + 26, x:0, w:W});
    y = oy + 20;
  }
  return {x:0, y:0, w:W, h:y};
}

/* ---------- tree ---------- */
const T = {colW:270, colGap:60, nodeH:104, vGap:18};
function renderTree(m) {
  const levels = !m.levels || JSON.stringify(m.levels) === JSON.stringify(["Outcome","Need or pain","Idea","Quick test"]) ? TREE_LEVELS : m.levels;
  const depthOf = n => n.children && n.children.length ? 1 + Math.max(...n.children.map(depthOf)) : 1;
  const depth = depthOf(m.root);
  const notesX = depth * (T.colW + T.colGap) + 10;
  const W = depth * (T.colW + T.colGap) - T.colGap + notesWidth();
  let y = header(m, W);
  for (let d = 0; d < depth; d++) place("label", d * (T.colW + T.colGap), y, 0, esc(levels[Math.min(d, levels.length - 1)]));
  y += 30;
  // Measure the actual cards before reserving rows. Long titles and badges wrap.
  const cards = {};
  let nodeH = T.nodeH;
  (function measure(n, d) {
    const el = place(`box tree-node l${d} inj`, d * (T.colW + T.colGap), y, T.colW,
      `<h4>${gl(n.title)}</h4>${n.text ? `<p class="t">${gl(n.text)}</p>` : ""}${tech(n)}<div class="meta">${pill(n.status)}${badges(n)}</div>`,
      {type:"box", id:n.id}, `${levels[Math.min(d, levels.length - 1)]}: ${n.title}`);
    el.style.minHeight = T.nodeH + "px";
    cards[n.id] = el;
    nodeH = Math.max(nodeH, el.offsetHeight);
    (n.children || []).forEach(c => measure(c, d + 1));
  })(m.root, 0);
  let cursor = y;
  const pos = {};
  (function lay(n, d) {
    const kids = n.children || [];
    let cy;
    if (!kids.length) { cy = cursor; cursor += nodeH + T.vGap; }
    else { kids.forEach(k => lay(k, d + 1)); cy = (pos[kids[0].id].y + pos[kids[kids.length - 1].id].y) / 2; }
    pos[n.id] = {x:d * (T.colW + T.colGap), y:cy, d};
  })(m.root, 0);
  const branches = m.root.children || [];
  const ids = n => [n.id, ...(n.children || []).flatMap(ids)];
  const shifted = {};
  let shift = 0;
  branches.forEach((b, bi) => {
    const own = ids(b);
    const ys = own.map(i => pos[i].y);

/* ---------- pan and zoom ---------- */
let Z = 1, X = 40, Y = 80;
const leftEdge = () => S.story && getComputedStyle($("#story")).display !== "none" ? $("#story").getBoundingClientRect().right : 0;
const rightEdge = () => document.body.classList.contains("panel-open") && innerWidth > 720 ? innerWidth - $("#panel").getBoundingClientRect().left : 0;
/* The drawing area: the whole screen with the side lists as insets, or in Side by side the

function pane() {
  if (!sbsOn()) return {x:0, w:innerWidth, l:leftEdge(), r:rightEdge()};
  const l = leftEdge(), w = Math.floor((innerWidth - l - rightEdge()) / 2);

}

  const P = pane(), on = sbsOn();
  Object.assign(viewport.style, on ? {left:P.x + "px", width:P.w + "px", right:"auto"} : {left:"", width:"", right:""});
  Object.assign(viewport2.style, on ? {left:(P.x + P.w) + "px", width:P.w + "px"} : {left:"", width:""});
  Object.assign($("#sbsbar").style, sbsJourneys() ? {display:"flex", left:P.x + "px", width:(2 * P.w) + "px"} : {display:"none"});
  const tf = `translate(${X}px,${Y}px) scale(${Z})`;
  world.style.transform = tf; world2.style.transform = tf;

const bottomEdge = () => document.body.classList.contains("panel-open") && innerWidth <= 720 ? innerHeight - $("#panel").getBoundingClientRect().top : 0;
const topEdge = () => (S.notesOnMap && NOTES.length ? TOP_H + 50 : TOP_H) + (sbsJourneys() ? 92 : sbsOn() ? 34 : 0);

function setStory(on) { document.body.classList.toggle("show-navigation", on); S.story = on; persist(); document.body.classList.toggle("nostory", !on); story(); topBar(); fit(); }
$("#storytab").addEventListener("click", () => setStory(true));
function story() {

    if (kind === "journeys") sub = (m.journeys || []).map((j, ji) => `<li><button class="view" data-j="${mi}:${ji}" aria-current="${cur && (sbsJourneys() ? S.sbsJourney === ji : S.journey === ji)}"><b><span class="num">${mi + 1}.${ji + 1}</span>${esc(j.title)}</b><span>${esc(j.summary || plural((j.steps || []).length, "step"))}</span></button></li>`).join("");
    if (kind === "chain") sub = (m.stages || []).map((st, si) => `<li><button class="view" data-row="${mi}:s${si}"><b><span class="num">${mi + 1}.${si + 1}</span>${esc(st.label)}</b><span>${esc(st.sub || "")}</span></button></li>`).join("");
    if (kind === "tree") sub = (m.root.children || []).map((b, bi) => `<li><button class="view" data-row="${mi}:b${bi}"><b><span class="num">${mi + 1}.${bi + 1}</span>${esc(b.title)}</b><span>${plural((b.children || []).length, "idea")}</span></button></li>`).join("");

  }).join("");
  const m = MODEL.maps[S.map];

  el.innerHTML = `<button class="hide" data-hide>Hide list</button>

      <button data-open="reviewstart" aria-current="${active === 'reviewstart'}">1. Understand the decision</button>
      <button data-give aria-current="${active === 'review' || active === 'questions'}">2. Give your view</button>
      <button data-open="reviewsummary" aria-current="${active === 'reviewsummary'}">3. Check your answers</button>
    </div>

      <button data-open="evidence">Supporting sources</button>

  el.querySelector("[data-hide]").addEventListener("click", () => setStory(false));

  el.querySelector("[data-give]").addEventListener("click", () => goReview(Math.max(0, qs.findIndex(q => !answerDone(q.n)))));
  el.querySelectorAll("[data-map]").forEach(b => b.addEventListener("click", () => { showMap(+b.dataset.map); S.journey = -1; persist(); applyFocus(); story(); fit(); }));
  el.querySelectorAll("[data-j]").forEach(b => b.addEventListener("click", () => { const [mi, ji] = b.dataset.j.split(":").map(Number); focusJourney(mi, ji); }));
  el.querySelectorAll("[data-row]").forEach(b => b.addEventListener("click", () => { const [mi, key] = b.dataset.row.split(":"); focusRow(+mi, key); }));
