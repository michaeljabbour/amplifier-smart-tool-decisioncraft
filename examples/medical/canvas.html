<script type="application/json" id="dc-model">{"format":"decisioncraft/1","title":"Going home well: changing how our ward discharges patients","question":"How should our ward change the way it sends patients home, so fewer come back within 30 days?","summary":"A worked example about how a hospital ward organises its work. It is not medical advice, and every name, quote and number is invented. A 28-bed medical ward sees one in seven patients readmitted within a month, often because of confusion about medicines. This map follows a patient's way home and the ward's discharge day, and lists what the team needs to decide.","roles":[{"id":"designer","label":"Patient experience","color":"#e86a92","asks":"Will patients and carers understand what happens and what to do?"},{"id":"analyst","label":"Quality analyst","color":"#4f7fd8","asks":"What exactly are we measuring, and could the change make anything worse?"},{"id":"engineer","label":"Ward pharmacist","color":"#2f9e6a","asks":"Can medicines be ready, checked and explained in time?"},{"id":"owner","label":"Ward manager","color":"#8a5cd6","asks":"What do we change first, who does it, and how do we know it worked?"},{"id":"security","label":"Privacy and safety","color":"#d1543f","asks":"Who sees patient information, and what could go wrong?"},{"id":"voice","label":"Patient and carer voice","color":"#d99a1e","asks":"What would make going home feel safe?","jobs":["Know which medicines are new or stopped","Know who to call if things go wrong"]},{"id":"agent","label":"AI agent teammate","color":"#1f9aa6","asks":"What routine work could an assistant do, always checked by a clinician?"},{"id":"finance","label":"Finance","color":"#7a7a72","asks":"What does it cost in staff time, and what does it save?"}],"reading":"This is a worked example about how a ward organises its work; it is not medical advice and everything in it is invented. The first view follows a patient and their carer home: how it goes today, how it would go with the ervation","date":"2026-08-06","ref":"material/timing-and-transport.md"},{"id":"S5","title":"Family doctor practices on discharge letters","kind":"interview","date":"2026-08-09","ref":"material/family-doctors.md"},{"id":"S6","title":"Language and access, records sample","kind":"data","date":"2026-08-07","ref":"material/language-and-access.md"},{"id":"S7","title":"Two-week try-out of follow-up calls","kind":"observation","date":"2026-08-12","ref":"material/calls-try-out.md"}],"evidence":[{"id":"E1","source":"S1","kind":"data","text":"58 of 412 patients (14%) were readmitted within 30 days.","where":"Summary"},{"id":"E2","source":"S1","kind":"data","text":"In 21 of those 58, the notes record a problem with medicines at home.","where":"Causes"},{"id":"E3","source":"S1","kind":"data","text":"63% of discharges happen after 4 pm. The pharmacy closes at 5:30 pm.","where":"Timing"},{"id":"E4","source":"S1","kind":"data","text":"Discharge letters reached the family doctor within 24 hours for 71% of patients.","where":"Letters"},{"id":"E5","source":"S2","kind":"quote","voice":true,"text":"Everyone was kind, but I left with a bag of tablets and no idea which were new.","where":"Patient"},{"id":"E6","source":"S2","kind":"quote","voice":true,"text":"We were told he'd go home in the morning. We waited until 7 pm for his medicines.","where":"Carer"},{"id":"E7","source":"S2","kind":"quote","voice":true,"text":"Nobody rang me afterwards. I didn't know who to call when I felt worse.","where":"Patient"},{"id":"E8","source":"S2","kind":"quote","voice":true,"text":"A simple sheet saying what changed would have helped more than anything.","where":"Carer"},{"id":"E9","source":"S3","kind":"quote","text":"If we knew the night before, we could have medicines ready by noon.","where":"Ward pharmacist"},{"id":"E10","source":"S3","kind":"observation","text":"The discharge checklist is on paper and often half-filled when the patient leaves.","where":"Nurse"},{"id":"E11","source":"S3","kind":"observation","text":"Follow-up phone calls happen when there is time, which is rarely.","where":"Discharge coordinator"},{"id":"E12","source":"S4","kind":"data","text":"Average time from 'can go home' to medicines on the ward: 5 hours 40 minutes.","where":"Timing"},{"id":"E13","source":"S4","kind":"data","text":"Discharge medicines reach the pharmacy queue in a batch, mostly between 12 pm and 2 pm.","where":"Pharmacy queue"},{"id":"E14","source":"S4","kind":"data","text":"Hospital transport must be booked by 11 am for a same-day journey; 1 in 5 patients needs it.","where":"Transport"},{"id":"E15","source":"S4","kind":"data","text":"The discharge lounge had free chairs before noon and was full after 3 pm on 9 of 10 days.","where":"Lounge"},{"id":"E16","source":"S4","kind":"data","text":"Weekend discharges are about half of a weekday's, partly because no pharmacist is on the ward.","where":"Weekends"},{"id":"E17","source":"S5","kind":"data","text":"Four of five practices said the most useful part of the letter is what changed with medicines and why.","where":"Practices"},{"id":"E18","source":"S5","kind":"data","text":"Three of five practices said letters sometimes arrive after the patient has already phoned them.","where":"Practices"},{"id":"E19","source":"S5","kind":"data","text":"Two practices asked for one named contact on the ward for questions in the first week.","where":"Practices"},{"id":"E20","source":"S6","kind":"data","text":"About 8% of patients need an interpreter; telephone interpreting takes 20 to 40 minutes to connect.","where":"Language"},{"id":"E21","source":"S6","kind":"data","text":"Discharge papers are printed in English only, in small type.","where":"Papers"},{"id":"E22","source":"S6","kind":"data","text":"About 1 in 4 patients go home to live alone.","where":"Living situation"},{"id":"E23","source":"S6","kind":"quote","text":"Large print and a picture of each tablet would help my mum.","where":"Patient group member","voice":true},{"id":"E24","source":"S7","kind":"data","text":"Of 31 patients called within two days, 28 were reached; 9 had a question about medicines.","where":"Calls"},{"id":"E25","source":"S7","kind":"data","text":"Average call: 7 minutes; afternoon calls were answered more often.","where":"Calls"},{"id":"E26","source":"S7","kind":"quote","text":"I could only do this because two planned meetings were cancelled.","where":"Discharge coordinator"},{"id":"E27","source":"S3","kind":"observation","text":"Discharges bunch up after the afternoon ward round.","where":"Ward manager"}],"maps":[{"id":"m-patient","template":"customer-journey","title":"A patient's way home","intro":"What a patient and their carer go through, from hearing they can go home to the weeks after. Each column is a phase.","lanes":[{"id":"notice","label":"Told they can go","sub":"The plan to go home"},{"id":"start","label":"Getting ready","sub":"Medicines and paperwork"},{"id":"use","label":"Leaving","sub":"The day itself"},{"id":"help","label":"First days home","sub":"When questions come up"},{"id":"stay","label":"Four weeks on","sub":"Well, or back in"}],"journeys":[{"id":"j-today","title":"Going home today","summary":"How it usually goes now, according to the audit and feedback.","creates":["A discharge letter","A bag of medicines","A paper checklist, often half-filled"],"steps":[{"id":"p1","lane":"notice","text":"Told at the morning ward round they can go home today","status":"works","detail":"Decision recorded in the ward record during the round.","feeling":"good"},{"id":"p1b","lane":"start","text":"Carer is phoned to come and collect them","status":"partial","detail":"Called when someone has time; no set time.","evidence":["E6"]},{"id":"p2","lane":"start","text":"Waits for medicines from the pharmacy","status":"partial","detail":"Prescription reaches the pharmacy queue in the post-round batch.","feeling":"bad","moment":true,"evidence":["E3","E6","E12","E13"]},{"id":"p2b","lane":"start","text":"Waits in the bed, or in a full discharge lounge after 3 pm","status":"partial","feeling":"bad","evidence":["E15"]},{"id":"p3","lane":"use","text":"Leaves with a bag of medicines and a letter","status":"partial","detail":"Papers printed in English, small type.","moment":true,"evidence":["E5","E21"]},{"id":"p3b","lane":"use","text":"Nobody checks they understood which medicines are new","status":"missing","detail":"No say-back step on the paper checklist.","evidence":["E5","E10"]},{"id":"p4","lane":"help","text":"Feels unsure at home; does not know who to call","status":"missing","feeling":"bad","evidence":["E7"]},{"id":"p4b","lane":"help","text":"Phones the family doctor, who has not had the letter yet","status":"partial","detail":"Letters reach the practice within 24 hours for 71%.","evidence":["E4","E18"]},{"id":"p5","lane":"stay","text":"One in seven comes back within a month","status":"missing","evidence":["E1","E2"]}]},{"id":"j-proposed","title":"Going home with the proposed changes","summary":"What the team proposes to try for eight weeks.","creates":["A place on tomorrow's list","A 'what changed' sheet","A call booked within two days"],"steps":[{"id":"q1","lane":"notice","text":"Told the evening before: 'You're on tomorrow's list'","status":"planned","detail":"Agreed at evening handover; confirmed by a doctor in the morning.","feeling":"good","evidence":["E9"]},{"id":"q1b","lane":"notice","text":"Carer told the likely time the evening before","status":"planned","evidence":["E6"]},{"id":"q1c","lane":"start","text":"Transport booked before 11 am if needed","status":"planned","detail":"Booked from tomorrow's list first thing.","evidence":["E14"]},{"id":"q2","lane":"start","text":"Medicines ready and checked by noon","status":"planned","detail":"Pharmacy works from the list overnight and early morning.","moment":true,"evidence":["E9","E12"]},{"id":"q3","lane":"use","text":"A nurse goes through a one-page 'what changed' sheet with them and their carer","status":"planned","detail":"Large print; new, changed and stopped medicines in three boxes.","moment":true,"evidence":["E8","E23"]},{"id":"q3b","lane":"use","text":"Patient says back which medicines are new","status":"planned","detail":"A tick box on the electronic checklist.","evidence":["E5"]},{"id":"q3c","lane":"use","text":"An interpreter is booked in advance if needed","status":"planned","detail":"Booked the evening before, not on the day.","evidence":["E20"]},{"id":"q4","lane":"help","text":"A phone call within two days, and one number to ring","status":"planned","detail":"Coordinator calls in the afternoon; one ward number on the sheet.","moment":true,"evidence":["E7","E11","E25"]},{"id":"q5","lane":"stay","text":"Fewer come back because of medicine problems","status":"planned","evidence":["E2"]}]},{"id":"j-carer","title":"A carer's day","summary":"What the person collecting them goes through.","creates":["A collection time","A copy of the sheet"],"steps":[{"id":"c1","lane":"notice","text":"Gets a call: 'He can go home today'","status":"partial","detail":"Often around midday, with no time given.","evidence":["E6"]},{"id":"c2","lane":"start","text":"Takes time off work and arrives early afternoon","status":"partial","feeling":"ok","evidence":["E6"]},{"id":"c3","lane":"start","text":"Waits hours for medicines","status":"partial","feeling":"bad","moment":true,"evidence":["E6","E12"]},{"id":"c4","lane":"use","text":"Is shown the medicines quickly, if at all","status":"missing","pain":"The carer will be the one sorting tablets at home.","evidence":["E8"]},{"id":"c5","lane":"help","text":"At home, sorts tablets from the bag and old boxes","status":"missing","detail":"Old medicines still in the house cause mix-ups.","feeling":"bad","evidence":["E2"]},{"id":"c6","lane":"help","text":"Has a question and does not know who to ask","status":"missing","evidence":["E7"]},{"id":"c7","lane":"stay","text":"With the changes: told the time the night before and given the sheet","status":"planned","feeling":"good","evidence":["E8","E9"]}]}]},{"id":"m-ward","template":"service-blueprint","title":"The ward's discharge day","intro":"What the patient sees, what staff do in front of them and out of sight, and what supports it.","lanes":[{"id":"person","label":"Patient and carer","sub":"What they do"},{"id":"front","label":"On the ward","sub":"Nurses, doctors at the bedside"},{"id":"back","label":"Behind the scenes","sub":"Pharmacy, letters, coordinators"},{"id":"support","label":"Support","sub":"Systems and rules"},{"id":"proof","label":"What they take home","sub":"Sheets and letters"}],"journeys":[{"id":"j-evening","title":"The evening before","summary":"Agreeing tomorrow's list at the evening handover.","creates":["Tomorrow's list","Transport and interpreter bookings"],"steps":[{"id":"e1","lane":"front","text":"Doctor marks patients likely to go tomorrow","status":"missing","detail":"A 'likely tomorrow' flag in the ward record.","evidence":["E9"]},{"id":"e2","lane":"back","text":"Evening handover agrees tomorrow's list","status":"missing","detail":"Five minutes at the 6 pm handover.","moment":true,"evidence":["E9","E27"]},{"id":"e3","lane":"back","text":"List goes to the pharmacy by 6 pm","status":"missing","detail":"Printed and sent through the ward record.","evidence":["E9"]},{"id":"e4","lane":"back","text":"Transport and interpreters booked for the morning","status":"missing","evidence":["E14","E20"]},{"id":"e5","lane":"person","text":"Patient and carer told the plan","status":"missing","detail":"Said as a plan, not a promise.","evidence":["E6"]},{"id":"e6","lane":"support","text":"Weekend lists only on days with a pharmacist","status":"missing","evidence":["E16"]},{"id":"e7","lane":"front","text":"Morning round confirms or takes patients off the list","status":"planned","detail":"Nobody goes home only because they were on the list.","evidence":["E9"]}]},{"id":"j-medicines","title":"Getting medicines ready","summary":"From tomorrow's list to a checked bag and a 'what changed' sheet.","creates":["A checked bag of medicines","A 'what changed' sheet"],"steps":[{"id":"m1","lane":"back","text":"Pharmacist reviews each listed patient's medicines","status":"missing","detail":"Compares medicines before admission with now.","evidence":["E9","E2"]},{"id":"m2","lane":"back","text":"Medicines dispensed overnight or early morning","status":"missing","detail":"Instead of the post-round batch at 12 to 2 pm.","evidence":["E13"]},{"id":"m3","lane":"back","text":"Draft 'what changed' sheet made from the medicines list","status":"missing","detail":"New, changed and stopped, with a plain reason for each.","evidence":["E8","E17"]},{"id":"m4","lane":"back","text":"Pharmacist checks and signs the sheet","status":"planned","detail":"Always checked by a pharmacist before it is printed.","evidence":["E10"]},{"id":"m5","lane":"proof","text":"Sheet printed in large type, in the patient's language if possible","status":"missing","evidence":["E21","E23","E20"]},{"id":"m6","lane":"front","text":"Bag and sheet on the ward by noon","status":"planned","moment":true,"evidence":["E9","E12"]},{"id":"m7","lane":"front","text":"Old medicines at home are mentioned","status":"missing","detail":"The sheet says which medicines to stop and put aside.","evidence":["E2"]},{"id":"m8","lane":"support","text":"If the plan changes on the morning round, the sheet is redone","status":"planned"}]},{"id":"j-day","title":"Discharge day, as proposed","summary":"The changes the team wants to try for eight weeks.","creates":["A completed electronic checklist","A discharge letter sent the same day"],"steps":[{"id":"w1","lane":"back","text":"Evening before: team agrees tomorrow's list","status":"missing","detail":"See 'The evening before'.","evidence":["E9"]},{"id":"w2","lane":"back","text":"Pharmacy prepares medicines overnight and early morning","status":"missing","evidence":["E3","E9"]},{"id":"w3","lane":"support","text":"Checklist moves from paper to the ward system","status":"missing","detail":"A required-fields form in the existing ward record system; no new software.","evidence":["E10"]},{"id":"w3b","lane":"front","text":"Patient moves to the discharge lounge before noon","status":"planned","detail":"The lounge is free before noon on most days.","evidence":["E15"]},{"id":"w4","lane":"front","text":"Nurse goes through the 'what changed' sheet at the bedside","status":"planned","detail":"With the carer present or on speakerphone.","moment":true,"evidence":["E8"]},{"id":"w4b","lane":"front","text":"Patient says back which medicines are new","status":"planned","evidence":["E5"]},{"id":"w5","lane":"proof","text":"Patient leaves with the sheet and one phone number","status":"planned","evidence":["E7"]},{"id":"w6","lane":"back","text":"Letter sent to the family doctor the same day","status":"partial","detail":"With a 'what changed' section at the top.","evidence":["E4","E17"]},{"id":"w7","lane":"back","text":"Coordinator calls within two days","status":"missing","evidence":["E11"]}]},{"id":"j-followup","title":"Calls and letters afterwards","summary":"Making sure the first week at home is covered.","creates":["A call record","A letter the practice can act on"],"steps":[{"id":"f1","lane":"back","text":"Call list made from yesterday's discharges","status":"missing","evidence":["E11"]},{"id":"f2","lane":"back","text":"Coordinator calls in the afternoon, two tries","status":"missing","detail":"28 of 31 reached in the try-out.","evidence":["E24","E25"]},{"id":"f3","lane":"person","text":"Patient asks about a medicine","status":"partial","detail":"9 of 28 had a medicine question in the try-out.","moment":true,"evidence":["E24"]},{"id":"f4","lane":"back","text":"Medicine questions passed to the pharmacist the same day","status":"partial","evidence":["E24"]},{"id":"f5","lane":"back","text":"Call recorded in the ward record","status":"missing","detail":"Short script with four questions."},{"id":"f6","lane":"support","text":"Family doctor gets the letter before the patient phones","status":"partial","detail":"Same-day letter, 'what changed' first.","evidence":["E18","E4"]},{"id":"f7","lane":"support","text":"Practices have one named ward contact for the first week","status":"missing","evidence":["E19"]},{"id":"f8","lane":"back","text":"Coordinator time is protected for calls","status":"missing","detail":"Calls happened in the try-out only because meetings were cancelled.","pain":"Without protected time, calls stop.","evidence":["E26","E11"]}]}]}],"gaps":[{"id":"G1","title":"Tomorrow's list, agreed the evening before","why":"Lets the pharmacy get medicines ready by noon instead of the evening.","anchors":["q1","w1","w2","e2"],"impact":5,"effort":2,"stories":[{"as":"As the ward pharmacist, I want tomorrow's list by 6 pm, so medicines are ready by noon.","done_when":["a list is agreed at the evening handover every weekday","at least 70% of listed patients leave before 2 pm","the list never sends anyone home before a doctor confirms in the morning"]},{"as":"As a carer, I want to know the evening before roughly when to come, so I do not lose a day waiting.","done_when":["carers of listed patients are told a likely time the evening before","they are called if the plan changes on the morning round"]}]},{"id":"G2","title":"A one-page 'what changed' sheet","why":"Medicine confusion is behind about a third of readmissions on this ward.","anchors":["q3","w4","m3"],"impact":5,"effort":2,"stories":[{"as":"As a patient going home, I want one page showing new, changed and stopped medicines, so I take the right ones.","done_when":["every discharge includes the sheet","the nurse goes through it with the patient or carer","patients can say back which medicines are new"]},{"as":"As a patient with poor eyesight, I want the sheet in large print, so I can read it at home.","done_when":["the sheet uses large type by default","it fits on one page"]},{"as":"As a patient who needs an interpreter, I want the sheet explained in my language, so I understand it.","done_when":["an interpreter is booked the evening before for listed patients who need one","the say-back is done with the interpreter"]}]},{"id":"G3","title":"A call within two days","why":"Patients did not know who to call when they felt worse; in the try-out 9 of 28 had a medicine question.","anchors":["q4","w7","f2"],"impact":4,"effort":3,"stories":[{"as":"As a patient at home, I want a call within two days, so I can ask questions before small problems grow.","done_when":["90% of patients get a call within two working days","the call follows a short script and is recorded"]},{"as":"As the discharge coordinator, I want protected time for calls, so they do not depend on cancelled meetings.","done_when":["two hours each weekday afternoon are kept for calls","the ward manager reviews call numbers weekly"]}]},{"id":"G4","title":"Checklist in the ward system","why":"Paper checklists are often half-filled.","anchors":["w3"],"impact":3,"effort":3,"stories":[{"as":"As a nurse, I want the checklist in the ward system, so nothing is missed and the next shift can see it.","done_when":["a patient cannot be marked discharged with required items blank"]},{"as":"As the next shift's nurse, I want to see what is done and what is not, so nothing is repeated or missed.","done_when":["the checklist shows who did each item and when","say-back and 'sheet given' are required items"]}]},{"id":"G5","title":"Letters the family doctor can act on","why":"Practices said the medicines part is what matters, and letters sometimes arrive after the patient phones.","anchors":["w6","f6","f7"],"impact":4,"effort":2,"stories":[{"as":"As a family doctor, I want what changed with medicines at the top of the letter, so I can act quickly.","done_when":["every letter starts with new, changed and stopped medicines","letters go the same day for listed patients"]},{"as":"As a practice, I want one named contact on the ward for the first week, so I can ask questions.","done_when":["the letter names the ward contact and a direct number"]}]},{"id":"G6","title":"Weekend discharges","why":"Weekend discharges are about half of a weekday's, partly because no pharmacist is on the ward.","anchors":["e6"],"impact":3,"effort":4,"stories":[{"as":"As the ward manager, I want tomorrow's list to work on weekends too, so Monday is not overloaded.","done_when":["a pharmacist covers the ward on Saturday mornings during the trial","weekend discharges rise without more readmissions"]}]}],"notes":[{"id":"N1","role":"voice","anchor":"q3","title":"Patients asked for a simple sheet","body":"Carers said one page of what changed would help more than anything.","recommend":"Write the sheet with two patients and two carers before the trial.","question":"Who from our patient group can help write and test the sheet?","urgency":"must","evidence":["E5","E8"]},{"id":"N2","role":"engineer","anchor":"w2","title":"Noon is possible with a night-before list","body":"The pharmacist said medicines could be ready by noon if they knew the evening before.","recommend":"Start with weekdays only; weekends have one pharmacist.","question":"Can we run tomorrow's list on weekdays first and add weekends later?","urgency":"must","evidence":["E9","E3"]},{"id":"N3","role":"security","anchor":"w1","title":"The list must not rush anyone out","body":"A list made the evening before could pressure staff to discharge patients who are not ready.","recommend":"Being on the list means 'medicines prepared', never 'must leave'. A doctor confirms each morning.","question":"How do we make clear that the list is a plan, not a promise?","urgency":"must","evidence":["E9"]},{"id":"N4","role":"analyst","anchor":"p5","title":"Measure the right readmissions","body":"Some readmissions have nothing to do with discharge. Counting all of them could hide the effect.","recommend":"Track readmissions linked to medicines separately, as well as the total.","question":"Which readmissions count as 'linked to medicines', and who decides?","urgency":"should","evidence":["E1","E2"]},{"id":"N5","role":"analyst","anchor":"G3","title":"Watch for side effects of the change","body":"Calling every patient takes coordinator time from somewhere else.","recommend":"Record what the calls find and how long they take.","question":"What would we stop doing to make time for the calls?","urgency":"should","evidence":["E11"]},{"id":"N6","role":"designer","anchor":"q4","title":"One number, staffed when people need it","body":"A number nobody answers is worse than none.","recommend":"Use the ward's existing advice line and say on the sheet when it is answered.","question":"Can the advice line cope with more calls in the evenings?","urgency":"should","evidence":["E7"]},{"id":"N7","role":"owner","anchor":"j-day","title":"Try it for eight weeks, then decide","body":"Small changes, tested quickly, are easier to keep or drop.","recommend":"Run all three changes for eight weeks and review at a team meeting.","question":"Do we start all three changes together, or one at a time?","urgency":"must","evidence":["E1"]},{"id":"N8","role":"security","anchor":"w7","title":"Calls must reach the right person","body":"Calling a home number could reach someone the patient did not want told.","recommend":"Ask each patient at discharge which number to call and who may answer.","question":"Where do we record the patient's call preferences?","urgency":"should","evidence":["E11"]},{"id":"N9","role":"agent","anchor":"w4","title":"An assistant could draft the sheet","body":"The changes are already in the medicines record; drafting the sheet is routine.","recommend":"An assistant drafts the sheet from the record; the pharmacist checks and signs it before the patient sees it.","question":"Are we comfortable with a drafted sheet if a pharmacist always checks it?","urgency":"info","evidence":["E10"]},{"id":"N10","role":"finance","anchor":"G3","title":"Calls cost time; readmissions cost more","body":"Each readmission uses a bed for several days. A short call takes about ten minutes.","recommend":"Count coordinator hours during the trial to compare.","question":"Can we fund extra coordinator hours for eight weeks?","urgency":"should","evidence":["E1","E11"]},{"id":"N11","role":"engineer","anchor":"m2","title":"The batch after the round is the real delay","body":"Prescriptions arrive in one batch between 12 and 2 pm, so nothing can be ready early.","recommend":"Work from tomorrow's list overnight, and leave the post-round batch for surprises only.","question":"Can the pharmacy staff an early-morning slot for listed patients?","urgency":"must","evidence":["E13","E9"]},{"id":"N12","role":"engineer","anchor":"m4","title":"A pharmacist always checks the sheet","body":"A wrong sheet is worse than no sheet.","recommend":"No sheet is printed without a pharmacist's check.","question":"Who checks sheets when the ward pharmacist is off?","urgency":"must","evidence":["E10"]},{"id":"N13","role":"engineer","anchor":"e6","title":"Weekends need a pharmacist","body":"Without one, weekend discharges stay at half a weekday's.","recommend":"Try a Saturday-morning pharmacist during the eight weeks.","question":"Can we fund a Saturday pharmacist for the trial?","urgency":"should","evidence":["E16"]},{"id":"N14","role":"owner","anchor":"w3b","title":"Use the lounge in the morning","body":"The lounge is empty before noon and full after 3 pm.","recommend":"Move listed patients to the lounge once medicines are ready.","question":"Who decides when a patient moves to the lounge?","urgency":"should","evidence":["E15"]},{"id":"N15","role":"owner","anchor":"f8","title":"Calls need protected time","body":"The try-out only worked because meetings were cancelled.","recommend":"Protect two hours each weekday afternoon for calls during the trial.","question":"What do we stop doing to free those two hours?","urgency":"must","evidence":["E26"]},{"id":"N16","role":"owner","anchor":"G6","title":"Leave weekends until the weekday version works","body":"Weekends add staffing questions.","recommend":"Start weekdays only; review weekends at week four.","question":"Do we agree to start weekdays only?","urgency":"info","evidence":["E16"]},{"id":"N17","role":"analyst","anchor":"q3b","title":"Say-back gives us something to measure","body":"We cannot measure understanding from a ticked 'sheet given' box.","recommend":"Record whether the patient could say back the new medicines.","question":"Is a yes/no for say-back enough, or do we need more detail?","urgency":"should","evidence":["E5"]},{"id":"N18","role":"analyst","anchor":"e7","title":"Check the list does not change who goes home","body":"The list must change timing, not decisions.","recommend":"Compare who goes home and when, before and during the trial.","question":"What would tell us the list is pushing people out too early?","urgency":"must","evidence":["E9"]},{"id":"N19","role":"analyst","anchor":"f6","title":"Letters on the same day for listed patients","body":"Today 71% reach the practice within 24 hours.","recommend":"Measure same-day letters separately for listed patients.","question":"Do we aim for same-day letters for everyone, or listed patients first?","urgency":"info","evidence":["E4","E18"]},{"id":"N20","role":"designer","anchor":"m5","title":"Large print and pictures","body":"A patient group member asked for large print and a picture of each tablet.","recommend":"Test a large-print sheet with three patients before the trial.","question":"Do we add pictures of tablets, or is that too hard to keep right?","urgency":"should","evidence":["E23","E21"]},{"id":"N21","role":"designer","anchor":"c4","title":"The carer will be the one sorting tablets","body":"Carers are often shown the medicines quickly, if at all.","recommend":"Go through the sheet with the carer present or on speakerphone.","question":"What do we do when the carer cannot be there?","urgency":"must","evidence":["E8","E6"]},{"id":"N22","role":"security","anchor":"f5","title":"Calls must be recorded in the ward record","body":"Notes kept elsewhere would not be seen by the next person.","recommend":"Use a short call form in the ward record; no personal notebooks.","question":"Who can see call records after the patient leaves?","urgency":"should","evidence":["E11"]},{"id":"N23","role":"security","anchor":"q3c","title":"Use professional interpreters, not family","body":"Family members interpreting can miss or change things about medicines.","recommend":"Book telephone interpreters the evening before for listed patients.","question":"Do we allow family to interpret if an interpreter cannot be reached?","urgency":"should","evidence":["E20"]},{"id":"N24","role":"voice","anchor":"c5","title":"Old medicines at home cause mix-ups","body":"The audit found old medicines still being taken.","recommend":"Say on the sheet which medicines to stop, and offer to take back old ones.","question":"Can the ward take back old medicines from home?","urgency":"must","evidence":["E2"]},{"id":"N25","role":"voice","anchor":"p4","title":"One in four go home to live alone","body":"For them there is no carer to ask.","recommend":"Call people living alone first.","question":"Do we call people living alone on day one rather than day two?","urgency":"should","evidence":["E22","E7"]},{"id":"N26","role":"voice","anchor":"c1","title":"A time, not just a day","body":"Carers took a day off and waited hours.","recommend":"Give carers a likely time the evening before.","question":"How do we tell carers if the time changes?","urgency":"info","evidence":["E6"]},{"id":"N27","role":"agent","anchor":"m3","title":"An assistant could draft the sheet from the medicines list","body":"Comparing before and after lists and writing plain reasons is routine.","recommend":"Let an assistant draft; a pharmacist always checks and signs.","question":"Do we let an assistant draft the plain-language reason for each change?","urgency":"info","evidence":["E8","E10"]},{"id":"N28","role":"agent","anchor":"f1","title":"An assistant could prepare the call list","body":"Yesterday's discharges, who lives alone, and preferred times are all in the record.","recommend":"Prepare the list by 1 pm, people living alone first.","question":"Do we let an assistant put people in call order?","urgency":"info","evidence":["E22","E25"]},{"id":"N29","role":"finance","anchor":"f2","title":"Seven minutes a call","body":"About 30 calls a fortnight at 7 minutes is under four hours.","recommend":"Fund two coordinator hours a day for eight weeks.","question":"Is the call time worth it if readmissions fall by only a few?","urgency":"should","evidence":["E24","E25"]},{"id":"N30","role":"finance","anchor":"q1c","title":"Booking transport earlier saves bed time","body":"Transport booked after 11 am means waiting until the next day.","recommend":"Book transport from tomorrow's list at 9 am.","question":"Do we measure bed hours saved, as well as readmissions?","urgency":"info","evidence":["E14"]},{"id":"N31","role":"security","anchor":"e5","title":"Tell patients the list is a plan","body":"Being told 'tomorrow' and then not going is upsetting and can push staff to rush.","recommend":"Use the words 'likely tomorrow, if the doctors agree in the morning'.","question":"Who says it, and in what words?","urgency":"must","evidence":["E9"]},{"id":"N32","role":"designer","anchor":"w5","title":"One number that is answered","body":"Patients did not know who to call.","recommend":"Put one ward number on the sheet, answered until 8 pm.","question":"Can the ward answer that number until 8 pm?","urgency":"info","evidence":["E7"]}],"decisions":[{"id":"D1","question":"Do we run an eight-week trial of tomorrow's list, the 'what changed' sheet and follow-up calls?","notes":["N2","N3","N7"],"options":["All three together","Sheet and list first, calls later"],"owner":"Ward manager","status":"open","due":"2026-09-01"},{"id":"D2","question":"What do we measure, and what result would make us keep the changes?","notes":["N4","N5"],"owner":"Quality analyst","status":"open","due":"2026-09-01"},{"id":"D3","question":"Do we start on weekdays only?","notes":["N16","N13"],"options":["Weekdays only","Weekdays plus Saturday with a pharmacist"],"owner":"Ward manager","status":"open","due":"2026-09-01"},{"id":"D4","question":"Who drafts and who checks the 'what changed' sheet?","notes":["N12","N27"],"options":["Pharmacist drafts and checks","Assistant drafts, pharmacist checks"],"owner":"Ward pharmacist","status":"open","due":"2026-09-01"}],"outcomes":[{"id":"O1","measure":"Readmissions within 30 days linked to medicines","baseline":"21 in six months","target":"Half that rate"},{"id":"O2","measure":"Patients leaving before 2 pm","baseline":"About 1 in 3","target":"7 in 10 of those on tomorrow's list"},{"id":"O3","measure":"Patients called within two days","target":"9 in 10"},{"id":"O4","measure":"Hours from 'can go home' to medicines on the ward","baseline":"5 hours 40 minutes","target":"Under 2 hours for listed patients"},{"id":"O5","measure":"Patients who could say back their new medicines","target":"9 in 10"}]}</script>

<script>

(function () {
"use strict";

const $ = (s, r) => (r || document).querySelector(s);
const read = id => { const n = document.getElementById(id); return n && n.textContent.trim() ? JSON.parse(n.textContent) : null; };
const MODEL = read("dc-model");
const MERGED = read("dc-merged");
const SINCE = read("dc-since");

const STATUS = {works:"Works today", partial:"Partly there", missing:"Missing", planned:"Planned"};
const URG = {must:"Must decide", should:"Should decide", info:"For information"};
const URG_ORDER = {must:0, should:1, info:2};
const FEEL = {good:"Feels good", ok:"Mixed feelings", bad:"Feels bad"};
const DSTATUS = {open:"Open", decided:"Decided", deferred:"Deferred"};
const DEFAULT_ROLES = [
  {id:"designer",label:"Designer",color:"#e86a92"},{id:"analyst",label:"Analyst",color:"#4f7fd8"},
  {id:"engineer",label:"Engineer",color:"#2f9e6a"},{id:"owner",label:"Product owner",color:"#8a5cd6"},
  {id:"security",label:"Security and privacy",color:"#d1543f"},{id:"voice",label:"Customer voice",color:"#d99a1e"},
  {id:"agent",label:"AI agent teammate",color:"#1f9aa6"},{id:"finance",label:"Finance",color:"#7a7a72"}];
const KIND = {"system-journeys":"journeys","customer-journey":"journeys","service-blueprint":"journeys",
  "decision-chain":"chain","opportunity-tree":"tree"};
const TREE_LEVELS = ["Outcome","Need or pain","Idea","Quick test"];
const MIN_Z = 0.3, MAX_Z = 2.2;
const STORY_W = 320, PANEL_W = 480, TOP_H = 52;

const ROLES = (MODEL.roles && MODEL.roles.length ? MODEL.roles : DEFAULT_ROLES);
const ROLE = Object.fromEntries(ROLES.map(r => [r.id, r]));
const EVID = Object.fromEntries((MODEL.evidence || []).map(e => [e.id, e]));
const SRC = Object.fromEntries((MODEL.sources || []).map(s => [s.id, s]));
const GAPS = MODEL.gaps || [];
const NOTES = MODEL.notes || [];
const DECISIONS = MODEL.decisions || [];
const GLOSS = MODEL.glossary || {};
const DOT_BUDGET = MODEL.dots || 5;
const FRESH_DAYS = MODEL.freshness_days || 60;
const KEY = "decisioncraft:" + (META.fingerprint || MODEL.title);

const sinceAdded = new Set((SINCE && SINCE.added || []).map(x => x.id));
const sinceChanged = Object.fromEntries((SINCE && SINCE.changed || []).map(x => [x.id, x.fields]));

/* ---------- saved state ---------- */
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { saved = {}; }
const S = Object.assign({map:0, mode:"planned", journey:-1, tech:false, notesOnMap:false, dots:true, story:true,
  hintSeen:false, roles:Object.fromEntries(ROLES.map(r => [r.id, true])),
  answers:{}, votes:{}, decisions:{}, reviewer:""}, saved);
ROLES.forEach(r => { if (!(r.id in S.roles)) S.roles[r.id] = true; });
if (S.map >= MODEL.maps.length) S.map = 0;
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

/* ---------- text helpers ---------- */
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const TERMS = Object.keys(GLOSS).sort((a, b) => b.length - a.length);
const TERM_RE = TERMS.length ? new RegExp("\\b(" + TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "i") : null;
function gl(text, focusable) {
  const s = esc(text);
  if (!TERM_RE) return s;
  return s.replace(TERM_RE, m => {
    const key = TERMS.find(t => t.toLowerCase() === m.toLowerCase());
    return `<span class="term" data-term="${esc(key)}"${focusable ? ' tabindex="0"' : ""}>${m}</span>`;
  });
}
const pill = s => s && STATUS[s] ? `<span class="pill ${s}">${STATUS[s]}</span>` : "";
const days = (a, b) => (new Date(a) - new Date(b)) / 864e5;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

/* ---------- index of boxes ---------- */
const BOX = {};
MODEL.maps.forEach((m, mi) => {
  (m.journeys || []).forEach((j, ji) => {
    BOX[j.id] = {box:j, mi, kind:"journey", ji};
    (j.steps || []).forEach((s, k) => BOX[s.id] = {box:s, mi, kind:"step", ji, k});

    BOX[st.id] = {box:st, mi, kind:"stage", si};
    (st.items || []).forEach(it => BOX[it.id] = {box:it, mi, kind:"item", si, stage:st.id});

  if (m.root) {
    const walk = (n, d, bi) => { BOX[n.id] = {box:n, mi, kind:"node", depth:d, bi}; (n.children || []).forEach((c, i) => walk(c, d + 1, d === 0 ? i : bi)); };
    walk(m.root, 0, -1);

});
GAPS.forEach(g => BOX[g.id] = {box:g, mi:-1, kind:"gap"});
const notesOn = id => NOTES.filter(n => n.anchor === id && S.roles[n.role] !== false);
const mapOfAnchor = a => BOX[a] ? (BOX[a].mi >= 0 ? BOX[a].mi : mapOfAnchor((BOX[a].box.anchors || [])[0])) : -1;
const titleOf = b => b.title || b.label || b.text || b.id;

function badges(b) {
  const out = [];
  if (sinceAdded.has(b.id)) out.push(`<span class="chip new">New</span>`);
  else if (sinceChanged[b.id]) out.push(`<span class="chip changed">Changed</span>`);
  const ref = (MODEL.checked || {}).date;
  if (b.checked && ref && days(ref, b.checked) > FRESH_DAYS) out.push(`<span class="chip stale" title="Checked ${esc(b.checked)}">May be out of date</span>`);
  if (b.moment) out.push(`<span class="chip moment">Moment that matters</span>`);
  if (b.pain) out.push(`<span class="chip pain">Pain point</span>`);
  if (b.feeling) out.push(`<span class="chip"><i class="feel ${b.feeling}"></i>${FEEL[b.feeling]}</span>`);
  const ev = (b.evidence || []).length;
  if (ev) out.push(`<span class="chip">${ev} evidence</span>`);
  const notes = notesOn(b.id);
  if (notes.length) out.push(`<span class="notebadge${notes.some(n => n.urgency === "must") ? " must" : ""}">${plural(notes.length, "note")}</span>`);
  return out.join("");
}
const tech = b => S.tech && b.detail ? `<span class="techname">${esc(b.detail)}</span>` : "";

/* ---------- DOM helpers ---------- */
const world = $("#world"), viewport = $("#viewport");
let nodes = {}, rows = [], svg;
function place(cls, x, y, w, html, data, label) {
  const d = document.createElement("div");
  d.className = cls; d.style.left = x + "px"; d.style.top = y + "px";
  if (w) d.style.width = w + "px";
  d.innerHTML = html;
  if (data) { d.tabIndex = 0; d.setAttribute("role", "button"); d.setAttribute("aria-label", label || ""); d._data = data; }
  world.appendChild(d);
  return d;
}
function link(x1, y1, x2, y2, cls, label) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  const my = (y1 + y2) / 2;
  p.setAttribute("d", Math.abs(x1 - x2) < 2 ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
  if (cls) p.setAttribute("class", cls);
  svg.appendChild(p);
  if (label) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", (x1 + x2) / 2 + 10); t.setAttribute("y", my + 5); t.textContent = label;
    svg.appendChild(t);
  }

}
function arrowHead(x, y) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", `M${x - 6},${y - 9} L${x},${y} L${x + 6},${y - 9}`);

}

  const n = parseInt(String(hex).replace("#", ""), 16) || 0x888888;
  const mix = c => Math.round(c * 0.16 + 255 * 0.84);
  return `rgb(${mix(n >> 16 & 255)},${mix(n >> 8 & 255)},${mix(n & 255)})`;

/* Notes beside a row (only when "Show all notes on the map" is on): a column to the right of

const NOTE_W = 250, NOTE_GAP = 12, NOTES_W = 2 * NOTE_W + NOTE_GAP;
function notePile(anchors, x, y, max, rowKey) {
  if (!S.notesOnMap) return 0;
  const list = NOTES.filter(n => anchors.includes(n.anchor) && S.roles[n.role] !== false)
    .sort((a, b) => URG_ORDER[a.urgency || "info"] - URG_ORDER[b.urgency || "info"]);
  const shown = list.slice(0, max);
  const colH = [0, 0];
  shown.forEach(n => {
    const c = colH[0] <= colH[1] ? 0 : 1;
    const r = ROLE[n.role] || {label:n.role, color:"#888"};
    const el = place(`notecard ${n.urgency || "info"} inj`, x + c * (NOTE_W + NOTE_GAP), y + colH[c], NOTE_W,

      {type:"note", n}, `${r.label} note: ${n.title}`);
    el.style.background = tint(r.color);
    el.dataset.row = rowKey;
    colH[c] += el.offsetHeight + NOTE_GAP;
  });
  let h = Math.max(colH[0], colH[1]);
  if (list.length > shown.length) {
    const more = place("morenotes inj", x, y + h, NOTES_W, `+ ${plural(list.length - shown.length, "more note")} here`,

}
const notesWidth = () => S.notesOnMap ? NOTES_W + 48 : 0;

function header(m, width) {
  place("stamp", 0, 6, 0, (MODEL.checked && MODEL.checked.date) ? `Checked against the sources on ${esc(MODEL.checked.date)}` : "Not yet checked against sources");
  const t = place("maptitle", 0, 40, Math.max(width, 600), esc(m.title || MODEL.title));
  const q = place("mapintro", 0, 40 + t.offsetHeight + 8, Math.min(Math.max(width, 600), 900), gl(m.intro || ""));
  return 40 + t.offsetHeight + 8 + q.offsetHeight + 40;
}

/* ---------- journeys ---------- */
const J = {laneW:260, laneGap:22, stepW:236, stepH:84, rowGap:16, headW:330, headGap:40, bandGap:70};
function renderJourneys(m) {
  const lanes = m.lanes || [];

  const laneX = i => J.headW + J.headGap + i * (J.laneW + J.laneGap);

  let y = header(m, W);
  lanes.forEach((l, i) => place("lanehead", laneX(i), y, J.laneW, `${esc(l.label)}<small>${esc(l.sub || "")}</small>`));
  if (S.notesOnMap) place("label", notesX, y + 4, 0, "Notes from each role");
  y += 60;
  const laneTop = y - 70;
  (m.journeys || []).forEach((j, ji) => {
    const y0 = y;
    const hd = place("box jhead inj", 0, y0, J.headW,
      `<h3><span class="n">${ji + 1}</span>${gl(j.title)}</h3><p>${gl(j.summary || "")}</p>
       ${(j.creates || []).length ? `<p class="sub small"><b>What it leaves behind:</b> ${j.creates.map(esc).join(", ")}</p>` : ""}
       <div class="meta">${badges(j)}<span class="chip">${plural((j.steps || []).length, "step")}</span></div>`,
      {type:"box", id:j.id}, `Journey ${ji + 1}: ${j.title}`);
    hd.dataset.row = "j" + ji;
    nodes[j.id] = hd;
    let sy = y0, prev = null;
    (j.steps || []).forEach((s, k) => {
      const x = laneX(LI[s.lane] || 0) + (J.laneW - J.stepW) / 2;
      const el = place("box step inj", x, sy, J.stepW,
        `<div class="row1"><span class="n">${k + 1}</span><div class="t">${gl(s.text)}</div></div>${tech(s)}
         <div class="meta">${pill(s.status)}${badges(s)}</div>`,
        {type:"box", id:s.id}, `Step ${k + 1} of journey ${ji + 1}: ${s.text}`);
      el.style.minHeight = J.stepH + "px";
      el.dataset.row = "j" + ji;
      nodes[s.id] = el;
      const h = el.offsetHeight;

    });

    const h = Math.max(hd.offsetHeight, sy - y0, nh);

    y = y0 + h + J.bandGap;
  });

    const bg = document.createElement("div"); bg.className = "lanebg";
    Object.assign(bg.style, {left:(laneX(i) - 8) + "px", top:laneTop + "px", width:(J.laneW + 16) + "px", height:(y - laneTop) + "px"});

  });
  return {x:0, y:0, w:W, h:y};
}

/* ---------- chain ---------- */
const C = {stageW:300, stageH:96, itemW:250, itemGap:14, perRow:3, gap:64};
function renderChain(m) {
  const itemsX = C.stageW + 50;
  const notesX = itemsX + C.perRow * (C.itemW + C.itemGap) + 34;
  const W = itemsX + C.perRow * (C.itemW + C.itemGap) + notesWidth();
  let y = header(m, W);
  place("label", 0, y, 0, "Stage");
  place("label", itemsX, y, 0, S.mode === "planned" ? "Planned (dashed border = new)" : "What exists today");
  if (S.notesOnMap) place("label", notesX, y, 0, "Notes from each role");
  y += 30;
  let prevStage = null;
  (m.stages || []).forEach((st, si) => {
    const y0 = y;
    const items = (st.items || []).filter(it => (it.when || "both") === "both" || it.when === S.mode);
    const stEl = place("box stage inj", 0, y0, C.stageW,
      `<h3>${gl(st.label)}</h3><p>${gl(st.sub || "")}</p>${tech(st)}<div class="meta">${badges(st)}</div>`,
      {type:"box", id:st.id}, `Stage ${si + 1}: ${st.label}`);
    stEl.style.minHeight = C.stageH + "px";
    stEl.dataset.row = "s" + si;
    nodes[st.id] = stEl;
    let rowMax = 0, iy = y0, col = 0;
    items.forEach(it => {
      const el = place(`box item inj${it.when === "planned" ? " planned-new" : ""}`,
        itemsX + col * (C.itemW + C.itemGap), iy, C.itemW,
        `<h4>${gl(it.title)}</h4><p class="t">${gl(it.text || "")}</p>${tech(it)}<div class="meta">${pill(it.status)}${badges(it)}</div>`,
        {type:"box", id:it.id}, it.title);
      el.dataset.row = "s" + si;
      nodes[it.id] = el;
      rowMax = Math.max(rowMax, el.offsetHeight);
      if (++col === C.perRow) { col = 0; iy += rowMax + C.itemGap; rowMax = 0; }
    });
    let ih = iy - y0 + rowMax;
    if (!items.length) { place("label", itemsX, y0 + 10, 0, S.mode === "planned" ? "Nothing planned here" : "Nothing here today"); ih = 40; }
    const nh = notePile([st.id, ...(st.items || []).map(i => i.id)], notesX, y0, 4, "s" + si);
    const h = Math.max(stEl.offsetHeight, ih, nh);
    rows.push({key:"s" + si, y:y0, h, x:0, w:W});
    if (prevStage) {
      const p = link(C.stageW / 2, prevStage.y + prevStage.h, C.stageW / 2, y0 - 2, "inj", prevStage.verb);
      p.dataset.row = "s" + si; arrowHead(C.stageW / 2, y0 - 2);
    }
    prevStage = {y:y0, h:stEl.offsetHeight, verb:st.verb || ""};
    y = y0 + h + C.gap;
  });
  const outs = MODEL.outcomes || [];
  if (outs.length && m === MODEL.maps.find(mm => KIND[mm.template] === "chain")) {
    place("label", 0, y, 0, "Did it work?");
    y += 26;
    const ow = C.itemW + 60;
    outs.forEach((o, i) => {
      const el = place("box inj", (i % 3) * (ow + C.itemGap), y + Math.floor(i / 3) * 150, ow,
        `<h4>${esc(o.measure)}</h4><p class="t">${o.baseline ? "Before: " + esc(o.baseline) + ". " : ""}${o.target ? "Target: " + esc(o.target) + ". " : ""}${o.result ? "<b>Result: " + esc(o.result) + "</b>" : "Not measured yet."}</p>
         <div class="meta">${o.becomes_evidence ? `<span class="chip">Feeds back as evidence</span>` : ""}</div>`,
        {type:"outcome", o}, `Outcome: ${o.measure}`);
      nodes[o.id] = el;
    });
    rows.push({key:"outcomes", y:y - 26, h:Math.ceil(outs.length / 3) * 150 + 26, x:0, w:W});
    y += Math.ceil(outs.length / 3) * 150 + 20;
  }
  return {x:0, y:0, w:W, h:y};
}

/* ---------- tree ---------- */
const T = {colW:270, colGap:60, nodeH:104, vGap:18};
function renderTree(m) {
  const levels = m.levels || TREE_LEVELS;
  const depthOf = n => n.children && n.children.length ? 1 + Math.max(...n.children.map(depthOf)) : 1;
  const depth = depthOf(m.root);
  const notesX = depth * (T.colW + T.colGap) + 10;
  const W = depth * (T.colW + T.colGap) - T.colGap + notesWidth();
  let y = header(m, W);
  for (let d = 0; d < depth; d++) place("label", d * (T.colW + T.colGap), y, 0, esc(levels[Math.min(d, levels.length - 1)]));
  y += 30;
  let cursor = y;
  const pos = {};
  (function lay(n, d) {
    const kids = n.children || [];
    let cy;
    if (!kids.length) { cy = cursor; cursor += T.nodeH + T.vGap; }
    else { kids.forEach(k => lay(k, d + 1)); cy = (pos[kids[0].id].y + pos[kids[kids.length - 1].id].y) / 2; }
    pos[n.id] = {x:d * (T.colW + T.colGap), y:cy, d};
  })(m.root, 0);
  const branches = m.root.children || [];
  const ids = n => [n.id, ...(n.children || []).flatMap(ids)];
  const shifted = {};
  let shift = 0;
  branches.forEach((b, bi) => {
    const own = ids(b);
    const ys = own.map(i => pos[i].y);
    const y0 = Math.min(...ys) + shift, y1 = Math.max(...ys) + T.nodeH + shift;
    own.forEach(i => shifted[i] = pos[i].y + shift);
    const nh = notePile(own, notesX, y0, 4, "b" + bi);
    rows.push({key:"b" + bi, y:y0, h:Math.max(y1 - y0, nh), x:0, w:W});
    shift += Math.max(0, nh - (y1 - y0)) + (S.notesOnMap ? T.vGap : 0);
  });
  shifted[m.root.id] = branches.length ? (shifted[branches[0].id] + shifted[branches[branches.length - 1].id]) / 2 : pos[m.root.id].y;
  const draw = (n, parent, bi) => {
    const p = pos[n.id], ny = shifted[n.id];
    const el = place(`box tree-node l${p.d} inj`, p.x, ny, T.colW,
      `<h4>${gl(n.title)}</h4>${n.text ? `<p class="t">${gl(n.text)}</p>` : ""}${tech(n)}<div class="meta">${pill(n.status)}${badges(n)}</div>`,
      {type:"box", id:n.id}, `${levels[Math.min(p.d, levels.length - 1)]}: ${n.title}`);
    el.style.minHeight = T.nodeH + "px";
    if (bi != null) el.dataset.row = "b" + bi;
    nodes[n.id] = el;
    if (parent) {
      const l = link(pos[parent.id].x + T.colW, shifted[parent.id] + T.nodeH / 2, p.x, ny + T.nodeH / 2, "inj");
      if (bi != null) l.dataset.row = "b" + bi;
    }
    (n.children || []).forEach(c => draw(c, n, bi == null ? branches.indexOf(c) : bi));
  };
  draw(m.root, null, null);
  return {x:0, y:0, w:W, h:Math.max(...Object.values(shifted)) + T.nodeH + 60};
}

/* ---------- render ---------- */
let bounds = {x:0, y:0, w:1000, h:800};
function render() {
  world.innerHTML = "";
  nodes = {}; rows = [];
  svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "links"); svg.setAttribute("aria-hidden", "true");
  world.appendChild(svg);
  const far = document.body.classList.contains("z-far");
  document.body.classList.remove("z-far");          // lay out at full detail, then restore
  const m = MODEL.maps[S.map];
  const kind = KIND[m.template];
  bounds = kind === "journeys" ? renderJourneys(m) : kind === "chain" ? renderChain(m) : renderTree(m);
  if (far) document.body.classList.add("z-far");
  applyFocus();
  topBar();
  story();
}

/* ---------- pan and zoom ---------- */
let Z = 1, X = 40, Y = 80;
const leftEdge = () => S.story ? STORY_W : 0;
const rightEdge = () => document.body.classList.contains("panel-open") ? PANEL_W + 10 : 0;
function apply() {
  world.style.transform = `translate(${X}px,${Y}px) scale(${Z})`;
  document.documentElement.style.setProperty("--z", Z);
  document.documentElement.style.setProperty("--inv", Math.min(2.4, Math.max(1, 0.62 / Z)));
  document.body.classList.toggle("z-far", Z < 0.55);
}
function zoomAt(f, cx, cy) {
  const nz = Math.min(MAX_Z, Math.max(MIN_Z, Z * f));
  X = cx - (cx - X) * (nz / Z); Y = cy - (cy - Y) * (nz / Z); Z = nz; apply();
}
const viewCenter = () => [leftEdge() + (innerWidth - leftEdge() - rightEdge()) / 2, TOP_H + (innerHeight - TOP_H) / 2];
function fitTo(b) {
  const vw = innerWidth - leftEdge() - rightEdge() - 40, vh = innerHeight - TOP_H - 40;
  let z = Math.min(vw / b.w, vh / b.h) * 0.95;
  const tall = z < MIN_Z + 0.08;
  if (tall) z = Math.min(1, Math.max(MIN_Z + 0.1, vw / b.w * 0.96));   // too tall: fit the width, start at the top
  Z = Math.min(1.3, Math.max(MIN_Z, z));
  X = leftEdge() + 20 + Math.max(0, (vw - b.w * Z) / 2) - b.x * Z;
  Y = TOP_H + 20 + (tall ? 0 : Math.max(0, (vh - b.h * Z) / 2)) - b.y * Z;
  apply();
}
function fitRow(key) {
  const r = rows.find(r => r.key === key);
  if (r) fitTo({x:r.x - 10, y:r.y - 30, w:r.w + 20, h:r.h + 60});
}
function fit() { if (S.journey >= 0) fitRow("j" + S.journey); else fitTo(bounds); }
function centerOn(el) {
  const x = parseFloat(el.style.left) + el.offsetWidth / 2, y = parseFloat(el.style.top) + el.offsetHeight / 2;
  if (Z < 0.75) Z = 0.9;
  const [cx, cy] = viewCenter();
  X = cx - x * Z; Y = cy - y * Z; apply();
}
let drag = null;
viewport.addEventListener("pointerdown", e => {
  if (e.target.closest(".box,.notecard,.morenotes,button")) return;
  drag = {x:e.clientX, y:e.clientY, X, Y}; viewport.classList.add("dragging"); viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener("pointermove", e => { if (!drag) return; X = drag.X + e.clientX - drag.x; Y = drag.Y + e.clientY - drag.y; apply(); });
viewport.addEventListener("pointerup", () => { drag = null; viewport.classList.remove("dragging"); });
viewport.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
  else { X -= e.deltaX; Y -= e.deltaY; apply(); }
}, {passive:false});
$("#zin").addEventListener("click", () => zoomAt(1.25, ...viewCenter()));
$("#zout").addEventListener("click", () => zoomAt(1 / 1.25, ...viewCenter()));
$("#zfit").addEventListener("click", () => fit());

/* ---------- focus ---------- */
function applyFocus() {
  const on = S.journey >= 0 && KIND[MODEL.maps[S.map].template] === "journeys";
  document.body.classList.toggle("dim", on);
  world.querySelectorAll(".inj").forEach(el => el.classList.toggle("hot", on && el.dataset.row === "j" + S.journey));
  svg.querySelectorAll("path").forEach(p => p.classList.toggle("hot", on && p.dataset.row === "j" + S.journey));
}
function showMap(i) { if (i !== S.map) { S.map = i; S.journey = -1; persist(); render(); } }
function focusJourney(mi, ji) { showMap(mi); S.journey = ji; persist(); applyFocus(); story(); fit(); }
function focusRow(mi, key) { showMap(mi); S.journey = -1; persist(); applyFocus(); story(); fitRow(key); }
function setMode(m) { S.mode = m; persist(); render(); }

/* ---------- top bar ---------- */

function menu(btn, items) {
  const mm = $("#menu");
  const reopen = mm.classList.contains("open") && mm._from === btn;
  mm.classList.remove("open");
  document.querySelectorAll("#top [aria-expanded]").forEach(b => b.setAttribute("aria-expanded", "false"));

  const r = btn.getBoundingClientRect();

  mm.classList.add("open"); btn.setAttribute("aria-expanded", "true");
  mm.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { mm.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); act(b.dataset.a); }));

document.addEventListener("click", e => { if (!e.target.closest("#menu,#tshare,#tview")) $("#menu").classList.remove("open"); });
function act(a) {
  if (a === "tech") { S.tech = !S.tech; persist(); render(); if (current) open(current.kind, current.arg); toast(S.tech ? "Technical names shown" : "Technical names hidden"); }
  if (a === "notes") { S.notesOnMap = !S.notesOnMap; persist(); render(); toast(S.notesOnMap ? "Notes shown beside the boxes" : "Notes shown as a count on each box"); }
  if (a === "roles") open("roles");
  if (a === "story") setStory(!S.story);
  if (a === "dots") { S.dots = !S.dots; persist(); document.body.classList.toggle("dots", S.dots); }
  if (a === "key") open("key");
  if (a === "save") saveReview();
  if (a === "copy") copyQuestions();
  if (a === "print") window.print();
  if (a === "reset" && confirm("Clear your answers, dots and decision notes on this computer?")) {
    S.answers = {}; S.votes = {}; S.decisions = {}; persist(); if (current) open(current.kind, current.arg); topBar();
  }
}

/* ---------- left story list ---------- */
function setStory(on) { S.story = on; persist(); document.body.classList.toggle("nostory", !on); story(); }
$("#storytab").addEventListener("click", () => setStory(true));
function story() {
  const el = $("#story");
  if (!S.story) { el.innerHTML = ""; return; }
  const views = MODEL.maps.map((m, mi) => {
    const kind = KIND[m.template];
    const cur = mi === S.map;
    let sub = "";
    if (kind === "journeys") sub = (m.journeys || []).map((j, ji) => `<li><button class="view" data-j="${mi}:${ji}" aria-current="${cur && S.journey === ji}"><b><span class="num">${mi + 1}.${ji + 1}</span>${esc(j.title)}</b><span>${esc(j.summary || plural((j.steps || []).length, "step"))}</span></button></li>`).join("");
    if (kind === "chain") sub = (m.stages || []).map((st, si) => `<li><button class="view" data-row="${mi}:s${si}"><b><span class="num">${mi + 1}.${si + 1}</span>${esc(st.label)}</b><span>${esc(st.sub || "")}</span></button></li>`).join("");
    if (kind === "tree") sub = (m.root.children || []).map((b, bi) => `<li><button class="view" data-row="${mi}:b${bi}"><b><span class="num">${mi + 1}.${bi + 1}</span>${esc(b.title)}</b><span>${plural((b.children || []).length, "idea")}</span></button></li>`).join("");
    const seg = kind === "chain" && cur ? `<div class="seg" role="group" aria-label="Today or planned"><button data-mode="today" aria-pressed="${S.mode === "today"}">Today</button><button data-mode="planned" aria-pressed="${S.mode === "planned"}">Planned</button></div>` : "";
    return `<li><button class="view" data-map="${mi}" aria-current="${cur && S.journey < 0}"><b><span class="num">${mi + 1}.</span>${esc(m.title)}</b><span>${esc(m.intro || "")}</span></button>${seg}<ol class="sub">${sub}</ol></li>`;
  }).join("");
  el.innerHTML = `<button class="hide" data-hide>Hide list</button>
    <div class="small">The decision</div><p class="q">${gl(MODEL.question, true)}</p>
    ${MODEL.reading ? `<details class="reading"><summary>How to read this</summary><p>${gl(MODEL.reading, true)}</p></details>` : ""}
    <button class="walkbtn" data-walk>Walk me through it</button>
    <h2>Views</h2><ol>${views}</ol>
    <h2>Deciding</h2><div class="more">
      <button data-open="questions">Questions to decide (${questionList().length})</button>
      ${DECISIONS.length ? `<button data-open="decisions">Decisions (${DECISIONS.length})</button>` : ""}
      ${GAPS.length ? `<button data-open="gaps">Gaps, ranked (${GAPS.length})</button>` : ""}
      <button data-open="evidence">Evidence and sources (${(MODEL.evidence || []).length})</button>
      <button data-open="roles">Whose notes to show</button>
    </div>
    ${MODEL.summary ? `<h2>About this decision</h2><p class="small">${gl(MODEL.summary, true)}</p>` : ""}`;
  el.querySelector("[data-hide]").addEventListener("click", () => setStory(false));
  el.querySelector("[data-walk]").addEventListener("click", () => walk(0));
  el.querySelectorAll("[data-map]").forEach(b => b.addEventListener("click", () => { showMap(+b.dataset.map); S.journey = -1; persist(); applyFocus(); story(); fit(); }));
  el.querySelectorAll("[data-j]").forEach(b => b.addEventListener("click", () => { const [mi, ji] = b.dataset.j.split(":").map(Number); focusJourney(mi, ji); }));
  el.querySelectorAll("[data-row]").forEach(b => b.addEventListener("click", () => { const [mi, key] = b.dataset.row.split(":"); focusRow(+mi, key); }));
  el.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  el.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => open(b.dataset.open)));
  wireTerms(el);
}

/* ---------- walk-through ---------- */
function steps() {
  const out = [{title:"The decision", text:MODEL.question + (MODEL.summary ? " " + MODEL.summary : ""), go:() => { showMap(0); S.journey = -1; applyFocus(); story(); fit(); }}];
  if (MODEL.reading) out.push({title:"How to read this", text:MODEL.reading, go:() => { showMap(0); S.journey = -1; applyFocus(); story(); fit(); }});
  MODEL.maps.forEach((m, mi) => {
    const kind = KIND[m.template];
    out.push({title:m.title, text:m.intro || "", go:() => { showMap(mi); S.journey = -1; applyFocus(); story(); fit(); }});
    if (kind === "journeys") (m.journeys || []).forEach((j, ji) => {
      const moments = (j.steps || []).filter(s => s.moment).map(s => s.text);
      out.push({title:`${ji + 1}. ${j.title}`, text:(j.summary || "") + ` ${plural((j.steps || []).length, "step")}.` + (moments.length ? ` Moments that matter: ${moments.join("; ")}.` : ""), go:() => focusJourney(mi, ji)});
    });
    if (kind === "chain") (m.stages || []).forEach((st, si) => {
      const items = (st.items || []).filter(it => (it.when || "both") === "both" || it.when === S.mode).map(it => it.title);
      out.push({title:`${si + 1}. ${st.label}`, text:`${st.sub || ""}. ${items.length ? items.join("; ") + "." : "Nothing here yet."}`, go:() => focusRow(mi, "s" + si)});
    });
    if (kind === "tree") (m.root.children || []).forEach((b, bi) => {
      out.push({title:b.title, text:`Ideas: ${(b.children || []).map(c => c.title).join("; ") || "none yet"}.`, go:() => focusRow(mi, "b" + bi)});
    });
  });
  if (GAPS.length) {
    const best = GAPS.slice().sort((a, b) => ((b.impact || 0) * 2 - (b.effort || 0)) - ((a.impact || 0) * 2 - (a.effort || 0)))[0];
    out.push({title:"Gaps between today and planned", text:`${plural(GAPS.length, "gap")}. Best value first: ${best.title}.`, panel:true, go:() => open("gaps")});
  }
  const qs = questionList();
  const must = qs.filter(q => q.urgency === "must").length;
  out.push({title:"What we need to decide", text:`${plural(qs.length, "question")}, ${must} that must be decided. Answer them on the right, then use Share my answers.`, panel:true, go:() => open("questions")});
  return out;
}
let walkAt = -1;
function walk(i) {
  const list = steps();
  if (i < 0 || i >= list.length) return endWalk();
  walkAt = i;
  hideHint();
  const s = list[i];
  if (!s.panel) close();
  s.go();
  const w = $("#walk");
  w.innerHTML = `<div class="step">Step ${i + 1} of ${list.length}</div><h3>${esc(s.title)}</h3><p>${gl(s.text)}</p>
    <div class="row"><button data-w="back"${i === 0 ? " disabled" : ""}>Back</button><span class="grow"></span>
    <button data-w="end">End the walk-through</button><button class="next" data-w="next">${i === list.length - 1 ? "Finish" : "Next"}</button></div>`;
  w.classList.add("open");
  w.querySelector('[data-w="back"]').addEventListener("click", () => walk(walkAt - 1));
  w.querySelector('[data-w="next"]').addEventListener("click", () => walk(walkAt + 1));
  w.querySelector('[data-w="end"]').addEventListener("click", endWalk);
  w.querySelector('[data-w="next"]').focus();
  wireTerms(w);
}
function endWalk() { walkAt = -1; $("#walk").classList.remove("open"); }

/* ---------- first-visit hint ---------- */
function hint() {
  if (S.hintSeen) return;
  const h = $("#hint");
  h.innerHTML = `<b>New here?</b> Press <b>Walk me through it</b> on the left for a short tour, or click any box to read about it. Answer questions on the right, then use <b>Share my answers</b>.<br><button id="hintok">Got it</button>`;
  h.classList.add("open");
  $("#hintok").addEventListener("click", hideHint);
}
function hideHint() { $("#hint").classList.remove("open"); if (!S.hintSeen) { S.hintSeen = true; persist(); } }

/* ---------- right panel ---------- */
let current = null;
function open(kind, arg) {
  current = {kind, arg};
  const p = $("#panel");
  const [title, html] = PANELS[kind](arg);
  p.innerHTML = `<header><h2 id="ptitle">${title}</h2><button id="pclose">Close</button></header>
    <div class="body">${kind === "box" || kind === "note" ? `<label class="switch"><input type="checkbox" id="techsw"${S.tech ? " checked" : ""}> Show technical names</label>` : ""}${html}</div>`;

function evidenceHtml(refs) {
  return (refs || []).map(r => {
    const e = EVID[r]; if (!e) return "";

function wirePanel(p) {
  p.querySelectorAll("[data-jump-to]").forEach(b => b.addEventListener("click", () => jumpTo(b.dataset.jumpTo)));
  p.querySelectorAll("[data-open-gap]").forEach(b => b.addEventListener("click", () => { open("gaps"); const c = $("#gap-" + CSS.escape(b.dataset.openGap)); if (c) c.scrollIntoView(); }));
  p.querySelectorAll("[data-open-note]").forEach(b => b.addEventListener("click", () => open("note", NOTES.find(n => n.id === b.dataset.openNote))));
  p.querySelectorAll("[data-open-decision]").forEach(b => b.addEventListener("click", () => open("decisions")));
  p.querySelectorAll("[data-ans]").forEach(b => b.addEventListener("click", () => {
    const a = S.answers[b.dataset.ans] = S.answers[b.dataset.ans] || {};
    a.choice = a.choice === b.dataset.choice ? "" : b.dataset.choice; persist();
    b.parentElement.querySelectorAll("[data-ans]").forEach(x => x.setAttribute("aria-pressed", x.dataset.choice === a.choice));
  }));
  p.querySelectorAll("[data-comment]").forEach(t => t.addEventListener("input", () => {
    (S.answers[t.dataset.comment] = S.answers[t.dataset.comment] || {}).comment = t.value; persist();
  }));
  p.querySelectorAll("[data-dot]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.dot, d = +b.dataset.d, v = S.votes[id] || 0;
    if (d > 0 && dotsLeft() <= 0) return toast("No dots left. Take one back from another question first.");
    S.votes[id] = Math.max(0, v + d); if (!S.votes[id]) delete S.votes[id]; persist();
    b.parentElement.querySelector(".n").textContent = S.votes[id] || 0;
    const dl = $("#dleft"); if (dl) dl.textContent = dotsLeft();
  }));
  p.querySelectorAll("[data-dec]").forEach(f => f.addEventListener(f.tagName === "SELECT" ? "change" : "input", () => {
    (S.decisions[f.dataset.dec] = S.decisions[f.dataset.dec] || {})[f.dataset.k] = f.value; persist();
  }));
  const rv = $("#reviewer", p); if (rv) rv.addEventListener("input", () => { S.reviewer = rv.value; persist(); });
  p.querySelectorAll("[data-role]").forEach(c => c.addEventListener("change", () => { S.roles[c.dataset.role] = c.checked; persist(); render(); }));
  p.querySelectorAll("[data-roles]").forEach(b => b.addEventListener("click", () => {
    ROLES.forEach(r => S.roles[r.id] = b.dataset.roles === "all"); persist(); render(); open("roles");
  }));
  const gs = $("#gsort", p); if (gs) gs.addEventListener("change", () => open("gaps", gs.value));
  const vo = $("#voiceonly", p); if (vo) vo.addEventListener("change", () => open("evidence", vo.checked));
  wireTerms(p);
}
function jumpTo(id) {
  const info = BOX[id];
  if (info && info.kind === "gap") return open("gaps");
  const mi = mapOfAnchor(id);
  if (mi >= 0) showMap(mi);
  if (info && info.kind === "item" && !nodes[id]) setMode(info.box.when === "today" ? "today" : "planned");
  if (S.journey >= 0 && info && info.ji !== S.journey) { S.journey = -1; applyFocus(); story(); }
  const el = nodes[id];
  if (el) { world.querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); el.classList.add("sel"); centerOn(el); }
}

/* ---------- clicks on the map ---------- */
function activate(el) {
  const d = el._data; if (!d) return;
  hideHint();
  if (d.type === "box") open("box", d.id);
  else if (d.type === "note") open("note", d.n);
  else if (d.type === "notes") open("notes", d);
  else if (d.type === "outcome") open("outcome", d.o);
}
world.addEventListener("click", e => { const el = e.target.closest("[role=button]"); if (el && el._data) activate(el); });
world.addEventListener("keydown", e => {
  const el = e.target.closest("[role=button]");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); activate(el); }
});
world.addEventListener("focusin", e => {
  const el = e.target.closest("[role=button]");
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (r.right < leftEdge() || r.left > innerWidth - rightEdge() || r.bottom < TOP_H || r.top > innerHeight) centerOn(el);
});

/* ---------- glossary ---------- */
const gbox = $("#gloss");
function showTerm(el) {
  const k = el.dataset.term; if (!GLOSS[k]) return;
  gbox.innerHTML = `<b>${esc(k)}</b>${esc(GLOSS[k])}`;
  gbox.style.display = "block";
  const r = el.getBoundingClientRect();
  gbox.style.left = Math.min(innerWidth - 320, Math.max(8, r.left)) + "px";
  gbox.style.top = (r.bottom + 8 + 120 > innerHeight ? r.top - gbox.offsetHeight - 8 : r.bottom + 8) + "px";
}
const hideTerm = () => { gbox.style.display = "none"; };
function wireTerms(root) {
  root.querySelectorAll(".term").forEach(t => {
    t.addEventListener("mouseenter", () => showTerm(t)); t.addEventListener("mouseleave", hideTerm);
    t.addEventListener("focus", () => showTerm(t)); t.addEventListener("blur", hideTerm);
    t.addEventListener("click", e => { e.stopPropagation(); showTerm(t); });
  });
}
world.addEventListener("mouseover", e => { const t = e.target.closest(".term"); if (t) showTerm(t); });
world.addEventListener("mouseout", e => { if (e.target.closest(".term")) hideTerm(); });

function reviewData() {

    reviewer:S.reviewer || "", saved_at:new Date().toISOString(), answers:S.answers, dots:S.votes, decisions:S.decisions};
}
function saveReview() {
  const blob = new Blob([JSON.stringify(reviewData(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  const who = (S.reviewer || "reviewer").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  a.href = URL.createObjectURL(blob); a.download = `review-${who || "reviewer"}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Saved. Send the file to whoever runs the review.");
}
function copyQuestions() {
  let out = `# Questions to decide: ${MODEL.title}\n`, cur = null;
  questionList().forEach(q => {
    if (q.urgency !== cur) { cur = q.urgency; out += `\n## ${URG[cur]}\n\n`; }
    const a = S.answers[q.id] || {};
    out += `- ${q.n.question} (${(ROLE[q.n.role] || {label:q.n.role}).label})${a.choice ? ` — my answer: ${a.choice}` : ""}${a.comment ? ` — ${a.comment}` : ""}\n`;
  });
  const done = () => toast("Copied as a list");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out).then(done, () => fallbackCopy(out, done));
  else fallbackCopy(out, done);
}
function fallbackCopy(text, done) {
  const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("Could not copy on this browser."); }
  t.remove();
}
let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", 2600); }

/* ---------- optional keyboard shortcuts ---------- */
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,select")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "escape") { $("#menu").classList.remove("open"); hideTerm(); if (walkAt >= 0) endWalk(); else close(); return; }
  if (walkAt >= 0 && (k === "arrowright" || k === "arrowleft")) { walk(walkAt + (k === "arrowright" ? 1 : -1)); e.preventDefault(); return; }
  const m = MODEL.maps[S.map];
  if (/^[1-9]$/.test(k) && +k <= MODEL.maps.length) { showMap(+k - 1); fit(); }
  else if (k === "w") walk(0);
  else if (k === "f") fit();
  else if (k === "+" || k === "=") zoomAt(1.25, ...viewCenter());
  else if (k === "-") zoomAt(1 / 1.25, ...viewCenter());
  else if (k === "q") open("questions");
  else if (k === "n") act("notes");
  else if (k === "x") act("tech");
  else if (k === "?") open("keys");
  else if (k === "t" && KIND[m.template] === "chain") setMode(S.mode === "today" ? "planned" : "today");
  else return;
  e.preventDefault();
});

/* ---------- print: fit the view to the page width ---------- */
let before = null;
addEventListener("beforeprint", () => { before = {Z, X, Y}; Z = Math.min(1, 1000 / bounds.w); X = 0; Y = 0; apply(); });
addEventListener("afterprint", () => { if (before) { ({Z, X, Y} = before); apply(); } });

/* ---------- start ---------- */
document.title = MODEL.title;
document.body.classList.toggle("dots", S.dots);
document.body.classList.toggle("nostory", !S.story);
render();
fit();
hint();
addEventListener("resize", () => apply());
})();

</script>
</body>
