xes","kind":"observation","date":"2026-03-19","ref":"material/other-boxes.md"}],"evidence":[{"id":"E1","source":"S1","kind":"quote","voice":true,"text":"I'd pay for a box if I could skip a month when we're away. I hate being locked in.","where":"Regular, Mill Lane"},{"id":"E2","source":"S1","kind":"quote","voice":true,"text":"Friday treats for the team would be great, but I need an invoice, not a card charge.","where":"Office buyer, Station Road"},{"id":"E3","source":"S1","kind":"quote","voice":true,"text":"What's in it each month? I don't want six things I won't eat.","where":"New customer, Mill Lane"},{"id":"E4","source":"S1","kind":"quote","voice":true,"text":"If there's nothing for me, I'm out.","where":"Gluten-free regular, Mill Lane"},{"id":"E5","source":"S1","kind":"quote","voice":true,"text":"£25 a month feels right. £35 feels like a treat I'd cancel.","where":"Regular, Mill Lane"},{"id":"E6","source":"S2","kind":"data","text":"A trial box costs £11.40 in ingredients and packaging, plus about 14 minutes of staff time to pack.","where":"Costs section"},{"id":"E7","source":"S2","kind":"data","text":"9% of baked goods are thrown away or given away at closing.","where":"Waste"},{"id":"E8","source":"S2","kind":"data","text":"Local courier: £4.20 per drop within 3 miles, Tuesday or Friday only.","where":"Quotes"},{"id":"E9","source":"S3","kind":"quote","text":"Friday afternoon is already our tightest time.","where":"Head baker"},{"id":"E10","source":"S3","kind":"observation","text":"The counter team can take sign-ups but not chase failed payments.","where":"Mill Lane manager"},{"id":"E11","source":"S2","kind":"data","text":"Roughly 380 customers visit at least once a week.","where":"Loyalty card data"},{"id":"E12","source":"S3","kind":"observation","text":"Nobody owns the customer list today. Loyalty data lives in the till system.","where":"Meeting notes"},{"id":"E13","source":"S4","kind":"data","text":"Monday waste is 13% of what is baked; Saturday is 5%.","where":"Waste by day"},{"id":"E14","source":"S4","kind":"data","text":"Ovens sit idle from 1pm to 4pm Monday to Thursday.","where":"Notes under the table"},{"id":"E15","source":"S4","kind":"data","text":"Early-week waste is mostly sourdough and seeded loaves.","where":"Notes under the table"},{"id":"E16","source":"S5","kind":"data","text":"41 of 64 regulars said they would probably or definitely try a monthly box.","where":"Survey totals"},{"id":"E17","source":"S5","kind":"data","text":"Of those 41, 29 prefer collecting and 12 prefer delivery.","where":"Survey totals"},{"id":"E18","source":"S5","kind":"data","text":"24 of 64 ticked £25 as a fair price; only 8 ticked £30 or more.","where":"Price question"},{"id":"E19","source":"S5","kind":"data","text":"11 of 64 (17%) avoid gluten, nuts or dairy.","where":"Diet question"},{"id":"E20","source":"S5","kind":"data","text":"19 of 64 would want to skip at least one month a year.","where":"Skip question"},{"id":"E21","source":"S5","kind":"quote","text":"Let me choose the bread.","where":"Free comment, 7 slips","voice":true},{"id":"E22","source":"S5","kind":"quote","text":"Text me, don't email me.","where":"Free comment, 6 slips","voice":true},{"id":"E23","source":"S5","kind":"quote","text":"Would buy one as a gift.","where":"Free comment, 5 slips","voice":true},{"id":"E24","source":"S6","kind":"data","text":"If a stored-card charge fails, the till marks it declined in a daily report. It does not retry and does not tell the customer.","where":"Payments"},{"id":"E25","source":"S6","kind":"data","text":"The till can send a text through an add-on at 4p per message.","where":"Messages"},{"id":"E26","source":"S6","kind":"data","text":"Any staff login can see every customer's name, phone, email and points.","where":"Customer records"},{"id":"E27","source":"S6","kind":"data","text":"The till cannot raise invoices. The office buyer is invoiced by hand, about 20 minutes a month.","where":"Invoices"},{"id":"E28","source":"S7","kind":"observation","text":"All three local boxes show a photo of this month's box on their front page.","where":"Websites"},{"id":"E29","source":"S7","kind":"observation","text":"The cheese shop lets people skip any month online before the 20th; the veg box allows four weeks of pause a year.","where":"Skip rules"},{"id":"E30","source":"S7","kind":"observation","text":"None of the three offer an allergy swap.","where":"Allergy swaps"},{"id":"E31","source":"S3","kind":"observation","text":"Owner wants the box to cut waste, not add to it, and proposes baking box items on Thursday.","where":"Owner"},{"id":"E32","source":"S3","kind":"observation","text":"Idea: let subscribers pick up on Saturday, when shops are busy anyway.","where":"Ideas"}],"maps":[{"id":"m-journey","template":"customer-journey","title":"A subscriber's month","intro":"What a regular would go through, from hearing about the box to staying or leaving. Each column is a phase.","lanes":[{"id":"notice","label":"Notice","sub":"They find out"},{"id":"start","label":"Start","sub":"Sign up"},{"id":"use","label":"Use","sub":"Each month"},{"id":"help","label":"Get help","sub":"When something is wrong"},{"id":"stay","label":"Stay or leave","sub":"What happens next"}],"journeys":[{"id":"j-signup","title":"A regular signs up","summary":"From seeing the sign at the counter to their first box being ready.","creates":["A subscriber record","A stored card, or an invoice line","A first entry on the packing list"],"steps":[{"id":"su1","lane":"notice","text":"Sees a card by the till: 'Our bread, every month', with a photo of this month's box","status":"planned","detail":"Counter card and a framed photo, changed on the first Monday of the month.","feeling":"good","evidence":["E28"]},{"id":"su2","lane":"start","text":"Asks what is in it and how much","status":"missing","detail":"No fixed contents list or price exists yet; staff answer from memory.","pain":"No fixed answer yet; staff guess.","moment":true,"evidence":["E3"]},{"id":"su3","lane":"start","text":"Picks collect or delivery, and a size","status":"planned","detail":"Two sizes: small (loaf, 4 pastries) and family (2 loaves, 8 pastries, jam).","evidence":["E8","E17"]},{"id":"su4","lane":"start","text":"Pays by card at the counter, or asks for an invoice","status":"partial","detail":"Till can store a card for repeat charges; invoices are written by hand today.","evidence":["E2","E27"]},{"id":"su4b","lane":"start","text":"Says if they avoid gluten, nuts or dairy","status":"missing","detail":"Diet needs would sit as a note on the till customer record; no field exists for it.","moment":true,"evidence":["E4","E19"]},{"id":"su4c","lane":"start","text":"Gives a mobile number for reminders","status":"partial","detail":"Till already stores phone numbers; texting needs the 4p-a-message add-on.","evidence":["E22","E25"]},{"id":"su4d","lane":"use","text":"Their name is added to next month's packing list","status":"missing","detail":"Packing list would be printed from the till's subscriber report every Thursday morning.","evidence":["E12"]},{"id":"su5","lane":"use","text":"Gets a text the day before: 'Your box is ready Saturday'","status":"missing","detail":"Text sent through the till add-on on Friday at 5pm.","evidence":["E25"]}]},{"id":"j-month","title":"Each month after that","summary":"Collecting, opening, skipping and paying, month by month.","creates":["A monthly charge","A packed box with a name label","A skip, if asked for"],"steps":[{"id":"mo0","lane":"use","text":"Sees what is coming next month","status":"missing","detail":"A photo and list posted at the counter and sent in the reminder text on the 25th.","evidence":["E28","E3"]},{"id":"mo1","lane":"use","text":"Collects on Saturday, or the courier drops it Friday","status":"planned","detail":"Boxes kept on a labelled shelf behind the counter; courier drops Tuesday or Friday only.","feeling":"good","evidence":["E8","E32"]},{"id":"mo2","lane":"use","text":"Opens the box and finds something they cannot eat","status":"missing","detail":"Swaps are not tracked; packers would need the diet note on the packing list.","pain":"A gluten-free regular said they would leave.","feeling":"bad","moment":true,"evidence":["E4","E30"]},{"id":"mo2b","lane":"use","text":"Wants a different bread this month","status":"missing","detail":"No way to choose; the box is fixed.","evidence":["E21"]},{"id":"mo3","lane":"help","text":"Wants to skip next month while away","status":"missing","detail":"Would be a text reply 'SKIP' before Wednesday, or a word at the counter.","moment":true,"evidence":["E1","E20","E29"]},{"id":"mo4","lane":"help","text":"Card payment fails; someone has to follow up","status":"missing","detail":"Till marks the charge declined in the daily report, with no retry and no message.","pain":"The counter team cannot chase payments.","feeling":"bad","evidence":["E10","E24"]},{"id":"mo4b","lane":"help","text":"Box not collected by closing on Saturday","status":"missing","detail":"No rule yet: hold until Sunday, give to charity Monday, or refund.","evidence":["E7"]},{"id":"mo5","lane":"stay","text":"Stays, upgrades, or cancels","status":"planned","detail":"Cancel by text or at the counter before the 20th; no fee.","evidence":["E29"]}]},{"id":"j-gift","title":"Someone buys a box as a gift","summary":"A customer pays for three months for someone else.","creates":["A gift record with two people on it","Three charges, or one up-front payment"],"steps":[{"id":"gi1","lane":"notice","text":"Asks at the counter: 'Can I buy one for my mum?'","status":"missing","detail":"Five survey slips asked for gifts; no gift option exists.","moment":true,"evidence":["E23"]},{"id":"gi2","lane":"start","text":"Chooses three months, collect or delivery","status":"missing","detail":"Would be one up-front card payment for three boxes.","evidence":["E23"]},{"id":"gi3","lane":"start","text":"Gives the other person's name and phone","status":"missing","detail":"Holding a second person's details needs their OK before we text them.","evidence":["E26"]},{"id":"gi4","lane":"use","text":"The other person gets a text saying a gift is waiting","status":"missing","detail":"Text through the till add-on.","feeling":"good","evidence":["E25"]},{"id":"gi5","lane":"use","text":"Collects three months in a row","status":"planned","detail":"Same shelf and label as any subscriber."},{"id":"gi6","lane":"stay","text":"After the gift ends, is asked if they want to carry on","status":"missing","detail":"One text after the last box; no follow-ups after that."}]}]},{"id":"m-counter","template":"service-blueprint","title":"Behind the counter","intro":"The same box from the shop's side: baking, packing, collecting, and money. The top row is what the subscriber sees; lower rows are out of sight.","lanes":[{"id":"person","label":"Subscriber","sub":"What they do"},{"id":"front","label":"Counter","sub":"Staff they meet"},{"id":"back","label":"Bakehouse","sub":"Baking and packing out of sight"},{"id":"support","label":"Till and suppliers","sub":"Systems, courier, card fees"},{"id":"proof","label":"What they keep","sub":"Texts, labels, receipts"}],"journeys":[{"id":"j-bake","title":"Thursday bake and pack","summary":"Baking box items in the quiet Thursday afternoon, then packing for Saturday.","creates":["Thursday bake sheet","Packed boxes with name labels","Updated waste log"],"steps":[{"id":"bk1","lane":"support","text":"Thursday 9am: print the packing list from the till","status":"missing","detail":"Till subscriber report, filtered to active, not skipped, paid.","evidence":["E12"]},{"id":"bk2","lane":"back","text":"Head baker adds box items to the Thursday bake sheet","status":"planned","detail":"Uses ovens that sit idle 1pm to 4pm.","moment":true,"evidence":["E14","E31"]},{"id":"bk3","lane":"back","text":"Bake sourdough and seeded loaves for boxes first","status":"planned","detail":"These are the loaves most often wasted early in the week.","evidence":["E15"]},{"id":"bk4","lane":"back","text":"Bake gluten-free swaps in a separate batch","status":"missing","detail":"Needs a cleaned tray, separate cooling rack and a labelled bag.","pain":"Cross-contact risk if done in the same batch.","evidence":["E4","E19"]},{"id":"bk5","lane":"back","text":"Friday morning: pack boxes and label with name and size","status":"partial","detail":"About 14 minutes per box today; target under 8 with a packing table.","evidence":["E6","E9"]},{"id":"bk6","lane":"back","text":"Put swap boxes on their own shelf, labelled 'GF'","status":"missing","detail":"Colour label so the counter team cannot mix them up.","evidence":["E30"]},{"id":"bk7","lane":"support","text":"Book the courier for Friday drops","status":"planned","detail":"£4.20 per drop within 3 miles; call by Thursday noon.","evidence":["E8"]},{"id":"bk8","lane":"back","text":"Log anything left over on Monday as waste","status":"works","detail":"Same waste log as today, with a new 'box' line.","evidence":["E7","E13"]}]},{"id":"j-collect","title":"Saturday collection at the counter","summary":"A subscriber picks up their box during the busy Saturday morning.","creates":["A collected mark on the list","A receipt text"],"steps":[{"id":"co1","lane":"person","text":"Arrives and says their name","status":"planned","evidence":["E32"]},{"id":"co2","lane":"front","text":"Counter finds the box on the labelled shelf","status":"planned","detail":"Shelf sorted by surname; GF shelf separate.","evidence":["E9"]},{"id":"co3","lane":"front","text":"Ticks them off on the printed list","status":"planned","detail":"Paper list kept by the till; typed in on Monday."},{"id":"co4","lane":"person","text":"Asks to swap the bread this week","status":"missing","detail":"No spare stock set aside; counter would swap from the shelf if possible.","evidence":["E21"]},{"id":"co5","lane":"front","text":"Mentions next month's box and the skip deadline","status":"planned","detail":"A short script on the back of the packing list.","evidence":["E3","E20"]},{"id":"co6","lane":"proof","text":"Gets a receipt text","status":"partial","detail":"Till sends receipts by text only if the add-on is on.","evidence":["E22","E25"]},{"id":"co7","lane":"front","text":"Box still on the shelf at closing","status":"missing","detail":"Rule needed; see 'Box not collected'.","evidence":["E7"]}]},{"id":"j-money","title":"Money each month","summary":"Charging cards, handling declines, and seeing whether the box pays.","creates":["Monthly charges","A declined list","A monthly profit line for the box"],"steps":[{"id":"mn1","lane":"support","text":"On the 1st, the till charges every stored card","status":"partial","detail":"Card fee 1.7% per charge; subscription service would be 3%.","evidence":["E24"]},{"id":"mn2","lane":"support","text":"Declined charges land in the daily report","status":"partial","detail":"No retry, no message to the customer.","pain":"Nobody reads the report on a busy morning.","evidence":["E24"]},{"id":"mn3","lane":"front","text":"Someone texts the customer to update their card","status":"missing","detail":"Manager would own this; counter team cannot chase.","moment":true,"evidence":["E10"]},{"id":"mn4","lane":"back","text":"Box held until the payment goes through","status":"missing","detail":"Hold, don't pack; confirmed by the owner in review.","evidence":["E10"]},{"id":"mn5","lane":"support","text":"Office buyer gets a typed invoice","status":"partial","detail":"Written by hand, about 20 minutes a month.","evidence":["E27","E2"]},{"id":"mn6","lane":"back","text":"Owner checks the month: boxes sold, cost, waste","status":"missing","detail":"One spreadsheet line per month: boxes, revenue, ingredients, packing time, waste.","evidence":["E6","E13"]},{"id":"mn7","lane":"proof","text":"Subscriber can see what they paid","status":"partial","detail":"Receipt text per charge; no statement.","evidence":["E25"]}]}]},{"id":"m-chain","template":"decision-chain","title":"From what we heard to what we would launch","intro":"Each stage is one step from a customer's words to a box on the shelf, and whether it worked.","stages":[{"id":"c-source","label":"Source","verb":"backs up","sub":"Where it was said or measured","items":[{"id":"ci1","title":"Counter chats","text":"Six regulars, two shops, written up the same day.","status":"works","when":"both","evidence":["E1","E5"]},{"id":"ci2","title":"Till and loyalty data","text":"A year of sales and weekly visits.","status":"works","when":"both","evidence":["E11"]},{"id":"ci2b","title":"Survey slips","text":"64 slips from both counters in one week.","status":"works","when":"both","evidence":["E16"]},{"id":"ci2c","title":"Waste log","text":"Four weeks of counts at closing.","status":"works","when":"both","evidence":["E13"]}]},{"id":"c-evidence","label":"Evidence","verb":"informs","sub":"The exact words or numbers we rely on","items":[{"id":"ci3","title":"Price people would pay","text":"£25 feels right; £35 feels like a treat people cancel.","status":"works","when":"both","evidence":["E5","E18"]},{"id":"ci4","title":"Pausing matters","text":"Being locked in is the main reason to say no.","status":"works","when":"both","evidence":["E1","E20"]},{"id":"ci4b","title":"Diet needs are common","text":"About one in six avoid gluten, nuts or dairy.","status":"works","when":"both","evidence":["E19","E4"]},{"id":"ci4c","title":"Early-week waste and idle ovens","text":"Waste peaks Monday; ovens idle weekday afternoons.","status":"works","when":"both","evidence":["E13","E14"]}]},{"id":"c-decision","label":"Decision","verb":"shapes","sub":"What we chose, and why","items":[{"id":"ci5","title":"Start with collection only","text":"Most people prefer collecting, and delivery eats the margin.","status":"planned","when":"planned","evidence":["E17","E8"]},{"id":"ci5b","title":"Saturday pickup, Thursday bake","text":"Avoids the tight Friday afternoon and uses idle ovens.","status":"planned","when":"planned","evidence":["E9","E14"]}]},{"id":"c-intent","label":"Intent","verb":"spells out","sub":"The result we want, in plain words","items":[{"id":"ci6","title":"Steady weekday income, less waste","text":"Bake to a known number midweek instead of guessing.","status":"planned","when":"planned","evidence":["E31"]}]},{"id":"c-spec","label":"Spec","verb":"plans","sub":"What it must do, and how we will know","items":[{"id":"ci7","title":"One box, two sizes, a gluten-free swap","text":"Small £18, family £25. Skip by text before Wednesday.","status":"planned","when":"planned","evidence":["E18","E19"]},{"id":"ci7b","title":"Payment and skip rules","text":"Hold unpaid boxes; unlimited skips with a deadline.","status":"planned","when":"planned","evidence":["E24","E29"]}]},{"id":"c-plan","label":"Plan","verb":"produces","sub":"Pieces of work, in order","items":[{"id":"ci8","title":"Pilot at Mill Lane for 8 weeks","text":"Collection only, capped at 30 boxes.","status":"planned","when":"planned","evidence":["E16"]},{"id":"ci8b","title":"Before launch","text":"Counter card and photo, packing list, text add-on, GF shelf.","status":"planned","when":"planned","evidence":["E28","E25"]}]},{"id":"c-work","label":"Work","verb":"creates","sub":"What was actually built or changed","items":[{"id":"ci9","title":"Trial box costed","text":"£11.40 plus 14 minutes of packing.","status":"works","when":"today","evidence":["E6"]},{"id":"ci9b","title":"Customer list cleaned","text":"Not started; nobody owns the list.","status":"missing","when":"today","evidence":["E12"]}]},{"id":"c-outcome","label":"Outcome","verb":"","sub":"Did it work? Measured, not guessed","items":[{"id":"ci10","title":"Measures agreed, not yet measured","text":"Subscribers, waste, cancellations at week eight.","status":"missing","when":"both","evidence":["E7"]}]}]}],"gaps":[{"id":"G1","title":"Let people pause a month","why":"The first thing a regular asked for, and 19 of 64 survey slips want it. Without it, people avoid signing up.","anchors":["mo3"],"impact":5,"effort":2,"stories":[{"as":"As a subscriber going on holiday, I want to skip next month by replying to a text, so I am not charged for bread I cannot collect.","done_when":["a reply of SKIP before Wednesday stops that month's charge","the Saturday packing list leaves that person out","the subscriber gets a text confirming the skip"]},{"as":"As the Mill Lane manager, I want to see who skipped this month, so we bake the right number on Thursday.","done_when":["the Thursday packing list shows the count of skips","skips made at the counter appear on the list the same day"]}]},{"id":"G2","title":"Say what is in the box, and offer a gluten-free swap","why":"People will not pay for things they cannot eat; one in six avoid gluten, nuts or dairy; no other local box offers a swap.","anchors":["su2","mo2","bk4"],"impact":4,"effort":2,"stories":[{"as":"As a new customer, I want to see this month's box before I sign up, so I know it suits us.","done_when":["a photo and list are at the counter from the first Monday of the month","the reminder text on the 25th says what is coming next month"]},{"as":"As a gluten-free regular, I want a swap packed for me every month, so I can stay a subscriber.","done_when":["the diet need is asked once at sign-up","the packing list marks each swap","swap boxes sit on their own labelled shelf"]},{"as":"As the head baker, I want swaps baked in a separate batch, so there is no cross-contact.","done_when":["swaps are baked first on a cleaned tray","they cool on a separate rack and go straight into labelled bags"]}]},{"id":"G3","title":"Someone owns failed payments","why":"The till does not retry or tell the customer, and the counter team cannot chase.","anchors":["mo4","mn3"],"impact":3,"effort":3,"stories":[{"as":"As a subscriber whose card expired, I want a text asking me to update it, so my box is not missed.","done_when":["a text goes out the day a charge is declined","the box is held, not packed, until the charge goes through","a second text goes on day 3, then we stop"]},{"as":"As the Mill Lane manager, I want one short list of declined charges each morning, so it takes two minutes.","done_when":["the list shows only subscribers, not all card payments","each line has name, phone and amount"]}]},{"id":"G4","title":"Invoices for office buyers","why":"Office buyers need an invoice; the till cannot make one and hand-written invoices take 20 minutes a month.","anchors":["su4","mn5"],"impact":3,"effort":4,"stories":[{"as":"As an office buyer, I want a monthly invoice with our company name, so I can claim it back.","done_when":["an invoice goes out on the 1st with the company name and order","it shows the shop's VAT number if we have one"]}]},{"id":"G5","title":"Gift boxes","why":"Five survey slips asked for gifts, and gifts bring in new customers.","anchors":["gi1","gi2","gi3"],"impact":3,"effort":3,"stories":[{"as":"As a customer, I want to buy three months for my mum in one payment, so she gets bread without paying.","done_when":["one up-front payment covers three boxes","the gift ends by itself after three months"]},{"as":"As the person receiving a gift, I want to be asked before I get texts, so I don't feel signed up behind my back.","done_when":["the first text asks them to reply YES to get reminders","if they don't reply, the counter tells them at their first pickup"]}]},{"id":"G6","title":"A rule for boxes not collected","why":"Boxes left on the shelf become waste, and the box is meant to cut waste.","anchors":["mo4b","co7"],"impact":2,"effort":1,"stories":[{"as":"As a subscriber who forgot, I want my box kept until Sunday, so I can still get it.","done_when":["uncollected boxes stay on the shelf until Sunday closing","on Monday they go to the food charity, with no refund"]}]}],"notes":[{"id":"N1","role":"voice","anchor":"mo3","title":"Pausing decides whether people sign up","body":"The regular who asked for this said being locked in is the reason they would say no.","recommend":"Make pausing a one-word text reply, and say so on the counter card.","question":"Do we let people pause as often as they like, or cap it at two months a year?","urgency":"must","evidence":["E1"]},{"id":"N2","role":"designer","anchor":"su2","title":"Show a real box at the counter","body":"People asked what is inside before they asked the price.","recommend":"Put a packed sample box by the till with a card listing this month's items.","question":"Who packs and refreshes the sample box each month?","urgency":"should","evidence":["E3"]},{"id":"N3","role":"engineer","anchor":"mo1","title":"Friday packing clashes with the weekend bake","body":"The head baker named Friday afternoon as the tightest time of the week.","recommend":"Pack Thursday evening for Saturday pickup; no Friday deliveries in the pilot.","question":"Can we commit to Saturday-only pickup for the first eight weeks?","urgency":"must","evidence":["E9"]},{"id":"N4","role":"finance","anchor":"c-spec","title":"The box makes money at £25, but not with delivery","body":"Ingredients, packaging and packing time come to about £14. Card fees take another 43p. Delivery at £4.20 leaves little.","recommend":"Price at £25 for collection and £29 with delivery once delivery starts.","question":"Are we happy with roughly £10 a box before rent and power?","urgency":"must","evidence":["E6","E8"]},{"id":"N5","role":"owner","anchor":"c-decision","title":"Pilot in one shop first","body":"Mill Lane has the most regulars asking. A cap keeps the bake manageable.","recommend":"Pilot at Mill Lane, cap at 30 boxes, review after eight weeks.","question":"What number of subscribers after eight weeks would make us roll it out to all three shops?","urgency":"must","evidence":["E11"]},{"id":"N6","role":"analyst","anchor":"c-outcome","title":"Agree the measures before we start","body":"Without a starting number for waste, we cannot say the box reduced it.","recommend":"Record this month's waste at Mill Lane as the starting point.","question":"Which three numbers do we review at week eight?","urgency":"sh const notesWidth = () => S.notesOnMap ? NOTES_W + 48 : 0;

function header(m, width) {
  place("stamp", 0, 6, 0, (MODEL.checked && MODEL.checked.date) ? `Checked against the sources on ${esc(MODEL.checked.date)}` : "Not yet checked against sources");
  const t = place("maptitle", 0, 40, Math.max(width, 600), esc(m.title || MODEL.title));
  const q = place("mapintro", 0, 40 + t.offsetHeight + 8, Math.min(Math.max(width, 600), 900), gl(m.intro || ""));
  return 40 + t.offsetHeight + 8 + q.offsetHeight + 40;
}

/* ---------- journeys ---------- */
const J = {laneW:260, laneGap:22, stepW:236, stepH:84, rowGap:16, headW:330, headGap:40, bandGap:70};
function renderJourneys(m) {
  const lanes = m.lanes || [];
  const LI = Object.fromEntries(lanes.map((l, i) => [l.id, i]));
  const laneX = i => J.headW + J.headGap + i * (J.laneW + J.laneGap);
  const lanesRight = laneX(lanes.length - 1) + J.laneW;
  const notesX = lanesRight + 48;
  const W = lanesRight + notesWidth();
  let y = header(m, W);
  lanes.forEach((l, i) => place("lanehead", laneX(i), y, J.laneW, `${esc(l.label)}<small>${esc(l.sub || "")}</small>`));
  if (S.notesOnMap) place("label", notesX, y + 4, 0, "Notes from each role");
  y += 60;
  const laneTop = y - 70;
  (m.journeys || []).forEach((j, ji) => {
    const y0 = y;
    const hd = place("box jhead inj", 0, y0, J.headW,
      `<h3><span class="n">${ji + 1}</span>${gl(j.title)}</h3><p>${gl(j.summary || "")}</p>
       ${(j.creates || []).length ? `<p class="sub small"><b>What it leaves behind:</b> ${j.creates.map(esc).join(", ")}</p>` : ""}
       <div class="meta">${badges(j)}<span class="chip">${plural((j.steps || []).length, "step")}</span></div>`,
      {type:"box", id:j.id}, `Journey ${ji + 1}: ${j.title}`);
    hd.dataset.row = "j" + ji;
    nodes[j.id] = hd;
    let sy = y0, prev = null;
    (j.steps || []).forEach((s, k) => {
      const x = laneX(LI[s.lane] || 0) + (J.laneW - J.stepW) / 2;
      const el = place("box step inj", x, sy, J.stepW,
        `<div class="row1"><span class="n">${k + 1}</span><div class="t">${gl(s.text)}</div></div>${tech(s)}
         <div class="meta">${pill(s.status)}${badges(s)}</div>`,
        {type:"box", id:s.id}, `Step ${k + 1} of journey ${ji + 1}: ${s.text}`);
      el.style.minHeight = J.stepH + "px";
      el.dataset.row = "j" + ji;
      nodes[s.id] = el;
      const h = el.offsetHeight;
      if (prev) {
        const p = link(prev.x + J.stepW / 2, prev.y + prev.h, x + J.stepW / 2, sy - 2, "inj");
        p.dataset.row = "j" + ji; arrowHead(x + J.stepW / 2, sy - 2);
      }
      prev = {x, y:sy, h};
      sy += h + J.rowGap;
    });
    const nh = notePile([j.id, ...(j.steps || []).map(s => s.id)], notesX, y0, 4, "j" + ji);
    const h = Math.max(hd.offsetHeight, sy - y0, nh);
    rows.push({key:"j" + ji, y:y0, h, x:0, w:W});
    y = y0 + h + J.bandGap;
  });
  lanes.forEach((l, i) => {
    const bg = document.createElement("div"); bg.className = "lanebg";
    Object.assign(bg.style, {left:(laneX(i) - 8) + "px", top:laneTop + "px", width:(J.laneW + 16) + "px", height:(y - laneTop) + "px"});
    world.prepend(bg);
  });
  return {x:0, y:0, w:W, h:y};
}

/* ---------- chain ---------- */
const C = {stageW:300, stageH:96, itemW:250, itemGap:14, perRow:3, gap:64};
function renderChain(m) {
  const itemsX = C.stageW + 50;
  const notesX = itemsX + C.perRow * (C.itemW + C.itemGap) + 34;
  const W = itemsX + C.perRow * (C.itemW + C.itemGap) + notesWidth();
  let y = header(m, W);
  place("label", 0, y, 0, "Stage");
  place("label", itemsX, y, 0, S.mode === "planned" ? "Planned (dashed border = new)" : "What exists today");
  if (S.notesOnMap) place("label", notesX, y, 0, "Notes from each role");
  y += 30;
  let prevStage = null;
  (m.stages || []).forEach((st, si) => {
    const y0 = y;
    const items = (st.items || []).filter(it => (it.when || "both") === "both" || it.when === S.mode);
    const stEl = place("box stage inj", 0, y0, C.stageW,
      `<h3>${gl(st.label)}</h3><p>${gl(st.sub || "")}</p>${tech(st)}<div class="meta">${badges(st)}</div>`,
      {type:"box", id:st.id}, `Stage ${si + 1}: ${st.label}`);
    stEl.style.minHeight = C.stageH + "px";
    stEl.dataset.row = "s" + si;
    nodes[st.id] = stEl;
    let rowMax = 0, iy = y0, col = 0;
    items.forEach(it => {
      const el = place(`box item inj${it.when === "planned" ? " planned-new" : ""}`,
        itemsX + col * (C.itemW + C.itemGap), iy, C.itemW,
        `<h4>${gl(it.title)}</h4><p class="t">${gl(it.text || "")}</p>${tech(it)}<div class="meta">${pill(it.status)}${badges(it)}</div>`,
        {type:"box", id:it.id}, it.title);
      el.dataset.row = "s" + si;
      nodes[it.id] = el;
      rowMax = Math.max(rowMax, el.offsetHeight);
      if (++col === C.perRow) { col = 0; iy += rowMax + C.itemGap; rowMax = 0; }
    });
    let ih = iy - y0 + rowMax;
    if (!items.length) { place("label", itemsX, y0 + 10, 0, S.mode === "planned" ? "Nothing planned here" : "Nothing here today"); ih = 40; }
    const nh = notePile([st.id, ...(st.items || []).map(i => i.id)], notesX, y0, 4, "s" + si);
    const h = Math.max(stEl.offsetHeight, ih, nh);
    rows.push({key:"s" + si, y:y0, h, x:0, w:W});
    if (prevStage) {
      const p = link(C.stageW / 2, prevStage.y + prevStage.h, C.stageW / 2, y0 - 2, "inj", prevStage.verb);
      p.dataset.row = "s" + si; arrowHead(C.stageW / 2, y0 - 2);
    }
    prevStage = {y:y0, h:stEl.offsetHeight, verb:st.verb || ""};
    y = y0 + h + C.gap;
  });
  const outs = MODEL.outcomes || [];
  if (outs.length && m === MODEL.maps.find(mm => KIND[mm.template] === "chain")) {
    place("label", 0, y, 0, "Did it work?");
    y += 26;
    const ow = C.itemW + 60;
    outs.forEach((o, i) => {
      const el = place("box inj", (i % 3) * (ow + C.itemGap), y + Math.floor(i / 3) * 150, ow,
        `<h4>${esc(o.measure)}</h4><p class="t">${o.baseline ? "Before: " + esc(o.baseline) + ". " : ""}${o.target ? "Target: " + esc(o.target) + ". " : ""}${o.result ? "<b>Result: " + esc(o.result) + "</b>" : "Not measured yet."}</p>
         <div class="meta">${o.becomes_evidence ? `<span class="chip">Feeds back as evidence</span>` : ""}</div>`,
        {type:"outcome", o}, `Outcome: ${o.measure}`);
      nodes[o.id] = el;
    });
    rows.push({key:"outcomes", y:y - 26, h:Math.ceil(outs.length / 3) * 150 + 26, x:0, w:W});
    y += Math.ceil(outs.length / 3) * 150 + 20;
  }
  return {x:0, y:0, w:W, h:y};
}

/* ---------- tree ---------- */
const T = {colW:270, colGap:60, nodeH:104, vGap:18};
function renderTree(m) {
  const levels = m.levels || TREE_LEVELS;
  const depthOf = n => n.children && n.children.length ? 1 + Math.max(...n.children.map(depthOf)) : 1;
  const depth = depthOf(m.root);
  const notesX = depth * (T.colW + T.colGap) + 10;
  const W = depth * (T.colW + T.colGap) - T.colGap + notesWidth();
  let y = header(m, W);
  for (let d = 0; d < depth; d++) place("label", d * (T.colW + T.colGap), y, 0, esc(levels[Math.min(d, levels.length - 1)]));
  y += 30;
  let cursor = y;
  const pos = {};
  (function lay(n, d) {
    const kids = n.children || [];
    let cy;
    if (!kids.length) { cy = cursor; cursor += T.nodeH + T.vGap; }
    else { kids.forEach(k => lay(k, d + 1)); cy = (pos[kids[0].id].y + pos[kids[kids.length - 1].id].y) / 2; }
    pos[n.id] = {x:d * (T.colW + T.colGap), y:cy, d};
  })(m.root, 0);
  const branches = m.root.children || [];
  const ids = n => [n.id, ...(n.children || []).flatMap(ids)];
  const shifted = {};
  let shift = 0;
  branches.forEach((b, bi) => {
    const own = ids(b);
    const ys = own.map(i => pos[i].y);
    const y0 = Math.min(...ys) + shift, y1 = Math.max(...ys) + T.nodeH + shift;
    own.forEach(i => shifted[i] = pos[i].y + shift);
    const nh = notePile(own, notesX, y0, 4, "b" + bi);
    rows.push({key:"b" + bi, y:y0, h:Math.max(y1 - y0, nh), x:0, w:W});
    shift += Math.max(0, nh - (y1 - y0)) + (S.notesOnMap ? T.vGap : 0);
  });
  shifted[m.root.id] = branches.length ? (shifted[branches[0].id] + shifted[branches[branches.length - 1].id]) / 2 : pos[m.root.id].y;
  const draw = (n, parent, bi) => {
    const p = pos[n.id], ny = shifted[n.id];
    const el = place(`box tree-node l${p.d} inj`, p.x, ny, T.colW,
      `<h4>${gl(n.title)}</h4>${n.text ? `<p class="t">${gl(n.text)}</p>` : ""}${tech(n)}<div class="meta">${pill(n.status)}${badges(n)}</div>`,
      {type:"box", id:n.id}, `${levels[Math.min(p.d, levels.length - 1)]}: ${n.title}`);
    el.style.minHeight = T.nodeH + "px";
    if (bi != null) el.dataset.row = "b" + bi;
    nodes[n.id] = el;
    if (parent) {
      const l = link(pos[parent.id].x + T.colW, shifted[parent.id] + T.nodeH / 2, p.x, ny + T.nodeH / 2, "inj");
      if (bi != null) l.dataset.row = "b" + bi;
    }
    (n.children || []).forEach(c => draw(c, n, bi == null ? branches.indexOf(c) : bi));
  };
  draw(m.root, null, null);
  return {x:0, y:0, w:W, h:Math.max(...Object.values(shifted)) + T.nodeH + 60};
}

/* ---------- render ---------- */
let bounds = {x:0, y:0, w:1000, h:800};
function render() {
  world.innerHTML = "";
  nodes = {}; rows = [];
  svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "links"); svg.setAttribute("aria-hidden", "true");
  world.appendChild(svg);
  const far = document.body.classList.contains("z-far");
  document.body.classList.remove("z-far");          // lay out at full detail, then restore
  const m = MODEL.maps[S.map];
  const kind = KIND[m.template];
  bounds = kind === "journeys" ? renderJourneys(m) : kind === "chain" ? renderChain(m) : renderTree(m);
  if (far) document.body.classList.add("z-far");
  applyFocus();
  topBar();
  story();
}

/* ---------- pan and zoom ---------- */
let Z = 1, X = 40, Y = 80;
const leftEdge = () => S.story ? STORY_W : 0;
const rightEdge = () => document.body.classList.contains("panel-open") ? PANEL_W + 10 : 0;
function apply() {
  world.style.transform = `translate(${X}px,${Y}px) scale(${Z})`;
  document.documentElement.style.setProperty("--z", Z);
  document.documentElement.style.setProperty("--inv", Math.min(2.4, Math.max(1, 0.62 / Z)));
  document.body.classList.toggle("z-far", Z < 0.55);
}
function zoomAt(f, cx, cy) {
  const nz = Math.min(MAX_Z, Math.max(MIN_Z, Z * f));
  X = cx - (cx - X) * (nz / Z); Y = cy - (cy - Y) * (nz / Z); Z = nz; apply();
}
const viewCenter = () => [leftEdge() + (innerWidth - leftEdge() - rightEdge()) / 2, TOP_H + (innerHeight - TOP_H) / 2];
function fitTo(b) {
  const vw = innerWidth - leftEdge() - rightEdge() - 40, vh = innerHeight - TOP_H - 40;
  let z = Math.min(vw / b.w, vh / b.h) * 0.95;
  const tall = z < MIN_Z + 0.08;
  if (tall) z = Math.min(1, Math.max(MIN_Z + 0.1, vw / b.w * 0.96));   // too tall: fit the width, start at the top
  Z = Math.min(1.3, Math.max(MIN_Z, z));
  X = leftEdge() + 20 + Math.max(0, (vw - b.w * Z) / 2) - b.x * Z;
  Y = TOP_H + 20 + (tall ? 0 : Math.max(0, (vh - b.h * Z) / 2)) - b.y * Z;
  apply();
}
function fitRow(key) {
  const r = rows.find(r => r.key === key);
  if (r) fitTo({x:r.x - 10, y:r.y - 30, w:r.w + 20, h:r.h + 60});
}
function fit() { if (S.journey >= 0) fitRow("j" + S.journey); else fitTo(bounds); }
function centerOn(el) {
  const x = parseFloat(el.style.left) + el.offsetWidth / 2, y = parseFloat(el.style.top) + el.offsetHeight / 2;
  if (Z < 0.75) Z = 0.9;
  const [cx, cy] = viewCenter();
  X = cx - x * Z; Y = cy - y * Z; apply();
}
let drag = null;
viewport.addEventListener("pointerdown", e => {
  if (e.target.closest(".box,.notecard,.morenotes,button")) return;
  drag = {x:e.clientX, y:e.clientY, X, Y}; viewport.classList.add("dragging"); viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener("pointermove", e => { if (!drag) return; X = drag.X + e.clientX - drag.x; Y = drag.Y + e.clientY - drag.y; apply(); });
viewport.addEventListener("pointerup", () => { drag = null; viewport.classList.remove("dragging"); });
viewport.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
  else { X -= e.deltaX; Y -= e.deltaY; apply(); }
}, {passive:false});
$("#zin").addEventListener("click", () => zoomAt(1.25, ...viewCenter()));
$("#zout").addEventListener("click", () => zoomAt(1 / 1.25, ...viewCenter()));
$("#zfit").addEventListener("click", () => fit());

/* ---------- focus ---------- */
function applyFocus() {
  const on = S.journey >= 0 && KIND[MODEL.maps[S.map].template] === "journeys";
  document.body.classList.toggle("dim", on);
  world.querySelectorAll(".inj").forEach(el => el.classList.toggle("hot", on && el.dataset.row === "j" + S.journey));
  svg.querySelectorAll("path").forEach(p => p.classList.toggle("hot", on && p.dataset.row === "j" + S.journey));
}
function showMap(i) { if (i !== S.map) { S.map = i; S.journey = -1; persist(); render(); } }
function focusJourney(mi, ji) { showMap(mi); S.journey = ji; persist(); applyFocus(); story(); fit(); }
function focusRow(mi, key) { showMap(mi); S.journey = -1; persist(); applyFocus(); story(); fitRow(key); }
function setMode(m) { S.mode = m; persist(); render(); }

/* ---------- top bar ---------- */
function topBar() {
  const qn = questionList().length;
  $("#top").innerHTML = `
    <span class="title" title="${esc(MODEL.title)}">${esc(MODEL.title)}</span>
    <button id="tq" class="primary">Questions to decide<span class="count">${qn}</span></button>
    <button id="tshare" aria-haspopup="true" aria-expanded="false">Share my answers ▾</button>
    <button id="tview" aria-haspopup="true" aria-expanded="false">View ▾</button>
    <button id="tkeys" title="Keyboard shortcuts">? Keys</button>`;
  $("#tq").addEventListener("click", () => open("questions"));
  $("#tshare").addEventListener("click", e => menu(e.currentTarget, [
    ["save", "Save my answers as a file", ""], ["copy", "Copy the questions as a list", ""],
    ["print", "Print this view", ""], ["reset", "Clear my answers on this computer", ""]]));
  $("#tview").addEventListener("click", e => menu(e.currentTarget, [
    ["tech", "Show technical names", S.tech ? "On" : "Off"],
    ["notes", "Show all notes on the map", S.notesOnMap ? "On" : "Off"],
    ["roles", "Whose notes to show", `${ROLES.filter(r => S.roles[r.id] !== false).length} of ${ROLES.length}`],
    ["story", S.story ? "Hide the list on the left" : "Show the list on the left", ""],
    ["dots", "Background dots", S.dots ? "On" : "Off"],
    ["key", "What the colours mean", ""]]));
  $("#tkeys").addEventListener("click", () => open("keys"));
}
function menu(btn, items) {
  const mm = $("#menu");
  const reopen = mm.classList.contains("open") && mm._from === btn;
  mm.classList.remove("open");
  document.querySelectorAll("#top [aria-expanded]").forEach(b => b.setAttribute("aria-expanded", "false"));
  if (reopen) return;
  mm._from = btn;
  mm.innerHTML = items.map(([a, label, state]) => `<button role="menuitem" data-a="${a}"><span>${label}</span><span class="state">${state}</span></button>`).join("");
  const r = btn.getBoundingClientRect();
  mm.style.left = Math.max(8, Math.min(r.left, innerWidth - 290)) + "px"; mm.style.top = (r.bottom + 6) + "px";
  mm.classList.add("open"); btn.setAttribute("aria-expanded", "true");
  mm.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { mm.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); act(b.dataset.a); }));
  mm.querySelector("button").focus();
}
document.addEventListener("click", e => { if (!e.target.closest("#menu,#tshare,#tview")) $("#menu").classList.remove("open"); });
function act(a) {
  if (a === "tech") { S.tech = !S.tech; persist(); render(); if (current) open(current.kind, current.arg); toast(S.tech ? "Technical names shown" : "Technical names hidden"); }
  if (a === "notes") { S.notesOnMap = !S.notesOnMap; persist(); render(); toast(S.notesOnMap ? "Notes shown beside the boxes" : "Notes shown as a count on each box"); }
  if (a === "roles") open("roles");
  if (a === "story") setStory(!S.story);
  if (a === "dots") { S.dots = !S.dots; persist(); document.body.classList.toggle("dots", S.dots); }
  if (a === "key") open("key");
  if (a === "save") saveReview();
  if (a === "copy") copyQuestions();
  if (a === "print") window.print();
  if (a === "reset" && confirm("Clear your answers, dots and decision notes on this computer?")) {
    S.answers = {}; S.votes = {}; S.decisions = {}; persist(); if (current) open(current.kind, current.arg); topBar();
  }
}

/* ---------- left story list ---------- */
function setStory(on) { S.story = on; persist(); document.body.classList.toggle("nostory", !on); story(); }
$("#storytab").addEventListener("click", () => setStory(true));
function story() {
  const el = $("#story");
  if (!S.story) { el.innerHTML = ""; return; }
  const views = MODEL.maps.map((m, mi) => {
    const kind = KIND[m.template];
    const cur = mi === S.map;
    let sub = "";
    if (kind === "journeys") sub = (m.journeys || []).map((j, ji) => `<li><button class="view" data-j="${mi}:${ji}" aria-current="${cur && S.journey === ji}"><b><span class="num">${mi + 1}.${ji + 1}</span>${esc(j.title)}</b><span>${esc(j.summary || plural((j.steps || []).length, "step"))}</span></button></li>`).join("");
    if (kind === "chain") sub = (m.stages || []).map((st, si) => `<li><button class="view" data-row="${mi}:s${si}"><b><span class="num">${mi + 1}.${si + 1}</span>${esc(st.label)}</b><span>${esc(st.sub || "")}</span></button></li>`).join("");
    if (kind === "tree") sub = (m.root.children || []).map((b, bi) => `<li><button class="view" data-row="${mi}:b${bi}"><b><span class="num">${mi + 1}.${bi + 1}</span>${esc(b.title)}</b><span>${plural((b.children || []).length, "idea")}</span></button></li>`).join("");
    const seg = kind === "chain" && cur ? `<div class="seg" role="group" aria-label="Today or planned"><button data-mode="today" aria-pressed="${S.mode === "today"}">Today</button><button data-mode="planned" aria-pressed="${S.mode === "planned"}">Planned</button></div>` : "";
    return `<li><button class="view" data-map="${mi}" aria-current="${cur && S.journey < 0}"><b><span class="num">${mi + 1}.</span>${esc(m.title)}</b><span>${esc(m.intro || "")}</span></button>${seg}<ol class="sub">${sub}</ol></li>`;
  }).join("");
  el.innerHTML = `<button class="hide" data-hide>Hide list</button>
    <div class="small">The decision</div><p class="q">${gl(MODEL.question, true)}</p>
    ${MODEL.reading ? `<details class="reading"><summary>How to read this</summary><p>${gl(MODEL.reading, true)}</p></details>` : ""}
    <button class="walkbtn" data-walk>Walk me through it</button>
    <h2>Views</h2><ol>${views}</ol>
    <h2>Deciding</h2><div class="more">
      <button data-open="questions">Questions to decide (${questionList().length})</button>
      ${DECISIONS.length ? `<button data-open="decisions">Decisions (${DECISIONS.length})</button>` : ""}
      ${GAPS.length ? `<button data-open="gaps">Gaps, ranked (${GAPS.length})</button>` : ""}
      <button data-open="evidence">Evidence and sources (${(MODEL.evidence || []).length})</button>
      <button data-open="roles">Whose notes to show</button>
    </div>
    ${MODEL.summary ? `<h2>About this decision</h2><p class="small">${gl(MODEL.summary, true)}</p>` : ""}`;
  el.querySelector("[data-hide]").addEventListener("click", () => setStory(false));
  el.querySelector("[data-walk]").addEventListener("click", () => walk(0));
  el.querySelectorAll("[data-map]").forEach(b => b.addEventListener("click", () => { showMap(+b.dataset.map); S.journey = -1; persist(); applyFocus(); story(); fit(); }));
  el.querySelectorAll("[data-j]").forEach(b => b.addEventListener("click", () => { const [mi, ji] = b.dataset.j.split(":").map(Number); focusJourney(mi, ji); }));
  el.querySelectorAll("[data-row]").forEach(b => b.addEventListener("click", () => { const [mi, key] = b.dataset.row.split(":"); focusRow(+mi, key); }));
  el.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  el.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => open(b.dataset.open)));
  wireTerms(el);
}

/* ---------- walk-through ---------- */
function steps() {
  const out = [{title:"The decision", text:MODEL.question + (MODEL.summary ? " " + MODEL.summary : ""), go:() => { showMap(0); S.journey = -1; applyFocus(); story(); fit(); }}];
  if (MODEL.reading) out.push({title:"How to read this", text:MODEL.reading, go:() => { showMap(0); S.journey = -1; applyFocus(); story(); fit(); }});
  MODEL.maps.forEach((m, mi) => {
    const kind = KIND[m.template];

      const items = (st.items || []).filter(it => (it.when || "both") === "both" || it.when === S.mode).map(it => it.title);

let walkAt = -1;
function walk(i) {
  const list = steps();
  if (i < 0 || i >= list.length) return endWalk();
  walkAt = i;
  hideHint();
  const s = list[i];
  if (!s.panel) close();
  s.go();
  const w = $("#walk");
  w.innerHTML = `<div class="step">Step ${i + 1} of ${list.length}</div><h3>${esc(s.title)}</h3><p>${gl(s.text)}</p>
    <div class="row"><button data-w="back"${i === 0 ? " disabled" : ""}>Back</button><span class="grow"></span>
    <button data-w="end">End the walk-through</button><button class="next" data-w="next">${i === list.length - 1 ? "Finish" : "Next"}</button></div>`;
  w.classList.add("open");
  w.querySelector('[data-w="back"]').addEventListener("click", () => walk(walkAt - 1));
  w.querySelector('[data-w="next"]').addEventListener("click", () => walk(walkAt + 1));
  w.querySelector('[data-w="end"]').addEventListener("click", endWalk);

    const a = S.answers[b.dataset.ans] = S.answers[b.dataset.ans] || {};
    a.choice = a.choice === b.dataset.choice ? "" : b.dataset.choice; persist();
    b.parentElement.querySelectorAll("[data-ans]").forEach(x => x.setAttribute("aria-pressed", x.dataset.choice === a.choice));
  }));
  p.querySelectorAll("[data-comment]").forEach(t => t.addEventListener("input", () => {
    (S.answers[t.dataset.comment] = S.answers[t.dataset.comment] || {}).comment = t.value; persist();
  }));
  p.querySelectorAll("[data-dot]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.dot, d = +b.dataset.d, v = S.votes[id] || 0;
    if (d > 0 && dotsLeft() <= 0) return toast("No dots left. Take one back from another question first.");
    S.votes[id] = Math.max(0, v + d); if (!S.votes[id]) delete S.votes[id]; persist();
    b.parentElement.querySelector(".n").textContent = S.votes[id] || 0;
    const dl = $("#dleft"); if (dl) dl.textContent = dotsLeft();
  }));
  p.querySelectorAll("[data-dec]").forEach(f => f.addEventListener(f.tagName === "SELECT" ? "change" : "input", () => {
    (S.decisions[f.dataset.dec] = S.decisions[f.dataset.dec] || {})[f.dataset.k] = f.value; persist();
  }));
  const rv = $("#reviewer", p); if (rv) rv.addEventListener("input", () => { S.reviewer = rv.value; persist(); });
  p.querySelectorAll("[data-role]").forEach(c => c.addEventListener("change", () => { S.roles[c.dataset.role] = c.checked; persist(); render(); }));
  p.querySelectorAll("[data-roles]").forEach(b => b.addEventListener("click", () => {
    ROLES.forEach(r => S.roles[r.id] = b.dataset.roles === "all"); persist(); render(); open("roles");
  }));
  const gs = $("#gsort", p); if (gs) gs.addEventListener("change", () => open("gaps", gs.value));
  const vo = $("#voiceonly", p); if (vo) vo.addEventListener("change", () => open("evidence", vo.checked));
  wireTerms(p);
}
function jumpTo(id) {
  const info = BOX[id];
  if (info && info.kind === "gap") return open("gaps");
  const mi = mapOfAnchor(id);
  if (mi >= 0) showMap(mi);
  if (info && info.kind === "item" && !nodes[id]) setMode(info.box.when === "today" ? "today" : "planned");
  if (S.journey >= 0 && info && info.ji !== S.journey) { S.journey = -1; applyFocus(); story(); }
  const el = nodes[id];
  if (el) { world.querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); el.classList.add("sel"); centerOn(el); }
}

/* ---------- clicks on the map ---------- */
function activate(el) {
  const d = el._data; if (!d) return;
  hideHint();
  if (d.type === "box") open("box", d.id);
  else if (d.type === "note") open("note", d.n);
  else if (d.type === "notes") open("notes", d);
  else if (d.type === "outcome") open("outcome", d.o);
}
world.addEventListener("click", e => { const el = e.target.closest("[role=button]"); if (el && el._data) activate(el); });
world.addEventListener("keydown", e => {
  const el = e.target.closest("[role=button]");
  if (el && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); activate(el); }
});
world.addEventListener("focusin", e => {
  const el = e.target.closest("[role=button]");
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (r.right < leftEdge() || r.left > innerWidth - rightEdge() || r.bottom < TOP_H || r.top > innerHeight) centerOn(el);
});

/* ---------- glossary ---------- */
const gbox = $("#gloss");
function showTerm(el) {
  const k = el.dataset.term; if (!GLOSS[k]) return;
  gbox.innerHTML = `<b>${esc(k)}</b>${esc(GLOSS[k])}`;
  gbox.style.display = "block";
  const r = el.getBoundingClientRect();
  gbox.style.left = Math.min(innerWidth - 320, Math.max(8, r.left)) + "px";
  gbox.style.top = (r.bottom + 8 + 120 > innerHeight ? r.top - gbox.offsetHeight - 8 : r.bottom + 8) + "px";
}
const hideTerm = () => { gbox.style.display = "none"; };
function wireTerms(root) {
  root.querySelectorAll(".term").forEach(t => {
    t.addEventListener("mouseenter", () => showTerm(t)); t.addEventListener("mouseleave", hideTerm);
    t.addEventListener("focus", () => showTerm(t)); t.addEventListener("blur", hideTerm);
    t.addEventListener("click", e => { e.stopPropagation(); showTerm(t); });
  });
}
world.addEventListener("mouseover", e => { const t = e.target.closest(".term"); if (t) showTerm(t); });
world.addEventListener("mouseout", e => { if (e.target.closest(".term")) hideTerm(); });

/* ---------- share ---------- */
function reviewData() {
  return {format:"decisioncraft-review/1", model:MODEL.title, model_fingerprint:META.fingerprint || "",
    reviewer:S.reviewer || "", saved_at:new Date().toISOString(), answers:S.answers, dots:S.votes, decisions:S.decisions};
}
function saveReview() {
  const blob = new Blob([JSON.stringify(reviewData(), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  const who = (S.reviewer || "reviewer").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  a.href = URL.createObjectURL(blob); a.download = `review-${who || "reviewer"}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Saved. Send the file to whoever runs the review.");
}
function copyQuestions() {
  let out = `# Questions to decide: ${MODEL.title}\n`, cur = null;
  questionList().forEach(q => {
    if (q.urgency !== cur) { cur = q.urgency; out += `\n## ${URG[cur]}\n\n`; }
    const a = S.answers[q.id] || {};
    out += `- ${q.n.question} (${(ROLE[q.n.role] || {label:q.n.role}).label})${a.choice ? ` — my answer: ${a.choice}` : ""}${a.comment ? ` — ${a.comment}` : ""}\n`;
  });
  const done = () => toast("Copied as a list");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out).then(done, () => fallbackCopy(out, done));
  else fallbackCopy(out, done);
}
function fallbackCopy(text, done) {
  const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("Could not copy on this browser."); }
  t.remove();
}
let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", 2600); }

/* ---------- optional keyboard shortcuts ---------- */
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,select")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "escape") { $("#menu").classList.remove("open"); hideTerm(); if (walkAt >= 0) endWalk(); else close(); return; }
  if (walkAt >= 0 && (k === "arrowright" || k === "arrowleft")) { walk(walkAt + (k === "arrowright" ? 1 : -1)); e.preventDefault(); return; }
  const m = MODEL.maps[S.map];
  if (/^[1-9]$/.test(k) && +k <= MODEL.maps.length) { showMap(+k - 1); fit(); }
  else if (k === "w") walk(0);
  else if (k === "f") fit();
  else if (k === "+" || k === "=") zoomAt(1.25, ...viewCenter());
  else if (k === "-") zoomAt(1 / 1.25, ...viewCenter());
  else if (k === "q") open("questions");
  else if (k === "n") act("notes");
  else if (k === "x") act("tech");
  else if (k === "?") open("keys");
  else if (k === "t" && KIND[m.template] === "chain") setMode(S.mode === "today" ? "planned" : "today");
  else return;
  e.preventDefault();
});

/* ---------- print: fit the view to the page width ---------- */
let before = null;
addEventListener("beforeprint", () => { before = {Z, X, Y}; Z = Math.min(1, 1000 / bounds.w); X = 0; Y = 0; apply(); });
addEventListener("afterprint", () => { if (before) { ({Z, X, Y} = before); apply(); } });

/* ---------- start ---------- */
document.title = MODEL.title;
document.body.classList.toggle("dots", S.dots);
document.body.classList.toggle("nostory", !S.story);
render();
fit();
hint();
addEventListener("resize", () => apply());
})();

</script>
</body>
</html>
