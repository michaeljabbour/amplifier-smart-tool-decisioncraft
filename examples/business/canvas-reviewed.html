<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:">
<meta name="generator" content="decisioncraft">
<title>Three Oaks Bakery: a monthly box?</title>
<style>
:root{
  --bg:#f5f4f0; --dot:#d6d3cb; --ink:#1d1d1b; --ink2:#46453f; --muted:#6a6862; --line:#d9d6ce;
  --panel:#ffffff; --soft:#efede7; --accent:#2f5bd3; --accent-ink:#ffffff;
  --works:#1f7a4a; --partial:#9a5b00; --missing:#b3261e; --planned:#0d6e74;
  --must:#b3261e; --should:#9a5b00; --info:#4a5a72;
  --z:1; --inv:1;
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* canvas */
#viewport{position:fixed;inset:0;cursor:grab;touch-action:none}
body.dots #viewport{background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:22px 22px}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:1}
svg.links path{fill:none;stroke:#9a978f;stroke-width:2}
svg.links path.hot{stroke:var(--accent);stroke-width:3}
svg.links text{font-size:15px;font-weight:600;fill:#5d5b55;paint-order:stroke;stroke:var(--bg);stroke-width:4px}

.box{position:absolute;border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;
  box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;transition:opacity .15s,box-shadow .15s;overflow:hidden;z-index:2}
.box:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.box.sel{outline:3px solid var(--accent);outline-offset:2px}
.box h3,.box h4{margin:0 0 4px;font-size:15px;line-height:1.25}
.box p{margin:0;color:var(--ink2)}
.box .t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.box .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
body.dim .box.inj:not(.hot){opacity:.28}
body.dim .notecard.inj:not(.hot){opacity:.28}

.lanehead{position:absolute;font-weight:700;font-size:15px;color:var(--ink)}
.lanehead small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.lanebg{position:absolute;z-index:0;background:rgba(255,255,255,.45);border-radius:14px;border:1px dashed #e0ddd5}
.label{position:absolute;white-space:nowrap;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.maptitle{position:absolute;font-size:34px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.mapintro{position:absolute;color:var(--ink2);font-size:15px;max-width:760px}
.stamp{position:absolute;white-space:nowrap;font-size:12px;font-weight:700;color:#fff;background:#3b4a63;border-radius:6px;padding:3px 8px}

.jhead{background:#fbfaf6}
.jhead .n,.step .n{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;
  background:var(--ink);color:#fff;font-size:12px;font-weight:700;margin-right:6px;padding:0 6px}
.step{display:flex;flex-direction:column}
.step .row1{display:flex;align-items:flex-start;gap:6px}
.stage{background:#f6d77b;border-color:#e2bf55;display:flex;flex-direction:column;justify-content:center}
.stage h3{font-size:19px}
.stage p{color:#3d3200}
.item.planned-new{border:2px dashed var(--planned)}
.tree-node{background:#fff}
.tree-node.l0{background:#1d1d1b;color:#fff;border-color:#1d1d1b}
.tree-node.l0 p{color:#ddd}

.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;color:#fff;white-space:nowrap}
.pill.works{background:var(--works)} .pill.partial{background:var(--partial)}
.pill.missing{background:var(--missing)} .pill.planned{background:var(--planned)}
.chip{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chip.new{background:#dff3e6;color:#145c36;font-weight:700}
.chip.changed{background:#fff0c9;color:#6b4800;font-weight:700}
.chip.stale{background:#f4e1df;color:#7d1d16}
.chip.moment{background:#ece4fb;color:#4b2a8a;font-weight:700}
.chip.pain{background:#fde6e3;color:#8a1f16}
.feel{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:middle}
.feel.good{background:#2f9e6a}.feel.ok{background:#d9a21e}.feel.bad{background:#d1543f}

/* notes: a column beside each row, sized so they never cover any box */
.notecard{position:absolute;z-index:2;border-radius:8px;padding:8px 10px 9px 12px;cursor:pointer;
  border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden;transition:opacity .15s}
.notecard:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}
.notecard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--info)}
.notecard.must::before{background:var(--must)} .notecard.should::before{background:var(--should)}
.notecard .who{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.notecard .urg{font-size:11px;font-weight:700;margin-left:6px}
.notecard.must .urg{color:var(--must)} .notecard.should .urg{color:var(--should)} .notecard.info .urg{color:var(--info)}
.notecard h5{margin:3px 0 3px;font-size:13.5px;line-height:1.25}
.notecard .q{font-size:12.5px;color:var(--ink2);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.morenotes{position:absolute;z-index:2;border:1px dashed #b9b5aa;background:rgba(255,255,255,.7);border-radius:8px;
  padding:6px 10px;font-size:12.5px;color:var(--ink2);cursor:pointer}

/* far zoom: keep the main words readable, drop the small print */
body.z-far .box .meta > :not(.notebadge),body.z-far .box p.sub,body.z-far .notecard .q,body.z-far .notecard .who{display:none}
body.z-far .box .t,body.z-far .box h3,body.z-far .box h4,body.z-far .notecard h5{font-size:calc(14px * var(--inv));line-height:1.15}
body.z-far .box .t{-webkit-line-clamp:2}

.term{border-bottom:1px dotted currentColor;cursor:help}
#gloss{position:fixed;z-index:60;max-width:300px;background:#1d1d1b;color:#fff;border-radius:8px;padding:8px 10px;
  font-size:13px;display:none;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#gloss b{display:block;margin-bottom:2px}

/* side panel */
#panel{position:fixed;top:64px;right:10px;bottom:10px;width:min(460px,calc(100vw - 20px));z-index:35;background:#fff;
  border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.14);display:none;flex-direction:column}
#panel.open{display:flex}
#panel header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
#panel header h2{margin:0;font-size:17px;flex:1}
#panel header button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:32px;min-height:32px}
#panel .body{overflow:auto;padding:12px 14px 20px}
#panel h3{font-size:14px;margin:16px 0 6px}
#panel h3:first-child{margin-top:0}
#panel p{margin:4px 0}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
.card.must{border-left:5px solid var(--must)} .card.should{border-left:5px solid var(--should)} .card.info{border-left:5px solid var(--info)}
.quote{border-left:3px solid #c9c4b6;padding:2px 0 2px 10px;margin:6px 0;color:var(--ink2);font-style:italic}
.quote .src{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.quote.voice{border-left-color:#d99a1e}
.answer{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.answer button,.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;min-height:28px}
.answer button[aria-pressed="true"]{background:#e6ecfb;border-color:#9fb4ee;font-weight:600}
.dots{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.dots .n{min-width:1.5em;text-align:center;font-weight:700}
textarea,input[type=text],input[type=date],select.field{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;margin-top:4px;background:#fff}
textarea{min-height:52px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
.tally{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft);margin:6px 0 2px}
.tally i{display:block;height:100%}
.tally .a{background:#2f9e6a}.tally .c{background:#d1543f}.tally .u{background:#c9c4b6}
.small{font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--soft)}
.badge.split{background:#fde6e3;color:#8a1f16}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:8px;height:8px;border-radius:50%;background:#dcd8cf}
.meter i.on{background:var(--ink2)}
.rolerow{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft)}
.rolerow input{margin-top:4px;width:18px;height:18px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend span{margin-right:10px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d1d1b;color:#fff;border-radius:8px;
  padding:8px 14px;z-index:70;display:none}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:60px;z-index:80;background:#fff;padding:6px 10px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media print{
  #bar,#panel,#more,#toast,#gloss{display:none !important}
  html,body{overflow:visible;height:auto;background:#fff}
  #viewport{position:static;background:none !important}
  #world{position:relative}
  .box,.notecard{box-shadow:none;break-inside:avoid}
}

.jindex{cursor:default;background:#fbfaf6}
.jindex .meta{gap:6px}
body.z-far .jindex .mini{font-size:calc(13px * var(--inv))}

/* ---------- chrome: one quiet top bar ---------- */
#top{position:fixed;left:0;right:0;top:0;height:52px;z-index:30;display:flex;align-items:center;gap:8px;
  padding:0 12px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);white-space:nowrap}
#top .title{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
#top button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;min-height:34px}
#top button:hover{background:var(--soft)}
#top .primary{background:#fff6dc;border-color:#e9cf86;font-weight:600}
#top .count{display:inline-block;min-width:1.6em;padding:0 6px;margin-left:5px;border-radius:9px;background:rgba(0,0,0,.07);font-size:12px}
#menu{position:fixed;z-index:45;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;
  box-shadow:0 8px 28px rgba(0,0,0,.14);display:none;min-width:270px;max-height:calc(100vh - 70px);overflow-y:auto}
#menu.open{display:block}
#menu button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px}
#menu button:hover{background:var(--soft)}
#menu .state{color:var(--muted);font-size:12.5px}
#menu hr{border:0;border-top:1px solid var(--soft);margin:4px 0}

/* ---------- left story list ---------- */
#story{position:fixed;left:0;top:52px;bottom:0;width:320px;z-index:25;background:#fbfaf7;border-right:1px solid var(--line);
  overflow:auto;padding:14px 14px 30px}
body.nostory #story{display:none}
#storytab{position:fixed;left:10px;top:62px;z-index:26;display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px}
body.nostory #storytab{display:block}
#story .q{font-size:15px;font-weight:600;line-height:1.35;margin:2px 0 10px}
#story .walkbtn{width:100%;background:#2f5bd3;color:#fff;border:0;border-radius:9px;padding:10px;font-weight:600;font-size:15px}
#story .walkbtn:hover{background:#2a50bb}
#story .hide{border:0;background:none;color:var(--muted);font-size:12.5px;padding:4px 0;float:right}
#story h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
#story ol{list-style:none;margin:0;padding:0}
#story li{margin:0}
#story .view{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 9px;margin:2px 0}
#story .view:hover{background:#fff;border-color:var(--line)}
#story .view[aria-current="true"]{background:#fff;border-color:#9fb4ee}
#story .view b{display:block;font-size:14.5px}
#story .view span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
#story .sub{padding-left:14px;border-left:2px solid var(--line);margin:2px 0 8px 12px}
#story .sub .view b{font-size:13.5px;font-weight:600}
#story .num{display:inline-block;min-width:1.7em;color:var(--muted);font-weight:700}
#story .seg{display:flex;margin:4px 0 6px 12px}
#story .seg button{flex:1;border:1px solid var(--line);background:#fff;padding:6px;font-size:13px}
#story .seg button:first-child{border-radius:8px 0 0 8px}
#story .seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
#story .seg button[aria-pressed="true"]{background:#e6ecfb;border-color:#9fb4ee;font-weight:600}
#story .more button{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:7px 9px}
#story .more button:hover{background:#fff;border-color:var(--line)}

/* ---------- zoom, walk-through, hint ---------- */
#zoom{position:fixed;right:14px;bottom:14px;z-index:28;display:flex;flex-direction:column;gap:6px}
body.panel-open #zoom{right:494px}
#zoom button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;min-width:128px;text-align:left;box-shadow:0 2px 8px rgba(0,0,0,.08)}
#zoom button:hover{background:var(--soft)}
#walk{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:32;width:min(560px,calc(100vw - 40px));
  background:#1d1d1b;color:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
body:not(.nostory) #walk{left:calc(50% + 160px)}
body.panel-open #walk{left:calc(50% - 80px)}
#walk.open{display:block}
#walk .step{font-size:12px;color:#c9c6bd;letter-spacing:.04em;text-transform:uppercase}
#walk h3{margin:4px 0 4px;font-size:17px}
#walk p{margin:0 0 10px;color:#e8e6df}
#walk .row{display:flex;gap:8px;align-items:center}
#walk button{white-space:nowrap;border:1px solid #55534d;background:#2c2b28;color:#fff;border-radius:8px;padding:7px 14px}
#walk button.next{background:#fff;color:#1d1d1b;border-color:#fff;font-weight:600}
#walk .grow{flex:1}
#hint{position:fixed;left:340px;top:66px;z-index:31;max-width:420px;background:#fff8e1;border:1px solid #ecd48e;border-radius:10px;
  padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.1);display:none}
body.nostory #hint{left:110px}
#hint.open{display:block}
#hint button{margin-top:6px;border:1px solid #d9bf73;background:#fff;border-radius:7px;padding:4px 10px}

/* the panel sits under the top bar */
#panel{top:62px}
body.panel-open #panel{display:flex}
.techname{display:block;margin-top:4px;font:12px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#3b4a63;
  background:#eef1f7;border-radius:5px;padding:2px 6px;white-space:normal}
body.z-far .techname{font-size:calc(12px * var(--inv))}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.switch input{width:18px;height:18px}
.notebadge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:#1d1d1b;color:#fff}
.notebadge.must{background:var(--must)}
body.z-far .box .meta .notebadge{font-size:calc(11.5px * var(--inv))}
#story .reading{margin:0 0 10px;font-size:13.5px;line-height:1.45}
#story .reading summary{cursor:pointer;color:#2f5bd3;font-weight:600}
#story .reading p{margin:6px 0 0}

/* Review actions stay visible and say where the file goes. */
.save-primary,#top .save-primary{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;padding:7px 11px;font-weight:600}
#top .save-primary:hover{background:#2448a8}
.review-next{border:1px solid var(--line);background:#f3f6fd;border-radius:9px;padding:12px;margin-bottom:16px}
.answer-label{display:block;font-weight:600;margin-top:10px}
.review-answer{white-space:pre-wrap;border-left:3px solid var(--accent);padding-left:8px}

.review-nav{display:flex;gap:8px;justify-content:space-between;margin:20px 0 12px}
.review-nav button{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.support{margin:14px 0}
.support summary{cursor:pointer;color:var(--accent);font-weight:600}
.decision-question{font-size:19px;font-weight:600;line-height:1.35}

.short-label{display:none}
@media(max-width:720px){
  #top{gap:5px;padding:6px}
  #top .title,#top .wide-label,#top .count,#tkeys{display:none}
  #top .short-label{display:inline}
  #top button{padding:6px 8px;font-size:13px}
  #hint{left:10px;right:10px;max-width:none}
}

#paper-review{display:none}
@media print{
  body.print-review{height:auto;overflow:visible;background:#fff}
  body.print-review > *{display:none!important}
  body.print-review #paper-review{display:block!important;padding:16px}
  #paper-review article{break-inside:avoid;margin:24px 0}
  #paper-review h2{font-size:17px}
  .paper-space{height:90px;border-bottom:1px solid #ccc}
}

.recommendation{background:#f3f6fd;border-left:3px solid var(--accent);padding:10px 12px;margin:12px 0}
.recommendation p{margin:4px 0 0}

#story .workflow button{padding:12px 9px;font-weight:600}
#story .more button[aria-current="true"]{background:#eaf0ff;border-color:#9fb4ee;color:#244ca6}

/* Display controls have names on hover or focus, and a visible switch state. */
#top .display-controls{display:flex;gap:5px;align-items:center}
#top .icon-control{position:relative;width:36px;height:36px;padding:5px 6px 9px}
.icon-control svg{display:block;width:22px;height:22px}
#top .icon-control[aria-pressed="true"]{background:#eaf0ff;color:#244ca6;border-color:#9fb4ee}
.toggle-state{position:absolute;bottom:3px;left:13px;width:11px;height:4px;border-radius:4px;background:#aaa}
[aria-pressed="true"] .toggle-state{background:#244ca6}
.control-tip{display:none;position:absolute;top:calc(100% + 9px);right:0;background:#1d1d1b;color:#fff;
  font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;z-index:60}
.icon-control:hover .control-tip,.icon-control:focus-visible .control-tip{display:block}
.word-meanings dt{font-weight:700;margin-top:16px}
.word-meanings dd{margin:4px 0 0}
@media(max-width:720px){#top .display-controls{gap:3px}#top .icon-control{width:32px;padding:5px 4px 9px}}

/* Keep space for the drawing when details are open. */
body.panel-open #panel{width:clamp(320px,30vw,460px)}
body.panel-open #story{width:240px}
body.panel-open #zoom{right:calc(clamp(320px,30vw,460px) + 24px)}
.customer-step{border-top:4px solid #5b78b9}
.timeline-title{background:#eef3ff;border-color:#b9c9ea}
.links .customer-flow{stroke:#5b78b9;stroke-width:2}
#story .seg button{padding:6px 4px}
@media(max-width:1100px){body.panel-open #story{display:none}body.panel-open #storytab{display:block}}
@media(max-width:720px){body.panel-open #panel{width:calc(100vw - 20px)}body.panel-open #zoom{display:none}}

/* A stage spine anchors the work; proposals and feedback have distinct styles. */
.box.stage{background:#f9d46b;border-color:#e5bd51;color:#3a2a00}
.box.stage h3{font-size:23px;font-weight:600}
.box.stage.first-stage{background:#7652d9;color:#fff;border-color:#7652d9}
.box.stage.first-stage p{color:#fff}
.box.planned-new{background:#effaf8;border-color:#81c9c1}
.links .connection path{stroke:#7652d9;stroke-width:1.8;fill:none;opacity:.55}
.links .connection.evidence path{stroke:#4675ba}

#role-strip button[aria-pressed="false"]{color:var(--muted);opacity:.7}
.paper-swatch{width:14px;height:14px;border:1px solid;box-shadow:1px 2px 2px rgba(0,0,0,.12);transform:rotate(-5deg)}

<script type="application/json" id="dc-model">{"format":"decisioncraft/1","title":"Three Oaks Bakery: a monthly box?","question":"Should our three bakeries offer a monthly subscription box, and if so, what shape should it take?","summary":"Three Oaks is a small chain of three bakeries. Regulars have asked for a box they can collect or have delivered each month. This canvas shows what a subscriber would go through, what the shop would have to do behind the counter, where the idea comes from, and what is still open. All names and numbers are made up.","checked":{"date":"2026-03-28","note":"Checked against six customer chats, 64 survey slips, a four-week waste log, a year of sales and costs, the till supplier call, three other local boxes, and one staff meeting."},"dots":5,"roles":[{"id":"designer","label":"Designer","color":"#e86a92","asks":"Will people understand this and find their way without help?","jobs":["Make signing up take under two minutes at the counter or online"]},{"id":"analyst","label":"Analyst","color":"#4f7fd8","asks":"Is it clear what must be true, for whom, and how we will measure it?"},{"id":"engineer","label":"Head baker","color":"#2f9e6a","asks":"Can we bake and pack this without breaking the weekend?","jobs":["Keep the Friday and weekend bake on time"]},{"id":"owner","label":"Owner","color":"#8a5cd6","asks":"What is in the first version, what do we cut, and what does success look like?","jobs":["Grow steady weekday income","Cut waste"]},{"id":"security","label":"Privacy","color":"#d1543f","asks":"What customer details do we keep, who sees them, and for how long?"},{"id":"voice","label":"Customer voice","color":"#d99a1e","asks":"Would our regulars choose this, and would they need it explained?","jobs":["Get good bread without thinking about it","Treat the office on Fridays"]},{"id":"agent","label":"AI agent teammate","color":"#1f9aa6","asks":"What could an assistant do on its own, and what needs a person's OK?"},{"id":"finance","label":"Finance","color":"#7a7a72","asks":"What does it cost to run, and when does it pay back?"}],"reading":"Start with the list on the left. The first view follows a subscriber through signing up, a normal month, and asking for help or leaving. The second view shows the same box from behind the counter: baking, packing, collection and money. The third view traces the idea from what customers said to what we would launch, and whether it worked; switch between Today and Planned to see what exists and what we propose. Each box says whether it works today, partly works, is missing, or is planned. Notes from the owner, head baker, finance and others sit on the boxes they are about; each ends in a question for the team to answer.","glossary":{"churn":"The share of subscribers who cancel in a given month.","margin":"What is left from the price after ingredients, packaging, fees and staff time.","pause":"Skipping a month without cancelling.","packing list":"The sheet that says how many boxes, of which size and with which swaps, to pack for a given day.","stored card":"A customer's card kept by the till so it can be charged again without them being there.","declined":"A card charge the bank refused, for example because the card expired."},"sources":[{"id":"S1","title":"Customer chats, March","kind":"interview","date":"2026-03-14","ref":"material/customer-chats.md"},{"id":"S2","title":"Sales and costs, last 12 months","kind":"data","date":"2026-03-20","ref":"material/sales-and-costs.md"},{"id":"S3","title":"Staff meeting, Station Road","kind":"meeting","date":"2026-03-22","ref":"material/staff-meeting.md"},{"id":"S4","title":"Waste log, Mill Lane, February","kind":"data","date":"2026-03-01","ref":"material/waste-log.md"},{"id":"S5","title":"Survey of regulars, 64 slips","kind":"survey","date":"2026-03-21","ref":"material/regulars-survey.md"},{"id":"S6","title":"Till supplier call","kind":"document","date":"2026-03-18","ref":"material/till-and-payments.md"},{"id":"S7","title":"Other local boxes","kind":"observation","date":"2026-03-19","ref":"material/other-boxes.md"}],"evidence":[{"id":"E1","source":"S1","kind":"quote","voice":true,"text":"I'd pay for a box if I could skip a month when we're away. I hate being locked in.","where":"Regular, Mill Lane"},{"id":"E2","source":"S1","kind":"quote","voice":true,"text":"Friday treats for the team would be great, but I need an invoice, not a card charge.","where":"Office buyer, Station Road"},{"id":"E3","source":"S1","kind":"quote","voice":true,"text":"What's in it each month? I don't want six things I won't eat.","where":"New customer, Mill Lane"},{"id":"E4","source":"S1","kind":"quote","voice":true,"text":"If there's nothing for me, I'm out.","where":"Gluten-free regular, Mill Lane"},{"id":"E5","source":"S1","kind":"quote","voice":true,"text":"£25 a month feels right. £35 feels like a treat I'd cancel.","where":"Regular, Mill Lane"},{"id":"E6","source":"S2","kind":"data","text":"A trial box costs £11.40 in ingredients and packaging, plus about 14 minutes of staff time to pack.","where":"Costs section"},{"id":"E7","source":"S2","kind":"data","text":"9% of baked goods are thrown away or given away at closing.","where":"Waste"},{"id":"E8","source":"S2","kind":"data","text":"Local courier: £4.20 per drop within 3 miles, Tuesday or Friday only.","where":"Quotes"},{"id":"E9","source":"S3","kind":"quote","text":"Friday afternoon is already our tightest time.","where":"Head baker"},{"id":"E10","source":"S3","kind":"observation","text":"The counter team can take sign-ups but not chase failed payments.","where":"Mill Lane manager"},{"id":"E11","source":"S2","kind":"data","text":"Roughly 380 customers visit at least once a week.","where":"Loyalty card data"},{"id":"E12","source":"S3","kind":"observation","text":"Nobody owns the customer list today. Loyalty data lives in the till system.","where":"Meeting notes"},{"id":"E13","source":"S4","kind":"data","text":"Monday waste is 13% of what is baked; Saturday is 5%.","where":"Waste by day"},{"id":"E14","source":"S4","kind":"data","text":"Ovens sit idle from 1pm to 4pm Monday to Thursday.","where":"Notes under the table"},{"id":"E15","source":"S4","kind":"data","text":"Early-week waste is mostly sourdough and seeded loaves.","where":"Notes under the table"},{"id":"E16","source":"S5","kind":"data","text":"41 of 64 regulars said they would probably or definitely try a monthly box.","where":"Survey totals"},{"id":"E17","source":"S5","kind":"data","text":"Of those 41, 29 prefer collecting and 12 prefer delivery.","where":"Survey totals"},{"id":"E18","source":"S5","kind":"data","text":"24 of 64 ticked £25 as a fair price; only 8 ticked £30 or more.","where":"Price question"},{"id":"E19","source":"S5","kind":"data","text":"11 of 64 (17%) avoid gluten, nuts or dairy.","where":"Diet question"},{"id":"E20","source":"S5","kind":"data","text":"19 of 64 would want to skip at least one month a year.","where":"Skip question"},{"id":"E21","source":"S5","kind":"quote","text":"Let me choose the bread.","where":"Free comment, 7 slips","voice":true},{"id":"E22","source":"S5","kind":"quote","text":"Text me, don't email me.","where":"Free comment, 6 slips","voice":true},{"id":"E23","source":"S5","kind":"quote","text":"Would buy one as a gift.","where":"Free comment, 5 slips","voice":true},{"id":"E24","source":"S6","kind":"data","text":"If a stored-card charge fails, the till marks it declined in a daily report. It does not retry and does not tell the customer.","where":"Payments"},{"id":"E25","source":"S6","kind":"data","text":"The till can send a text through an add-on at 4p per message.","where":"Messages"},{"id":"E26","source":"S6","kind":"data","text":"Any staff login can see every customer's name, phone, email and points.","where":"Customer records"},{"id":"E27","source":"S6","kind":"data","text":"The till cannot raise invoices. The office buyer is invoiced by hand, about 20 minutes a month.","where":"Invoices"},{"id":"E28","source":"S7","kind":"observation","text":"All three local boxes show a photo of this month's box on their front page.","where":"Websites"},{"id":"E29","source":"S7","kind":"observation","text":"The cheese shop lets people skip any month online before the 20th; the veg box allows four weeks of pause a year.","where":"Skip rules"},{"id":"E30","source":"S7","kind":"observation","text":"None of the three offer an allergy swap.","where":"Allergy swaps"},{"id":"E31","source":"S3","kind":"observation","text":"Owner wants the box to cut waste, not add to it, and proposes baking box items on Thursday.","where":"Owner"},{"id":"E32","source":"S3","kind":"observation","text":"Idea: let subscribers pick up on Saturday, when shops are busy anyway.","where":"Ideas"}],"maps":[{"id":"m-journey","template":"customer-journey","title":"A subscriber's month","intro":"What a regular would go through, from hearing about the box to staying or leaving. Each column is a phase.","lanes":[{"id":"notice","label":"Notice","sub":"They find out"},{"id":"start","label":"Start","sub":"Sign up"},{"id":"use","label":"Use","sub":"Each month"},{"id":"help","label":"Get help","sub":"When something is wrong"},{"id":"stay","label":"Stay or leave","sub":"What happens next"}],"journeys":[{"id":"j-signup","title":"A regular signs up","summary":"From seeing the sign at the counter to their first box being ready.","creates":["A subscriber record","A stored card, or an invoice line","A first entry on the packing list"],"steps":[{"id":"su1","lane":"notice","text":"Sees a card by the till: 'Our bread, every month', with a photo of this month's box","status":"planned","detail":"Counter card and a framed photo, changed on the first Monday of the month.","feeling":"good","evidence":["E28"]},{"id":"su2","lane":"start","text":"Asks what is in it and how much","status":"missing","detail":"No fixed contents list or price exists yet; staff answer from memory.","pain":"No fixed answer yet; staff guess.","moment":true,"evidence":["E3"]},{"id":"su3","lane":"start","text":"Picks collect or delivery, and a size","status":"planned","detail":"Two sizes: small (loaf, 4 pastries) and family (2 loaves, 8 pastries, jam).","evidence":["E8","E17"]},{"id":"su4","lane":"start","text":"Pays by card at the counter, or asks for an invoice","status":"partial","detail":"Till can store a card for repeat charges; invoices are written by hand today.","evidence":["E2","E27"]},{"id":"su4b","lane":"start","text":"Says if they avoid gluten, nuts or dairy","status":"missing","detail":"Diet needs would sit as a note on the till customer record; no field exists for it.","moment":true,"evidence":["E4","E19"]},{"id":"su4c","lane":"start","text":"Gives a mobile number for reminders","status":"partial","detail":"Till already stores phone numbers; texting needs the 4p-a-message add-on.","evidence":["E22","E25"]},{"id":"su4d","lane":"use","text":"Their name is added to next month's packing list","status":"missing","detail":"Packing list would be printed from the till's subscriber report every Thursday morning.","evidence":["E12"]},{"id":"su5","lane":"use","text":"Gets a text the day before: 'Your box is ready Saturday'","status":"missing","detail":"Text sent through the till add-on on Friday at 5pm.","evidence":["E25"]}]},{"id":"j-month","title":"Each month after that","summary":"Collecting, opening, skipping and paying, month by month.","creates":["A monthly charge","A packed box with a name label","A skip, if asked for"],"steps":[{"id":"mo0","lane":"use","text":"Sees what is coming next month","status":"missing","detail":"A photo and list posted at the counter and sent in the reminder text on the 25th.","evidence":["E28","E3"]},{"id":"mo1","lane":"use","text":"Collects on Saturday, or the courier drops it Friday","status":"planned","detail":"Boxes kept on a labelled shelf behind the counter; courier drops Tuesday or Friday only.","feeling":"good","evidence":["E8","E32"]},{"id":"mo2","lane":"use","text":"Opens the box and finds something they cannot eat","status":"missing","detail":"Swaps are not tracked; packers would need the diet note on the packing list.","pain":"A gluten-free regular said they would leave.","feeling":"bad","moment":true,"evidence":["E4","E30"]},{"id":"mo2b","lane":"use","text":"Wants a different bread this month","status":"missing","detail":"No way to choose; the box is fixed.","evidence":["E21"]},{"id":"mo3","lane":"help","text":"Wants to skip next month while away","status":"missing","detail":"Would be a text reply 'SKIP' before Wednesday, or a word at the counter.","moment":true,"evidence":["E1","E20","E29"]},{"id":"mo4","lane":"help","text":"Card payment fails; someone has to follow up","status":"missing","detail":"Till marks the charge declined in the daily report, with no retry and no message.","pain":"The counter team cannot chase payments.","feeling":"bad","evidence":["E10","E24"]},{"id":"mo4b","lane":"help","text":"Box not collected by closing on Saturday","status":"missing","detail":"No rule yet: hold until Sunday, give to charity Monday, or refund.","evidence":["E7"]},{"id":"mo5","lane":"stay","text":"Stays, upgrades, or cancels","status":"planned","detail":"Cancel by text or at the counter before the 20th; no fee.","evidence":["E29"]}]},{"id":"j-gift","title":"Someone buys a box as a gift","summary":"A customer pays for three months for someone else.","creates":["A gift record with two people on it","Three charges, or one up-front payment"],"steps":[{"id":"gi1","lane":"notice","text":"Asks at the counter: 'Can I buy one for my mum?'","status":"missing","detail":"Five survey slips asked for gifts; no gift option exists.","moment":true,"evidence":["E23"]},{"id":"gi2","lane":"start","text":"Chooses three months, collect or delivery","status":"missing","detail":"Would be one up-front card payment for three boxes.","evidence":["E23"]},{"id":"gi3","lane":"start","text":"Gives the other person's name and phone","status":"missing","detail":"Holding a second person's details needs their OK before we text them.","evidence":["E26"]},{"id":"gi4","lane":"use","text":"The other person gets a text saying a gift is waiting","status":"missing","detail":"Text through the till add-on.","feeling":"good","evidence":["E25"]},{"id":"gi5","lane":"use","text":"Collects three months in a row","status":"planned","detail":"Same shelf and label as any subscriber."},{"id":"gi6","lane":"stay","text":"After the gift ends, is asked if they want to carry on","status":"missing","detail":"One text after the last box; no follow-ups after that."}]}]},{"id":"m-counter","template":"service-blueprint","title":"Behind the counter","intro":"The same box from the shop's side: baking, packing, collecting, and money. The top row is what the subscriber sees; lower rows are out of sight.","lanes":[{"id":"person","label":"Subscriber","sub":"What they do"},{"id":"front","label":"Counter","sub":"Staff they meet"},{"id":"back","label":"Bakehouse","sub":"Baking and packing out of sight"},{"id":"support","label":"Till and suppliers","sub":"Systems, courier, card fees"},{"id":"proof","label":"What they keep","sub":"Texts, labels, receipts"}],"journeys":[{"id":"j-bake","title":"Thursday bake and pack","summary":"Baking box items in the quiet Thursday afternoon, then packing for Saturday.","creates":["Thursday bake sheet","Packed boxes with name labels","Updated waste log"],"steps":[{"id":"bk1","lane":"support","text":"Thursday 9am: print the packing list from the till","status":"missing","detail":"Till subscriber report, filtered to active, not skipped, paid.","evidence":["E12"]},{"id":"bk2","lane":"back","text":"Head baker adds box items to the Thursday bake sheet","status":"planned","detail":"Uses ovens that sit idle 1pm to 4pm.","moment":true,"evidence":["E14","E31"]},{"id":"bk3","lane":"back","text":"Bake sourdough and seeded loaves for boxes first","status":"planned","detail":"These are the loaves most often wasted early in the week.","evidence":["E15"]},{"id":"bk4","lane":"back","text":"Bake gluten-free swaps in a separate batch","status":"missing","detail":"Needs a cleaned tray, separate cooling rack and a labelled bag.","pain":"Cross-contact risk if done in the same batch.","evidence":["E4","E19"]},{"id":"bk5","lane":"back","text":"Friday morning: pack boxes and label with name and size","status":"partial","detail":"About 14 minutes per box today; target under 8 with a packing table.","evidence":["E6","E9"]},{"id":"bk6","lane":"back","text":"Put swap boxes on their own shelf, labelled 'GF'","status":"missing","detail":"Colour label so the counter team cannot mix them up.","evidence":["E30"]},{"id":"bk7","lane":"support","text":"Book the courier for Friday drops","status":"planned","detail":"£4.20 per drop within 3 miles; call by Thursday noon.","evidence":["E8"]},{"id":"bk8","lane":"back","text":"Log anything left over on Monday as waste","status":"works","detail":"Same waste log as today, with a new 'box' line.","evidence":["E7","E13"]}]},{"id":"j-collect","title":"Saturday collection at the counter","summary":"A subscriber picks up their box during the busy Saturday morning.","creates":["A collected mark on the list","A receipt text"],"steps":[{"id":"co1","lane":"person","text":"Arrives and says their name","status":"planned","evidence":["E32"]},{"id":"co2","lane":"front","text":"Counter finds the box on the labelled shelf","status":"planned","detail":"Shelf sorted by surname; GF shelf separate.","evidence":["E9"]},{"id":"co3","lane":"front","text":"Ticks them off on the printed list","status":"planned","detail":"Paper list kept by the till; typed in on Monday."},{"id":"co4","lane":"person","text":"Asks to swap the bread this week","status":"missing","detail":"No spare stock set aside; counter would swap from the shelf if possible.","evidence":["E21"]},{"id":"co5","lane":"front","text":"Mentions next month's box and the skip deadline","status":"planned","detail":"A short script on the back of the packing list.","evidence":["E3","E20"]},{"id":"co6","lane":"proof","text":"Gets a receipt text","status":"partial","detail":"Till sends receipts by text only if the add-on is on.","evidence":["E22","E25"]},{"id":"co7","lane":"front","text":"Box still on the shelf at closing","status":"missing","detail":"Rule needed; see 'Box not collected'.","evidence":["E7"]}]},{"id":"j-money","title":"Money each month","summary":"Charging cards, handling declines, and seeing whether the box pays.","creates":["Monthly charges","A declined list","A monthly profit line for the box"],"steps":[{"id":"mn1","lane":"support","text":"On the 1st, the till charges every stored card","status":"partial","detail":"Card fee 1.7% per charge; subscription service would be 3%.","evidence":["E24"]},{"id":"mn2","lane":"support","text":"Declined charges land in the daily report","status":"partial","detail":"No retry, no message to the customer.","pain":"Nobody reads the report on a busy morning.","evidence":["E24"]},{"id":"mn3","lane":"front","text":"Someone texts the customer to update their card","status":"missing","detail":"Manager would own this; counter team cannot chase.","moment":true,"evidence":["E10"]},{"id":"mn4","lane":"back","text":"Box held until the payment goes through","status":"missing","detail":"Hold, don't pack; confirmed by the owner in review.","evidence":["E10"]},{"id":"mn5","lane":"support","text":"Office buyer gets a typed invoice","status":"partial","detail":"Written by hand, about 20 minutes a month.","evidence":["E27","E2"]},{"id":"mn6","lane":"back","text":"Owner checks the month: boxes sold, cost, waste","status":"missing","detail":"One spreadsheet line per month: boxes, revenue, ingredients, packing time, waste.","evidence":["E6","E13"]},{"id":"mn7","lane":"proof","text":"Subscriber can see what they paid","status":"partial","detail":"Receipt text per charge; no statement.","evidence":["E25"]}]}]},{"id":"m-chain","template":"decision-chain","title":"From what we heard to what we would launch","intro":"Each stage is one step from a customer's words to a box on the shelf, and whether it worked.","stages":[{"id":"c-source","label":"Source","verb":"backs up","sub":"Where it was said or measured","items":[{"id":"ci1","title":"Counter chats","text":"Six regulars, two shops, written up the same day.","status":"works","when":"both","evidence":["E1","E5"]},{"id":"ci2","title":"Till and loyalty data","text":"A year of sales and weekly visits.","status":"works","when":"both","evidence":["E11"]},{"id":"ci2b","title":"Survey slips","text":"64 slips from both counters in one week.","status":"works","when":"both","evidence":["E16"]},{"id":"ci2c","title":"Waste log","text":"Four weeks of counts at closing.","status":"works","when":"both","evidence":["E13"]}]},{"id":"c-evidence","label":"Evidence","verb":"informs","sub":"The exact words or numbers we rely on","items":[{"id":"ci3","title":"Price people would pay","text":"£25 feels right; £35 feels like a treat people cancel.","status":"works","when":"both","evidence":["E5","E18"]},{"id":"ci4","title":"Pausing matters","text":"Being locked in is the main reason to say no.","status":"works","when":"both","evidence":["E1","E20"]},{"id":"ci4b","title":"Diet needs are common","text":"About one in six avoid gluten, nuts or dairy.","status":"works","when":"both","evidence":["E19","E4"]},{"id":"ci4c","title":"Early-week waste and idle ovens","text":"Waste peaks Monday; ovens idle weekday afternoons.","status":"works","when":"both","evidence":["E13","E14"]}]},{"id":"c-decision","label":"Decision","verb":"shapes","sub":"What we chose, and why","items":[{"id":"ci5","title":"Start with collection only","text":"Most people prefer collecting, and delivery eats the margin.","status":"planned","when":"planned","evidence":["E17","E8"]},{"id":"ci5b","title":"Saturday pickup, Thursday bake","text":"Avoids the tight Friday afternoon and uses idle ovens.","status":"planned","when":"planned","evidence":["E9","E14"]}]},{"id":"c-intent","label":"Intent","verb":"spells out","sub":"The result we want, in plain words","items":[{"id":"ci6","title":"Steady weekday income, less waste","text":"Bake to a known number midweek instead of guessing.","status":"planned","when":"planned","evidence":["E31"]}]},{"id":"c-spec","label":"Spec","verb":"plans","sub":"What it must do, and how we will know","items":[{"id":"ci7","title":"One box, two sizes, a gluten-free swap","text":"Small £18, family £25. Skip by text before Wednesday.","status":"planned","when":"planned","evidence":["E18","E19"]},{"id":"ci7b","title":"Payment and skip rules","text":"Hold unpaid boxes; unlimited skips with a deadline.","status":"planned","when":"planned","evidence":["E24","E29"]}]},{"id":"c-plan","label":"Plan","verb":"produces","sub":"Pieces of work, in order","items":[{"id":"ci8","title":"Pilot at Mill Lane for 8 weeks","text":"Collection only, capped at 30 boxes.","status":"planned","when":"planned","evidence":["E16"]},{"id":"ci8b","title":"Before launch","text":"Counter card and photo, packing list, text add-on, GF shelf.","status":"planned","when":"planned","evidence":["E28","E25"]}]},{"id":"c-work","label":"Work","verb":"creates","sub":"What was actually built or changed","items":[{"id":"ci9","title":"Trial box costed","text":"£11.40 plus 14 minutes of packing.","status":"works","when":"today","evidence":["E6"]},{"id":"ci9b","title":"Customer list cleaned","text":"Not started; nobody owns the list.","status":"missing","when":"today","evidence":["E12"]}]},{"id":"c-outcome","label":"Outcome","verb":"","sub":"Did it work? Measured, not guessed","items":[{"id":"ci10","title":"Measures agreed, not yet measured","text":"Subscribers, waste, cancellations at week eight.","status":"missing","when":"both","evidence":["E7"]}]}]}],"gaps":[{"id":"G1","title":"Let people pause a month","why":"The first thing a regular asked for, and 19 of 64 survey slips want it. Without it, people avoid signing up.","anchors":["mo3"],"impact":5,"effort":2,"stories":[{"as":"As a subscriber going on holiday, I want to skip next month by replying to a text, so I am not charged for bread I cannot collect.","done_when":["a reply of SKIP before Wednesday stops that month's charge","the Saturday packing list leaves that person out","the subscriber gets a text confirming the skip"]},{"as":"As the Mill Lane manager, I want to see who skipped this month, so we bake the right number on Thursday.","done_when":["the Thursday packing list shows the count of skips","skips made at the counter appear on the list the same day"]}]},{"id":"G2","title":"Say what is in the box, and offer a gluten-free swap","why":"People will not pay for things they cannot eat; one in six avoid gluten, nuts or dairy; no other local box offers a swap.","anchors":["su2","mo2","bk4"],"impact":4,"effort":2,"stories":[{"as":"As a new customer, I want to see this month's box before I sign up, so I know it suits us.","done_when":["a photo and list are at the counter from the first Monday of the month","the reminder text on the 25th says what is coming next month"]},{"as":"As a gluten-free regular, I want a swap packed for me every month, so I can stay a subscriber.","done_when":["the diet need is asked once at sign-up","the packing list marks each swap","swap boxes sit on their own labelled shelf"]},{"as":"As the head baker, I want swaps baked in a separate batch, so there is no cross-contact.","done_when":["swaps are baked first on a cleaned tray","they cool on a separate rack and go straight into labelled bags"]}]},{"id":"G3","title":"Someone owns failed payments","why":"The till does not retry or tell the customer, and the counter team cannot chase.","anchors":["mo4","mn3"],"impact":3,"effort":3,"stories":[{"as":"As a subscriber whose card expired, I want a text asking me to update it, so my box is not missed.","done_when":["a text goes out the day a charge is declined","the box is held, not packed, until the charge goes through","a second text goes on day 3, then we stop"]},{"as":"As the Mill Lane manager, I want one short list of declined charges each morning, so it takes two minutes.","done_when":["the list shows only subscribers, not all card payments","each line has name, phone and amount"]}]},{"id":"G4","title":"Invoices for office buyers","why":"Office buyers need an invoice; the till cannot make one and hand-written invoices take 20 minutes a month.","anchors":["su4","mn5"],"impact":3,"effort":4,"stories":[{"as":"As an office buyer, I want a monthly invoice with our company name, so I can claim it back.","done_when":["an invoice goes out on the 1st with the company name and order","it shows the shop's VAT number if we have one"]}]},{"id":"G5","title":"Gift boxes","why":"Five survey slips asked for gifts, and gifts bring in new customers.","anchors":["gi1","gi2","gi3"],"impact":3,"effort":3,"stories":[{"as":"As a customer, I want to buy three months for my mum in one payment, so she gets bread without paying.","done_when":["one up-front payment covers three boxes","the gift ends by itself after three months"]},{"as":"As the person receiving a gift, I want to be asked before I get texts, so I don't feel signed up behind my back.","done_when":["the first text asks them to reply YES to get reminders","if they don't reply, the counter tells them at their first pickup"]}]},{"id":"G6","title":"A rule for boxes not collected","why":"Boxes left on the shelf become waste, and the box is meant to cut waste.","anchors":["mo4b","co7"],"impact":2,"effort":1,"stories":[{"as":"As a subscriber who forgot, I want my box kept until Sunday, so I can still get it.","done_when":["uncollected boxes stay on the shelf until Sunday closing","on Monday they go to the food charity, with no refund"]}]}],"notes":[{"id":"N1","role":"voice","anchor":"mo3","title":"Pausing decides whether people sign up","body":"The regular who asked for this said being locked in is the reason they would say no.","recommend":"Make pausing a one-word text reply, and say so on the counter card.","question":"Do we let people pause as often as they like, or cap it at two months a year?","urgency":"must","evidence":["E1"]},{"id":"N2","role":"designer","anchor":"su2","title":"Show a real box at the counter","body":"People asked what is inside before they asked the price.","recommend":"Put a packed sample box by the till with a card listing this month's items.","question":"Who packs and refreshes the sample box each month?","urgency":"should","evidence":["E3"]},{"id":"N3","role":"engineer","anchor":"mo1","title":"Friday packing clashes with the weekend bake","body":"The head baker named Friday afternoon as the tightest time of the week.","recommend":"Pack Thursday evening for Saturday pickup; no Friday deliveries in the pilot.","question":"Can we commit to Saturday-only pickup for the first eight weeks?","urgency":"must","evidence":["E9"]},{"id":"N4","role":"finance","anchor":"c-spec","title":"The box makes money at £25, but not with delivery","body":"Ingredients, packaging and packing time come to about £14. Card fees take another 43p. Delivery at £4.20 leaves little.","recommend":"Price at £25 for collection and £29 with delivery once delivery starts.","question":"Are we happy with roughly £10 a box before rent and power?","urgency":"must","evidence":["E6","E8"]},{"id":"N5","role":"owner","anchor":"c-decision","title":"Pilot in one shop first","body":"Mill Lane has the most regulars asking. A cap keeps the bake manageable.","recommend":"Pilot at Mill Lane, cap at 30 boxes, review after eight weeks.","question":"What number of subscribers after eight weeks would make us roll it out to all three shops?","urgency":"must","evidence":["E11"]},{"id":"N6","role":"analyst","anchor":"c-outcome","title":"Agree the measures before we start","body":"Without a starting number for waste, we cannot say the box reduced it.","recommend":"Record this month's waste at Mill Lane as the starting point.","question":"Which three numbers do we review at week eight?","urgency":"should","evidence":["E7"]},{"id":"N7","role":"security","anchor":"su4","title":"Keep as little customer data as we can","body":"We would hold names, phone numbers and cards. Nobody owns the customer list today.","recommend":"Keep cards in the payment provider only, and name one person responsible for the list.","question":"Who owns the subscriber list, and how long do we keep details after someone cancels?","urgency":"should","evidence":["E12"]},{"id":"N8","role":"agent","anchor":"su5","title":"An assistant could send the reminders and handle skips","body":"Reminder texts, skip replies and the packing list follow simple rules.","recommend":"Let an assistant send reminders and record skips; a person approves the weekly packing list.","question":"Are we comfortable with an assistant replying to customers' texts about skips?","urgency":"info","evidence":["E1"]},{"id":"N9","role":"voice","anchor":"su4","title":"Office buyers are a different customer","body":"They want Friday treats and an invoice, not a personal card charge.","recommend":"Leave office boxes out of the pilot; talk to three office buyers first.","question":"Do we treat office boxes as a separate product later?","urgency":"info","evidence":["E2"]},{"id":"N10","role":"finance","anchor":"G3","title":"Failed payments cost more than the fee","body":"A packed box nobody paid for is £14 lost.","recommend":"Hold the box until the payment goes through.","question":"Do we pack boxes for people whose payment failed, or hold them?","urgency":"should","evidence":["E6","E10"]},{"id":"N11","role":"designer","anchor":"mo2","title":"Ask about dietary needs once, at sign-up","body":"A box with nothing someone can eat is the fastest way to lose them.","recommend":"One question at sign-up with three choices: none, gluten-free, no nuts.","question":"Can the bakery reliably make a gluten-free swap every month?","urgency":"must","evidence":["E4"]},{"id":"N12","role":"engineer","anchor":"ci6","title":"Thursday baking uses spare ov   try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; }
  queueSync(); updateReviewStatus();
};
function answerDone(n) {
  const a = S.answers[n.id] || {};
  return n.answer_type === "stance" ? !!a.choice : !!String(a.answer || "").trim() || a.choice === "unsure";
}
function updateReviewStatus() {
  const save = $("#tsave"); if (save && SESSION && !finishing) save.textContent = S.sessionFinished ? "Read my answers" : "Finish review";
  const el = $("#review-progress");
  if (!el) return;
  const all = NOTES.filter(n => String(n.question || "").trim());
  const done = all.filter(answerDone).length;
  const unsure = all.filter(n => (S.answers[n.id] || {}).choice === "unsure").length;
  el.textContent = `${done} of ${all.length} reviewed${unsure ? ` · ${unsure} not sure yet` : ""}. ` +
    (SESSION ? syncState === "failed" ? "Not saved for your agent. " + syncError : syncState === "saved" ? "Saved for your agent automatically." : "Saving for your agent…" :
      storageOK ? "Kept in this browser. Save a file to share." : "Browser storage is unavailable. Save a file before leaving.");
  document.querySelectorAll("[data-local-copy]").forEach(el => el.textContent = SESSION ? "Answers save for your agent automatically. Finish review when you are ready." : "Answers stay in this browser. Save a file to share.");
  const status = $("#save-status");
  const changed = JSON.stringify([S.answers, S.votes, S.decisions, S.reviewer]) !== (S.lastExport || JSON.stringify([{}, {}, {}, ""]));
  if (status) status.textContent = SESSION ? "No file handoff needed. Finish review when you are ready." : changed ? "Changes since your last saved file" : "";
}

/* ---------- text helpers ---------- */
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const TERMS = Object.keys(GLOSS).sort((a, b) => b.length - a.length);
const TERM_RE = TERMS.length ? new RegExp("\\b(" + TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "i") : null;
function gl(text, focusable = true) {
  if (!TERM_RE) return esc(text);
  return String(text || "").split(TERM_RE).map((part, i) => {
    if (!(i % 2)) return esc(part);
    const key = TERMS.find(t => t.toLowerCase() === part.toLowerCase());
    return `<span class="term" data-term="${esc(key)}"${focusable ? ' tabindex="0"' : ""}>${esc(part)}</span>`;
  }).join("");
}

const pill = s => s && STATUS[s] ? `<span class="pill ${s}">${STATUS[s]}</span>` : "";
const days = (a, b) => (new Date(a) - new Date(b)) / 864e5;
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

/* ---------- index of boxes ---------- */
const BOX = {};
MODEL.maps.forEach((m, mi) => {
  (m.journeys || []).forEach((j, ji) => {
    BOX[j.id] = {box:j, mi, kind:"journey", ji};
    (j.steps || []).forEach((s, k) => BOX[s.id] = {box:s, mi, kind:"step", ji, k});
  });
  (m.stages || []).forEach((st, si) => {
    BOX[st.id] = {box:st, mi, kind:"stage", si};
    (st.items || []).forEach(it => BOX[it.id] = {box:it, mi, kind:"item", si, stage:st.id});
  });
  if (m.root) {
    const walk = (n, d, bi) => { BOX[n.id] = {box:n, mi, kind:"node", depth:d, bi}; (n.children || []).forEach((c, i) => walk(c, d + 1, d === 0 ? i : bi)); };
    walk(m.root, 0, -1);
  }
});
GAPS.forEach(g => BOX[g.id] = {box:g, mi:-1, kind:"gap"});
const notesOn = id => NOTES.filter(n => n.anchor === id && S.roles[n.role] !== false);
const mapOfAnchor = a => BOX[a] ? (BOX[a].mi >= 0 ? BOX[a].mi : mapOfAnchor((BOX[a].box.anchors || [])[0])) : -1;
const titleOf = b => b.title || b.label || b.text || b.id;

function badges(b) {
  const out = [];
  if (sinceAdded.has(b.id)) out.push(`<span class="chip new">New</span>`);
  else if (sinceChanged[b.id]) out.push(`<span class="chip changed">Changed</span>`);
  const ref = (MODEL.checked || {}).date;
  if (b.checked && ref && days(ref, b.checked) > FRESH_DAYS) out.push(`<span class="chip stale" title="Checked ${esc(b.checked)}">May be out of date</span>`);
  if (b.moment) out.push(`<span class="chip moment">Moment that matters</span>`);
  if (b.pain) out.push(`<span class="chip pain">Pain point</span>`);
  if (b.feeling) out.push(`<span class="chip"><i class="feel ${b.feeling}"></i>${FEEL[b.feeling]}</span>`);
  const ev = (b.evidence || []).length;
  if (ev) out.push(`<span class="chip">Evidence: ${ev}</span>`);
  const notes = notesOn(b.id);
  if (notes.length) out.push(`<span class="notebadge${notes.some(n => n.urgency === "must") ? " must" : ""}">${plural(notes.length, "note")}</span>`);
  return out.join("");
}
const tech = b => S.tech && b.detail ? `<span class="techname">${esc(b.detail)}</span>` : "";

/* ---------- DOM helpers ---------- */
const world = $("#world"), viewport = $("#viewport");
let nodes = {}, rows = [], svg;
function place(cls, x, y, w, html, data, label) {
  const d = document.createElement("div");
  d.className = cls; d.style.left = x + "px"; d.style.top = y + "px";
  if (w) d.style.width = w + "px";
  d.innerHTML = html;
  if (data) { d.tabIndex = 0; d.setAttribute("role", "button"); d.setAttribute("aria-label", label || ""); d._data = data; }
  world.appendChild(d);
  return d;
}
function link(x1, y1, x2, y2, cls, label) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  const my = (y1 + y2) / 2;
  p.setAttribute("d", Math.abs(x1 - x2) < 2 ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
  if (cls) p.setAttribute("class", cls);
  svg.appendChild(p);
  if (label) {
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", (x1 + x2) / 2 + 10); t.setAttribute("y", my + 5); t.textContent = label;
    svg.appendChild(t);
  }
  return p;
}
function arrowHead(x, y) {
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", `M${x - 6},${y - 9} L${x},${y} L${x + 6},${y - 9}`);
  svg.appendChild(p);
}
function tint(hex) {
  const n = parseInt(String(hex).replace("#", ""), 16) || 0x888888;
  const mix = c => Math.round(c * 0.16 + 255 * 0.84);
  return `rgb(${mix(n >> 16 & 255)},${mix(n >> 8 & 255)},${mix(n & 255)})`;
}

/* Notes beside a row (only when "Show all notes on the map" is on): a column to the right of
   every box, sized from the real cards, so a note never sits over any text. */
const NOTE_W = 250, NOTE_GAP = 12, NOTES_W = 2 * NOTE_W + NOTE_GAP;
function notePile(anchors, x, y, max, rowKey) {
  if (!S.notesOnMap) return 0;
  const list = NOTES.filter(n => anchors.includes(n.anchor) && S.roles[n.role] !== false)
    .sort((a, b) => URG_ORDER[a.urgency || "info"] - URG_ORDER[b.urgency || "info"]);
  const shown = list.slice(0, max);
  const colH = [0, 0];
  shown.forEach((n, i) => {
    const c = colH[0] <= colH[1] ? 0 : 1;
    const r = ROLE[n.role] || {label:n.role, color:"#888"};
    const el = place(`notecard ${n.urgency || "info"} inj`, x + c * (NOTE_W + NOTE_GAP), y + colH[c], NOTE_W,
      `<div><span class="who">${esc(r.label)}</span><span class="urg">${URG[n.urgency || "info"]}</span></div>
       <h5>${esc(n.title)}</h5><div class="q">${esc(n.question || n.body || "")}</div>`,
      {type:"note", n}, `${r.label} note: ${n.title}`);
    el.style.background = tint(r.color);
    el.style.setProperty("--note-tilt", [-0.7, 0.5, -0.3, 0.6][i % 4] + "deg");
    el.dataset.row = rowKey;
    colH[c] += el.offsetHeight + NOTE_GAP;
  });
  let h = Math.max(colH[0], colH[1]);
  if (list.length > shown.length) {
    const more = place("morenotes inj", x, y + h, NOTES_W, `+ ${plural(list.length - shown.length, "more note")} here`,
      {type:"notes", anchors, title:"Notes here"}, `${list.length - shown.length} more notes`);
    more.dataset.row = rowKey;
    h += more.offsetHeight + NOTE_GAP;
  }
  return h;
}
const notesWidth = () => S.notesOnMap ? NOTES_W + 48 : 0;

function header(m, width) {
  place("stamp", 0, 6, 0, (MODEL.checked && MODEL.checked.date) ? `Checked against the sources on ${esc(MODEL.checked.date)}` : "Not yet checked against sources");
  const t = place("maptitle", 0, 40, Math.max(width, 600), esc(m.title || MODEL.title));
  const q = place("mapintro", 0, 40 + t.offsetHeight + 8, Math.min(Math.max(width, 600), 900), gl(m.intro || ""));
  return 40 + t.offsetHeight + 8 + q.offsetHeight + 40;
}

/* ---------- journeys ---------- */
const J = {laneW:260, laneGap:22, stepW:236, stepH:84, rowGap:16, headW:330, headGap:40, bandGap:70};
function renderJourneys(m) {
  const lanes = m.lanes || [];
  const LI = Object.fromEntries(lanes.map((l, i) => [l.id, i]));
  const laneX = i => J.headW + J.headGap + i * (J.laneW + J.laneGap);
  const lanesRight = laneX(lanes.length - 1) + J.laneW;
  const notesX = lanesRight + 48;
  const W = lanesRight + notesWidth();
  let y = header(m, W);
  lanes.forEach((l, i) => place("lanehead", laneX(i), y, J.laneW, `${esc(l.label)}<small>${esc(l.sub || "")}</small>`));
  if (S.notesOnMap) place("label", notesX, y + 4, 0, "Notes from each role");
  y += 60;
  const laneTop = y - 70;
  (m.journeys || []).forEach((j, ji) => {
    const y0 = y;
    const hd = place("box jhead inj", 0, y0, J.headW,
      `<h3><span class="n">${ji + 1}</span>${gl(j.title)}</h3><p>${gl(j.summary || "")}</p>
       ${(j.creates || []).length ? `<p class="sub small"><b>What it leaves behind:</b> ${j.creates.map(esc).join(", ")}</p>` : ""}
       ${tech(j)}<div class="meta">${badges(j)}<span class="chip">${plural((j.steps || []).length, "step")}</span></div>`,
      {type:"box", id:j.id}, `Journey ${ji + 1}: ${j.title}`);
    hd.dataset.row = "j" + ji;
    nodes[j.id] = hd;
    let sy = y0, prev = null;
    (j.steps || []).forEach((s, k) => {
      const x = laneX(LI[s.lane] || 0) + (J.laneW - J.stepW) / 2;
      const el = place("box step inj", x, sy, J.stepW,
        `<div class="row1"><span class="n">${k + 1}</span><div class="t">${gl(s.text)}</div></div>${tech(s)}
         <div class="meta">${pill(s.status)}${badges(s)}</div>`,
        {type:"box", id:s.id}, `Step ${k + 1} of journey ${ji + 1}: ${s.text}`);
      el.style.minHeight = J.stepH + "px";
      el.dataset.row = "j" + ji;
      nodes[s.id] = el;
      const h = el.offsetHeight;
      if (prev) {
        const p = link(prev.x + J.stepW / 2, prev.y + prev.h, x + J.stepW / 2, sy - 2, "inj");
        p.dataset.row = "j" + ji; arrowHead(x + J.stepW / 2, sy - 2);
      }
      prev = {x, y:sy, h};
      sy += h + J.rowGap;
    });
    const nh = notePile([j.id, ...(j.steps || []).map(s => s.id)], notesX, y0, 4, "j" + ji);
    const h = Math.max(hd.offsetHeight, sy - y0, nh);
    rows.push({key:"j" + ji, y:y0, h, x:0, w:W});
    y = y0 + h + J.bandGap;
  });
  lanes.forEach((l, i) => {
    const bg = document.createElement("div"); bg.className = "lanebg";
    Object.assign(bg.style, {left:(laneX(i) - 8) + "px", top:laneTop + "px", width:(J.laneW + 16) + "px", height:(y - laneTop) + "px"});
    world.prepend(bg);
  });
  return {x:0, y:0, w:W, h:y};
}

/* A customer's actions run left to right, in the supplied order. */
function renderCustomerJourney(m) {
  const cardW = 250, gap = 64;
  const count = Math.max(1, ...(m.journeys || []).map(j => (j.steps || []).length));
  const timelineW = count * (cardW + gap) - gap;
  const notesX = timelineW + 48;
  const W = timelineW + notesWidth();
  let y = header(m, W);
  (m.journeys || []).forEach((j, ji) => {
    const start = y;
    const hd = place("box timeline-title inj", 0, y, Math.min(600, timelineW),
      `<h3>${gl(j.title)}</h3><p>${gl(j.summary || "")}</p>${tech(j)}<div class="meta">${badges(j)}</div>`,
      {type:"box", id:j.id}, j.title);
    nodes[j.id] = hd; hd.dataset.row = "j" + ji;
    y += hd.offsetHeight + 48;
    let maxH = 0, prev = null;
    (j.steps || []).forEach((step, i) => {
      const x = i * (cardW + gap);
      const lane = (m.lanes || []).find(l => l.id === step.lane);
      place("label", x, y - 26, cardW, `${i + 1}. ${esc(lane ? lane.label : "Next step")}`);
      const card = place("box customer-step inj", x, y, cardW,
        `<h4>${gl(step.text)}</h4>${tech(step)}<div class="meta">${pill(step.status)}${badges(step)}</div>`,
        {type:"box", id:step.id}, `Step ${i + 1}: ${step.text}`);
      card.dataset.row = "j" + ji; nodes[step.id] = card;
      maxH = Math.max(maxH, card.offsetHeight);
      if (prev !== null) {
        const line = link(prev + cardW, y + 30, x - 8, y + 30, "inj customer-flow");
        line.dataset.row = "j" + ji;
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
        arrow.setAttribute("d", `M${x - 16},${y + 24} L${x - 8},${y + 30} L${x - 16},${y + 36}`);
        arrow.setAttribute("class", "customer-flow"); svg.appendChild(arrow);
      }
      prev = x;
    });
    const nh = notePile([j.id, ...(j.steps || []).map(step => step.id)], notesX, start, 4, "j" + ji);
    const h = Math.max(y - start + maxH, nh);
    rows.push({key:"j" + ji, y:start, h, x:0, w:W});
    y = start + h + 64;
  });
  return {x:0, y:0, w:W, h:y};
}

/* ---------- chain ---------- */
const C = {stageW:300, stageH:96, itemW:250, itemGap:14, perRow:3, gap:64};
function renderChain(m) {
  const compare = S.mode === "compare";
  const itemsX = C.stageW + 50;
  const perRow = compare ? 2 : C.perRow;
  const columnW = perRow * (C.itemW + C.itemGap) - C.itemGap;
  const versions = compare ? ["today", "planned"] : [S.mode];
  const notesX = itemsX + versions.length * (columnW + 44) + 34;
  const W = notesX - 34 + notesWidth();
  let y = header(m, W);
  place("label", 0, y, 0, "Stage");
  versions.forEach((version, i) => place("label", itemsX + i * (columnW + 44), y, columnW,
    version === "today" ? "Current" : "Proposed · dashed boxes are new"));
  if (S.notesOnMap) place("label", notesX, y, 0, "Notes from each role");
  y += 30;
  let prevStage = null;
  (m.stages || []).forEach((st, si) => {
    const y0 = y;
    const stEl = place(`box stage inj${si === 0 ? " first-stage" : ""}`, 0, y0, C.stageW,
      `<h3>${gl(st.label)}</h3><p>${gl(st.sub || "")}</p>${tech(st)}<div class="meta">${badges(st)}</div>`,
      {type:"box", id:st.id}, `Stage ${si + 1}: ${st.label}`);
    stEl.style.minHeight = C.stageH + "px";
    stEl.dataset.row = "s" + si; nodes[st.id] = stEl;
    let ih = 0;
    versions.forEach((version, vi) => {
      const items = (st.items || []).filter(it => (it.when || "both") === "both" || it.when === version);
      const columnX = itemsX + vi * (columnW + 44);
      let rowMax = 0, iy = y0, col = 0;
      items.forEach(it => {
        const el = place(`box item inj${it.when === "planned" ? " planned-new" : ""}`,
          columnX + col * (C.itemW + C.itemGap), iy, C.itemW,
          `<h4>${gl(it.title)}</h4><p class="t">${gl(it.text || "")}</p>${tech(it)}<div class="meta">${pill(it.status)}${badges(it)}${compare && (it.when || "both") === "both" ? '<span class="chip">Unchanged</span>' : ""}</div>`,
          {type:"box", id:it.id}, `${compare ? version === "today" ? "Current: " : "Proposed: " : ""}${it.title}`);
        el.dataset.row = "s" + si;
        if (!nodes[it.id]) nodes[it.id] = el;
        rowMax = Math.max(rowMax, el.offsetHeight);
        if (++col === perRow) { col = 0; iy += rowMax + C.itemGap; rowMax = 0; }
      });
      ih = Math.max(ih, iy - y0 + rowMax);
      if (!items.length) { place("label", columnX, y0 + 10, columnW, version === "planned" ? "Nothing proposed here" : "Nothing here today"); ih = Math.max(ih, 40); }
    });
    const nh = notePile([st.id, ...(st.items || []).map(i => i.id)], notesX, y0, 4, "s" + si);
    const h = Math.max(stEl.offsetHeight, ih, nh);
    rows.push({key:"s" + si, y:y0, h, x:0, w:W});
    if (prevStage) {
      const p = link(C.stageW / 2, prevStage.y + prevStage.h, C.stageW / 2, y0 - 2, "inj", prevStage.verb);
      p.dataset.row = "s" + si; arrowHead(C.stageW / 2, y0 - 2);
    }
    prevStage = {y:y0, h:stEl.offsetHeight, verb:st.verb || ""};
    y = y0 + h + C.gap;
  });
  const outs = MODEL.outcomes || [];
  if (outs.length && m === MODEL.maps.find(mm => KIND[mm.template] === "chain")) {
    place("label", 0, y, 0, "Did it work?");
    y += 26;
    const ow = C.itemW + 60;
    let oy = y, outcomeH = 0;
    outs.forEach((o, i) => {
      const el = place("box inj", (i % 3) * (ow + C.itemGap), oy, ow,
        `<h4>${esc(o.measure)}</h4><p class="t">${o.baseline ? "Before: " + esc(o.baseline) + ". " : ""}${o.target ? "Target: " + esc(o.target) + ". " : ""}${o.result ? "<b>Result: " + esc(o.result) + "</b>" : "Not measured yet."}</p>
         <div class="meta">${o.becomes_evidence ? `<span class="chip">Feeds back as evidence</span>` : ""}</div>`,
        {type:"outcome", o}, `Outcome: ${o.measure}`);
      nodes[o.id] = el;
      outcomeH = Math.max(outcomeH, el.offsetHeight);
      if (i % 3 === 2 || i === outs.length - 1) { oy += outcomeH + C.itemGap; outcomeH = 0; }
    });
    rows.push({key:"outcomes", y:y - 26, h:oy - y + 26, x:0, w:W});
    y = oy + 20;
  }
  return {x:0, y:0, w:W, h:y};
}

/* ---------- tree ---------- */
const T = {colW:270, colGap:60, nodeH:104, vGap:18};
function renderTree(m) {
  const levels = !m.levels || JSON.stringify(m.levels) === JSON.stringify(["Outcome","Need or pain","Idea","Quick test"]) ? TREE_LEVELS : m.levels;
  const depthOf = n => n.children && n.children.length ? 1 + Math.max(...n.children.map(depthOf)) : 1;
  const depth = depthOf(m.root);
  const notesX = depth * (T.colW + T.colGap) + 10;
  const W = depth * (T.colW + T.colGap) - T.colGap + notesWidth();
  let y = header(m, W);
  for (let d = 0; d < depth; d++) place("label", d * (T.colW + T.colGap), y, 0, esc(levels[Math.min(d, levels.length - 1)]));
  y += 30;
  // Measure the actual cards before reserving rows. Long titles and badges wrap.
  const cards = {};
  let nodeH = T.nodeH;
  (function measure(n, d) {
    const el = place(`box tree-node l${d} inj`, d * (T.colW + T.colGap), y, T.colW,
      `<h4>${gl(n.title)}</h4>${n.text ? `<p class="t">${gl(n.text)}</p>` : ""}${tech(n)}<div class="meta">${pill(n.status)}${badges(n)}</div>`,
      {type:"box", id:n.id}, `${levels[Math.min(d, levels.length - 1)]}: ${n.title}`);
    el.style.minHeight = T.nodeH + "px";
    cards[n.id] = el;
    nodeH = Math.max(nodeH, el.offsetHeight);
    (n.children || []).forEach(c => measure(c, d + 1));
  })(m.root, 0);
  let cursor = y;
  const pos = {};
  (function lay(n, d) {
    const kids = n.children || [];
    let cy;
    if (!kids.length) { cy = cursor; cursor += nodeH + T.vGap; }
    else { kids.forEach(k => lay(k, d + 1)); cy = (pos[kids[0].id].y + pos[kids[kids.length - 1].id].y) / 2; }
    pos[n.id] = {x:d * (T.colW + T.colGap), y:cy, d};
  })(m.root, 0);
  const branches = m.root.children || [];
  const ids = n => [n.id, ...(n.children || []).flatMap(ids)];
  const shifted = {};
  let shift = 0;
  branches.forEach((b, bi) => {
    const own = ids(b);
    const ys = own.map(i => pos[i].y);
    const y0 = Math.min(...ys) + shift, y1 = Math.max(...ys) + nodeH + shift;
    own.forEach(i => shifted[i] = pos[i].y + shift);
    const nh = notePile(own, notesX, y0, 4, "b" + bi);
    rows.push({key:"b" + bi, y:y0, h:Math.max(y1 - y0, nh), x:0, w:W});
    shift += Math.max(0, nh - (y1 - y0)) + (S.notesOnMap ? T.vGap : 0);
  });
  shifted[m.root.id] = branches.length ? (shifted[branches[0].id] + shifted[branches[branches.length - 1].id]) / 2 : pos[m.root.id].y;
  const draw = (n, parent, bi) => {
    const p = pos[n.id], ny = shifted[n.id];
    const el = cards[n.id];
    el.style.top = ny + "px";
    el.style.height = nodeH + "px";
    if (bi != null) el.dataset.row = "b" + bi;
    nodes[n.id] = el;
    if (parent) {
      const l = link(pos[parent.id].x + T.colW, shifted[parent.id] + nodeH / 2, p.x, ny + nodeH / 2, "inj");

/* Named connections come from the model, never from the card positions. */

function drawConnections() {

/* ---------- pan and zoom ---------- */
let Z = 1, X = 40, Y = 80;

function apply() {
  world.style.transform = `translate(${X}px,${Y}px) scale(${Z})`;
  document.documentElement.style.setProperty("--z", Z);
  const inv = Math.min(2.4, Math.max(1, 0.62 / Z));
  const changed = document.body.classList.contains("z-far") !== (Z < 0.55) ||
    document.documentElement.style.getPropertyValue("--inv") !== String(inv);

function fitTo(b) {
  const vw = innerWidth - leftEdge() - rightEdge() - 40, vh = innerHeight - topEdge() - bottomEdge() - 40;
  let z = Math.min(vw / b.w, vh / b.h) * 0.95;

}

/* ---------- walk-through ---------- */
function steps() {
  const out = [{title:"The decision", text:MODEL.question + (MODEL.summary ? " " + MODEL.summary : ""), go:() => { showMap(0); S.journey = -1; applyFocus(); story(); fit(); }}];
  if (MODEL.reading) out.push({title:"How to read this", text:MODEL.reading, go:() => { showMap(0); S.journey = -1; applyFocus(); story(); fit(); }});
  MODEL.maps.forEach((m, mi) => {
    const kind = KIND[m.template];
    out.push({title:m.title, text:m.intro || "", go:() => { showMap(mi); S.journey = -1; applyFocus(); story(); fit(); }});
    if (kind === "journeys") (m.journeys || []).forEach((j, ji) => {
      const moments = (j.steps || []).filter(s => s.moment).map(s => s.text);
      out.push({title:`${ji + 1}. ${j.title}`, text:(j.summary || "") + ` ${plural((j.steps || []).length, "step")}.` + (moments.length ? ` Moments that matter: ${moments.join("; ")}.` : ""), go:() => focusJourney(mi, ji)});
    });
    if (kind === "chain") (m.stages || []).forEach((st, si) => {
      const items = (st.items || []).filter(it => (it.when || "both") === "both" || it.when === S.mode).map(it => it.title);
      out.push({title:`${si + 1}. ${st.label}`, text:`${st.sub || ""}. ${items.length ? items.join("; ") + "." : "Nothing here yet."}`, go:() => focusRow(mi, "s" + si)});
    });
    if (kind === "tree") (m.root.children || []).forEach((b, bi) => {
      out.push({title:b.title, text:`Ideas: ${(b.children || []).map(c => c.title).join("; ") || "none yet"}.`, go:() => focusRow(mi, "b" + bi)});
    });
  });
  if (GAPS.length) {
    const best = GAPS.slice().sort((a, b) => ((b.impact || 0) * 2 - (b.effort || 0)) - ((a.impact || 0) * 2 - (a.effort || 0)))[0];
    out.push({title:"Gaps between today and planned", text:`${plural(GAPS.length, "gap")}. Best value first: ${best.title}.`, panel:true, go:() => open("gaps")});
  }
  const qs = questionList();
  const must = qs.filter(q => q.urgency === "must").length;
  out.push({title:"What we need to decide", text:`${plural(qs.length, "question")}, ${must} that must be decided. Answer them on the right, then press Save my answers. Send the downloaded file to the review owner.`, panel:true, go:() => open("questions")});
  return out;
}
let walkAt = -1;
function walk(i) {
  const list = steps();

  walkAt = i;
  hideHint();
  const s = list[i];
  if (!s.panel) close();
  s.go();
  const w = $("#walk");
  w.innerHTML = `<div class="step">Step ${i + 1} of ${list.length}</div><h3>${esc(s.title)}</h3><p>${gl(s.text)}</p>
    <div class="row"><button data-w="back"${i === 0 ? " disabled" : ""}>Back</button><span class="grow"></span>
    <button data-w="end">End the walk-through</button><button class="next" data-w="next">${i === list.length - 1 ? "Finish" : "Next"}</button></div>`;
  w.classList.add("open");
  w.querySelector('[data-w="back"]').addEventListener("click", () => walk(walkAt - 1));
  w.querySelector('[data-w="next"]').addEventListener("click", () => walk(walkAt + 1));
  w.querySelector('[data-w="end"]').addEventListener("click", endWalk);
  w.querySelector('[data-w="next"]').focus();
  wireTerms(w);
}
function endWalk() { walkAt = -1; $("#walk").classList.remove("open"); }

/* ---------- first-visit hint ---------- */
function hint() {
  if (S.hintSeen) return;
  const h = $("#hint");
  h.innerHTML = `<b>New here?</b> Press <b>Walk me through it</b> in Tools for a short tour, or click any box to read about it. ${SESSION ? "Answer questions on the right. Your answers save for your agent automatically; press Finish review when ready." : "Answer questions on the right, then press Save my answers. Send the downloaded file to the review owner."}<br><button id="hintok">Got it</button>`;
  h.classList.add("open");
  $("#hintok").addEventListener("click", hideHint);
}
function hideHint() { $("#hint").classList.remove("open"); if (!S.hintSeen) { S.hintSeen = true; persist(); } }

/* ---------- right panel ---------- */
let current = null;
function open(kind, arg) {
  current = {kind, arg};
  applyConnections();
  story();
  const p = $("#panel");
  const [title, html] = PANELS[kind](arg);
  p.innerHTML = `<header><h2 id="ptitle">${title}</h2><button id="pclose">Close</button></header>
    <div class="body">${html}</div>`;
  p.classList.add("open"); document.body.classList.add("panel-open"); topBar();

function close() {
  $("#panel").classList.remove("open"); document.body.classList.remove("panel-open");

}

function evidenceHtml(refs) {
  return (refs || []).map(r => {
    const e = EVID[r]; if (!e) return "";
    const s = SRC[e.source] || {};
    const local = SESSION && SESSION.sources && SESSION.sources[s.id];
    const remote = /^https?:\/\//i.test(s.ref || "") ? s.ref : null;
    const sourceLink = local || remote;
    const q = e.kind === "data" ? "" : "“", qq = e.kind === "data" ? "" : "”";
    return `<div class="quote${e.voice ? " voice" : ""}">${q}${esc(e.text)}${qq}
      <span class="src">${e.voice ? "In their words · " : ""}${esc(s.title || e.source)}${s.date ? " · " + esc(s.date) : ""}</span>${sourceLink ? `<a href="${esc(sourceLink)}" target="_blank" rel="noopener noreferrer">Open source</a>` : ""}${e.where || s.ref ? `<p class="small">${esc(s.ref || "")}${e.where ? " · " + esc(e.where) : ""}</p>` : ""}</div>`;
  }).join("");
}
function noteHtml(n, withJump) {
  const r = ROLE[n.role] || {label:n.role, color:"#888"};
  const dec = DECISIONS.filter(d => (d.notes || []).includes(n.id));
  return `<div class="card ${n.urgency || "info"}">
    <div class="small"><span class="swatch" style="background:${r.color}"></span><b>${esc(r.label)}</b> · ${esc(n.author || (SESSION && SESSION.prepared_by) || "Author not recorded")} · ${URG[n.urgency || "info"]}</div>
    <h3 style="margin:4px 0">${gl(n.title, true)}</h3>
